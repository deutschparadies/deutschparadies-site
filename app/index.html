 topic:{ro:"Sănătate: profesia de medic, farmacia de călătorie, metode alternative", ar:"الصحة: مهنة الطب وشنطة الأدوية وطرق العلاج البديلة", en:"Health: the medical profession, travel first-aid kit, alternative medicine"},
 grammar:{title:"Indefinitpronomen · Modale Zusammenhänge",
  expl:{ro:"1) Pronumele nehotărâte vorbesc despre persoane sau lucruri necunoscute ori neprecizate: man, (irgend)jemand, niemand, (irgend)etwas, nichts, (irgend)einer, keiner, (irgend)welche. Cu excepția nominativului, ele se declină ca articolul: man → einen (Akk.), einem (Dat.); (irgend)einer → (irgend)einen, (irgend)einem; keiner → keinen, keinem; pluralul lui (irgend)einer este (irgend)welche. La jemand și niemand terminațiile -en/-em pot lipsi: Hast du jemand(en) gesehen? În loc de genitiv folosim von + dativ: von irgendjemand(em). Exemple: Wenn ihr irgendjemanden aus unserem Kurs seht, gebt Bescheid. Brauchst du ein Pflaster? – Ja, hast du eins? – Nein, ich habe leider keins. 2) Modul (cum se întâmplă ceva) se exprimă verbal sau nominal. Verbal: dadurch, dass … (prin faptul că) și indem (doar cu același subiect!): Man kann sich das Rauchen abgewöhnen, indem man ein Pflaster verwendet. ohne dass / ohne … zu (fără să): Die Anbieter versprechen Heilung, ohne dies zu begründen. (an)statt dass / (an)statt … zu (în loc să): Man sollte sich mehr bewegen, statt ständig am Computer zu sitzen. Nominal (tipic scris): durch + acuzativ (Durch Verwendung eines Pflasters …), ohne + acuzativ (ohne objektive Begründung), statt + genitiv (Statt der ständigen Arbeit am Computer …).",
   ar:"١) الضماير غير المحددة بتتكلم عن أشخاص أو حاجات مش معروفة أو مش محددة: man، و (irgend)jemand، و niemand، و (irgend)etwas، و nichts، و (irgend)einer، و keiner، و (irgend)welche. ماعدا في النوميناتيف، بتتصرّف زي أداة التعريف: man → einen (Akk.) و einem (Dat.)، و (irgend)einer → (irgend)einen و (irgend)einem، و keiner → keinen و keinem، وجمع (irgend)einer هو (irgend)welche. مع jemand و niemand النهايات ‎-en و ‎-em ممكن تتشال: Hast du jemand(en) gesehen? وبدل الجينيتيف بنستخدم von + Dativ: von irgendjemand(em). أمثلة: Wenn ihr irgendjemanden aus unserem Kurs seht, gebt Bescheid. و Brauchst du ein Pflaster? – Ja, hast du eins? – Nein, ich habe leider keins. ٢) الطريقة (إزاي الحاجة بتحصل) بنعبّر عنها بالفعل أو بالاسم. بالفعل: dadurch, dass … (عن طريق إن) و indem (بس لو نفس الفاعل!): Man kann sich das Rauchen abgewöhnen, indem man ein Pflaster verwendet. و ohne dass / ohne … zu (من غير ما): Die Anbieter versprechen Heilung, ohne dies zu begründen. و (an)statt dass / (an)statt … zu (بدل ما): Man sollte sich mehr bewegen, statt ständig am Computer zu sitzen. وبالاسم (أسلوب الكتابة): durch + Akkusativ (Durch Verwendung eines Pflasters …)، و ohne + Akkusativ (ohne objektive Begründung)، و statt + Genitiv (Statt der ständigen Arbeit am Computer …).",
   en:"1) Indefinite pronouns refer to unknown or unspecified people or things: man, (irgend)jemand, niemand, (irgend)etwas, nichts, (irgend)einer, keiner, (irgend)welche. Except in the nominative, they decline like the article: man → einen (acc.), einem (dat.); (irgend)einer → (irgend)einen, (irgend)einem; keiner → keinen, keinem; the plural of (irgend)einer is (irgend)welche. With jemand and niemand the endings -en/-em can be dropped: Hast du jemand(en) gesehen? Instead of the genitive we use von + dative: von irgendjemand(em). Examples: Wenn ihr irgendjemanden aus unserem Kurs seht, gebt Bescheid. Brauchst du ein Pflaster? – Ja, hast du eins? – Nein, ich habe leider keins. 2) Manner (how something happens) can be expressed verbally or nominally. Verbally: dadurch, dass … and indem (only with the same subject!): Man kann sich das Rauchen abgewöhnen, indem man ein Pflaster verwendet. ohne dass / ohne … zu (without): Die Anbieter versprechen Heilung, ohne dies zu begründen. (an)statt dass / (an)statt … zu (instead of): Man sollte sich mehr bewegen, statt ständig am Computer zu sitzen. Nominally (typical of writing): durch + accusative (Durch Verwendung eines Pflasters …), ohne + accusative (ohne objektive Begründung), statt + genitive (Statt der ständigen Arbeit am Computer …)."},

  tables:[{h:"Modale Zusammenhänge: verbal und nominal",t:[["verbal (Konnektor)","nominal (Präposition)"],["Man könnte Raucher dadurch beeinflussen, dass man sie aus der Versicherung ausschließt.","Durch einen Ausschluss aus der Versicherung könnte man Raucher beeinflussen. (durch + Akk.)"],["Man kann sich das Rauchen abgewöhnen, indem man ein Pflaster verwendet.","Durch Verwendung eines Pflasters kann man sich das Rauchen abgewöhnen."],["Die Anbieter versprechen Heilung, ohne dass sie dies begründen. / ohne dies zu begründen.","Die Anbieter versprechen Heilung ohne objektive Begründung. (ohne + Akk.)"],["Man sollte sich bewegen, (an)statt dass man ständig sitzt. / (an)statt ständig zu sitzen.","Statt des ständigen Sitzens sollte man sich bewegen. (statt + Gen.)"]]}],
  examples:["Hat irgendjemand ein Schmerzmittel dabei?","Ich habe niemanden in der Praxis erreicht.","Wenn einem schwindelig wird, sollte man sich hinsetzen.","Brauchst du Pflaster? – Danke, ich habe noch welche.","Man kann Erkältungen vorbeugen, indem man sich regelmäßig die Hände wäscht.","Dadurch, dass er mit dem Rauchen aufgehört hat, schläft er besser.","Sie hat die Tabletten genommen, ohne die Packungsbeilage zu lesen.","Statt gleich Antibiotika zu nehmen, sollte man zuerst zum Arzt gehen."]},

 text:{title:"Arzt – Traumberuf oder Knochenjob?",de:"Für viele Jugendliche ist er immer noch ein Traumberuf: Arzt oder Ärztin. Der Beruf gilt als sicher, angesehen und gut bezahlt. Jedes Jahr bewerben sich in Deutschland etwa viermal so viele junge Menschen um einen Medizinstudienplatz, wie es Plätze gibt. Doch wer mit Ärztinnen und Ärzten spricht, die schon einige Jahre im Krankenhaus arbeiten, hört oft eine ganz andere Geschichte. Dr. Julia Brandt, 34, ist Assistenzärztin in der Inneren Medizin eines großen Klinikums. „Ich wollte schon als Kind Menschen helfen“, erzählt sie. „Aber dass ich irgendwann mehr Zeit am Computer als mit Patienten verbringen würde, hätte mir niemand gesagt.“ Tatsächlich zeigen Studien, dass Klinikärzte bis zu vierzig Prozent ihrer Arbeitszeit mit Dokumentation und Verwaltung verbringen. Hinzu kommen lange Schichten: Dienste von 24 Stunden sind keine Seltenheit, und Überstunden gehören zum Alltag. Viele junge Ärzte klagen über Erschöpfung. Laut einer Umfrage denkt fast jeder Dritte darüber nach, den Beruf zu wechseln oder zumindest die Arbeitszeit zu reduzieren. Besonders schwierig ist die Situation auf dem Land. Dort gehen viele Hausärzte in den Ruhestand, ohne dass sich ein Nachfolger findet. Die Folge: lange Wartezeiten und weite Wege für die Patienten. Manche Gemeinden versuchen, junge Mediziner dadurch anzulocken, dass sie ihnen günstige Praxisräume oder sogar ein Haus anbieten. Einige Bundesländer vergeben Studienplätze an Bewerber, die sich verpflichten, später einige Jahre als Landarzt zu arbeiten. Trotzdem würde sich Julia Brandt wieder für den Beruf entscheiden. „Wenn man einem Patienten helfen kann, der mit großer Angst in die Notaufnahme gekommen ist, dann weiß man, warum man das alles macht.“ Sie wünscht sich jedoch Veränderungen: weniger Bürokratie, mehr Personal und flexiblere Arbeitszeitmodelle. Erste Kliniken reagieren bereits. Sie stellen Assistenten für die Dokumentation ein, damit sich die Ärzte auf ihre eigentliche Aufgabe konzentrieren können, statt stundenlang Formulare auszufüllen. Denn eines ist klar: Ohne zufriedene Ärzte gibt es auf Dauer auch keine gute Versorgung der Patienten.",
  q:[["Es gibt viel mehr Bewerber als Medizinstudienplätze.",true],["Dr. Brandt arbeitet als Hausärztin auf dem Land.",false],["Sie verbringt mehr Zeit am Computer, als sie erwartet hatte.",true],["Klinikärzte verbringen nur wenig Zeit mit Dokumentation.",false],["Dienste von 24 Stunden kommen vor.",true],["Fast jeder Dritte denkt über einen Berufswechsel oder weniger Arbeitszeit nach.",true],["Auf dem Land finden Hausärzte leicht Nachfolger.",false],["Manche Gemeinden bieten jungen Ärzten günstige Praxisräume an.",true],["Dr. Brandt würde nicht noch einmal Ärztin werden.",false],["Einige Kliniken stellen Assistenten für die Dokumentation ein.",true]]},

 write:{type:"Forumsbeitrag",title:"Alternative Heilmethoden – ja oder nein?",
  situation:"Auf dem Gesundheitsportal „Gesund leben“ wird diskutiert: „Sind alternative Heilmethoden wie Homöopathie oder Akupunktur eine sinnvolle Ergänzung zur Schulmedizin – oder rausgeworfenes Geld?“ Schreiben Sie einen Beitrag für das Forum.",
  points:["Ihre eigenen Erfahrungen oder die von Bekannten schildern","Argumente für alternative Methoden nennen","Argumente dagegen nennen","Ihre persönliche Meinung begründen und einen Rat geben"],
  words:"Schreiben Sie ca. 180 Wörter.",
  tip:{ro:"Arată structurile modale ale lecției: Man kann Schmerzen lindern, indem … / dadurch, dass … / Statt sofort Tabletten zu nehmen … / ohne dass es wissenschaftlich belegt ist. Plus un pronume nehotărât (Jemand aus meiner Familie …).",ar:"ورّي تراكيب الطريقة من الدرس: Man kann Schmerzen lindern, indem … و dadurch, dass … و Statt sofort Tabletten zu nehmen … و ohne dass es wissenschaftlich belegt ist. وضيف ضمير غير محدد (Jemand aus meiner Familie …).",en:"Show off the lesson's modal structures: Man kann Schmerzen lindern, indem … / dadurch, dass … / Statt sofort Tabletten zu nehmen … / ohne dass es wissenschaftlich belegt ist. Plus an indefinite pronoun (Jemand aus meiner Familie …)."},
  redemittel:[["Erfahrung",["Ich habe selbst die Erfahrung gemacht, dass …","Jemand aus meiner Familie hat …"]],["Pro",["Für alternative Methoden spricht, dass …","Viele Patienten fühlen sich ernst genommen, dadurch, dass …"]],["Contra",["Dagegen spricht allerdings, dass …","Problematisch wird es, wenn man …, statt …","… ohne dass die Wirkung belegt ist."]],["Meinung und Rat",["Ich persönlich bin der Meinung, dass …","Mein Rat an alle: …","Viele Grüße"]]],
  model:"Hallo zusammen,\n\nich habe selbst die Erfahrung gemacht, dass alternative Methoden helfen können. Vor zwei Jahren hatte ich monatelang starke Rückenschmerzen. Schmerzmittel haben kaum gewirkt, deshalb hat mir eine Bekannte Akupunktur empfohlen. Nach acht Behandlungen ging es mir tatsächlich deutlich besser.\n\nFür alternative Methoden spricht, dass sich die Therapeuten meistens viel Zeit nehmen. Viele Patienten fühlen sich dadurch ernst genommen, dass jemand ihnen eine Stunde lang zuhört – beim Hausarzt hat man oft nur fünf Minuten. Außerdem haben viele dieser Methoden kaum Nebenwirkungen.\n\nDagegen spricht allerdings, dass die Wirkung mancher Methoden wissenschaftlich nicht belegt ist. Kritiker erklären die Erfolge oft mit dem Placebo-Effekt. Problematisch wird es vor allem dann, wenn jemand bei einer schweren Krankheit nur auf Globuli vertraut, statt zum Arzt zu gehen.\n\nIch persönlich bin der Meinung, dass alternative Methoden eine gute Ergänzung sein können, aber kein Ersatz für die Schulmedizin. Mein Rat an alle: Sprecht immer zuerst mit eurem Arzt und probiert Alternativen nur zusätzlich aus, ohne auf notwendige Medikamente zu verzichten.\n\nViele Grüße\nElena"}
},

 grammar:{title:"Erweitertes Partizip · Adversativsätze · Partizipien als Nomen · Fugenelement -s-",
  expl:{ro:"1) Participiul extins înlocuiește o propoziție relativă și este tipic limbii scrise (presă, texte științifice). Toate informațiile stau între articol și substantiv, iar participiul (cu terminație de adjectiv) stă imediat înaintea substantivului. Participiul I = acțiune activă, neîncheiată: der ständig telefonierende Junge (= der Junge, der ständig telefoniert). Participiul II = acțiune încheiată, de obicei pasivă: eine in kurzer Zeit gelernte Sprache (= eine Sprache, die in kurzer Zeit gelernt wurde). Truc de citire: găsește articolul, sari la substantiv, apoi citește informațiile din mijloc. 2) Propozițiile adversative exprimă un contrast între două fapte: während (în timp ce – propoziție secundară, verbul la final): Auf dem Land hört man noch Dialekt, während Jugendliche in Städten Hochdeutsch sprechen. dagegen (în schimb – poziția 1 sau în interior) și im Gegensatz dazu (spre deosebire de aceasta – poziția 1). 3) Participiile folosite ca substantive permit o exprimare scurtă și neutră din punct de vedere al genului: Liebe Studierende (în loc de Studenten und Studentinnen), die Angestellten, die Reisenden, der/die Heranwachsende. Se declină ca adjectivele: ein Angestellter, mit allen Angestellten. 4) Elementul de legătură -s- apare în substantivele compuse după sufixele -heit, -keit, -ion, -ität, -ling, -schaft, -tum, -ung: Freiheitskampf, Diskussionsrunde, Identitätsverlust, Tätigkeitsbereich, Zwillingsbruder, Freundschaftspreis, Eigentumswohnung, Ankündigungstext.",
   ar:"١) الـ Partizip الموسّع بيحل محل جملة صلة وبيستخدم في الكتابة (الجرايد والنصوص العلمية). كل المعلومات بتيجي بين الأداة والاسم، والـ Partizip (بنهاية صفة) بييجي قبل الاسم على طول. Partizip I = فعل مبني للمعلوم ولسه شغّال: der ständig telefonierende Junge (= der Junge, der ständig telefoniert). و Partizip II = فعل خلص وغالبًا مبني للمجهول: eine in kurzer Zeit gelernte Sprache (= eine Sprache, die in kurzer Zeit gelernt wurde). حيلة للقراية: دوّر على الأداة، ونطّ للاسم، وبعدين اقرا المعلومات اللي في النص. ٢) جمل المقابلة بتوضّح تناقض بين حقيقتين: während (في حين إن – جملة فرعية والفعل في الآخر): Auf dem Land hört man noch Dialekt, während Jugendliche in Städten Hochdeutsch sprechen. و dagegen (في المقابل – في الأول أو جوه الجملة)، و im Gegensatz dazu (على عكس ده – في الأول). ٣) الـ Partizip لما يبقى اسم بيدّينا تعبير قصير ومحايد للجنسين: Liebe Studierende (بدل Studenten und Studentinnen)، و die Angestellten، و die Reisenden، و der/die Heranwachsende. وبيتصرّف زي الصفة: ein Angestellter و mit allen Angestellten. ٤) حرف الربط ‎-s- بييجي في الأسماء المركبة بعد النهايات ‎-heit و ‎-keit و ‎-ion و ‎-ität و ‎-ling و ‎-schaft و ‎-tum و ‎-ung: Freiheitskampf و Diskussionsrunde و Identitätsverlust و Tätigkeitsbereich و Zwillingsbruder و Freundschaftspreis و Eigentumswohnung و Ankündigungstext.",
   en:"1) The extended participle replaces a relative clause and is typical of written German (press, academic texts). All the information sits between the article and the noun, and the participle (with an adjective ending) comes right before the noun. Participle I = active, ongoing action: der ständig telefonierende Junge (= der Junge, der ständig telefoniert). Participle II = completed, usually passive action: eine in kurzer Zeit gelernte Sprache (= eine Sprache, die in kurzer Zeit gelernt wurde). Reading trick: find the article, jump to the noun, then read the information in between. 2) Adversative clauses express a contrast between two facts: während (whereas – subordinate clause, verb at the end): Auf dem Land hört man noch Dialekt, während Jugendliche in Städten Hochdeutsch sprechen. dagegen (by contrast – position 1 or inside the clause) and im Gegensatz dazu (in contrast to this – position 1). 3) Participles used as nouns allow short, gender-neutral expressions: Liebe Studierende (instead of Studenten und Studentinnen), die Angestellten, die Reisenden, der/die Heranwachsende. They decline like adjectives: ein Angestellter, mit allen Angestellten. 4) The linking element -s- appears in compound nouns after the suffixes -heit, -keit, -ion, -ität, -ling, -schaft, -tum, -ung: Freiheitskampf, Diskussionsrunde, Identitätsverlust, Tätigkeitsbereich, Zwillingsbruder, Freundschaftspreis, Eigentumswohnung, Ankündigungstext."},

 text:{title:"Ein Deutsch – viele Varianten",de:"„Grüß Gott“, „Moin“ oder „Grüezi“? Wer durch den deutschsprachigen Raum reist, merkt schnell, dass es das eine Deutsch nicht gibt. Deutsch ist in Deutschland, Österreich und Liechtenstein Amtssprache, in der Schweiz und in Luxemburg eine von mehreren Landessprachen und in Südtirol sowie in Ostbelgien regionale Amtssprache. In jedem dieser Gebiete hat sich eine eigene Varietät entwickelt. Sprachwissenschaftler sprechen deshalb von einer „plurizentrischen Sprache“ – einer Sprache mit mehreren gleichberechtigten Zentren. Die Unterschiede betreffen vor allem den Wortschatz. Während man in Hamburg Kartoffeln isst, bestellt man in Wien Erdäpfel. Die in Deutschland verkaufte Sahne heißt in Österreich Obers, und das in Berlin beliebte Brötchen nennt man in Bayern Semmel und in der Schweiz Weggli. Auch in der Grammatik gibt es Abweichungen: In Süddeutschland, Österreich und der Schweiz sagt man „ich bin gesessen“, im Norden dagegen „ich habe gesessen“. Neben diesen nationalen Varianten existieren zahlreiche Dialekte. Besonders lebendig sind sie in der Schweiz. Dort sprechen fast alle Menschen im Alltag Schweizerdeutsch – egal ob Professorin oder Handwerker, ob in der Familie oder im Büro. Im Gegensatz dazu wird Hochdeutsch vor allem geschrieben oder in offiziellen Situationen verwendet. Für Deutschlernende kann das eine echte Herausforderung sein. In Deutschland ist die Situation anders. Hier haben die Dialekte in den letzten Jahrzehnten stark an Bedeutung verloren, besonders in den Städten. Viele Eltern sprachen mit ihren Kindern lieber Hochdeutsch, weil Dialekt lange als ungebildet galt. Heute erleben Mundarten jedoch ein kleines Comeback. Musiker singen im Dialekt, Werbespots spielen mit regionalen Ausdrücken, und Vereine setzen sich für den Erhalt bedrohter Mundarten ein. Für viele Menschen ist ihr Dialekt ein Stück Heimat und ein wichtiger Teil ihrer Identität. Forschungen zeigen übrigens, dass mit Dialekt aufgewachsene Kinder keine Nachteile in der Schule haben. Im Gegenteil: Wer früh lernt, zwischen zwei Sprachvarianten zu wechseln, entwickelt ähnliche Fähigkeiten wie zweisprachig aufwachsende Heranwachsende.",
  q:[["Deutsch ist nur in Deutschland Amtssprache.",false],["Sprachwissenschaftler nennen Deutsch eine plurizentrische Sprache.",true],["Die Unterschiede betreffen vor allem den Wortschatz.",true],["In Wien bestellt man Kartoffeln, in Hamburg Erdäpfel.",false],["In Süddeutschland sagt man „ich bin gesessen“.",true],["In der Schweiz sprechen fast alle im Alltag Dialekt.",true],["In der Schweiz wird Hochdeutsch vor allem im Alltag gesprochen.",false],["In deutschen Städten haben Dialekte an Bedeutung verloren.",true],["Dialekt galt früher als besonders gebildet.",false],["Kinder, die mit Dialekt aufwachsen, haben laut Forschung Nachteile in der Schule.",false]]},

  tip:{ro:"O Stellungnahme are structură clară: introducere – pro – contra – opinie – concluzie. Folosește conectorii adversativi ai lecției (während, dagegen, im Gegensatz dazu) pentru a pune argumentele față în față și un participiu extins pentru stil elevat.",ar:"الـ Stellungnahme ليها ترتيب واضح: مقدمة – مع – ضد – رأيك – خلاصة. استخدم أدوات المقابلة من الدرس (während و dagegen و im Gegensatz dazu) عشان تحط الحجج قصاد بعض، و Partizip موسّع عشان الأسلوب يبقى راقي.",en:"A position paper has a clear structure: introduction – pros – cons – opinion – conclusion. Use the lesson's adversative connectors (während, dagegen, im Gegensatz dazu) to contrast arguments and an extended participle for an elevated style."},

  model:"Sehr geehrte Damen und Herren,\n\ndie Frage, ob Dialekt in der Schule erlaubt sein sollte, wird derzeit kontrovers diskutiert. Dieses Thema betrifft nicht nur Lehrkräfte, sondern vor allem die vielen mit Dialekt aufwachsenden Kinder.\n\nBefürworter argumentieren, dass der Dialekt ein wichtiger Teil der regionalen Identität ist. Kinder, die zu Hause nur Mundart sprechen, fühlen sich in der Schule oft fremd, wenn sie sofort Hochdeutsch sprechen müssen. Hinzu kommt, dass Studien zufolge Kinder, die zwischen Dialekt und Hochdeutsch wechseln, ähnliche Fähigkeiten entwickeln wie zweisprachig aufwachsende Heranwachsende.\n\nGegner wenden dagegen ein, dass die Schule auf das Berufsleben vorbereiten soll. Während der Dialekt nur in einer Region verstanden wird, ermöglicht Hochdeutsch die Kommunikation im ganzen deutschsprachigen Raum. Außerdem könnten Kinder aus anderen Regionen oder mit Migrationshintergrund benachteiligt werden.\n\nNach Abwägung aller Argumente bin ich der Meinung, dass beides seinen Platz haben sollte. Im Unterricht sollte Hochdeutsch die Regel sein. Im Gegensatz dazu sollte der Dialekt in Pausen, Projekten oder im Musikunterricht ausdrücklich erlaubt sein.\n\nAbschließend möchte ich betonen, dass sprachliche Vielfalt kein Problem, sondern ein Schatz ist, den wir bewahren sollten.\n\nMit freundlichen Grüßen\nAna Weber, Graz"}
}

guide:{
 intro:{ro:"telc Deutsch B2 verifică dacă poți folosi germana independent în viața de zi cu zi și la muncă. Examenul are o parte scrisă (Lesen, Sprachbausteine, Hören, Schreiben) și o parte orală (Sprechen, de obicei în pereche). Ca să treci, ai nevoie de cel puțin 60 % în partea scrisă ȘI 60 % în partea orală – separat! Informațiile de aici urmează formatul standard telc Deutsch B2; înainte de înscriere verifică întotdeauna modelul oficial actual pe telc.net.",
  ar:"امتحان telc Deutsch B2 بيختبر إذا كنت تقدر تستخدم الألماني لوحدك في الحياة اليومية والشغل. الامتحان فيه جزء تحريري (Lesen و Sprachbausteine و Hören و Schreiben) وجزء شفوي (Sprechen، غالبًا مع زميل). علشان تنجح لازم تجيب ٦٠٪ على الأقل في التحريري و٦٠٪ في الشفوي – كل واحد لوحده! المعلومات هنا ماشية على الشكل الرسمي لـ telc Deutsch B2، وقبل التسجيل راجع دايمًا النموذج الرسمي الحالي على telc.net.",
  en:"telc Deutsch B2 tests whether you can use German independently in everyday life and at work. The exam has a written part (Reading, Language Elements, Listening, Writing) and an oral part (Speaking, usually in pairs). To pass you need at least 60 % in the written part AND 60 % in the oral part – separately! The information here follows the standard telc Deutsch B2 format; before registering, always check the current official sample test on telc.net."},
 table:[["Prüfungsteil","Aufgaben","Zeit","Punkte"],["Leseverstehen","Teil 1: 5 Texte – 10 Überschriften · Teil 2: langer Text – 5 Fragen (a/b/c) · Teil 3: 10 Situationen – 12 Anzeigen","90 Min. (zusammen mit Sprachbausteinen)","75"],["Sprachbausteine","Teil 1: Brief mit 10 Lücken (a/b/c) · Teil 2: Text mit 10 Lücken, 15 Wörter","(in den 90 Min.)","30"],["Pause","—","20 Min.","—"],["Hörverstehen","Teil 1: 5 Aussagen · Teil 2: Interview – 10 Aussagen · Teil 3: 5 kurze Texte – richtig/falsch","ca. 20 Min.","75"],["Schriftlicher Ausdruck","1 Brief / E-Mail – Sie wählen Aufgabe A oder B","30 Min.","45"],["Schriftlich gesamt","Bestanden ab 135 Punkten (60 %)","ca. 2 Std. 20 Min.","225"],["Mündliche Prüfung","Teil 1: Präsentation · Teil 2: Diskussion · Teil 3: Gemeinsam etwas planen","20 Min. Vorbereitung + ca. 15 Min. Prüfung (Paar)","75"],["Mündlich gesamt","Bestanden ab 45 Punkten (60 %)","",""]],
 parts:[
  {h:"Leseverstehen",ro:"Teil 1: citește întâi cele 10 titluri, apoi fiecare text și caută ideea principală – nu cuvinte identice! Două–trei titluri sunt capcane. Teil 2: citește întrebările înainte de text; răspunsul corect spune același lucru cu alte cuvinte. Teil 3: subliniază în fiecare situație 2–3 criterii (preț, loc, oră, persoană); pentru o situație poate să nu existe anunț – atunci scrii X. Folosește fiecare anunț o singură dată. Nu pierde mai mult de 60 de minute la Lesen, ca să-ți rămână 30 pentru Sprachbausteine.",
   ar:"الجزء ١: اقرا العناوين العشرة الأول، وبعدين كل نص ودوّر على الفكرة الأساسية – مش على نفس الكلمات! فيه ٢–٣ عناوين فخ. الجزء ٢: اقرا الأسئلة قبل النص؛ الإجابة الصح بتقول نفس المعنى بكلام تاني. الجزء ٣: حط خط تحت ٢–٣ شروط في كل موقف (السعر، المكان، الوقت، الشخص)؛ ممكن موقف مالوش إعلان – ساعتها تكتب X. كل إعلان بيستخدم مرة واحدة بس. ماتصرفش أكتر من ٦٠ دقيقة على Lesen علشان يفضلك ٣٠ للـ Sprachbausteine.",
   en:"Part 1: read the 10 headings first, then each text, looking for the main idea – not identical words! Two or three headings are traps. Part 2: read the questions before the text; the correct answer says the same thing in different words. Part 3: underline 2–3 criteria in each situation (price, place, time, person); one situation may have no matching ad – then write X. Each ad is used only once. Don't spend more than 60 minutes on reading so you have 30 left for the language elements."},
  {h:"Sprachbausteine",ro:"Aici se testează gramatica și vocabularul: prepoziții, conectori (obwohl, weil, damit, trotzdem), terminații, verbe cu prepoziție, pronume relative, Konjunktiv II în formule politicoase. Citește propoziția întreagă înainte să alegi. În Teil 2 sunt 15 cuvinte pentru 10 goluri – 5 rămân nefolosite. Bifează cuvintele folosite.",
   ar:"هنا بيختبروا الجرامر والمفردات: حروف الجر، وأدوات الربط (obwohl و weil و damit و trotzdem)، والنهايات، والأفعال مع حروف الجر، وضماير الصلة، و Konjunktiv II في الجمل المؤدبة. اقرا الجملة كلها قبل ما تختار. في الجزء ٢ فيه ١٥ كلمة لـ ١٠ فراغات – ٥ كلمات مش هتستخدمهم. اشطب الكلمة اللي استخدمتها.",
   en:"This tests grammar and vocabulary: prepositions, connectors (obwohl, weil, damit, trotzdem), endings, verbs with prepositions, relative pronouns, Konjunktiv II in polite phrases. Read the whole sentence before choosing. In part 2 there are 15 words for 10 gaps – 5 remain unused. Tick off the words you use."},
  {h:"Hörverstehen",ro:"Folosește timpul de dinainte de fiecare text ca să citești afirmațiile. Teil 1 și Teil 3 se aud o singură dată, Teil 2 (interviul) de două ori – verifică exact formatul în modelul oficial. Atenție la negații (nicht, kein, kaum), cuvinte ca nur, immer, nie și la schimbări de opinie (aber, allerdings). Notează răspunsul imediat și treci mai departe.",
   ar:"استغل الوقت قبل كل نص علشان تقرا الجمل. الجزء ١ والجزء ٣ بيتسمعوا مرة واحدة، والجزء ٢ (المقابلة) مرتين – راجع الشكل بالظبط في النموذج الرسمي. خد بالك من النفي (nicht و kein و kaum)، وكلمات زي nur و immer و nie، ومن تغيير الرأي (aber و allerdings). اكتب الإجابة على طول وكمّل.",
   en:"Use the time before each text to read the statements. Parts 1 and 3 are usually heard once, part 2 (the interview) twice – check the exact format in the official sample. Watch out for negations (nicht, kein, kaum), words like nur, immer, nie and changes of opinion (aber, allerdings). Mark your answer immediately and move on."},
  {h:"Schriftlicher Ausdruck",ro:"Alegi O singură sarcină (A sau B) – citește-le pe amândouă 1–2 minute și alege tema la care ai mai multe idei. Tratează TOATE punctele cerute, fiecare în cel puțin 2–3 propoziții. Scrisoare formală: expeditor, destinatar, Ort und Datum („Bukarest, den 18. Oktober 2026“), Betreff, „Sehr geehrte Damen und Herren,“, prima propoziție cu literă mică, „Mit freundlichen Grüßen“ și numele. Țintește 150–200 de cuvinte și lasă 5 minute pentru corectură (verb pe poziția 2 / la final, terminații, majuscule la substantive).",
   ar:"بتختار مهمة واحدة بس (A أو B) – اقرا الاتنين دقيقة أو اتنين واختار الموضوع اللي عندك فيه أفكار أكتر. اتكلم عن كل النقاط المطلوبة، كل نقطة على الأقل ٢–٣ جمل. الجواب الرسمي: الراسل، والمرسل إليه، والمكان والتاريخ («Bukarest, den 18. Oktober 2026»)، والـ Betreff، و «Sehr geehrte Damen und Herren,»، وأول جملة بحرف صغير، و «Mit freundlichen Grüßen» والاسم. اكتب من ١٥٠ لـ ٢٠٠ كلمة وسيب ٥ دقايق للمراجعة (مكان الفعل، النهايات، الحروف الكبيرة للأسماء).",
   en:"You choose ONE task (A or B) – read both for 1–2 minutes and pick the topic you have more ideas about. Cover ALL required points, each with at least 2–3 sentences. Formal letter: sender, recipient, place and date („Bukarest, den 18. Oktober 2026“), subject line, „Sehr geehrte Damen und Herren,“, first sentence in lower case, „Mit freundlichen Grüßen“ and your name. Aim for 150–200 words and leave 5 minutes for checking (verb position, endings, capital letters for nouns)."},
  {h:"Mündliche Prüfung",ro:"Teil 1 – Präsentation: vorbești aprox. 1,5–2 minute despre tema ta (structură: introducere – experiență proprie – avantaje/dezavantaje – situația în țara ta – opinie și încheiere), apoi partenerul îți pune o întrebare și invers. Teil 2 – Diskussion: discutați un text scurt sau o afirmație; spune-ți opinia, argumentează, reacționează la partener (zustimmen, widersprechen). Teil 3 – planificare comună: faceți propuneri, acceptați sau respingeți politicos și ajungeți la o decizie. Contează să vorbiți amândoi la fel de mult – nu face monolog!",
   ar:"الجزء ١ – العرض: بتتكلم حوالي دقيقة ونص لدقيقتين عن موضوعك (الترتيب: مقدمة – تجربتك – مزايا وعيوب – الوضع في بلدك – رأيك والخاتمة)، وبعدين زميلك يسألك سؤال وانت تسأله. الجزء ٢ – النقاش: بتتناقشوا في نص قصير أو رأي؛ قول رأيك وبرّره ورد على زميلك (توافق أو تعترض). الجزء ٣ – التخطيط سوا: اقترحوا، واقبلوا أو ارفضوا بأدب، ووصلوا لقرار. المهم إنكم الاتنين تتكلموا تقريبًا نفس القدر – ماتعملش مونولوج!",
   en:"Part 1 – Presentation: speak for about 1.5–2 minutes on your topic (structure: introduction – own experience – pros/cons – situation in your country – opinion and conclusion), then your partner asks you a question and vice versa. Part 2 – Discussion: discuss a short text or statement; give your opinion, justify it, react to your partner (agree, disagree). Part 3 – Planning together: make suggestions, accept or reject politely and reach a decision. Both should speak about equally – no monologues!"}],

 title:"Modelltest 1 · Wohnen und Nachbarschaft",
 lesen1:{headings:["Mieter bekommen mehr Rechte","Gemeinsam gärtnern mitten in der Stadt","Wenn der Nachbar zu laut ist","Tauschen statt kaufen","Neue Regeln für Haustiere","Im Alter gemeinsam statt einsam","Studentenwohnheime voll belegt","Strom sparen im Haushalt","Kostenlose Beratung für Wohnungssuchende","Immer mehr Menschen ziehen aufs Land"],
  texts:["Wo früher ein grauer Parkplatz war, wachsen heute Tomaten, Zucchini und Sonnenblumen. Rund vierzig Anwohner haben sich zusammengeschlossen und pflegen die Beete gemeinsam. Jeder bringt ein, was er kann: Die einen gießen, die anderen bauen Hochbeete aus alten Holzpaletten. Die Ernte wird geteilt, und einmal im Monat gibt es ein gemeinsames Essen. „Wir haben hier nicht nur Gemüse, sondern auch Freunde gefunden“, sagt eine Teilnehmerin.",
   "Nach dem Tod ihres Mannes fühlte sich Helga Brandt, 74, in ihrem großen Haus sehr allein. Heute lebt sie mit sechs anderen Seniorinnen und Senioren in einer Wohngemeinschaft. Jeder hat ein eigenes Zimmer mit Bad, Küche und Wohnzimmer werden gemeinsam genutzt. Einkäufe und Arztbesuche organisiert die Gruppe zusammen. „Ich hätte nie gedacht, dass ich mit über siebzig noch in eine WG ziehe – aber es war die beste Entscheidung meines Lebens.“",
   "Hohe Mieten, Lärm und wenig Grün: Immer mehr Familien kehren den Großstädten den Rücken. Laut einer aktuellen Studie haben im letzten Jahr deutlich mehr Menschen eine Stadt in Richtung Dorf verlassen als umgekehrt. Möglich macht das vor allem das Homeoffice. Wer nur noch ein- bis zweimal pro Woche ins Büro fahren muss, nimmt einen längeren Arbeitsweg gern in Kauf. Gemeinden auf dem Land freuen sich über die neuen Bewohner.",
   "Eine Bohrmaschine wird im Durchschnitt nur dreizehn Minuten in ihrem ganzen Leben benutzt. Warum also eine kaufen? In vielen Stadtteilen gibt es inzwischen sogenannte „Leihläden“, in denen man Werkzeuge, Campingausrüstung oder Küchengeräte für wenig Geld ausleihen kann. Andere Initiativen organisieren Tauschpartys für Kleidung und Bücher. Das spart Geld, schont die Umwelt und bringt Menschen zusammen.",
   "Laute Musik um Mitternacht, Partys am Wochenende oder ein Hund, der stundenlang bellt – Streit mit Nachbarn ist einer der häufigsten Gründe für Ärger im Mietshaus. Experten raten, zuerst das persönliche Gespräch zu suchen, bevor man sich beim Vermieter beschwert. Oft weiß der Nachbar gar nicht, dass er stört. Hilft das nicht, kann ein Lärmprotokoll sinnvoll sein, in dem man Datum, Uhrzeit und Art der Störung notiert."],
  key:[1,5,9,3,2]},
 lesen2:{title:"Großes Glück auf kleiner Fläche",text:"Fünfzehn Quadratmeter, zwei Fenster, eine Küchenzeile, ein Bad so groß wie eine Telefonzelle und ein Bett unter dem Dach: Das ist das Zuhause von Jonas Weber. Der 31-jährige Informatiker lebt seit zwei Jahren in einem sogenannten Tiny House, einem Mini-Haus auf Rädern, das er mit Freunden selbst gebaut hat. „Am Anfang haben alle gedacht, ich bin verrückt“, erzählt er lachend. „Aber ich habe noch nie so bewusst gelebt wie jetzt.“ Die Idee kommt aus den USA, wo nach der Finanzkrise 2008 viele Menschen nach günstigen Alternativen zum klassischen Hauskauf suchten. Inzwischen ist der Trend auch in Deutschland angekommen. Die Gründe sind unterschiedlich: Für manche steht der Umweltschutz im Vordergrund, denn ein kleines Haus verbraucht deutlich weniger Energie. Andere wollen unabhängig sein und nicht jahrzehntelang einen Kredit abbezahlen. Ein Tiny House kostet je nach Ausstattung zwischen 40.000 und 100.000 Euro – ein Bruchteil dessen, was ein normales Einfamilienhaus kostet. Doch so einfach, wie es klingt, ist es nicht. Das größte Problem ist der Stellplatz. In Deutschland darf man ein Tiny House nicht einfach auf eine Wiese stellen; man braucht ein Grundstück, auf dem Wohnen erlaubt ist, und eine Baugenehmigung. Viele Gemeinden haben dafür noch keine Regeln. Jonas hatte Glück: Er durfte sein Haus auf dem Grundstück eines Bauernhofs aufstellen und zahlt dafür eine kleine Pacht. Strom bekommt er teilweise von Solarzellen auf dem Dach. Auch der Alltag verlangt Disziplin. „Man kann nichts mehr einfach kaufen und irgendwo hinstellen“, sagt Jonas. „Bevor etwas Neues reinkommt, muss etwas anderes raus.“ Gäste übernachten bei ihm auf einer ausklappbaren Couch, und Partys feiert er lieber draußen. Trotzdem möchte er nicht mehr zurück. Er arbeitet von zu Hause aus, hat weniger Fixkosten und deshalb mehr Zeit für Hobbys. Kritiker weisen jedoch darauf hin, dass Tiny Houses die Wohnungsnot in den Städten nicht lösen können, weil sie im Verhältnis zur Wohnfläche viel Boden verbrauchen. Stadtplaner setzen deshalb eher auf kleinere Wohnungen in Mehrfamilienhäusern. Für Familien mit Kindern sei das Modell ohnehin kaum geeignet. Jonas sieht das gelassen: „Ein Tiny House ist nicht für jeden die richtige Lösung. Aber es zeigt, dass man mit viel weniger glücklich sein kann.“",
  q:[{q:"Jonas Weber …",o:["hat sein Haus mit Hilfe von Freunden gebaut.","hat sein Tiny House in den USA gekauft.","wohnt seit fünfzehn Jahren in seinem Haus."],a:0},
   {q:"Ein Grund für den Trend in Deutschland ist, dass …",o:["Tiny Houses von der Regierung finanziert werden.","man nicht viele Jahre lang einen Kredit zurückzahlen möchte.","normale Häuser weniger Energie verbrauchen."],a:1},
   {q:"Das größte Problem für Besitzer von Tiny Houses ist …",o:["der hohe Preis der Solarzellen.","einen erlaubten Platz für das Haus zu finden.","die schlechte Qualität der Häuser."],a:1},
   {q:"Im Alltag muss Jonas …",o:["auf Gäste komplett verzichten.","jeden Tag ins Büro fahren.","genau überlegen, was er besitzt."],a:2},
   {q:"Kritiker meinen, dass Tiny Houses …",o:["das Wohnungsproblem in Städten nicht lösen.","besonders gut für Familien geeignet sind.","in Zukunft verboten werden sollten."],a:0}]},
 lesen3:{situations:["Ihre Freundin sucht für drei Monate ein möbliertes Zimmer in der Innenstadt.","Ein Kollege möchte sein altes Sofa kostenlos abgeben, hat aber kein Auto.","Ihre Nachbarin, 80, sucht einen Platz in einem Seniorenheim.","Sie möchten am Wochenende lernen, wie man kleine Reparaturen in der Wohnung selbst macht.","Ihr Bruder sucht eine Wohnung für sich und seinen großen Hund.","Sie möchten Ihren Balkon bepflanzen und suchen Tipps.","Ein Freund will in eine Wohngemeinschaft mit anderen Berufstätigen ziehen.","Sie suchen jemanden, der während Ihres Urlaubs Ihre Katze füttert.","Ihre Eltern möchten eine Eigentumswohnung kaufen und brauchen Beratung zur Finanzierung.","Sie wollen Ihre Wohnung streichen lassen und suchen einen günstigen Maler."],
  ads:["a) Tiersitter-Service: Ich versorge Ihre Haustiere zu Hause, während Sie verreisen. Erfahrene Tierpflegerin, 12 € pro Besuch.","b) Malermeister Kraus: Streicharbeiten, Tapezieren, schnell und zuverlässig. Kostenloser Kostenvoranschlag, faire Preise.","c) Ferienwohnung an der Ostsee, 2 Zimmer, Meerblick, ab 80 €/Nacht.","d) Nachbarschaftshilfe „Hand in Hand“: Studierende erledigen Einkäufe für ältere Menschen – kostenlos.","e) Möbliertes WG-Zimmer, zentral, ab sofort, für 2–6 Monate, 450 € warm. Tel. 0176-2238841","f) Berufstätige 3er-WG (28–35 J.) sucht ruhigen, ordentlichen Mitbewohner. Zimmer 18 m², unbefristet.","g) Verkaufe Kinderzimmermöbel, fast neu, Selbstabholung, 300 €.","h) Heimwerkerkurs für Anfänger: Samstag und Sonntag, 10–16 Uhr. Wände streichen, Regale montieren, Wasserhahn wechseln. VHS Mitte.","i) Bausparkasse Nord: Kostenlose Beratung zu Krediten und Finanzierung beim Wohnungskauf. Termin online.","j) Helle 3-Zimmer-Wohnung mit Garten, Haustiere erlaubt, Stadtrand, 1.100 € kalt.","k) Gartencenter Grünwerk: Kostenloser Vortrag „Mein Balkon blüht“ – Donnerstag, 18 Uhr.","l) Sperrmüll-Abholung: Wir holen Ihre alten Möbel kostenlos ab – gemeinnütziger Verein „Zweite Chance“. Termin unter 089-445566"],
  key:[4,11,-1,7,9,10,5,0,8,1]},
 sb1:{text:"Liebe Frau Hoffmann,\n\nvielen Dank für Ihre Einladung [1] Hoffest am nächsten Samstag. Ich freue mich sehr darüber und komme natürlich gern. Leider kann ich erst gegen 17 Uhr da sein, [2] ich bis 16 Uhr arbeiten muss.\n\nSie haben gefragt, ob jemand beim Aufbau helfen kann. Mein Mann hat Zeit und würde Ihnen gern [3]. Er könnte zum Beispiel die Tische und Bänke aus dem Keller holen, [4] Sie nicht alles allein tragen müssen.\n\nAußerdem möchte ich einen Kuchen mitbringen. Wissen Sie schon, [5] die anderen Nachbarn mitbringen? Ich möchte nicht, dass wir am Ende fünf Schokoladenkuchen haben! Vielleicht könnten Sie eine Liste an die Haustür hängen, [6] jeder eintragen kann, was er mitbringt.\n\nNoch eine Frage: Dürfen auch Kinder [7] Fest kommen? Unsere Tochter würde sich sehr freuen, die anderen Kinder aus dem Haus [8] kennenzulernen.\n\nIch finde es toll, dass Sie sich so sehr für eine gute Nachbarschaft [9]. Das ist heutzutage leider nicht mehr selbstverständlich.\n\nBis Samstag und [10] Grüße\nIhre Elena Popescu",
  o:[["zum","für das","an dem"],["weil","deshalb","obwohl"],["helfen","hilft","geholfen"],["damit","um","sodass zu"],["was","dass","wie viel"],["auf der","in die","an der"],["zum","zu dem","auf das"],["besser","gut","am besten"],["engagieren","interessieren","kümmern"],["herzliche","herzlichen","herzlich"]],
},
 sb2:{text:"Wohnen in der Großstadt wird immer teurer. In vielen Städten müssen Mieter inzwischen mehr als ein Drittel [11] Einkommens für die Miete ausgeben. Besonders schwierig ist die Situation für Studierende und Familien [12] kleinem Einkommen. Viele finden [13] Monaten keine bezahlbare Wohnung. Die Politik hat reagiert und eine sogenannte Mietpreisbremse eingeführt. Sie soll verhindern, [14] die Mieten bei einem neuen Vertrag zu stark steigen. Kritiker meinen jedoch, dass das Gesetz zu viele Ausnahmen hat und deshalb kaum [15]. Experten fordern vor allem, mehr neue Wohnungen zu [16]. Doch Bauland ist knapp und teuer. Eine Lösung könnten genossenschaftliche Projekte sein, [17] die Bewohner gemeinsam Eigentümer sind. Dort sind die Mieten meist deutlich niedriger, [18] niemand mit den Wohnungen Gewinn machen will. Außerdem entscheiden die Mitglieder gemeinsam über wichtige Fragen. Wer eine solche Wohnung bekommen möchte, braucht allerdings Geduld: Die Wartelisten sind [19] lang, dass man sich oft schon Jahre vorher anmelden muss. Trotzdem lohnt es sich, [20] zu informieren.",
  words:["a) ihres","b) mit","c) seit","d) dass","e) wirkt","f) bauen","g) bei denen","h) weil","i) so","j) sich","k) ob","l) wegen","m) deren","n) obwohl","o) baut"],
},
 hoeren1:{intro:"Sie hören fünf Personen, die über ihre Nachbarn sprechen. Sind die Aussagen richtig oder falsch?",items:[
  {script:"Also, meine Nachbarn sehe ich eigentlich nie. Wir grüßen uns im Treppenhaus, aber mehr nicht. Ehrlich gesagt finde ich das auch ganz angenehm. Ich arbeite viel und möchte zu Hause meine Ruhe haben.",s:"Die Person wünscht sich mehr Kontakt zu den Nachbarn.",a:false},
  {script:"Wir haben im Haus eine WhatsApp-Gruppe. Wenn jemand ein Paket annehmen soll oder Werkzeug braucht, schreibt man einfach. Letzten Winter, als ich krank war, haben mir die Nachbarn sogar Suppe gebracht.",s:"Die Nachbarn helfen sich gegenseitig.",a:true},
  {script:"Über mir wohnt eine Familie mit drei Kindern. Am Anfang hat mich der Lärm wirklich gestört. Dann haben wir uns zusammengesetzt und Ruhezeiten vereinbart. Seitdem klappt es gut.",s:"Das Problem mit dem Lärm besteht immer noch.",a:false},
  {script:"Ich wohne in einem Haus mit vielen älteren Menschen. Einmal pro Woche gehe ich für meine Nachbarin einkaufen, sie ist schon über neunzig. Dafür backt sie mir jeden Sonntag einen Kuchen.",s:"Die Person kauft für eine ältere Nachbarin ein.",a:true},
  {script:"Mein Nachbar parkt ständig vor meiner Garage. Ich habe ihn schon mehrmals darauf angesprochen, aber er ignoriert mich. Jetzt habe ich mich beim Vermieter beschwert.",s:"Die Person hat noch nicht mit dem Nachbarn gesprochen.",a:false}]},
 hoeren2:{intro:"Sie hören ein Interview mit einer Expertin für Wohnprojekte. Sind die Aussagen richtig oder falsch?",script:"Moderator: Frau Dr. Lehmann, Sie beschäftigen sich seit vielen Jahren mit neuen Wohnformen. Was hat sich in den letzten Jahren verändert? – Lehmann: Sehr viel. Früher lebten die meisten Menschen in einer klassischen Familie, also Eltern mit Kindern. Heute gibt es viel mehr Singles, Alleinerziehende und ältere Menschen, die allein leben. Gleichzeitig wünschen sich viele mehr Gemeinschaft. – Moderator: Und wie sieht diese Gemeinschaft aus? – Lehmann: Ein Beispiel sind Mehrgenerationenhäuser. Dort wohnen junge Familien, Studierende und Senioren unter einem Dach. Jeder hat seine eigene Wohnung, aber es gibt Gemeinschaftsräume, zum Beispiel eine große Küche oder einen Garten. Die Älteren passen manchmal auf die Kinder auf, und die Jüngeren helfen im Gegenzug beim Einkaufen oder bei technischen Fragen. – Moderator: Klingt ideal. Gibt es auch Probleme? – Lehmann: Natürlich. Wo viele Menschen zusammenleben, gibt es auch Konflikte, etwa über Lärm oder Sauberkeit. Deshalb ist es wichtig, dass es von Anfang an klare Regeln gibt. In den meisten Projekten trifft man sich einmal im Monat zu einer Hausversammlung. – Moderator: Ist diese Art zu wohnen teurer? – Lehmann: Nicht unbedingt. Oft sind die Mieten sogar günstiger, weil die Häuser von Genossenschaften gebaut werden, die keinen Gewinn machen wollen. Allerdings muss man meistens einen Anteil kaufen, der mehrere tausend Euro kosten kann. – Moderator: Wie lange muss man auf einen Platz warten? – Lehmann: Das ist leider das größte Problem. In beliebten Städten wie München oder Hamburg warten Interessenten oft drei bis fünf Jahre. Auf dem Land geht es schneller. – Moderator: Was raten Sie Menschen, die so leben möchten? – Lehmann: Sich frühzeitig zu informieren und vorher einmal bei einem Projekt zu Besuch zu sein. Viele Häuser bieten Tage der offenen Tür an. Und man sollte ehrlich zu sich selbst sein: Wer seine Ruhe braucht und nicht gern Kompromisse macht, ist dort vielleicht nicht glücklich.",
  s:[["Laut Dr. Lehmann leben heute mehr Menschen allein als früher.",true],["In Mehrgenerationenhäusern teilen sich alle Bewohner eine einzige Wohnung.",false],["Ältere Bewohner betreuen manchmal die Kinder.",true],["In Wohnprojekten gibt es nie Streit.",false],["In den meisten Projekten gibt es regelmäßige Hausversammlungen.",true],["Die Mieten in solchen Projekten sind immer sehr hoch.",false],["Oft muss man einen Anteil an der Genossenschaft kaufen.",true],["In München bekommt man schnell einen Platz.",false],["Viele Projekte laden Interessenten zu einem Besuch ein.",true],["Laut Dr. Lehmann passt diese Wohnform zu jedem Menschen.",false]]},
 hoeren3:{intro:"Sie hören fünf kurze Texte. Sind die Aussagen richtig oder falsch?",items:[
  {script:"Liebe Mieterinnen und Mieter, am kommenden Dienstag wird zwischen acht und zwölf Uhr das Wasser im gesamten Haus abgestellt. Grund sind Reparaturarbeiten an den Leitungen. Bitte füllen Sie sich vorher genügend Wasser ab. Ihre Hausverwaltung.",s:"Das Wasser wird am Dienstagnachmittag abgestellt.",a:false},
  {script:"Hallo Frau Ionescu, hier ist Herr Wagner vom Malerbetrieb Kraus. Ich wollte unseren Termin für Donnerstag bestätigen. Wir kommen um halb neun. Bitte räumen Sie die Möbel von den Wänden weg. Danke und bis Donnerstag!",s:"Frau Ionescu soll vor dem Termin die Möbel wegräumen.",a:true},
  {script:"Und nun der Verkehr: Auf der Hauptstraße Richtung Zentrum gibt es wegen einer Baustelle einen langen Stau. Bitte nutzen Sie die Umleitung über die Bahnhofstraße. Die Arbeiten dauern voraussichtlich bis Ende der Woche.",s:"Die Baustelle ist schon heute Abend fertig.",a:false},
  {script:"Hier ist der Anrufbeantworter der Stadtbibliothek. Wegen einer Veranstaltung schließen wir heute bereits um sechzehn Uhr. Ab morgen gelten wieder die normalen Öffnungszeiten.",s:"Die Bibliothek schließt heute früher als normal.",a:true},
  {script:"Achtung, eine Information für alle Besucher des Wochenmarkts: Ab nächster Woche findet der Markt nicht mehr am Rathausplatz statt, sondern auf dem Parkplatz hinter der Kirche. Die Öffnungszeiten bleiben gleich.",s:"Der Markt hat ab nächster Woche neue Öffnungszeiten.",a:false}]},
 schreiben:[
  {title:"Aufgabe A · Beschwerde an die Hausverwaltung",situation:"Seit drei Wochen funktioniert in Ihrem Mietshaus der Aufzug nicht. Sie wohnen im fünften Stock. Sie haben die Hausverwaltung schon zweimal angerufen, aber nichts ist passiert. Schreiben Sie eine Beschwerde an die Hausverwaltung „Wohnbau Süd GmbH“.",points:["Grund Ihres Schreibens","Folgen für Sie und andere Mieter","Ihre bisherigen Versuche, das Problem zu lösen","Ihre Forderungen (mit Frist)"],
   model:"Elena Popescu\nGoethestraße 12\n80336 München\n\nWohnbau Süd GmbH\nKundenservice\nLandsberger Straße 88\n80339 München\n\nMünchen, den 18. Oktober 2026\n\nDefekter Aufzug in der Goethestraße 12\n\nSehr geehrte Damen und Herren,\n\nich wende mich an Sie, weil der Aufzug in unserem Haus seit drei Wochen nicht funktioniert.\n\nIch wohne im fünften Stock und muss meine Einkäufe jeden Tag die Treppe hochtragen. Für mich ist das anstrengend, für die älteren Mieter im Haus ist es jedoch ein echtes Problem. Unsere Nachbarin, Frau Berger, ist 82 Jahre alt und kann ihre Wohnung seitdem kaum noch verlassen. Auch Familien mit Kinderwagen haben große Schwierigkeiten.\n\nAm 30. September und am 7. Oktober habe ich Ihren Kundenservice angerufen. Beide Male wurde mir versprochen, dass ein Techniker innerhalb weniger Tage kommt. Leider ist bis heute nichts passiert.\n\nIch fordere Sie daher auf, den Aufzug bis spätestens 31. Oktober reparieren zu lassen. Außerdem erwarte ich für die Zeit ohne Aufzug eine angemessene Mietminderung. Sollte ich bis zu diesem Datum nichts von Ihnen hören, werde ich mich an den Mieterverein wenden.\n\nMit freundlichen Grüßen\nElena Popescu"},
  {title:"Aufgabe B · Anfrage an eine Wohnungsgenossenschaft",situation:"Sie haben in der Zeitung gelesen, dass die Wohnungsgenossenschaft „Gemeinsam Wohnen eG“ ein neues Mehrgenerationenhaus baut. Sie interessieren sich für eine Wohnung. Schreiben Sie eine E-Mail an die Genossenschaft.",points:["Grund Ihres Schreibens und kurze Vorstellung","Fragen zu Größe und Kosten der Wohnungen","Fragen zum Zusammenleben im Haus","Bitte um einen Besichtigungstermin"],
   model:"Andrei Marin\nLindenweg 4\n50667 Köln\n\nGemeinsam Wohnen eG\nVermietung\nRheinstraße 21\n50668 Köln\n\nKöln, den 18. Oktober 2026\n\nAnfrage zu Ihrem neuen Mehrgenerationenhaus\n\nSehr geehrte Damen und Herren,\n\nmit großem Interesse habe ich im „Kölner Anzeiger“ gelesen, dass Sie ein neues Mehrgenerationenhaus bauen. Ich bin 38 Jahre alt, verheiratet und habe zwei Kinder. Wir suchen schon lange eine größere Wohnung in einer guten Nachbarschaft.\n\nZunächst möchte ich wissen, wie groß die Wohnungen sind und ob es auch Vierzimmerwohnungen gibt. Außerdem interessiert mich, wie hoch die monatliche Miete ist und wie viel ein Genossenschaftsanteil kostet.\n\nBesonders gefällt mir die Idee, dass Jung und Alt zusammenwohnen. Könnten Sie mir mitteilen, welche Gemeinschaftsräume es geben wird und ob von den Bewohnern erwartet wird, sich aktiv zu beteiligen?\n\nGern würde ich das Projekt einmal persönlich kennenlernen. Gibt es die Möglichkeit, einen Besichtigungstermin zu vereinbaren oder an einem Informationsabend teilzunehmen?\n\nFür Ihre Bemühungen bedanke ich mich im Voraus und freue mich auf Ihre Antwort.\n\nMit freundlichen Grüßen\nAndrei Marin"}],
 sprechen:{
  t1:[{who:"Kandidat/in A",topic:"Wohnen in der Stadt oder auf dem Land?",pts:["eigene Erfahrung","Vor- und Nachteile","Situation in Ihrem Heimatland","Ihre Meinung"]},{who:"Kandidat/in B",topic:"Wohngemeinschaften – eine gute Idee?",pts:["eigene Erfahrung","Vor- und Nachteile","Situation in Ihrem Heimatland","Ihre Meinung"]}],
  t2:{text:"Zeitungsmeldung: „Immer mehr Städte verbieten Ferienwohnungen für Touristen. Ziel ist, dass wieder mehr Wohnraum für Einheimische zur Verfügung steht. Vermieter kritisieren das Verbot als Eingriff in ihr Eigentum.“",q:"Diskutieren Sie: Ist ein solches Verbot richtig? Begründen Sie Ihre Meinung und reagieren Sie auf die Argumente Ihres Partners."},
  t3:{situation:"In Ihrem Wohnhaus soll im Sommer zum ersten Mal ein Nachbarschaftsfest stattfinden. Sie und Ihr Partner sollen es organisieren.",pts:["Termin und Ort","Essen und Getränke","Programm für Kinder und Erwachsene","Wer übernimmt welche Aufgaben?"]},
  model:"Teil 1 (Beispiel): „In meiner Präsentation geht es um die Frage, ob man besser in der Stadt oder auf dem Land wohnt. Ich selbst bin in einem kleinen Dorf aufgewachsen und wohne seit fünf Jahren in Bukarest. Ein großer Vorteil der Stadt ist, dass man alles schnell erreichen kann … Ein Nachteil dagegen sind die hohen Mieten … In meinem Heimatland ziehen viele junge Leute in die Städte, während die Dörfer immer leerer werden … Meiner Meinung nach hängt die Entscheidung von der Lebensphase ab. Vielen Dank fürs Zuhören.“\n\nTeil 2: „Ich finde das Verbot grundsätzlich richtig, denn Wohnungen sind zum Wohnen da. – Da muss ich Ihnen widersprechen. Viele Vermieter verdienen mit Touristen ihr Geld …“\n\nTeil 3: „Wie wäre es, wenn wir das Fest an einem Samstag im Juni im Hof machen? – Gute Idee! Für das Essen schlage ich vor, dass jeder etwas mitbringt. – Und wer kümmert sich um die Kinder? Vielleicht könnten wir Spiele organisieren …“"}

 title:"Modelltest 2 · Arbeit und Beruf",
 lesen1:{headings:["Vier-Tage-Woche im Test","Wenn der Chef zu viel verlangt","Weiterbildung zahlt sich aus","Mehr Frauen in Führungspositionen","Pause ohne Handy","Fachkräfte aus dem Ausland gesucht","Vorstellungsgespräch vor der Kamera","Streik legt Bahnverkehr lahm","Kein Feierabend ohne E-Mails?","Junge Leute gründen eigene Firmen"],
  texts:["Ein Jahr lang haben fünfzig Unternehmen ein ungewöhnliches Modell ausprobiert: Ihre Mitarbeiter arbeiteten nur noch vier Tage pro Woche – bei gleichem Gehalt. Das Ergebnis überraschte viele Skeptiker. Die Produktivität blieb gleich, die Zahl der Krankmeldungen sank deutlich. Fast alle Firmen wollen das Modell beibehalten.",
   "In Pflegeheimen, Krankenhäusern und auf Baustellen fehlen Hunderttausende Arbeitskräfte. Die Bundesregierung will es deshalb Menschen aus Nicht-EU-Ländern leichter machen, in Deutschland zu arbeiten. Abschlüsse sollen schneller anerkannt werden, und wer gute Deutschkenntnisse hat, bekommt einfacher ein Visum.",
   "Immer mehr Unternehmen führen die erste Runde der Bewerbungsgespräche online durch. Für Bewerber spart das Zeit und Reisekosten. Doch Experten warnen: Auch vor dem Bildschirm zählt der erste Eindruck. Man sollte auf einen ruhigen Hintergrund, gutes Licht und eine stabile Internetverbindung achten – und sich so kleiden wie für ein persönliches Gespräch.",
   "Eine kurze Nachricht vom Chef am Sonntagabend, eine Frage von einem Kollegen um 22 Uhr: Für viele Beschäftigte ist es normal, auch in der Freizeit erreichbar zu sein. Psychologen sehen das kritisch, denn wer nie richtig abschaltet, riskiert Schlafprobleme und Erschöpfung. Einige Firmen leiten E-Mails nach Feierabend deshalb automatisch nicht mehr weiter.",
   "Statt nach dem Studium eine feste Stelle zu suchen, wagen immer mehr junge Menschen den Schritt in die Selbstständigkeit. Besonders beliebt sind digitale Geschäftsideen, etwa Apps oder Online-Shops. Hochschulen unterstützen sie mit Beratung, Büroräumen und Kontakten zu Investoren. Allerdings scheitert etwa die Hälfte der neuen Firmen in den ersten fünf Jahren."],
  key:[0,5,6,8,9]},
 lesen2:{title:"Vom Ingenieur zum Lehrer",text:"Fünfzehn Jahre lang hat Thomas Berger als Maschinenbauingenieur in einem großen Automobilkonzern gearbeitet. Er verdiente gut, hatte einen sicheren Arbeitsplatz und ein Büro mit Blick auf den Park. Trotzdem war er nicht glücklich. „Ich hatte das Gefühl, dass meine Arbeit keinen echten Sinn hat“, erzählt der 44-Jährige. Heute steht er vor einer zehnten Klasse und unterrichtet Mathematik und Physik. Thomas ist ein sogenannter Quereinsteiger – jemand, der ohne klassisches Lehramtsstudium Lehrer geworden ist. Solche Quereinsteiger werden in Deutschland dringend gebraucht. In vielen Bundesländern fehlen Tausende Lehrkräfte, besonders in naturwissenschaftlichen Fächern. Deshalb haben die Länder Programme entwickelt, mit denen Akademiker aus anderen Berufen in die Schule wechseln können. In der Regel unterrichten sie von Anfang an, besuchen aber parallel ein bis zwei Jahre lang ein Seminar, in dem sie Pädagogik und Didaktik lernen. Die ersten Monate waren für Thomas eine große Herausforderung. „Ich wusste alles über Motoren, aber nichts darüber, wie man dreißig Teenager motiviert“, sagt er lachend. Besonders schwierig fand er es, mit Unterrichtsstörungen umzugehen. Geholfen haben ihm erfahrene Kolleginnen, die ihn in ihren Unterricht eingeladen und ihm Tipps gegeben haben. Finanziell musste Thomas zunächst Abstriche machen. Als Quereinsteiger verdient er weniger als früher in der Industrie, zumindest in den ersten Jahren. Dafür hat er mehr freie Zeit in den Ferien – auch wenn er viele Abende mit Korrekturen und Unterrichtsvorbereitung verbringt. Seine Familie unterstützt die Entscheidung, obwohl seine Frau anfangs skeptisch war. Nicht alle Quereinsteiger bleiben dauerhaft im Schuldienst. Studien zeigen, dass etwa jeder Fünfte nach wenigen Jahren wieder aufgibt, meistens wegen der hohen Belastung. Bildungsexperten fordern deshalb eine bessere Vorbereitung, bevor die neuen Lehrkräfte allein vor einer Klasse stehen. Lehrerverbände kritisieren außerdem, dass die Qualität des Unterrichts leiden könne, wenn zu viele Lehrkräfte keine pädagogische Ausbildung haben. Thomas kann diese Kritik verstehen, sieht aber auch die Vorteile. „Ich kann meinen Schülern erzählen, wofür man Mathematik in der Praxis wirklich braucht. Das macht den Unterricht lebendiger.“ Bereut hat er seinen Wechsel nie. „Wenn ein Schüler plötzlich versteht, was ich erkläre, und mich anstrahlt – das ist mehr wert als jede Gehaltserhöhung.“",
  q:[{q:"Thomas Berger hat seinen Beruf gewechselt, weil …",o:["er seine Arbeit als wenig sinnvoll empfand.","er in der Industrie entlassen wurde.","er schon immer Lehrer werden wollte."],a:0},
   {q:"Quereinsteiger …",o:["müssen zuerst ein komplettes Lehramtsstudium machen.","unterrichten sofort und machen gleichzeitig eine pädagogische Ausbildung.","dürfen nur Sport und Kunst unterrichten."],a:1},
   {q:"Am Anfang hatte Thomas besonders Probleme damit, …",o:["den Stoff in Physik zu verstehen.","mit Kollegen zusammenzuarbeiten.","mit störenden Schülern umzugehen."],a:2},
   {q:"Finanziell …",o:["verdient Thomas zurzeit weniger als früher.","hat sich für Thomas nichts verändert.","verdient Thomas jetzt deutlich mehr."],a:0},
   {q:"Lehrerverbände befürchten, dass …",o:["Quereinsteiger zu viel verdienen.","der Unterricht ohne pädagogische Ausbildung schlechter werden könnte.","bald zu viele Lehrer arbeitslos sind."],a:1}]},
 lesen3:{situations:["Ihre Kollegin möchte ihr Englisch für Telefonate mit Kunden verbessern.","Ein Freund sucht einen Nebenjob am Wochenende, am liebsten in der Gastronomie.","Sie möchten lernen, wie man eine überzeugende Präsentation hält.","Ihr Nachbar ist 58 und sucht eine Beratung, weil er sich beruflich neu orientieren will.","Ihre Schwester möchte sich selbstständig machen und braucht Hilfe beim Businessplan.","Sie suchen eine Teilzeitstelle im Büro, vormittags.","Ein Bekannter hat einen ausländischen Berufsabschluss und möchte ihn anerkennen lassen.","Sie möchten Ihre Kenntnisse in Excel vertiefen.","Ihr Sohn sucht einen Ausbildungsplatz als Koch.","Ihre Freundin möchte sich zur Kindergärtnerin umschulen lassen."],
  ads:["a) Restaurant „Zur Linde“ bildet aus: Koch/Köchin (m/w/d), Beginn 1. September. Bewerbungen an info@zurlinde.de","b) Rhetorik-Workshop: Sicher auftreten, frei sprechen, überzeugend präsentieren. Samstag, 9–17 Uhr.","c) Business English am Telefon: Abendkurs für Berufstätige, 10 Termine, kleine Gruppen.","d) Café am Markt sucht Aushilfe für Samstag und Sonntag. Erfahrung im Service erwünscht.","e) Gründerzentrum Nord: Kostenlose Beratung für Existenzgründer – vom Businessplan bis zur Finanzierung.","f) Anwaltskanzlei sucht Bürokraft in Teilzeit (20 Std.), Arbeitszeit 8–12 Uhr.","g) Excel für Fortgeschrittene: Pivot-Tabellen, Formeln, Diagramme. Online-Kurs, 6 Wochen.","h) Beratungsstelle „Anerkennung“: Wir helfen bei der Anerkennung ausländischer Abschlüsse. Kostenlos und mehrsprachig.","i) Fitnessstudio sucht Trainer/in für Abendkurse.","j) Berufsberatung 50+: Neue Perspektiven für erfahrene Arbeitnehmer. Termine bei der Agentur für Arbeit.","k) Lagerhelfer gesucht, Schichtarbeit, ab sofort.","l) Spanisch für Anfänger: Intensivkurs im August."],

 sb1:{text:"Sehr geehrte Frau Schulz,\n\nich arbeite seit drei Jahren in der Buchhaltung unserer Firma und möchte mich gern [1] weiterbilden. Deshalb wende ich mich [2] Sie.\n\nIm Intranet habe ich gelesen, dass die Firma Kurse zum Thema Digitalisierung anbietet. Ich interessiere mich besonders [3] den Kurs „Moderne Buchhaltungssoftware“. Könnten Sie mir bitte mitteilen, [4] der Kurs stattfindet und wie viele Plätze es noch gibt?\n\nAußerdem würde ich gern wissen, ob die Kurszeit als Arbeitszeit gilt. Da ich zwei kleine Kinder habe, wäre es für mich schwierig, abends an einem Kurs [5]. Falls der Kurs nur am Abend angeboten wird, wäre ein Online-Kurs eine gute Alternative, [6] ich von zu Hause aus teilnehmen könnte.\n\nMeine Vorgesetzte, Frau Lang, unterstützt meinen Wunsch und ist der Meinung, [7] die Weiterbildung auch für unser Team sehr nützlich wäre. [8] neuen Kenntnissen könnte ich meine Kolleginnen und Kollegen später bei der Umstellung auf das neue System unterstützen.\n\nIch wäre Ihnen sehr dankbar, [9] Sie mir bald antworten könnten.\n\nMit [10] Grüßen\nMaria Dumitru",

 sb2:{text:"Seit einigen Jahren arbeiten viele Menschen regelmäßig im Homeoffice. Was früher eine Ausnahme war, ist heute für Millionen Beschäftigte [11]. Die Vorteile liegen auf der Hand: Der Weg ins Büro fällt [12], man spart Zeit und Geld und kann die Arbeit besser mit dem Familienleben verbinden. Doch das Arbeiten von zu Hause hat auch Schattenseiten. Viele Beschäftigte berichten, dass es ihnen schwerfällt, Arbeit und Freizeit [13] zu trennen. Wer am Küchentisch arbeitet, schaltet oft auch abends noch den Laptop ein. Außerdem fehlt der Kontakt [14] Kolleginnen und Kollegen. Gerade neue Mitarbeiter fühlen sich [15] allein gelassen. Unternehmen versuchen deshalb, eine Balance zu finden. Viele setzen inzwischen auf ein sogenanntes hybrides Modell, [16] die Mitarbeiter einige Tage im Büro und einige Tage zu Hause arbeiten. Experten empfehlen, sich zu Hause einen festen Arbeitsplatz einzurichten und feste Pausen [17] machen. Wichtig sei auch, dass die Firma die nötige Technik zur Verfügung [18]. [19] die Zukunft der Arbeit aussehen wird, ist noch offen. Sicher ist nur: Ganz zurück ins Büro [20] die wenigsten.",
  words:["selbstverständlich","weg","klar","mit den","manchmal","bei dem","zu","stellt","Wie","wollen","weil","stellen","dass","mit der","Ob"]},
 hoeren1:{intro:"Sie hören fünf Personen, die über ihren Beruf sprechen. Sind die Aussagen richtig oder falsch?",items:[
  {script:"Ich bin Krankenpflegerin und arbeite im Schichtdienst. Die Arbeit ist anstrengend, und das Gehalt könnte besser sein. Aber wenn ein Patient sich bei mir bedankt, weiß ich wieder, warum ich diesen Beruf gewählt habe.",s:"Die Frau ist mit ihrem Gehalt sehr zufrieden.",a:false},
  {script:"Seit einem Jahr arbeite ich komplett im Homeoffice. Ich spare jeden Tag zwei Stunden Fahrzeit. Manchmal vermisse ich zwar meine Kollegen, aber zurück ins Büro möchte ich trotzdem nicht.",s:"Der Mann möchte weiter von zu Hause arbeiten.",a:true},
  {script:"Ich habe nach dem Abitur eine Ausbildung als Elektronikerin gemacht. Viele haben gesagt, das sei kein Beruf für Frauen. Heute leite ich ein Team von acht Männern – und alle respektieren mich.",s:"Die Frau arbeitet heute als Teamleiterin.",a:true},
  {script:"Ich bin Lehrer an einer Grundschule. Die Klassen sind viel zu groß, und es fehlt an Personal. Ich überlege ernsthaft, den Beruf zu wechseln, obwohl ich die Arbeit mit Kindern eigentlich liebe.",s:"Der Lehrer ist mit seinen Arbeitsbedingungen zufrieden.",a:false},
  {script:"Vor zwei Jahren habe ich mich mit einem kleinen Café selbstständig gemacht. Ich arbeite mehr als früher, oft auch am Wochenende. Aber ich bin meine eigene Chefin, und das ist mir sehr wichtig.",s:"Die Frau arbeitet jetzt weniger als früher.",a:false}]},
 hoeren2:{intro:"Sie hören ein Interview mit einer Berufsberaterin. Sind die Aussagen richtig oder falsch?",script:"Moderator: Frau Krüger, Sie beraten seit zwanzig Jahren junge Menschen bei der Berufswahl. Ist die Entscheidung heute schwieriger als früher? – Krüger: Ja, eindeutig. Es gibt inzwischen über dreihundert Ausbildungsberufe und mehr als zwanzigtausend Studiengänge. Viele Jugendliche fühlen sich von dieser Auswahl überfordert. – Moderator: Womit beginnen Sie in der Beratung? – Krüger: Ich frage nicht zuerst, was jemand werden will, sondern was ihm Spaß macht und was er gut kann. Viele Jugendliche unterschätzen ihre Stärken. Wer zum Beispiel gern organisiert oder anderen hilft, hat Fähigkeiten, die in vielen Berufen gefragt sind. – Moderator: Welche Rolle spielen die Eltern? – Krüger: Eine große. Leider wünschen sich viele Eltern, dass ihre Kinder unbedingt studieren. Dabei bietet eine Ausbildung oft sehr gute Chancen. Handwerker werden dringend gesucht und verdienen inzwischen teilweise mehr als Akademiker. – Moderator: Wie wichtig sind Praktika? – Krüger: Sehr wichtig. Ein Praktikum ist die beste Möglichkeit herauszufinden, ob ein Beruf wirklich passt. Ich empfehle mindestens zwei Praktika in ganz unterschiedlichen Bereichen. Manchmal merkt man auch, was man auf keinen Fall machen möchte – das ist genauso wertvoll. – Moderator: Was ist mit jungen Menschen, die nach der Schule noch gar nicht wissen, was sie wollen? – Krüger: Das ist völlig normal. Ein freiwilliges soziales Jahr oder ein Auslandsaufenthalt kann helfen, sich zu orientieren. Wichtig ist nur, dass man diese Zeit aktiv nutzt und nicht nur abwartet. – Moderator: Und wenn man die falsche Entscheidung trifft? – Krüger: Dann ist das kein Weltuntergang. Fast jeder dritte Student wechselt einmal das Fach oder bricht ab. Heute ist es ganz normal, im Laufe des Lebens mehrmals den Beruf zu wechseln. Lebenslanges Lernen ist das Stichwort.",
  s:[["Laut Frau Krüger ist die Berufswahl heute leichter als früher.",false],["Es gibt mehr als zwanzigtausend Studiengänge.",true],["In der Beratung fragt Frau Krüger zuerst nach dem Traumberuf.",false],["Viele Jugendliche kennen ihre Stärken nicht gut genug.",true],["Viele Eltern möchten, dass ihre Kinder studieren.",true],["Handwerker verdienen immer weniger als Akademiker.",false],["Frau Krüger empfiehlt Praktika in verschiedenen Bereichen.",true],["Ein Praktikum, das einem nicht gefällt, ist laut Krüger nutzlos.",false],["Nach der Schule noch nicht zu wissen, was man will, ist normal.",true],["Laut Frau Krüger sollte man nie den Beruf wechseln.",false]]},
 hoeren3:{intro:"Sie hören fünf kurze Texte. Sind die Aussagen richtig oder falsch?",items:[
  {script:"Guten Tag, hier ist die Personalabteilung der Firma Lindner. Wir möchten Sie zu einem Vorstellungsgespräch am Mittwoch, dem zwölften, um zehn Uhr einladen. Bitte bringen Sie Ihre Zeugnisse im Original mit.",s:"Die Person soll ihre Zeugnisse mitbringen.",a:true},
  {script:"Liebe Kolleginnen und Kollegen, die Kantine bleibt diese Woche wegen Renovierungsarbeiten geschlossen. Im Erdgeschoss steht ein Imbisswagen mit Snacks und Getränken bereit.",s:"Die Kantine ist diese Woche normal geöffnet.",a:false},
  {script:"Hier ist die Agentur für Arbeit. Ihr Termin bei Frau Petersen am Montag muss leider verschoben werden. Bitte rufen Sie uns zurück, um einen neuen Termin zu vereinbaren.",s:"Der Termin am Montag findet wie geplant statt.",a:false},
  {script:"Achtung an alle Mitarbeiter: Wegen des Feueralarm-Tests ertönt heute um vierzehn Uhr ein Alarmsignal. Sie müssen das Gebäude nicht verlassen.",s:"Beim Alarm um vierzehn Uhr müssen alle das Gebäude verlassen.",a:false},
  {script:"Hallo Herr Jovanović, hier ist Sandra aus dem Marketing. Die Präsentation für den Kunden ist fertig. Ich habe sie Ihnen per E-Mail geschickt. Schauen Sie bitte bis morgen früh drüber.",s:"Herr Jovanović soll die Präsentation bis morgen ansehen.",a:true}]},
 schreiben:[
  {title:"Aufgabe A · Beschwerde über einen Weiterbildungskurs",situation:"Sie haben bei der Akademie „Karriere Plus“ einen Online-Kurs „Projektmanagement“ für 590 € gebucht. Laut Anzeige: erfahrene Trainer, Live-Unterricht in kleinen Gruppen und ein anerkanntes Zertifikat. Leider war der Kurs ganz anders. Schreiben Sie eine Beschwerde.",points:["Grund Ihres Schreibens","was versprochen wurde und was tatsächlich passiert ist","Folgen für Sie","Ihre Erwartungen"],
   model:"Maria Dumitru\nStrada Victoriei 50\n010061 Bukarest\nRumänien\n\nKarriere Plus Akademie GmbH\nKundenservice\nBahnhofstraße 7\n60329 Frankfurt am Main\n\nBukarest, den 18. Oktober 2026\n\nBeschwerde über den Online-Kurs „Projektmanagement“\n\nSehr geehrte Damen und Herren,\n\nim September habe ich bei Ihnen den Online-Kurs „Projektmanagement“ für 590 Euro gebucht. Leider muss ich mich heute über den Kurs beschweren.\n\nIn Ihrer Anzeige versprechen Sie Live-Unterricht in kleinen Gruppen mit erfahrenen Trainern. Tatsächlich bestand der Kurs fast nur aus alten Videos. Die zwei Live-Termine fanden mit über 60 Teilnehmern statt, sodass keine Zeit für Fragen blieb. Hinzu kommt, dass das Zertifikat, wie ich inzwischen erfahren habe, von keinem Arbeitgeber anerkannt wird.\n\nDas ist für mich besonders ärgerlich, weil ich den Kurs für eine Bewerbung um eine neue Stelle gebraucht hätte. Außerdem habe ich für die Live-Termine extra Urlaub genommen.\n\nIch erwarte daher, dass Sie mir mindestens die Hälfte der Kursgebühr zurückerstatten. Bitte teilen Sie mir bis zum 31. Oktober mit, wie Sie das Problem lösen werden. Andernfalls werde ich mich an die Verbraucherzentrale wenden.\n\nMit freundlichen Grüßen\nMaria Dumitru"},
  {title:"Aufgabe B · Anfrage nach einer Messe",situation:"Auf einer Jobmesse haben Sie am Stand der Firma „GreenTech GmbH“ von einem Traineeprogramm für Berufseinsteiger erfahren. Leider hatten Sie nicht genug Zeit für alle Fragen. Schreiben Sie eine E-Mail an die Personalabteilung.",points:["Bezug auf die Messe und kurze Vorstellung","Fragen zum Ablauf und zur Dauer des Programms","Fragen zu Gehalt und Arbeitsort","Bitte um weitere Unterlagen oder ein Gespräch"],
   model:"Radu Ionescu\nStrada Florilor 3\n400165 Cluj-Napoca\nRumänien\n\nGreenTech GmbH\nPersonalabteilung\nAm Hafen 12\n28217 Bremen\n\nCluj-Napoca, den 18. Oktober 2026\n\nIhr Traineeprogramm für Berufseinsteiger\n\nSehr geehrte Damen und Herren,\n\nam vergangenen Samstag habe ich auf der Jobmesse in Berlin mit Ihrer Mitarbeiterin, Frau Hahn, über Ihr Traineeprogramm gesprochen. Ich habe gerade mein Studium der Umwelttechnik abgeschlossen und interessiere mich sehr für eine Tätigkeit in Ihrem Unternehmen.\n\nLeider hatten wir nicht genug Zeit für alle meine Fragen. Zunächst möchte ich wissen, wie lange das Programm dauert und in welchen Abteilungen man eingesetzt wird. Gibt es auch die Möglichkeit, einige Monate an einem Standort im Ausland zu arbeiten?\n\nAußerdem interessiert mich, wie hoch das Gehalt während des Programms ist und ob es feste Arbeitsorte gibt oder ob man flexibel sein muss.\n\nIch wäre Ihnen dankbar, wenn Sie mir weitere Informationen zuschicken könnten. Sehr gern würde ich auch an einem persönlichen Gespräch teilnehmen.\n\nIch freue mich auf Ihre Antwort.\n\nMit freundlichen Grüßen\nRadu Ionescu"}],
 sprechen:{
  t1:[{who:"Kandidat/in A",topic:"Homeoffice – Traum oder Albtraum?",pts:["eigene Erfahrung","Vor- und Nachteile","Situation in Ihrem Heimatland","Ihre Meinung"]},{who:"Kandidat/in B",topic:"Teilzeitarbeit",pts:["eigene Erfahrung","Vor- und Nachteile","Situation in Ihrem Heimatland","Ihre Meinung"]}],
  t2:{text:"Aus einem Interview: „Die Vier-Tage-Woche sollte für alle Beschäftigten Pflicht werden. Wer ausgeruht ist, arbeitet besser und ist seltener krank.“ (Arbeitspsychologin Dr. Anna Klein)",q:"Diskutieren Sie: Sollte die Vier-Tage-Woche für alle gelten? Begründen Sie Ihre Meinung."},
  t3:{situation:"Ihr Kollege Herr Schmitt geht nach 30 Jahren in Rente. Sie und Ihr Partner sollen eine Abschiedsfeier organisieren.",pts:["Datum, Uhrzeit und Ort","Essen und Getränke","Geschenk","Rede oder Programm"]},
  model:"Teil 1: „In meiner Präsentation geht es um das Homeoffice. Ich selbst arbeite seit der Pandemie zwei Tage pro Woche zu Hause … Ein großer Vorteil ist, dass man keine Zeit im Verkehr verliert. Ein Nachteil dagegen ist, dass der Kontakt zu den Kollegen fehlt … In Rumänien arbeiten vor allem IT-Firmen viel im Homeoffice … Zum Schluss möchte ich sagen, dass für mich eine Mischung ideal ist.“\n\nTeil 2: „Ich finde die Idee grundsätzlich gut, aber in manchen Berufen, zum Beispiel in Krankenhäusern, ist sie kaum umsetzbar. – Das ist ein gutes Argument, aber man könnte mehr Personal einstellen …“\n\nTeil 3: „Ich schlage vor, dass wir die Feier am letzten Freitag im Monat im Besprechungsraum machen. – Einverstanden. Und als Geschenk? Wie wäre es mit einem Gutschein für eine Reise? – Gute Idee, dafür sammeln wir Geld im Team.“"}

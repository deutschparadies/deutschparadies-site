 title:"Modelltest 3 · Gesundheit und Freizeit",
 lesen1:{headings:["Weniger Fleisch, mehr Gesundheit","Wandern liegt im Trend","Schlafmangel macht krank","Kinder bewegen sich zu wenig","Fitness-Apps unter der Lupe","Neue Regeln für Arzttermine","Gemeinsam singen hält jung","Lange Wartezeiten beim Facharzt","Ehrenamt im Sportverein","Zucker in Getränken"],
  texts:["Wer regelmäßig weniger als sechs Stunden pro Nacht schläft, hat ein höheres Risiko für Herz-Kreislauf-Erkrankungen. Das zeigt eine große Studie mit über 20.000 Teilnehmern. Die Forscher empfehlen sieben bis neun Stunden Schlaf und raten, das Smartphone eine Stunde vor dem Schlafengehen auszuschalten.",
   "Noch vor zwanzig Jahren galt Wandern als Hobby für Rentner. Heute sind auch viele junge Leute mit Rucksack und Wanderschuhen unterwegs. Sie suchen Ruhe vom stressigen Alltag in der Stadt. Tourismusregionen reagieren mit neuen Wanderwegen, Apps und Übernachtungsangeboten in Berghütten.",
   "Ob im Kirchenchor, im Popchor oder in der Gruppe im Seniorenheim: Wer regelmäßig mit anderen singt, tut seiner Gesundheit etwas Gutes. Forscher haben herausgefunden, dass gemeinsames Singen Stress reduziert, die Atmung verbessert und gegen Einsamkeit hilft. Besonders ältere Menschen profitieren davon.",
   "Drei Monate warten auf einen Termin beim Hautarzt, vier Monate beim Neurologen – für viele Patienten ist das Alltag. Besonders auf dem Land fehlen Fachärzte. Die Krankenkassen bieten deshalb Servicestellen an, die dringende Termine vermitteln. Kritiker meinen, das löse das eigentliche Problem nicht.",
   "Ohne die vielen Freiwilligen gäbe es die meisten Sportvereine nicht. Sie trainieren Kinder, organisieren Turniere oder kümmern sich um die Finanzen – meist unbezahlt. Doch immer weniger Menschen sind bereit, ein solches Amt zu übernehmen. Viele Vereine suchen dringend Trainerinnen und Trainer."],
  key:[2,1,6,7,8]},
 lesen2:{title:"Die Kunst des Nichtstuns",text:"Termine, E-Mails, Sport, Freunde treffen, die Wohnung aufräumen: Viele Menschen planen nicht nur ihre Arbeitszeit, sondern auch ihre Freizeit bis auf die letzte Minute. Selbst im Urlaub wird ein volles Programm absolviert. „Freizeitstress“ nennen Experten dieses Phänomen. Die Psychologin Dr. Miriam Holz beschäftigt sich seit Jahren damit. „Viele Menschen haben das Gefühl, dass sie ihre freie Zeit sinnvoll nutzen müssen“, erklärt sie. „Einfach nichts zu tun, gilt in unserer Gesellschaft als Zeitverschwendung.“ Dazu komme der Druck durch soziale Netzwerke, wo andere ständig zeigen, welche aufregenden Dinge sie erleben. Wer dagegen den Sonntag auf dem Sofa verbringt, hat schnell ein schlechtes Gewissen. Dabei sei gerade das Nichtstun für unsere Gesundheit wichtig, betont Holz. Wenn wir nicht ständig neue Reize verarbeiten müssen, kann sich das Gehirn erholen. In solchen Phasen entstehen oft die besten Ideen. Viele bekannte Erfindungen, so Holz, seien nicht am Schreibtisch entstanden, sondern beim Spazierengehen oder unter der Dusche. In den Niederlanden hat das Nichtstun sogar einen eigenen Namen: „Niksen“. Gemeint ist, sich bewusst Zeit zu nehmen, um aus dem Fenster zu schauen, Musik zu hören oder einfach den Gedanken freien Lauf zu lassen – ohne Ziel und ohne schlechtes Gewissen. Dass das nicht so einfach ist, zeigen die Erfahrungen vieler Menschen. Sabine K., 39, Mutter von zwei Kindern und Teilzeit-Bankangestellte, hat es ausprobiert. „In den ersten Tagen habe ich ständig zum Handy gegriffen. Zehn Minuten nichts zu tun, war für mich richtig anstrengend“, erzählt sie. Inzwischen plant sie bewusst Pausen in ihren Tag ein – paradoxerweise steht das Nichtstun jetzt in ihrem Kalender. Ihre Bilanz nach drei Monaten: Sie schläft besser und reagiert gelassener, wenn die Kinder streiten. Holz empfiehlt, klein anzufangen. Schon fünf bis zehn Minuten am Tag ohne Bildschirm und ohne Aufgabe könnten einen Unterschied machen. Wichtig sei, dass man sich dabei nicht wieder unter Druck setze. „Wer Nichtstun zu einem weiteren Projekt macht, das perfekt erledigt werden muss, hat das Prinzip nicht verstanden“, sagt sie und lacht. Auch Arbeitgeber haben das Thema entdeckt. Einige Unternehmen richten Ruheräume ein oder führen handyfreie Pausen ein. Sie hoffen auf kreativere und weniger gestresste Mitarbeiter.",
  q:[{q:"Viele Menschen haben Freizeitstress, weil …",o:["sie zu wenig Hobbys haben.","sie glauben, ihre Freizeit sinnvoll nutzen zu müssen.","sie am Wochenende arbeiten müssen."],a:1},
   {q:"Laut Dr. Holz ist Nichtstun wichtig, weil …",o:["sich das Gehirn dabei erholen kann.","man dabei mehr Kalorien verbraucht.","man dann mehr Zeit für soziale Netzwerke hat."],a:0},
   {q:"„Niksen“ bedeutet …",o:["ein Sportprogramm aus den Niederlanden.","eine Methode, schneller zu arbeiten.","bewusst ohne Ziel Zeit zu verbringen."],a:2},
   {q:"Sabine K. …",o:["fand das Nichtstun am Anfang schwierig.","hat das Experiment nach drei Tagen beendet.","schläft jetzt schlechter als vorher."],a:0},
   {q:"Dr. Holz rät, …",o:["mindestens zwei Stunden täglich nichts zu tun.","mit kurzen Pausen ohne Bildschirm zu beginnen.","das Nichtstun perfekt zu planen."],a:1}]},
 lesen3:{situations:["Ihr Vater (65) möchte nach einer Knieoperation wieder Sport treiben.","Ihre Freundin sucht einen Yogakurs am Abend in der Nähe ihres Büros.","Sie möchten gesünder kochen lernen.","Ihr Sohn (10) möchte Schwimmen lernen.","Ein Kollege möchte mit dem Rauchen aufhören.","Sie suchen einen Chor, der neue Mitglieder aufnimmt.","Ihre Nachbarin möchte am Wochenende wandern, aber nicht allein.","Sie brauchen dringend einen Zahnarzttermin am Samstag.","Ihr Bruder möchte Tanzen lernen, hat aber keine Partnerin.","Sie möchten einen Erste-Hilfe-Kurs für den Führerschein machen."],
  ads:["a) Wandergruppe „Gipfelstürmer“: Jeden Sonntag Touren für alle Altersgruppen. Neue Mitwanderer willkommen!","b) Zahnärztlicher Notdienst am Wochenende: Sa./So. 9–13 Uhr, Praxis Dr. Klein, Marktplatz 3.","c) Gesund kochen – einfach und lecker: Kochkurs der Verbraucherzentrale, 4 Abende.","d) Salsa für Singles: Kein Partner nötig, wir wechseln in jeder Stunde. Anfängerkurs ab Montag.","e) Reha-Sport nach Operationen: Gelenkschonendes Training unter ärztlicher Aufsicht, Krankenkasse übernimmt Kosten.","f) Yoga nach Feierabend: Di. und Do. 18:30 Uhr, Studio „Om“, direkt im Bürozentrum am Bahnhof.","g) Seepferdchen-Kurs: Schwimmen lernen für Kinder von 5 bis 7 Jahren.","h) Rauchfrei in 6 Wochen: Kurs mit Psychologin, Kosten werden teilweise erstattet.","i) Gospelchor „Joyful Voices“ sucht Sängerinnen und Sänger – keine Vorkenntnisse nötig.","j) Erste-Hilfe-Kurs für Führerscheinbewerber: Samstag, 8–16 Uhr, DRK, mit Bescheinigung.","k) Fitnessstudio: Jetzt 3 Monate zum halben Preis!","l) Schwimmkurs für Jugendliche ab 12 Jahren."],
  key:[4,5,2,-1,7,8,0,1,3,9]},
 sb1:{text:"Liebe Anna,\n\nendlich komme ich dazu, Dir zu schreiben! Seit ich in Wien wohne, ist so viel passiert. Stell Dir vor, ich habe mich in einem Sportverein [1]. Ich spiele jetzt jeden Dienstag Volleyball. Am Anfang war ich ziemlich nervös, [2] ich ja niemanden kannte. Aber die anderen waren sehr nett und haben mich sofort [3] die Gruppe aufgenommen.\n\nNach dem Training gehen wir oft noch zusammen etwas trinken. So habe ich schon einige neue Freunde gefunden, [4] ich mich hier jetzt viel wohler fühle. Eine von ihnen, Lisa, wohnt sogar in meiner Straße. Wir treffen uns manchmal am Wochenende und gehen [5] Donauufer joggen.\n\nUnd wie geht es Dir? Hast Du Dich [6] entschieden, ob Du die neue Stelle annimmst? Ich drücke Dir die Daumen! Wenn Du im Sommer Zeit hast, [7] Du mich unbedingt besuchen. Wien ist wunderschön, und ich würde Dir gern alles zeigen.\n\nIch freue mich schon sehr [8] Deine Antwort. Schreib mir bald, wie es Dir geht und [9] Du gerade machst.\n\nViele liebe [10]\nDeine Ioana",
  o:[["angemeldet","angemeldeten","anmelden"],["weil","deshalb","trotzdem"],["in","an","zu"],["sodass","damit","obwohl"],["am","an","im"],["schon","noch","erst"],["musst","müsstest","musstest"],["auf","über","für"],["was","dass","welche"],["Grüße","Gruß","Grüßen"]]},
 sb2:{text:"Immer mehr Menschen nutzen ihr Smartphone, um ihre Gesundheit zu überwachen. Fitness-Apps zählen Schritte, messen den Puls und erinnern daran, genug Wasser [11] trinken. Für viele ist das eine große Motivation, sich mehr [12] bewegen. Doch Experten sehen die Entwicklung nicht nur positiv. Einerseits können solche Apps helfen, gesunde Gewohnheiten zu entwickeln. [13] besteht die Gefahr, dass Menschen sich zu sehr unter Druck setzen. Wer sein Tagesziel von 10.000 Schritten nicht erreicht, fühlt sich [14] schlecht. Außerdem stellen sich Fragen zum Datenschutz. Viele Nutzer wissen nicht, [15] mit ihren Gesundheitsdaten passiert. Manche Anbieter verkaufen die Informationen sogar [16] Werbefirmen weiter. Verbraucherschützer raten deshalb, vor der Installation genau zu prüfen, welche Daten die App sammelt. Ärzte betonen außerdem, [17] eine App keinen Arztbesuch ersetzen kann. Wer gesundheitliche Beschwerden hat, sollte sich [18] an einen Mediziner wenden. Richtig eingesetzt können die digitalen Helfer [19] durchaus nützlich sein – solange man sich nicht von ihnen beherrschen [20].",
  words:["zu","zu","Andererseits","schnell","was","an","dass","deshalb","trotzdem","lässt","Einerseits","ob","für","lassen","immer"]},
 hoeren1:{intro:"Sie hören fünf Personen, die über ihre Freizeit sprechen. Sind die Aussagen richtig oder falsch?",items:[
  {script:"Am Wochenende mache ich am liebsten gar nichts. Ich schlafe lange, lese ein Buch und koche etwas Schönes. Unter der Woche habe ich so viel Stress, dass ich diese Ruhe einfach brauche.",s:"Die Person hat am Wochenende ein volles Programm.",a:false},
  {script:"Ich bin seit zehn Jahren in einem Fotoclub. Wir treffen uns jeden Monat und machen Ausflüge, um zu fotografieren. Letztes Jahr hatten wir sogar eine eigene Ausstellung im Rathaus.",s:"Der Fotoclub hat schon eine Ausstellung organisiert.",a:true},
  {script:"Früher habe ich viel Fußball gespielt, aber nach einer Verletzung ging das nicht mehr. Jetzt gehe ich zweimal pro Woche schwimmen. Das ist gut für meine Gelenke.",s:"Die Person spielt immer noch regelmäßig Fußball.",a:false},
  {script:"Meine Kinder und ich spielen jeden Freitagabend Brettspiele. Das ist unsere feste Familienzeit, ohne Handy und ohne Fernseher. Die Kinder freuen sich schon die ganze Woche darauf.",s:"Die Familie verbringt den Freitagabend ohne Bildschirme.",a:true},
  {script:"Ich wollte immer ein Instrument lernen. Mit fünfzig habe ich endlich angefangen, Klavier zu spielen. Es ist schwieriger, als ich dachte, aber es macht mir unglaublich viel Spaß.",s:"Die Person hat schon als Kind Klavier gespielt.",a:false}]},
 hoeren2:{intro:"Sie hören ein Interview mit einem Sportmediziner. Sind die Aussagen richtig oder falsch?",script:"Moderatorin: Herr Dr. Wagner, die Weltgesundheitsorganisation empfiehlt Erwachsenen mindestens 150 Minuten Bewegung pro Woche. Schaffen die Deutschen das? – Wagner: Leider nur etwa die Hälfte. Viele sitzen den ganzen Tag im Büro, fahren mit dem Auto nach Hause und setzen sich dann vor den Fernseher. Das ist ein großes Problem für die Gesundheit. – Moderatorin: Was sind die Folgen? – Wagner: Bewegungsmangel erhöht das Risiko für Herzkrankheiten, Diabetes und Rückenschmerzen. Aber auch die Psyche leidet. Wer sich regelmäßig bewegt, ist nachweislich seltener depressiv und schläft besser. – Moderatorin: Muss man dafür ins Fitnessstudio gehen? – Wagner: Nein, überhaupt nicht. Das ist ein weit verbreiteter Irrtum. Schon zügiges Spazierengehen, Radfahren zur Arbeit oder Treppensteigen statt Aufzugfahren hilft enorm. Wichtig ist die Regelmäßigkeit, nicht die Intensität. – Moderatorin: Viele sagen, sie hätten keine Zeit für Sport. – Wagner: Das höre ich oft. Mein Tipp: Bewegung in den Alltag einbauen. Wer zum Beispiel beim Telefonieren aufsteht und herumgeht oder eine Bushaltestelle früher aussteigt, kommt schnell auf zwanzig Minuten pro Tag. – Moderatorin: Gibt es ein Alter, ab dem es zu spät ist, mit Sport anzufangen? – Wagner: Es ist nie zu spät. Selbst Menschen mit achtzig Jahren können ihre Muskeln noch aufbauen. Allerdings sollten Ältere und Menschen mit Vorerkrankungen vorher mit ihrem Hausarzt sprechen. – Moderatorin: Und was halten Sie von Fitness-Apps? – Wagner: Sie können motivieren, besonders am Anfang. Man sollte aber nicht nur auf die Zahlen schauen. Der Spaß an der Bewegung ist am wichtigsten, denn nur dann bleibt man langfristig dabei.",
  s:[["Laut Dr. Wagner bewegen sich die meisten Deutschen genug.",false],["Bewegungsmangel kann zu Rückenschmerzen führen.",true],["Regelmäßige Bewegung kann sich positiv auf die Psyche auswirken.",true],["Man muss unbedingt ins Fitnessstudio gehen, um gesund zu bleiben.",false],["Regelmäßigkeit ist wichtiger als Intensität.",true],["Dr. Wagner empfiehlt, Bewegung in den Alltag zu integrieren.",true],["Mit achtzig Jahren kann man keine Muskeln mehr aufbauen.",false],["Menschen mit Vorerkrankungen sollten vorher mit dem Arzt sprechen.",true],["Dr. Wagner lehnt Fitness-Apps komplett ab.",false],["Laut Dr. Wagner ist der Spaß an der Bewegung am wichtigsten.",true]]},
 hoeren3:{intro:"Sie hören fünf kurze Texte. Sind die Aussagen richtig oder falsch?",items:[
  {script:"Hier ist die Praxis Dr. Becker. Unsere Praxis ist vom zweiten bis zum sechzehnten August wegen Urlaubs geschlossen. In dringenden Fällen wenden Sie sich bitte an Dr. Hoffmann in der Gartenstraße.",s:"Die Praxis ist im August zwei Wochen geschlossen.",a:true},
  {script:"Liebe Badegäste, wegen eines Gewitters muss das Freibad in zehn Minuten geschlossen werden. Bitte verlassen Sie das Becken sofort. Ihre Eintrittskarte behält heute ihre Gültigkeit.",s:"Die Gäste können mit ihrer Karte heute noch einmal wiederkommen.",a:true},
  {script:"Hallo Peter, hier ist Martina. Das Tennisspiel morgen müssen wir leider absagen, der Platz ist schon reserviert. Wollen wir stattdessen am Donnerstag spielen? Ruf mich an!",s:"Martina schlägt einen anderen Tag vor.",a:true},
  {script:"Wichtige Information der Apotheke am Markt: Ab sofort können Sie Ihre Medikamente auch online bestellen und am nächsten Tag abholen. Die Lieferung nach Hause kostet drei Euro.",s:"Die Lieferung nach Hause ist kostenlos.",a:false},
  {script:"Und jetzt das Wetter: Morgen wird es sonnig und warm, mit Temperaturen bis zu achtundzwanzig Grad. Erst am Abend ziehen im Westen Gewitter auf.",s:"Morgen regnet es den ganzen Tag.",a:false}]},
 schreiben:[
  {title:"Aufgabe A · Beschwerde an ein Fitnessstudio",situation:"Sie sind seit einem Jahr Mitglied im Fitnessstudio „Vital Center“. Seit dem letzten Monat ist der Beitrag ohne Ankündigung um 15 € gestiegen, die Sauna ist geschlossen und mehrere Kurse wurden gestrichen. Schreiben Sie eine Beschwerde an die Studioleitung.",points:["Grund Ihres Schreibens","was sich verändert hat","warum Sie damit nicht einverstanden sind","was Sie erwarten"],
   model:"Ana Constantin\nBlumenstraße 9\n70182 Stuttgart\n\nVital Center GmbH\nStudioleitung\nKönigstraße 40\n70173 Stuttgart\n\nStuttgart, den 18. Oktober 2026\n\nBeitragserhöhung und eingeschränktes Angebot – Mitgliedsnummer 4471\n\nSehr geehrte Damen und Herren,\n\nseit einem Jahr bin ich Mitglied in Ihrem Studio und war bisher sehr zufrieden. Leider muss ich mich heute über mehrere Veränderungen beschweren.\n\nZu meinem großen Ärger musste ich feststellen, dass im September 15 Euro mehr von meinem Konto abgebucht wurden. Über diese Erhöhung wurde ich nicht informiert. Hinzu kommt, dass die Sauna seit Wochen geschlossen ist und die Kurse „Rückenfit“ und „Yoga am Abend“ ersatzlos gestrichen wurden.\n\nGerade diese Angebote waren für mich der Hauptgrund, Mitglied bei Ihnen zu werden. Es ist für mich nicht nachvollziehbar, dass ich nun mehr bezahlen soll, obwohl ich weniger Leistungen bekomme.\n\nIch erwarte daher, dass Sie mir den zu viel abgebuchten Betrag erstatten und mich darüber informieren, wann die Sauna und die Kurse wieder angeboten werden. Sollte dies nicht möglich sein, bitte ich um eine Sonderkündigung meines Vertrags. Ihre Antwort erwarte ich bis zum 31. Oktober.\n\nMit freundlichen Grüßen\nAna Constantin"},
  {title:"Aufgabe B · Anfrage an einen Sportverein",situation:"Sie sind neu in der Stadt und möchten Mitglied in einem Sportverein werden. Auf der Internetseite des „TSV Grünwald“ fehlen einige Informationen. Schreiben Sie eine E-Mail an den Verein.",points:["kurze Vorstellung und Grund des Schreibens","Fragen zu Angeboten und Trainingszeiten","Fragen zu Kosten und Mitgliedschaft","Bitte um ein Probetraining"],
   model:"Mihai Stoica\nParkallee 5\n82031 Grünwald\n\nTSV Grünwald e. V.\nGeschäftsstelle\nSportplatzweg 1\n82031 Grünwald\n\nGrünwald, den 18. Oktober 2026\n\nAnfrage zur Mitgliedschaft\n\nSehr geehrte Damen und Herren,\n\nich bin vor Kurzem nach Grünwald gezogen und suche einen Sportverein, in dem ich regelmäßig trainieren und neue Leute kennenlernen kann. Auf Ihrer Internetseite habe ich gesehen, dass Sie viele verschiedene Sportarten anbieten.\n\nIch interessiere mich besonders für Volleyball und Badminton. Könnten Sie mir bitte mitteilen, an welchen Tagen und zu welchen Uhrzeiten das Training für Erwachsene stattfindet? Außerdem würde ich gern wissen, ob es auch Gruppen für Anfänger gibt.\n\nZudem interessiert mich, wie hoch der Mitgliedsbeitrag ist und ob es eine Aufnahmegebühr gibt. Wie lange ist die Kündigungsfrist?\n\nBevor ich mich entscheide, würde ich gern an einem Probetraining teilnehmen. Ist das möglich, und was muss ich dafür mitbringen?\n\nFür Ihre Antwort bedanke ich mich im Voraus.\n\nMit freundlichen Grüßen\nMihai Stoica"}],
 sprechen:{
  t1:[{who:"Kandidat/in A",topic:"Gesunde Ernährung im Alltag",pts:["eigene Erfahrung","Vor- und Nachteile / Schwierigkeiten","Situation in Ihrem Heimatland","Ihre Meinung"]},{who:"Kandidat/in B",topic:"Sport im Verein oder allein?",pts:["eigene Erfahrung","Vor- und Nachteile","Situation in Ihrem Heimatland","Ihre Meinung"]}],
  t2:{text:"Leserbrief: „Ungesunde Lebensmittel wie Süßigkeiten und Fast Food sollten viel höher besteuert werden. Nur so ändern die Menschen ihr Verhalten.“",q:"Diskutieren Sie: Ist eine höhere Steuer auf ungesunde Lebensmittel sinnvoll?"},
  t3:{situation:"Ihre Deutschklasse möchte gemeinsam einen Gesundheitstag organisieren.",pts:["Datum und Ort","Programm (Sport, Vorträge, Kochen …)","gesundes Essen","Wer macht was?"]},
  model:"Teil 1: „In meiner Präsentation geht es um gesunde Ernährung im Alltag. Ich versuche, mich gesund zu ernähren, aber wegen meiner Arbeit esse ich mittags oft schnell etwas in der Kantine … Ein Vorteil von gesunder Ernährung ist, dass man sich fitter fühlt, ein Nachteil ist, dass frische Produkte manchmal teurer sind … In Rumänien kocht man traditionell viel mit Fleisch …“\n\nTeil 2: „Ich bin nicht ganz überzeugt. Eine Steuer trifft vor allem Menschen mit wenig Geld. – Das sehe ich anders. In anderen Ländern hat eine Zuckersteuer gut funktioniert …“\n\nTeil 3: „Was hältst du davon, wenn wir den Gesundheitstag an einem Samstag in der Sporthalle der Schule machen? – Gute Idee! Ich könnte einen Yogakurs organisieren. – Und ich kümmere mich um das Buffet mit Salaten und Obst.“"}

(function(D){
D.telc.tests.push({
 title:"Modelltest 4 · Medien und Bildung",
 lesen1:{headings:["Handyverbot an Schulen?","Bibliotheken erfinden sich neu","Lernen im Alter","Fake News erkennen lernen","Podcasts werden immer beliebter","Kostenlose Nachhilfe von Studierenden","Zeitungen verlieren Leser","Programmieren schon im Kindergarten","Zu viel Zeit vor dem Bildschirm","Studieren ohne Abitur"],
  texts:["Sie verleihen nicht mehr nur Bücher: Viele Stadtbibliotheken bieten heute 3D-Drucker, Spielekonsolen, Sprachkurse und Arbeitsplätze mit schnellem Internet an. Besonders junge Leute und Familien nutzen die neuen Angebote. In einigen Städten sind die Bibliotheken sogar sonntags geöffnet und werden zu einem Treffpunkt für den ganzen Stadtteil.",
   "Ein manipuliertes Foto, eine erfundene Meldung, ein Video ohne Quelle – im Internet verbreiten sich falsche Informationen oft schneller als die Wahrheit. Immer mehr Schulen nehmen deshalb das Thema Medienkompetenz in den Unterricht auf. Schülerinnen und Schüler lernen, Quellen zu überprüfen und Bilder kritisch zu betrachten.",
   "Wer heute Mathe-Probleme hat, muss nicht unbedingt teure Nachhilfe bezahlen. In vielen Städten gibt es Projekte, bei denen Studierende Schülern aus Familien mit wenig Geld helfen – ehrenamtlich und kostenlos. Beide Seiten profitieren: Die Schüler verbessern ihre Noten, und die Studierenden sammeln pädagogische Erfahrung.",
   "Mit 72 Jahren hat Gerda Huber noch einmal ein Studium begonnen: Geschichte und Kunstgeschichte. Sie ist eine von über 30.000 Seniorinnen und Senioren, die als Gasthörer an deutschen Universitäten eingeschrieben sind. „Ich hatte früher keine Gelegenheit zu studieren. Jetzt hole ich es nach“, sagt sie stolz.",
   "Ob beim Joggen, beim Kochen oder in der Bahn: Immer mehr Menschen hören Podcasts. Laut einer aktuellen Umfrage nutzt inzwischen jeder Dritte regelmäßig dieses Medium. Besonders beliebt sind Gesprächsformate über Politik, Wissenschaft und wahre Kriminalfälle. Auch viele Zeitungen produzieren inzwischen eigene Podcasts."],
  key:[1,3,5,2,4]},
 lesen2:{title:"Schule ohne Noten",text:"Am Ende des Schuljahres bekommen die Kinder der Grundschule am Lindenpark kein Zeugnis mit Noten von eins bis sechs. Stattdessen erhalten sie einen mehrseitigen Bericht, in dem die Lehrerinnen und Lehrer beschreiben, was das Kind gelernt hat, wo seine Stärken liegen und woran es noch arbeiten sollte. Die Schule gehört zu einer wachsenden Zahl von Einrichtungen in Deutschland, die auf Noten weitgehend verzichten. „Noten sagen sehr wenig darüber aus, was ein Kind wirklich kann“, erklärt die Schulleiterin Karin Fuchs. „Eine Drei in Deutsch – heißt das, das Kind kann nicht gut schreiben, liest es zu langsam oder macht es viele Rechtschreibfehler? Ein ausführlicher Bericht gibt Eltern und Kindern viel genauere Informationen.“ Außerdem, so Fuchs, führten Noten oft dazu, dass Kinder nur noch für die Note lernten und nicht aus Interesse. Viele Kinder hätten Angst vor Klassenarbeiten, manche litten sogar unter Bauchschmerzen und Schlafproblemen. Ohne Notendruck lernten sie entspannter und mit mehr Freude. Statt Klassenarbeiten gibt es an der Schule regelmäßige Lerngespräche. Dabei setzen sich Lehrkraft, Kind und Eltern zusammen und besprechen die Fortschritte. Die Kinder lernen, sich selbst einzuschätzen und eigene Ziele zu formulieren. Die Eltern sind überwiegend zufrieden. „Meine Tochter geht viel lieber zur Schule als ihr großer Bruder früher“, sagt eine Mutter. Andere Eltern sind skeptischer. Sie befürchten, dass ihre Kinder später Schwierigkeiten haben, wenn sie auf eine weiterführende Schule wechseln, wo es wieder Noten gibt. Tatsächlich sind Noten in Deutschland spätestens ab der siebten Klasse in den meisten Bundesländern vorgeschrieben. Auch für Bewerbungen um einen Ausbildungs- oder Studienplatz spielen sie eine zentrale Rolle. Bildungsforscher sind sich nicht einig. Einige Studien zeigen, dass Kinder ohne Noten motivierter sind und genauso gute Leistungen erbringen. Kritiker wenden ein, dass ausführliche Berichte für die Lehrkräfte sehr viel mehr Arbeit bedeuten und dass Noten trotz aller Schwächen eine schnelle und vergleichbare Rückmeldung ermöglichen. Karin Fuchs kennt diese Argumente. „Natürlich ist unser Modell aufwendiger“, gibt sie zu. „Aber die Zeit, die wir in die Gespräche investieren, lohnt sich. Unsere Schülerinnen und Schüler wissen sehr genau, was sie können – und das ist am Ende wichtiger als jede Zahl.“",
  q:[{q:"Statt eines Zeugnisses mit Noten bekommen die Kinder …",o:["einen ausführlichen schriftlichen Bericht.","gar keine Rückmeldung.","nur eine mündliche Bewertung am Telefon."],a:0},
   {q:"Laut Karin Fuchs führen Noten oft dazu, dass Kinder …",o:["mehr Interesse am Lernen haben.","nur für die Note lernen.","weniger Hausaufgaben machen."],a:1},
   {q:"Bei den Lerngesprächen …",o:["schreiben die Kinder eine Klassenarbeit.","sprechen nur die Lehrer mit den Eltern.","sprechen Lehrkraft, Kind und Eltern über die Fortschritte."],a:2},
   {q:"Manche Eltern befürchten, dass …",o:["ihre Kinder später an anderen Schulen Probleme bekommen.","die Schule zu viele Hausaufgaben gibt.","die Lehrkräfte zu streng sind."],a:0},
   {q:"Kritiker sagen, dass ausführliche Berichte …",o:["für Lehrkräfte weniger Arbeit bedeuten.","für Lehrkräfte sehr viel zusätzliche Arbeit sind.","von Eltern nicht gelesen werden."],a:1}]},
 lesen3:{situations:["Ihre Tochter (15) braucht Hilfe in Mathematik vor der Abschlussprüfung.","Ein Freund möchte lernen, wie man einen eigenen Podcast produziert.","Sie möchten Ihr Deutsch für die Arbeit verbessern, aber nur online.","Ihre Mutter (68) möchte lernen, wie man ein Smartphone benutzt.","Sie suchen einen ruhigen Ort zum Lernen mit WLAN, auch am Sonntag.","Ihr Kollege möchte sich über ein Fernstudium neben dem Beruf informieren.","Ihre Nachbarin möchte in einer Gruppe über Bücher diskutieren.","Sie möchten einen Kurs zum Thema Fotografie mit dem Handy machen.","Ihr Sohn (8) interessiert sich für Roboter und Technik.","Sie suchen einen Abendkurs für Italienisch für Fortgeschrittene."],
  ads:["a) Stadtbibliothek: Lernplätze mit kostenlosem WLAN – täglich geöffnet, auch sonntags 10–18 Uhr.","b) Handykurs für Senioren: Fotos verschicken, WhatsApp, Videotelefonie – in kleinen Gruppen mit viel Geduld.","c) Podcast-Werkstatt: Von der Idee bis zur Veröffentlichung. Technik wird gestellt. Wochenendkurs.","d) Mathe-Nachhilfe für Prüfungsvorbereitung (Klasse 9–10) – erfahrene Lehrkräfte, Einzelunterricht.","e) Lesekreis „Seitenweise“: Wir treffen uns jeden ersten Dienstag im Monat im Café Literatur.","f) Online-Deutschkurs „Deutsch im Beruf B2“: Live-Unterricht per Video, abends.","g) Smartphone-Fotografie: Bessere Bilder mit dem Handy – Kurs an zwei Samstagen.","h) Infoabend Fernuniversität: Studieren neben dem Beruf – alle Studiengänge im Überblick.","i) Roboter-Club für Kinder von 7 bis 11 Jahren: Bauen und Programmieren mit Lego.","j) Italienisch A1 für absolute Anfänger, montags 18 Uhr.","k) Gitarrenunterricht für Kinder und Erwachsene.","l) Englisch-Konversation für Fortgeschrittene, mittwochs."],

 sb1:{text:"Sehr geehrte Damen und Herren,\n\nich habe auf Ihrer Internetseite gelesen, dass Sie im Herbst einen Kurs „Deutsch für den Beruf“ anbieten. Da ich seit einem halben Jahr in Deutschland lebe und als Ingenieur arbeite, [1] ich meine Deutschkenntnisse dringend verbessern.\n\nZurzeit habe ich das Niveau B1, [2] ich im Alltag schon gut zurechtkomme. Bei der Arbeit habe ich aber oft Schwierigkeiten, besonders [3] Telefonaten und Besprechungen. Deshalb interessiert mich Ihr Kurs sehr.\n\nKönnten Sie mir bitte mitteilen, wie viele Teilnehmer in einer Gruppe sind und [4] der Kurs stattfindet? Ich arbeite von Montag bis Freitag bis 17 Uhr und könnte deshalb nur abends oder am Wochenende [5].\n\nAußerdem würde ich gern wissen, ob man am Ende des Kurses eine Prüfung ablegen kann. Mein Arbeitgeber wäre bereit, die Kosten zu übernehmen, [6] ich ein offizielles Zertifikat bekomme.\n\nGibt es vor Kursbeginn einen Einstufungstest? Ich möchte sicher sein, dass ich in die richtige Gruppe komme, [7] ich weder unter- noch überfordert bin.\n\nIch wäre Ihnen sehr dankbar, wenn Sie mir weitere Informationen [8] die Kursgebühren schicken könnten. Ich freue mich [9] Ihre Antwort.\n\nMit [10] Grüßen\nIon Vasile",
  o:[["möchte","möchten","möchtest"],["sodass","damit","weil"],["bei","in","mit"],["wann","ob","dass"],["teilnehmen","teilzunehmen","teilgenommen"],["wenn","ob","als"],["damit","um","sodass"],["über","von","für"],["auf","über","an"],["freundlichen","freundliche","freundlich"]]},
 sb2:{text:"Lebenslanges Lernen ist heute wichtiger denn je. Die Arbeitswelt verändert sich so schnell, [11] viele Kenntnisse nach wenigen Jahren veraltet sind. Wer im Beruf erfolgreich bleiben will, muss sich regelmäßig weiterbilden. Zum Glück gibt es dafür heute mehr Möglichkeiten [12] je. Neben klassischen Kursen an Volkshochschulen werden Online-Angebote immer beliebter. Sie haben den Vorteil, dass man selbst entscheiden kann, [13] und wo man lernt. Viele Plattformen bieten sogar kostenlose Kurse von bekannten Universitäten an. [14] erfordert das Lernen am Bildschirm viel Disziplin. Studien zeigen, dass nur ein kleiner Teil der Teilnehmer einen Online-Kurs bis zum Ende [15]. Experten empfehlen deshalb, sich feste Lernzeiten einzuplanen und sich mit anderen Lernenden [16] vernetzen. Auch Arbeitgeber haben ein großes Interesse [17] gut ausgebildeten Mitarbeitern. Viele Unternehmen übernehmen die Kosten für Weiterbildungen oder stellen ihre Beschäftigten dafür frei. In einigen Bundesländern haben Arbeitnehmer sogar einen gesetzlichen Anspruch auf Bildungsurlaub – meist fünf Tage pro Jahr. Trotzdem nutzen nur wenige [18] Möglichkeit. Viele wissen gar nicht, dass es sie gibt, [19] haben Angst, im Job etwas zu verpassen. Dabei lohnt sich die Investition in die eigene Bildung fast immer – [20] für die Karriere als auch für die persönliche Entwicklung.",
  words:["dass","als","wann","Allerdings","abschließt","zu","an","diese","oder","sowohl","ob","wie","für","abschließen","weder"]},
 hoeren1:{intro:"Sie hören fünf Personen, die über Medien sprechen. Sind die Aussagen richtig oder falsch?",items:[
  {script:"Ich lese jeden Morgen beim Frühstück die Zeitung – und zwar auf Papier. Auf dem Handy kann ich mich einfach nicht so gut konzentrieren. Außerdem mag ich das Gefühl, eine richtige Zeitung in der Hand zu halten.",s:"Die Person liest die Zeitung lieber auf dem Handy.",a:false},
  {script:"Fernsehen schaue ich eigentlich gar nicht mehr. Serien und Filme streame ich, wann ich will. Nachrichten höre ich als Podcast auf dem Weg zur Arbeit.",s:"Die Person hört Nachrichten als Podcast.",a:true},
  {script:"Ich habe vor einem Jahr alle sozialen Netzwerke gelöscht. Am Anfang war das komisch, aber jetzt habe ich viel mehr Zeit und fühle mich weniger gestresst. Meine Freunde treffe ich lieber persönlich.",s:"Die Person bereut, die sozialen Netzwerke gelöscht zu haben.",a:false},
  {script:"Meine Kinder dürfen nur eine Stunde pro Tag an den Bildschirm. Das gibt zwar manchmal Streit, aber ich finde es wichtig, dass sie auch draußen spielen und Bücher lesen.",s:"Die Kinder dürfen den ganzen Tag fernsehen.",a:false},
  {script:"Als Journalistin merke ich, dass die Menschen immer weniger bereit sind, für Nachrichten zu bezahlen. Dabei kostet guter Journalismus viel Zeit und Geld. Ich hoffe, dass sich das wieder ändert.",s:"Die Journalistin findet, dass guter Journalismus teuer ist.",a:true}]},
 hoeren2:{intro:"Sie hören ein Interview mit einem Medienpädagogen. Sind die Aussagen richtig oder falsch?",script:"Moderatorin: Herr Albrecht, Kinder bekommen ihr erstes Smartphone immer früher. Ab welchem Alter halten Sie das für sinnvoll? – Albrecht: Eine feste Altersgrenze gibt es nicht, jedes Kind ist anders. Ich empfehle aber, nicht vor dem Ende der Grundschule, also mit etwa zehn bis zwölf Jahren. Vorher reicht ein einfaches Handy zum Telefonieren völlig aus. – Moderatorin: Viele Eltern geben ihren Kindern früher ein Smartphone, weil alle anderen in der Klasse auch eins haben. – Albrecht: Ja, der Gruppendruck ist groß. Deshalb rate ich Eltern, sich mit anderen Eltern aus der Klasse abzusprechen. Wenn sich alle einig sind, ist es für die Kinder leichter. – Moderatorin: Welche Regeln sollten Eltern aufstellen? – Albrecht: Wichtig sind feste Bildschirmzeiten und handyfreie Zonen, zum Beispiel beim Essen und im Schlafzimmer. Und die Eltern sollten Vorbilder sein. Wer selbst ständig aufs Handy schaut, kann von seinen Kindern nichts anderes erwarten. – Moderatorin: Welche Gefahren sehen Sie? – Albrecht: Zum einen Inhalte, die für Kinder nicht geeignet sind, zum anderen Cybermobbing. Viele Kinder erzählen ihren Eltern nicht, wenn sie im Internet beleidigt werden, weil sie Angst haben, dass man ihnen das Handy wegnimmt. – Moderatorin: Was können Eltern dagegen tun? – Albrecht: Im Gespräch bleiben, ohne gleich zu verbieten. Kinder sollten wissen, dass sie mit jedem Problem zu ihren Eltern kommen können. Außerdem gibt es Jugendschutz-Apps, mit denen man bestimmte Inhalte sperren kann. Sie ersetzen aber nicht das Gespräch. – Moderatorin: Haben digitale Medien auch Vorteile für Kinder? – Albrecht: Natürlich! Es gibt tolle Lern-Apps, und Kinder können kreativ werden, etwa Videos drehen oder programmieren. Es kommt darauf an, wie man die Geräte nutzt, nicht nur wie lange.",
  s:[["Laut Herrn Albrecht gibt es ein festes Alter für das erste Smartphone.",false],["Er empfiehlt ein Smartphone etwa ab zehn bis zwölf Jahren.",true],["Eltern sollten sich mit anderen Eltern absprechen.",true],["Beim Essen sollte das Handy erlaubt sein.",false],["Eltern sollten selbst ein gutes Vorbild sein.",true],["Kinder erzählen ihren Eltern immer sofort von Cybermobbing.",false],["Manche Kinder haben Angst, ihr Handy zu verlieren, wenn sie von Problemen erzählen.",true],["Jugendschutz-Apps können das Gespräch mit den Eltern ersetzen.",false],["Digitale Medien können Kindern auch beim Lernen helfen.",true],["Laut Albrecht ist nur die Dauer der Nutzung wichtig.",false]]},
 hoeren3:{intro:"Sie hören fünf kurze Texte. Sind die Aussagen richtig oder falsch?",items:[
  {script:"Liebe Kursteilnehmerinnen und Kursteilnehmer, der Deutschkurs am Donnerstag findet ausnahmsweise in Raum 204 statt, nicht wie gewohnt in Raum 112. Die Uhrzeit bleibt gleich.",s:"Der Kurs findet am Donnerstag zu einer anderen Uhrzeit statt.",a:false},
  {script:"Hier ist die Volkshochschule. Ihr Kurs „Fotografie für Anfänger“ ist leider ausgefallen, weil sich nicht genug Teilnehmer angemeldet haben. Die Kursgebühr wird Ihnen in den nächsten Tagen zurücküberwiesen.",s:"Die Person bekommt ihr Geld zurück.",a:true},
  {script:"Und nun ein Hinweis in eigener Sache: Unsere Sendung „Wissen am Abend“ läuft ab nächster Woche nicht mehr um zwanzig Uhr, sondern schon um neunzehn Uhr dreißig.",s:"Die Sendung beginnt ab nächster Woche früher.",a:true},
  {script:"Hallo Frau Popa, hier ist Herr Lange von der Schule Ihres Sohnes. Bitte denken Sie daran, die Einverständniserklärung für den Museumsbesuch bis Freitag zu unterschreiben.",s:"Frau Popa soll bis Freitag ein Formular unterschreiben.",a:true},
  {script:"Achtung, liebe Besucher der Stadtbibliothek: Wegen Bauarbeiten ist der Eingang am Marktplatz gesperrt. Bitte benutzen Sie den Seiteneingang in der Schulstraße.",s:"Die Bibliothek ist wegen Bauarbeiten geschlossen.",a:false}]},
 schreiben:[
  {title:"Aufgabe A · Beschwerde über einen Sprachkurs",situation:"Sie haben an der Sprachschule „LinguaMax“ einen Intensivkurs Deutsch B2 gebucht (4 Wochen, 680 €). Versprochen wurden: maximal 10 Teilnehmer, qualifizierte Lehrkräfte und moderne Unterrichtsräume. Die Realität war anders. Schreiben Sie eine Beschwerde.",points:["Grund Ihres Schreibens","Probleme im Kurs","Folgen für Sie","Ihre Forderungen"],
   model:"Ion Vasile\nRosenweg 14\n10115 Berlin\n\nLinguaMax Sprachschule GmbH\nSchulleitung\nFriedrichstraße 120\n10117 Berlin\n\nBerlin, den 18. Oktober 2026\n\nBeschwerde über den Intensivkurs Deutsch B2 im September\n\nSehr geehrte Damen und Herren,\n\nim September habe ich an Ihrer Schule den Intensivkurs Deutsch B2 besucht, für den ich 680 Euro bezahlt habe. Leider war ich mit dem Kurs sehr unzufrieden.\n\nIn Ihrer Anzeige versprechen Sie Gruppen mit höchstens zehn Teilnehmern. Tatsächlich waren wir aber achtzehn Personen, sodass kaum Zeit zum Sprechen blieb. Außerdem wechselte die Lehrkraft dreimal, und eine Vertretung hatte offensichtlich keine Erfahrung mit Prüfungsvorbereitung. Hinzu kommt, dass der Raum viel zu klein war und die Heizung nicht funktionierte.\n\nDas ist für mich besonders ärgerlich, weil ich im November die telc-Prüfung ablegen möchte und für den Kurs extra Urlaub genommen habe.\n\nIch fordere Sie daher auf, mir einen Teil der Kursgebühr zu erstatten oder mir die kostenlose Teilnahme an einem weiteren Kurs zu ermöglichen. Ich erwarte Ihre Antwort bis zum 31. Oktober.\n\nMit freundlichen Grüßen\nIon Vasile"},
  {title:"Aufgabe B · Anfrage an eine Zeitung",situation:"Sie haben gelesen, dass die Lokalzeitung „Stadtanzeiger“ junge Leute für ein Praktikum in der Redaktion sucht. Sie interessieren sich dafür. Schreiben Sie eine E-Mail an die Redaktion.",points:["Grund Ihres Schreibens und kurze Vorstellung","Ihre Erfahrungen und Interessen","Fragen zu Dauer, Aufgaben und Bezahlung","Bitte um ein Gespräch"],
   model:"Laura Neagu\nAm Stadtpark 8\n04109 Leipzig\n\nStadtanzeiger Leipzig\nRedaktion\nPetersstraße 33\n04109 Leipzig\n\nLeipzig, den 18. Oktober 2026\n\nPraktikum in Ihrer Redaktion\n\nSehr geehrte Damen und Herren,\n\nmit großem Interesse habe ich in Ihrer Ausgabe vom Montag gelesen, dass Sie Praktikantinnen und Praktikanten für Ihre Redaktion suchen. Ich bin 23 Jahre alt und studiere im fünften Semester Journalistik an der Universität Leipzig.\n\nSchon während der Schulzeit habe ich für unsere Schülerzeitung geschrieben. Seit zwei Jahren betreibe ich außerdem einen Blog über Kultur in Leipzig. Besonders interessiere ich mich für Lokalpolitik und Reportagen über Menschen aus der Stadt.\n\nKönnten Sie mir bitte mitteilen, wie lange das Praktikum dauert und welche Aufgaben man übernimmt? Darf man auch eigene Artikel schreiben? Außerdem würde ich gern wissen, ob das Praktikum bezahlt wird.\n\nÜber die Möglichkeit, mich Ihnen in einem persönlichen Gespräch vorzustellen, würde ich mich sehr freuen.\n\nMit freundlichen Grüßen\nLaura Neagu"}],
 sprechen:{
  t1:[{who:"Kandidat/in A",topic:"Lesen in Zeiten des Internets",pts:["eigene Erfahrung","Vor- und Nachteile von gedruckten und digitalen Medien","Situation in Ihrem Heimatland","Ihre Meinung"]},{who:"Kandidat/in B",topic:"Online lernen",pts:["eigene Erfahrung","Vor- und Nachteile","Situation in Ihrem Heimatland","Ihre Meinung"]}],
  t2:{text:"Zeitungsmeldung: „Mehrere Bundesländer diskutieren ein generelles Handyverbot an Schulen. Befürworter erhoffen sich mehr Konzentration im Unterricht, Gegner sprechen von einem Rückschritt in der digitalen Bildung.“",q:"Diskutieren Sie: Sollten Handys an Schulen verboten werden?"},
  t3:{situation:"Ihr Deutschkurs endet bald. Sie und Ihr Partner sollen einen Ausflug für die ganze Klasse planen.",pts:["Ziel des Ausflugs","Datum und Treffpunkt","Verkehrsmittel und Kosten","Essen"]},
  model:"Teil 1: „In meiner Präsentation geht es um das Thema Lesen in Zeiten des Internets. Ich selbst lese Nachrichten fast nur noch online, aber Romane lese ich lieber auf Papier … Ein Vorteil digitaler Medien ist, dass sie immer aktuell sind, ein Nachteil dagegen, dass man sich schneller ablenken lässt … In meinem Heimatland …“\n\nTeil 2: „Meiner Meinung nach wäre ein komplettes Verbot zu streng. Man könnte die Handys im Unterricht gezielt nutzen. – Da bin ich anderer Meinung. Viele Schüler können sich ohne Handy viel besser konzentrieren …“\n\nTeil 3: „Wie wäre es mit einem Ausflug nach Potsdam? – Gute Idee, aber ist das nicht zu teuer? – Mit dem Gruppenticket kostet es nur wenige Euro pro Person. – Einverstanden. Dann treffen wir uns um neun Uhr am Hauptbahnhof.“"}

 lesen1:{headings:["Mit dem Nachtzug durch Europa","Plastik im Meer","Reparieren statt wegwerfen","Billigflüge werden teurer","Urlaub in der Heimat","Second-Hand-Mode boomt","Neue Regeln für Mietwagen","Fahrradstraßen in der Innenstadt","Kreuzfahrten in der Kritik","Lebensmittel retten per App"],
  texts:["Lange galten sie als altmodisch, jetzt erleben sie ein Comeback: Nachtzüge verbinden wieder zahlreiche europäische Großstädte. Man steigt abends in Wien ein und wacht morgens in Paris oder Amsterdam auf. Für viele Reisende ist das eine umweltfreundliche Alternative zum Flugzeug – auch wenn die Tickets nicht immer billig sind.",
   "Ein Toaster, der nicht mehr funktioniert, eine Hose mit Loch, ein wackeliger Stuhl: In sogenannten Repair-Cafés helfen ehrenamtliche Experten, defekte Dinge wieder in Ordnung zu bringen. Die Besucher zahlen nichts, eine kleine Spende ist willkommen. Inzwischen gibt es in Deutschland über tausend solcher Treffpunkte.",
   "Immer mehr Deutsche verbringen ihren Urlaub im eigenen Land. Ob an der Ostsee, in den Alpen oder im Schwarzwald – die Übernachtungszahlen steigen seit Jahren. Viele schätzen die kurzen Anreisewege und wollen außerdem etwas für die Umwelt tun. Für die Tourismusbranche ist das eine gute Nachricht.",
   "Kleidung aus zweiter Hand ist nicht mehr nur etwas für Studenten mit wenig Geld. Online-Plattformen und schicke Second-Hand-Läden machen gebrauchte Mode bei allen Altersgruppen beliebt. Die Käufer sparen Geld und schonen gleichzeitig die Umwelt, denn die Produktion neuer Kleidung verbraucht enorme Mengen an Wasser und Energie.",
   "Kurz vor Ladenschluss werden in Bäckereien und Restaurants oft große Mengen Essen weggeworfen. Eine App bringt Betriebe und Kunden zusammen: Die Nutzer kaufen übrig gebliebene Speisen zu einem stark reduzierten Preis und holen sie selbst ab. So landen jedes Jahr Millionen Mahlzeiten nicht im Müll."],
  key:[0,2,4,5,9]},
 lesen2:{title:"Overtourism – wenn zu viele kommen",text:"Venedig, Barcelona, Dubrovnik, Hallstatt: Diese Orte haben eines gemeinsam. Sie sind so schön, dass Millionen Menschen sie jedes Jahr besuchen wollen – und genau das wird zum Problem. Der Begriff „Overtourism“ beschreibt eine Situation, in der so viele Touristen an einen Ort kommen, dass die Lebensqualität der Einheimischen leidet und die Sehenswürdigkeiten selbst Schaden nehmen. Im österreichischen Dorf Hallstatt leben rund 750 Menschen. An manchen Tagen kommen über 10.000 Besucher, viele davon mit Reisebussen, die nur für ein paar Stunden halten. Die Touristen fotografieren Häuser und Gärten, manche gehen sogar in private Grundstücke, um ein besseres Bild zu bekommen. „Wir fühlen uns wie in einem Freilichtmuseum“, sagt eine Bewohnerin. Die Gemeinde hat reagiert: Reisebusse brauchen inzwischen eine Anmeldung, und ihre Zahl ist begrenzt. In größeren Städten zeigt sich das Problem vor allem auf dem Wohnungsmarkt. Weil Vermieter mit Ferienwohnungen deutlich mehr verdienen als mit normalen Mietverträgen, werden immer mehr Wohnungen an Touristen vermietet. Für Einheimische wird es schwierig, eine bezahlbare Wohnung zu finden. Kleine Geschäfte, in denen die Bewohner früher einkauften, werden durch Souvenirläden ersetzt. In Barcelona gingen deshalb Tausende auf die Straße, um gegen den Massentourismus zu protestieren. Venedig verlangt seit einiger Zeit an bestimmten Tagen eine Eintrittsgebühr von Tagesbesuchern. Kritiker bezweifeln allerdings, dass ein paar Euro Menschen davon abhalten, eine Reise anzutreten, die sie schon lange geplant haben. Andere Städte setzen auf strengere Regeln für Ferienwohnungen oder begrenzen die Zahl der Kreuzfahrtschiffe, die anlegen dürfen. Tourismusforscher betonen, dass nicht der Tourismus an sich das Problem sei, sondern seine Konzentration auf wenige Orte und Zeiten. Viele Reisende besuchen dieselben berühmten Plätze in denselben Wochen. Würden sie ihre Reisen besser verteilen – auf die Nebensaison oder auf weniger bekannte Regionen –, könnten alle profitieren. Ein Beispiel ist Slowenien, das gezielt kleinere Städte und ländliche Gegenden bewirbt. Auch jeder Einzelne kann etwas beitragen, sagen Experten: länger an einem Ort bleiben statt nur für ein Foto anzureisen, in lokalen Restaurants essen und die Privatsphäre der Bewohner respektieren. „Wir sollten uns als Gäste verhalten“, so ein Forscher, „nicht als Kunden, die ein Produkt konsumieren.“",
  q:[{q:"„Overtourism“ bedeutet, dass …",o:["zu wenige Touristen in eine Region kommen.","so viele Touristen kommen, dass Einwohner und Orte darunter leiden.","Touristen zu viel Geld ausgeben müssen."],a:1},
   {q:"In Hallstatt …",o:["dürfen Reisebusse nur noch mit Anmeldung kommen.","gibt es keine Touristen mehr.","leben mehr als 10.000 Menschen."],a:0},
   {q:"In größeren Städten führt Overtourism dazu, dass …",o:["die Mieten sinken.","mehr kleine Geschäfte für Einheimische eröffnen.","Einheimische schwerer eine bezahlbare Wohnung finden."],a:2},
   {q:"Kritiker der Eintrittsgebühr in Venedig glauben, dass …",o:["sie die meisten Besucher nicht abschrecken wird.","sie viel zu hoch ist.","sie nur für Einheimische gilt."],a:0},
   {q:"Tourismusforscher schlagen vor, …",o:["Reisen ins Ausland ganz zu verbieten.","Reisen besser auf Orte und Jahreszeiten zu verteilen.","nur noch Kreuzfahrten anzubieten."],a:1}]},
 lesen3:{situations:["Sie möchten mit Ihrer Familie (2 Kinder) eine Woche Urlaub auf einem Bauernhof machen.","Ihr Freund sucht eine günstige Mitfahrgelegenheit nach Hamburg.","Sie möchten Ihr kaputtes Fahrrad kostenlos reparieren lassen.","Ihre Kollegin möchte gebrauchte Kinderkleidung verkaufen.","Sie suchen eine Sprachreise nach Spanien für zwei Wochen.","Ihre Eltern möchten eine Flusskreuzfahrt auf der Donau machen.","Sie möchten am Wochenende an einer Müllsammelaktion im Park teilnehmen.","Ein Bekannter sucht ein Hotel in Berlin, in dem Hunde erlaubt sind.","Sie wollen lernen, wie man Lebensmittel richtig lagert, um weniger wegzuwerfen.","Ihre Schwester sucht einen Job als Reiseleiterin für den Sommer."],
  ads:["a) Repair-Café im Stadtteilzentrum: Jeden ersten Samstag im Monat reparieren Ehrenamtliche Fahrräder, Elektrogeräte und Kleidung – kostenlos.","b) Ferien auf dem Ferienhof Sonnenwiese: Tiere füttern, Traktor fahren, Ponyreiten – ideal für Familien mit Kindern.","c) Mitfahrzentrale online: Fahrten in ganz Deutschland, z. B. München–Hamburg ab 25 €.","d) Kinderflohmarkt in der Turnhalle: Verkaufen Sie gebrauchte Kinderkleidung und Spielzeug. Standgebühr 5 €.","e) Sprachschule Sol: Spanisch lernen in Valencia – Intensivkurse ab 1 Woche, Unterkunft in Gastfamilien.","f) Donau-Flussreisen: 8 Tage von Passau nach Budapest, Vollpension, deutschsprachige Reiseleitung.","g) „Sauberer Park“: Sammeln Sie mit uns am Samstag um 10 Uhr Müll. Handschuhe und Säcke werden gestellt.","h) Hotel Spree-Blick, Berlin-Mitte: Haustiere herzlich willkommen, Hundebett auf Anfrage.","i) Workshop der Verbraucherzentrale: „Länger frisch – richtig lagern statt wegwerfen“. Dienstag, 18 Uhr.","j) Fahrradverleih am Bahnhof: E-Bikes ab 15 € pro Tag.","k) Wellnesshotel im Allgäu, nur für Erwachsene, Hunde nicht erlaubt.","l) Busreisen nach Prag, jedes Wochenende."],
  key:[1,2,0,3,4,5,6,7,8,-1]},
 sb1:{text:"Sehr geehrte Damen und Herren,\n\nvom 5. bis 12. August habe ich mit meiner Familie Urlaub in Ihrem Hotel gemacht. Leider waren wir mit unserem Aufenthalt nicht zufrieden, [1] ich Ihnen heute schreibe.\n\nIm Katalog wird das Hotel als „ruhig und direkt am Strand gelegen“ beschrieben. Tatsächlich liegt es jedoch an einer stark befahrenen Straße, und der Strand ist zwanzig Minuten [2] Fuß entfernt. Nachts konnten wir wegen des Lärms kaum schlafen, [3] wir die Fenster geschlossen hatten.\n\nAußerdem hatten wir ein Familienzimmer mit Meerblick gebucht. Stattdessen bekamen wir ein kleines Doppelzimmer [4] Blick auf den Parkplatz. Unsere Kinder mussten auf einer Matratze auf dem Boden schlafen. Als ich mich an der Rezeption beschwert habe, sagte man mir, [5] alle Zimmer belegt seien.\n\nAuch das Essen entsprach nicht der Beschreibung. Statt eines reichhaltigen Buffets gab es jeden Tag [6] gleichen Gerichte.\n\nIch halte es für angemessen, [7] Sie uns einen Teil des Reisepreises zurückerstatten. Fotos von unserem Zimmer und [8] Aussicht lege ich diesem Schreiben bei.\n\nIch erwarte Ihre Antwort [9] spätestens 30. September.\n\nMit [10] Grüßen\nCristina Moldovan",
  o:[["weshalb","weil","denn"],["zu","mit","per"],["obwohl","weil","trotzdem"],["mit","von","auf"],["dass","ob","wenn"],["die","den","der"],["dass","wenn","ob"],["der","die","dem"],["bis","seit","ab"],["freundlichen","freundliche","freundlicher"]]},
 sb2:{text:"Jedes Jahr werden weltweit über hundert Milliarden Kleidungsstücke produziert. Viele davon werden nur wenige Male getragen, bevor sie im Müll [11]. Diese sogenannte „Fast Fashion“ hat gravierende Folgen für die Umwelt. Für die Herstellung eines einzigen T-Shirts braucht man etwa 2.700 Liter Wasser – so viel, [12] ein Mensch in zweieinhalb Jahren trinkt. Hinzu kommen Chemikalien, [13] beim Färben verwendet werden und oft ungefiltert in Flüsse gelangen. Auch die Arbeitsbedingungen in den Textilfabriken stehen in der Kritik. In vielen Ländern arbeiten die Näherinnen bis zu vierzehn Stunden am Tag [14] einen sehr niedrigen Lohn. Immer mehr Verbraucher wollen das nicht länger unterstützen. Sie kaufen weniger, aber [15] hochwertige Kleidung, tauschen Kleidungsstücke mit Freunden oder entscheiden sich [16] Second-Hand-Mode. Auch Siegel für fair produzierte Kleidung werden wichtiger. Allerdings ist es für Kunden nicht immer leicht, zu erkennen, [17] ein Produkt wirklich nachhaltig ist. Manche Firmen werben mit grünen Slogans, ohne ihre Produktion tatsächlich zu [18]. Experten raten deshalb, sich vor dem Kauf genau zu informieren. Die wichtigste Regel ist jedoch ganz einfach: Das nachhaltigste Kleidungsstück ist das, [19] man schon im Schrank hat. Wer seine Kleidung pflegt und repariert, kann sie viele Jahre tragen – und spart [20] noch Geld.",

 hoeren1:{intro:"Sie hören fünf Personen, die über das Reisen sprechen. Sind die Aussagen richtig oder falsch?",items:[
  {script:"Ich fliege nicht mehr in den Urlaub, das ist mir zu schlecht für die Umwelt. Letzten Sommer bin ich mit dem Zug nach Italien gefahren. Das hat zwar länger gedauert, aber die Fahrt durch die Alpen war wunderschön.",s:"Die Person ist letzten Sommer nach Italien geflogen.",a:false},
  {script:"Ich reise am liebsten allein. So kann ich selbst entscheiden, was ich mache, und lerne unterwegs viel schneller neue Leute kennen. Meine Familie macht sich zwar immer Sorgen, aber bisher ist nie etwas passiert.",s:"Die Person lernt auf Reisen leicht neue Menschen kennen.",a:true},
  {script:"Mit drei kleinen Kindern ist ein Hotelurlaub für uns zu teuer. Wir mieten jedes Jahr eine Ferienwohnung an der Nordsee. Da können wir selbst kochen, und die Kinder haben viel Platz zum Spielen.",s:"Die Familie macht jedes Jahr Urlaub im Hotel.",a:false},
  {script:"Bei meiner letzten Reise nach Lissabon wurde mein Koffer verloren. Ich musste drei Tage ohne meine Sachen auskommen. Seitdem nehme ich nur noch Handgepäck mit.",s:"Die Person reist jetzt nur noch mit Handgepäck.",a:true},
  {script:"Ich buche meine Reisen immer in letzter Minute. Das ist oft viel günstiger. Natürlich kann ich mir das Ziel nicht genau aussuchen, aber genau das finde ich spannend.",s:"Die Person plant ihre Reisen lange im Voraus.",a:false}]},
 hoeren2:{intro:"Sie hören ein Interview mit einer Expertin für nachhaltigen Konsum. Sind die Aussagen richtig oder falsch?",script:"Moderator: Frau Schneider, alle reden von Nachhaltigkeit. Aber kaufen die Menschen tatsächlich anders ein als früher? – Schneider: Teilweise ja. Bei Lebensmitteln achten immer mehr Menschen auf Bio-Qualität und regionale Produkte. Bei Elektronik und Kleidung sieht es dagegen anders aus. Da kaufen viele immer noch sehr viel und sehr oft neu. – Moderator: Woran liegt das? – Schneider: Zum einen an der Werbung, die uns ständig neue Produkte zeigt. Zum anderen sind viele Geräte so gebaut, dass man sie kaum reparieren kann. Akkus sind fest eingebaut, Ersatzteile gibt es nicht oder sie sind sehr teuer. – Moderator: Die EU hat ja ein Recht auf Reparatur beschlossen. – Schneider: Genau, und das ist ein wichtiger Schritt. Hersteller müssen bestimmte Ersatzteile künftig mehrere Jahre lang anbieten. Das wird aber nur funktionieren, wenn die Reparatur auch bezahlbar ist. – Moderator: Was kann jeder Einzelne tun? – Schneider: Sehr viel. Bevor man etwas kauft, sollte man sich fragen: Brauche ich das wirklich? Viele Dinge kann man auch leihen oder gebraucht kaufen. Bohrmaschinen, Zelte oder Partygeschirr benutzt man nur selten, dafür gibt es in vielen Städten Leihläden. – Moderator: Ist nachhaltiger Konsum nicht teurer? – Schneider: Auf den ersten Blick manchmal, langfristig meistens nicht. Ein gutes Paar Schuhe, das fünf Jahre hält, ist am Ende günstiger als jedes Jahr ein billiges Paar. Und wer weniger kauft, spart ohnehin Geld. – Moderator: Was halten Sie von Online-Shopping? – Schneider: Problematisch sind vor allem die vielen Rücksendungen. Viele bestellen drei Größen und schicken zwei zurück. Diese Rücksendungen verursachen viel Verkehr und Verpackungsmüll. Manche zurückgeschickten Waren werden sogar vernichtet. Mein Rat: lieber einmal im Geschäft anprobieren.",
  s:[["Bei Lebensmitteln achten mehr Menschen auf Nachhaltigkeit.",true],["Bei Kleidung kaufen die Menschen heute viel weniger neu als früher.",false],["Viele Geräte sind schwer zu reparieren.",true],["Durch das Recht auf Reparatur müssen Hersteller Ersatzteile anbieten.",true],["Laut Frau Schneider sind Reparaturen immer günstig.",false],["Sie empfiehlt, selten benutzte Dinge zu leihen.",true],["Nachhaltiger Konsum ist langfristig immer teurer.",false],["Gute Schuhe können auf Dauer günstiger sein als billige.",true],["Rücksendungen beim Online-Shopping sind kein Problem für die Umwelt.",false],["Manche zurückgeschickten Waren werden vernichtet.",true]]},
 hoeren3:{intro:"Sie hören fünf kurze Texte. Sind die Aussagen richtig oder falsch?",items:[
  {script:"Sehr geehrte Fahrgäste, der ICE 578 nach Hamburg fährt heute von Gleis 9 statt von Gleis 7 ab. Die Abfahrt verzögert sich um etwa fünfzehn Minuten.",s:"Der Zug fährt pünktlich von Gleis 7 ab.",a:false},
  {script:"Liebe Gäste, das Frühstücksbuffet ist heute ausnahmsweise bis elf Uhr geöffnet. Morgen gelten wieder die normalen Zeiten von sieben bis zehn Uhr.",s:"Heute kann man länger frühstücken als sonst.",a:true},
  {script:"Hallo Frau Weber, hier ist das Reisebüro Sonnenschein. Ihr Flug nach Mallorca wurde um zwei Stunden vorverlegt. Bitte seien Sie spätestens um sechs Uhr am Flughafen.",s:"Frau Webers Flug startet später als geplant.",a:false},
  {script:"Achtung, Passagiere des Fluges LH 412 nach New York: Das Boarding beginnt jetzt an Gate B22. Bitte halten Sie Ihre Bordkarte und Ihren Reisepass bereit.",s:"Die Passagiere sollen Bordkarte und Pass vorzeigen.",a:true},
  {script:"Hier ist das Fundbüro der Stadt. Ihre Tasche wurde gefunden und kann ab morgen bei uns abgeholt werden. Bitte bringen Sie Ihren Ausweis mit.",s:"Die Person kann ihre Tasche heute abholen.",a:false}]},
 schreiben:[
  {title:"Aufgabe A · Beschwerde an einen Reiseveranstalter",situation:"Sie haben beim Reiseveranstalter „SunTours“ eine Woche Urlaub in einem Strandhotel gebucht (1.400 € für zwei Personen). Im Katalog stand: ruhige Lage, Meerblick, Pool und Vollpension. Vor Ort war vieles anders. Schreiben Sie eine Beschwerde.",points:["Grund Ihres Schreibens","Unterschiede zwischen Katalog und Realität","Ihre Reaktion vor Ort","Ihre Forderungen"],
   model:"Cristina Moldovan\nBulevardul Unirii 21\n030823 Bukarest\nRumänien\n\nSunTours GmbH\nKundenservice\nKönigsallee 60\n40212 Düsseldorf\n\nBukarest, den 18. Oktober 2026\n\nReklamation – Buchungsnummer ST-77814\n\nSehr geehrte Damen und Herren,\n\nvom 5. bis 12. September habe ich mit meinem Mann über Ihr Reisebüro eine Woche im Hotel „Playa Azul“ verbracht. Leider waren wir mit unserem Urlaub sehr unzufrieden.\n\nIm Katalog wird das Hotel als ruhig gelegen mit Meerblick beschrieben. Tatsächlich lag es direkt neben einer Baustelle, auf der täglich ab sieben Uhr gearbeitet wurde. Statt Meerblick hatten wir Blick auf den Parkplatz. Hinzu kommt, dass der Pool während unseres gesamten Aufenthalts geschlossen war und es statt Vollpension nur Frühstück und Abendessen gab.\n\nGleich am ersten Tag habe ich mich bei Ihrer Reiseleiterin beschwert und um ein anderes Zimmer gebeten. Man hat mir jedoch erklärt, dass das Hotel ausgebucht sei.\n\nIch halte daher eine Erstattung von mindestens 30 Prozent des Reisepreises für angemessen. Fotos und ein Protokoll der Mängel lege ich diesem Schreiben bei. Bitte teilen Sie mir bis zum 31. Oktober mit, wie Sie die Angelegenheit regeln möchten.\n\nMit freundlichen Grüßen\nCristina Moldovan"},
  {title:"Aufgabe B · Anfrage an ein Repair-Café",situation:"In Ihrem Stadtteil soll ein neues Repair-Café eröffnen. Die Organisatoren suchen noch ehrenamtliche Helfer. Sie können gut nähen und kleine Elektrogeräte reparieren. Schreiben Sie eine E-Mail an die Organisatoren.",points:["Grund Ihres Schreibens und kurze Vorstellung","Ihre Fähigkeiten und Erfahrungen","Fragen zu Zeiten und Organisation","Bitte um ein erstes Treffen"],
   model:"Elena Barbu\nMühlenweg 7\n90402 Nürnberg\n\nRepair-Café Südstadt\nz. Hd. Herrn Peter Sommer\nGalgenhofstraße 5\n90459 Nürnberg\n\nNürnberg, den 18. Oktober 2026\n\nMithilfe im neuen Repair-Café\n\nSehr geehrter Herr Sommer,\n\nim Gemeindeblatt habe ich gelesen, dass in der Südstadt ein Repair-Café eröffnet und Sie noch ehrenamtliche Helfer suchen. Ich wohne seit drei Jahren im Stadtteil und würde mich sehr gern engagieren.\n\nIch habe früher als Schneiderin gearbeitet und kann Kleidung ändern und reparieren. Außerdem repariere ich in meiner Freizeit gern kleine Elektrogeräte wie Toaster oder Lampen. Mir gefällt die Idee, dass man Dinge nicht sofort wegwirft, sondern ihnen eine zweite Chance gibt.\n\nKönnten Sie mir bitte mitteilen, an welchen Tagen das Repair-Café geöffnet sein wird und wie oft man als Helfer mitarbeiten sollte? Außerdem würde ich gern wissen, ob es Werkzeug und Nähmaschinen vor Ort gibt oder ob man eigene Geräte mitbringen muss.\n\nIch würde mich freuen, Sie und die anderen Helfer bei einem ersten Treffen kennenzulernen.\n\nMit freundlichen Grüßen\nElena Barbu"}],

  t2:{text:"Aus einer Zeitschrift: „Flugreisen sind viel zu billig. Ein Flug innerhalb Europas sollte mindestens so viel kosten wie eine Zugfahrt, damit die Menschen umweltfreundlicher reisen.“",q:"Diskutieren Sie: Sollten Flüge teurer werden?"},

  model:"Teil 1: „In meiner Präsentation geht es um die Frage, ob man lieber im eigenen Land oder im Ausland Urlaub machen sollte. Ich selbst verbringe meinen Sommerurlaub meistens am Schwarzen Meer, aber ich reise auch gern nach Italien … Ein Vorteil von Urlaub im eigenen Land ist die kurze Anreise, ein Nachteil dagegen, dass man weniger Neues kennenlernt … In Rumänien …“\n\nTeil 2: „Ich verstehe das Argument, aber dann könnten sich viele Familien keinen Urlaub mehr leisten. – Das ist richtig, aber die Umweltkosten zahlen am Ende wir alle …“\n\nTeil 3: „Wie wäre es mit einem Wochenende in den Bergen? Sie wandert doch so gern. – Super Idee! Wir könnten mit dem Zug fahren und in einer Berghütte übernachten. – Ich kümmere mich um die Tickets, und du reservierst die Hütte?“"}

// ---------- storage ----------
const KEY="dp_lernraum_v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
let S=Object.assign({lang:"ro",points:0,today:"",todayPts:0,streak:0,last:"",done:{},wrong:[]},load());
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function dayStr(d){return d.toISOString().slice(0,10)}
function touchDay(){const t=dayStr(new Date());if(S.today!==t){const y=new Date();y.setDate(y.getDate()-1);S.streak=(S.today===dayStr(y))?S.streak+1:1;S.today=t;S.todayPts=0;save()}}
function addPts(n){touchDay();S.points+=n;S.todayPts+=n;save()}
const GOAL=50;

// ---------- speech ----------
let deVoice=null;
function pickVoice(){if(!("speechSynthesis" in window))return;const v=speechSynthesis.getVoices();deVoice=v.find(x=>/^de(-|_)DE/i.test(x.lang))||v.find(x=>/^de/i.test(x.lang))||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function toast(m){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--brand);color:#f4f1e6;padding:12px 14px;border-radius:12px;font-size:.92rem;max-width:600px;margin:0 auto";document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,6000)}
function say(txt,rate){if(!("speechSynthesis" in window)){toast("Audio ist in dieser App nicht verfügbar. Öffne den Link in Chrome.");return}if(!deVoice)pickVoice();setTimeout(()=>{if(!speechSynthesis.speaking&&!speechSynthesis.pending)toast("Kein Ton? Öffne den Link in Chrome und prüfe, ob eine deutsche Stimme installiert ist.")},1500);speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt.replace(/…/g,""));u.lang="de-DE";if(deVoice)u.voice=deVoice;u.rate=rate||0.92;speechSynthesis.speak(u)}
const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;

// ---------- helpers ----------
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase().replace(/[.,!?;:„“"…]/g,"").replace(/\s+/g," ").trim();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const L=()=>S.lang, rtl=()=>S.lang==="ar"?' dir="rtl"':'';
function sayBtn(txt){return `<button type="button" class="say" data-say="${esc(txt)}" aria-label="Anhören">${SPEAK_ICON}</button>`}
function lessonsOf(lv){return D.lessons[lv]||[]}
function findLesson(id){for(const lv in D.lessons){const l=D.lessons[lv].find(x=>x.id===id);if(l)return{lv,l}}return null}
function modDone(id,m){return S.done[id]&&S.done[id][m]}
function markMod(id,m,val){S.done[id]=S.done[id]||{};S.done[id][m]=val||true;save()}
const MODS=[["vocab","Wortschatz","Karteikarten"],["grammar","Grammatik","Regel + Beispiele"],["ex","Übungen","10 Aufgaben"],["text","Lesen","Text + 6 Fragen"],["dict","Hören","Diktat"],["speak","Sprechen","10 Sätze"],["write","Schreiben","telc-Aufgabe"],["video","Video","Szene"]];
function modsOf(l){return MODS.filter(m=>(m[0]!=="write"||l.write)&&(m[0]!=="video"||l.video))}
function lessonPct(l){const d=S.done[l.id]||{};const M=modsOf(l);return Math.round(M.filter(m=>d[m[0]]).length/M.length*100)}

// ---------- router ----------
let route={v:"home"};
function go(r,noPush){route=r;try{sessionStorage.setItem("dp_route",JSON.stringify(r))}catch(e){};if(!noPush){try{history.pushState(r,"")}catch(e){}}render();window.scrollTo(0,0)}
window.addEventListener("popstate",e=>{go(e.state||{v:"home"},true)});
try{const r=JSON.parse(sessionStorage.getItem("dp_route"));if(r)route=r}catch(e){}

function render(){
  if(!ACCESS)return;
  if(IS_LEHRER&&window.__DP_WEB&&!window.__lehrerShown){window.__lehrerShown=1;return pwChangeWeb()}
  if(!unlocked())return lockScreen();
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===S.lang));
  touchDay();
  if(route.v==="home")return home();

// ---------- Übungs-Runner ----------
const KIND={rw:"Forme den Satz um",mc:"Wähle die richtige Antwort",gap:"Ergänze",order:"Bilde den Satz",match:"Verbinde die Paare",dict:"Hör zu und schreib"};
function runner(f,mod,items,title){
  let i=0,score=0,answered=false;
  function next(){i++;answered=false;i<items.length?draw():finish()}
  function result(ok,correct){
    answered=true;if(ok){score++;addPts(10)}else{S.wrong.push({id:f.l.id,q:items[i]});S.wrong=S.wrong.slice(-50);save()}
    const fb=app.querySelector("#fb");fb.className="feedback "+(ok?"ok":"bad");
    fb.innerHTML=ok?"Richtig! +10":`Leider falsch.<small>Richtig ist: ${esc(correct)}</small>`;fb.hidden=false;
    const b=app.querySelector("#check");b.textContent=i<items.length-1?"Weiter":"Ergebnis";b.disabled=false;b.onclick=next;
  }
  function draw(){
    const it=items[i];
    let body="";
    if(it.t==="mc")body=`<p class="q">${esc(it.q)}</p><div class="opts">${it.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
    if(it.t==="rw")body=`<p class="q" style="font-size:1.12rem">${esc(it.q)}</p>${it.h?`<p class="note" style="margin-top:-6px">${esc(it.h)}</p>`:""}<textarea class="gap wta" id="gap" rows="3" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Schreib den ganzen Satz …"></textarea>`;
    if(it.t==="gap")body=`<p class="q">${esc(it.q)}</p><input class="gap" id="gap" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Antwort …">`;
    if(it.t==="order")body=`<div class="answer-line" id="line"></div><div class="chips" id="pool">${shuffle(it.w.map((w,k)=>({w,k}))).map(o=>`<button class="chip" data-k="${o.k}">${esc(o.w)}</button>`).join("")}</div>`;
    if(it.t==="match"){const left=it.pairs.map((p,k)=>({s:p[0],k})),right=shuffle(it.pairs.map((p,k)=>{const li={ro:1,ar:2,en:3}[L()];const vr=f.l.vocab.find(v=>v[0]===p[0]);return {s:(vr&&vr[1]===p[1])?vr[li]:p[1],k}}));body=`<div class="match"><div class="list">${left.map(o=>`<button class="chip" data-side="l" data-k="${o.k}">${esc(o.s)}</button>`).join("")}</div><div class="list">${right.map(o=>`<button class="chip" data-side="r" data-k="${o.k}">${esc(o.s)}</button>`).join("")}</div></div>`}
    if(it.t==="dict")body=`<div class="actions" style="margin-top:4px"><button class="btn gold" id="play">${SPEAK_ICON.replace('<svg','<svg style="width:18px;height:18px;vertical-align:-3px"')} Anhören</button><button class="btn ghost" id="slow">Langsam</button></div><input class="gap" id="gap" style="margin-top:12px" autocomplete="off" spellcheck="false" placeholder="Schreib den Satz …">`;
    app.innerHTML=header(f,title)+`<div class="progress" style="margin-top:8px"><div class="goal"><i style="width:${i/items.length*100}%"></i></div><span>${i+1}/${items.length}</span></div>
    <div class="card"><span class="kind">${KIND[it.t]}</span>${body}<div class="feedback" id="fb" hidden></div></div>
    <div class="actions"><button class="btn" id="check" ${it.t==="match"?"hidden":""}>Prüfen</button></div>`;
    const check=app.querySelector("#check");
    if(it.t==="mc"){let sel=null;check.disabled=true;app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(answered)return;sel=+b.dataset.k;app.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===b));check.disabled=false});
      check.onclick=()=>{const ok=sel===it.a;app.querySelectorAll(".opt").forEach(x=>{const k=+x.dataset.k;if(k===it.a)x.classList.add("ok");else if(k===sel)x.classList.add("bad")});result(ok,it.o[it.a]);if(ok)say(it.q.replace("___",it.o[it.a]))}}
    if(it.t==="gap"||it.t==="dict"||it.t==="rw"){const inp=app.querySelector("#gap");if(it.t==="dict"){app.querySelector("#play").onclick=()=>say(it.a);app.querySelector("#slow").onclick=()=>say(it.a,0.6)}
      inp.onkeydown=e=>{if(e.key==="Enter"&&!answered)check.click()};
      check.onclick=()=>{const v=norm(inp.value);const ans=it.t==="dict"?[it.a]:it.a;const ok=ans.some(a=>norm(a)===v);inp.disabled=true;result(ok,ans[0])}}
    if(it.t==="order"){const line=app.querySelector("#line"),pool=app.querySelector("#pool");const picked=[];
      pool.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{if(answered)return;picked.push(b);b.disabled=true;const c=document.createElement("button");c.className="chip";c.textContent=b.textContent;c.onclick=()=>{if(answered)return;picked.splice(picked.indexOf(b),1);b.disabled=false;c.remove()};line.appendChild(c)});
      check.onclick=()=>{const s=[...line.children].map(c=>c.textContent).join(" ");const ok=norm(s)===norm(it.a);result(ok,it.a+".");if(ok)say(it.a)}}
    if(it.t==="match"){let selL=null,selR=null,left=it.pairs.length,miss=0;
      const tryPair=()=>{if(!selL||!selR)return;if(selL.dataset.k===selR.dataset.k){[selL,selR].forEach(x=>{x.classList.remove("sel");x.classList.add("done");x.disabled=true});say(selL.textContent);left--;selL=selR=null;if(!left){check.hidden=false;result(miss===0,"alle Paare richtig verbinden")}}else{miss++;const a=selL,b=selR;[a,b].forEach(x=>x.classList.add("shake"));setTimeout(()=>[a,b].forEach(x=>x.classList.remove("shake","sel")),450);selL=selR=null}};
      app.querySelectorAll(".match .chip").forEach(b=>b.onclick=()=>{if(b.dataset.side==="l"){if(selL)selL.classList.remove("sel");selL=b}else{if(selR)selR.classList.remove("sel");selR=b}b.classList.add("sel");tryPair()})}
  }
  function finish(){
    const pct=Math.round(score/items.length*100);const prev=modDone(f.l.id,mod);markMod(f.l.id,mod,Math.max(pct,typeof prev==="number"?prev:0));
    app.innerHTML=header(f,title)+`<div class="card done-box"><div class="big">${score}/${items.length}</div><p>${pct>=80?"Sehr gut gemacht!":pct>=50?"Gut! Noch einmal üben?":"Wiederhole die Lektion und versuch es noch einmal."}</p></div>
    <div class="actions"><button class="btn ghost" id="again">Noch einmal</button><button class="btn" data-go-lesson="${f.l.id}">Zur Lektion</button></div>`;
    app.querySelector("#again").onclick=()=>runner(f,mod,mod==="ex"?shuffle(items):items,title);
  }
  draw();
}

    b.classList.add(ans[k]?"ok":"bad");if(!ans[k])b.parentNode.querySelector(`[data-v="${t.q[k][1]?1:0}"]`).classList.add("ok");if(ans[k])addPts(10);

function speaking(f){
  const items=f.l.speak;let i=0;
  const disc=f.l.discuss;
  function draw(){
    if(i===items.length){
      app.innerHTML=header(f,"Sprechen")+`<div class="card" style="margin-top:6px"><span class="kind">Diskussion · Mündliche Prüfung</span><h2>Sag deine Meinung</h2><p class="note">Antworte frei mit 4–6 Sätzen. Beginne mit der Redewendung.</p>
      ${disc.map((d,k)=>`<div class="disc"><b>${k+1}. ${esc(d[0])}</b><div class="opener">${sayBtn(d[1])}<span>${esc(d[1])}</span></div></div>`).join("")}</div>
      <div class="actions"><button class="btn" id="nx">Fertig</button></div>`;
      app.querySelector("#nx").onclick=()=>{markMod(f.l.id,"speak");go({v:"lesson",id:f.l.id})};return}
    const s=items[i];
    app.innerHTML=header(f,"Sprechen")+`<div class="progress" style="margin-top:8px"><div class="goal"><i style="width:${i/items.length*100}%"></i></div><span>${i+1}/${items.length}</span></div>
    <div class="card"><span class="kind">Hör zu und sprich nach</span><p class="q">${esc(s)}</p>
    <div class="actions"><button class="btn ghost" id="listen">${SPEAK_ICON.replace('<svg','<svg style="width:18px;height:18px;vertical-align:-3px"')} Anhören</button><button class="btn gold" id="rec">🎙 Sprechen</button></div>
    <div class="feedback" id="fb" hidden></div>
    ${Rec?"":'<p class="note">Die Spracherkennung funktioniert in Chrome (Android/PC). Hier kannst du anhören und laut nachsprechen.</p>'}</div>
    <div class="actions"><button class="btn" id="nx">${i<items.length-1||disc?"Weiter":"Fertig"}</button></div>`;
    app.querySelector("#listen").onclick=()=>say(s);
    const fb=app.querySelector("#fb");
    app.querySelector("#rec").onclick=()=>{
      if(!Rec){fb.hidden=false;fb.className="feedback bad";fb.textContent="Dein Browser unterstützt keine Spracherkennung. Öffne die Seite in Chrome.";return}
      let r;try{r=new Rec()}catch(e){fb.hidden=false;fb.className="feedback bad";fb.textContent="Mikrofon nicht verfügbar.";return}
      r.lang="de-DE";r.interimResults=false;r.maxAlternatives=3;fb.hidden=false;fb.className="feedback";fb.textContent="Ich höre zu …";
      r.onresult=e=>{const heard=[...e.results[0]].map(a=>a.transcript);const target=norm(s).split(" ").filter(w=>w);let best=0,bestTxt=heard[0];
        heard.forEach(h=>{const hw=norm(h).split(" ");const hit=target.filter(w=>hw.includes(w)).length/target.length;if(hit>best){best=hit;bestTxt=h}});
        const ok=best>=0.75;fb.className="feedback "+(ok?"ok":"bad");fb.innerHTML=(ok?"Super ausgesprochen! +10":"Fast! Versuch es noch einmal.")+`<small>Gehört: „${esc(bestTxt)}“</small>`;if(ok)addPts(10)};
      r.onerror=()=>{fb.className="feedback bad";fb.textContent="Mikrofon nicht erlaubt oder nichts gehört. Versuch es noch einmal."};
      try{r.start()}catch(e){}
    };
    app.querySelector("#nx").onclick=()=>{if(i<items.length-1||(disc&&i===items.length-1)){i++;draw()}else{markMod(f.l.id,"speak");go({v:"lesson",id:f.l.id})}};
  }
  draw();
}

    ta.oninput=()=>{cnt();try{localStorage.setItem(key,ta.value)}catch(e){}}});

async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

const IS_LEHRER=/[?&]lehrer\b/.test(location.search);
function pwChangeWeb(){
  const f=(id,l,ac)=>`<label class="kind" style="display:block;margin-top:12px">${l}</label><input class="gap" id="${id}" type="password" autocomplete="${ac}">`;
  app.innerHTML=`<button class="back" data-home="">‹ Zur App</button><h1>Lehrerbereich</h1><p class="muted">Hier änderst du das Passwort für die Schüler. Dafür brauchst du dein Lehrer-Passwort.</p>
  <form id="pf" class="card" style="margin-top:10px">${f("pa","Lehrer-Passwort","current-password")}
  <h3 style="margin-top:18px">Neues Schüler-Passwort</h3>${f("p1","Neues Schüler-Passwort (mind. 6 Zeichen)","new-password")}${f("p2","Wiederholen","new-password")}
  <h3 style="margin-top:18px">Lehrer-Passwort ändern <span class="muted">(optional)</span></h3>${f("q1","Neues Lehrer-Passwort","new-password")}${f("q2","Wiederholen","new-password")}
  <button class="btn" type="submit" style="width:100%;margin-top:14px">Speichern</button><div class="feedback" id="pfb" hidden></div></form>`;
  const fb=app.querySelector("#pfb");const msg=(t,ok)=>{fb.hidden=false;fb.className="feedback "+(ok?"ok":"bad");fb.textContent=t};
  app.querySelector("#pf").onsubmit=async e=>{e.preventDefault();const v=id=>app.querySelector("#"+id).value;
    const pa=v("pa"),p1=v("p1"),p2=v("p2"),q1=v("q1"),q2=v("q2");
    if(!pa)return msg("Bitte das Lehrer-Passwort eingeben.");
    if(!p1&&!q1)return msg("Bitte ein neues Passwort eingeben.");
    if(p1&&p1.length<6)return msg("Das neue Schüler-Passwort muss mindestens 6 Zeichen haben.");
    if(p1!==p2)return msg("Die beiden Schüler-Passwörter sind nicht gleich.");
    if(q1&&q1.length<6)return msg("Das neue Lehrer-Passwort muss mindestens 6 Zeichen haben.");
    if(q1!==q2)return msg("Die beiden Lehrer-Passwörter sind nicht gleich.");
    msg("Speichere …",true);
    try{const r=await fetch("/app/api/password",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({admin:pa,next:p1,newAdmin:q1})});const j=await r.json().catch(()=>({}));
      if(r.ok&&j.hash){ACCESS={v:j.v,salt:ACCESS.salt,hash:j.hash};setUnlocked(j.hash);app.querySelector("#pf").reset();return msg("Gespeichert!"+(p1?" Das neue Schüler-Passwort gilt ab jetzt für alle.":"")+(q1?" Dein Lehrer-Passwort wurde geändert.":""),true)}
      return msg(j.error==="wrong"?"Das Lehrer-Passwort ist falsch.":"Speichern fehlgeschlagen. Bitte später noch einmal versuchen.")}catch(err){return msg("Keine Verbindung. Bitte später noch einmal versuchen.")}};
}
function pwChange(){
  if(window.__DP_WEB)return pwChangeWeb();
  app.innerHTML=`<button class="back" data-home="">‹ Zurück</button><h1>Passwort ändern</h1><p class="muted">Nur für den Lehrer. Nach dem Speichern brauchen alle Schüler das neue Passwort.</p>
  <form id="pf" class="card" style="margin-top:10px"><label class="kind">Aktuelles Passwort</label><input class="gap" id="p0" type="password" autocomplete="current-password">
  <label class="kind" style="display:block;margin-top:12px">Neues Passwort (mind. 6 Zeichen)</label><input class="gap" id="p1" type="password" autocomplete="new-password">
  <label class="kind" style="display:block;margin-top:12px">Neues Passwort wiederholen</label><input class="gap" id="p2" type="password" autocomplete="new-password">
  <button class="btn" type="submit" style="width:100%;margin-top:14px">Speichern</button><div class="feedback" id="pfb" hidden></div></form>`;
  const fb=app.querySelector("#pfb");const msg=(t,ok)=>{fb.hidden=false;fb.className="feedback "+(ok?"ok":"bad");fb.textContent=t};
  app.querySelector("#pf").onsubmit=async e=>{e.preventDefault();
    const p0=app.querySelector("#p0").value,p1=app.querySelector("#p1").value,p2=app.querySelector("#p2").value;
    if(await sha(ACCESS.salt+p0)!==ACCESS.hash)return msg("Das aktuelle Passwort ist falsch.");
    if(p1.length<6)return msg("Das neue Passwort muss mindestens 6 Zeichen haben.");
    if(p1!==p2)return msg("Die beiden neuen Passwörter sind nicht gleich.");
    if(window.__DP_WEB){msg("Speichere …",true);
      try{const r=await fetch("/app/api/password",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({current:p0,next:p1})});const j=await r.json().catch(()=>({}));
        if(r.ok&&j.hash){ACCESS={v:j.v,salt:ACCESS.salt,hash:j.hash};setUnlocked(j.hash);return msg("Gespeichert! Das neue Passwort gilt ab jetzt für alle.",true)}
        return msg(j.error==="wrong"?"Das aktuelle Passwort ist falsch.":"Speichern fehlgeschlagen. Bitte später noch einmal versuchen.")}catch(e){return msg("Keine Verbindung. Bitte später noch einmal versuchen.")}}
    const art=(window.claude&&window.claude.use)?await window.claude.use("artifact"):null;
    if(!art)return msg("Hier kann das Passwort nicht gespeichert werden. Öffne die App in Claude mit deinem Konto.");
    const next={v:(ACCESS.v||1)+1,salt:ACCESS.salt,hash:await sha(ACCESS.salt+p1)};
    msg("Speichere …",true);
    try{await art.publish({"access.json":{content:JSON.stringify(next),contentType:"application/json"}});ACCESS=next;setUnlocked(next.hash);msg("Gespeichert! Das neue Passwort gilt ab jetzt für alle.",true)}
    catch(err){const c=err&&err.code;msg(c==="not_writer"||c==="not_granted"?"Nur der Besitzer der App kann das Passwort ändern.":c==="capability_disabled"?"In dieser Ansicht ist Speichern nicht möglich (z. B. bei öffentlich geteilten Links). Öffne die App in deinem Claude-Konto.":c==="conflict"?"Die App wurde gerade aktualisiert – bitte noch einmal versuchen.":"Speichern fehlgeschlagen. Bitte später noch einmal versuchen.")}
  };
}

// ---------- events ----------
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.say)return say(b.dataset.say);
  if(b.dataset.pw)return pwChange();
  if(b.dataset.telc!==undefined)return go({v:"telc",i:b.dataset.telc});
  if(b.dataset.l){S.lang=b.dataset.l;save();return render()}
  if(b.dataset.lv){route={v:"home",lv:b.dataset.lv};return render()}
  if(b.dataset.goLesson)return go({v:"lesson",id:b.dataset.goLesson});
  if(b.dataset.mod)return go({v:"mod",id:route.id,m:b.dataset.mod});
  if("home" in b.dataset)return go({v:"home",lv:b.dataset.home});
});
try{history.replaceState(route,"")}catch(e){}
loadAccess().then(render);
})();
</script>

</html>

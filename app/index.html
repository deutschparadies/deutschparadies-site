<style>
/* Layout: one-column phone app — sticky brand bar, stacked cards, bottom-anchored action buttons */
:root{
  --bg:#f3f5f0; --surface:#ffffff; --ink:#15231c; --muted:#5d6b63; --line:#dfe5dd;
  --brand:#173226; --brand-2:#24503c; --gold:#e3a72e; --gold-ink:#3a2a05;
  --ok:#1f8a4c; --ok-bg:#e3f4ea; --bad:#c2372f; --bad-bg:#fbe6e4;
  --display:"Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --arabic:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1713; --surface:#17221c; --ink:#e9efe9; --muted:#9db0a5; --line:#2a3a31;
  --brand:#0c1a13; --brand-2:#2f6a4f; --gold:#f0b94a; --gold-ink:#2a1e03;
  --ok:#4cc37f; --ok-bg:#16301f; --bad:#ff7b72; --bad-bg:#3a1b19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1713; --surface:#17221c; --ink:#e9efe9; --muted:#9db0a5; --line:#2a3a31;
  --brand:#0c1a13; --brand-2:#2f6a4f; --gold:#f0b94a; --gold-ink:#2a1e03;
  --ok:#4cc37f; --ok-bg:#16301f; --bad:#ff7b72; --bad-bg:#3a1b19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:#f4f1e6}
header .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header img.logo{width:38px;height:38px;border-radius:50%;flex:none;background:#fff}
header .name{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:.2px;line-height:1.1}
header .name small{display:block;font-family:var(--body);font-weight:400;font-size:.72rem;opacity:.75;letter-spacing:.6px;text-transform:uppercase}
.langs{margin-left:auto;display:flex;gap:4px;background:rgba(255,255,255,.1);padding:3px;border-radius:999px}
.langs button{border:0;background:none;color:#f4f1e6;padding:5px 9px;border-radius:999px;font-size:.8rem;font-weight:700}
.langs button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:1.6rem;line-height:1.15}
h2{font-size:1.25rem}
.muted{color:var(--muted)}
.hero{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.hero .ph{width:104px;height:104px;border-radius:50%;object-fit:cover;flex:none;background:var(--brand-2);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.5rem;overflow:hidden}
.hero .ph img{width:100%;height:100%;object-fit:cover}
.hero p{margin:2px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.goal{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.goal i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 6px;text-align:center}
.lvl b{display:block;font-family:var(--display);font-size:1.1rem}
.lvl small{font-size:.7rem;color:var(--muted)}
.lvl[aria-current="true"]{background:var(--brand-2);color:#fff;border-color:var(--brand-2)}
.lvl[aria-current="true"] small{color:#d8e8de}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.row .num{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--bg);border:1px solid var(--line)}
.row .num.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.row .t{min-width:0;flex:1}
.row .t b{display:block;font-family:var(--display);font-size:1rem}
.row .t small{color:var(--muted)}
.row .pct{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.row[disabled]{opacity:.55;cursor:default}
.back{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px 7px 10px;color:var(--ink);font-weight:700;margin-bottom:10px}
.modules{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.mod{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left}
.mod b{font-family:var(--display);font-size:1.02rem}
.mod small{color:var(--muted)}
.mod .tick{font-size:.75rem;color:var(--ok);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.expl{margin-top:10px;padding:12px;border-radius:10px;background:var(--bg);border:1px dashed var(--line)}
.expl[dir="rtl"]{font-family:var(--arabic);text-align:right;line-height:1.8}
.expl .lab{font-size:.72rem;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-family:var(--body)}
.tbl{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;white-space:nowrap}
th{font-family:var(--display);font-size:.9rem;color:var(--brand-2)}
:root[data-theme="dark"] th{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) th{color:var(--gold)}}
.ex-list{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.ex-list li{display:flex;gap:8px;align-items:center}
.say{border:1px solid var(--line);background:var(--bg);border-radius:999px;width:34px;height:34px;flex:none;display:grid;place-items:center;font-size:.95rem}
.say svg{width:16px;height:16px}
.progress{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.progress .goal{flex:1;margin:0}
.progress span{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.q{font-family:var(--display);font-size:1.3rem;line-height:1.3;margin:4px 0 14px}
.kind{font-size:.72rem;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;font-size:1.05rem}
.opt.sel{border-color:var(--brand-2)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
input.gap{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tsec{margin:26px 0 4px;font-size:1.15rem;scroll-margin-top:70px}.tq{margin-top:10px}.ttext{line-height:1.7;margin:6px 0}
.tsel{font:inherit;font-size:.95rem;padding:5px 8px;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:100%;margin-top:6px}
.tsel.inl{margin:2px 0;max-width:62vw}.tsel.ok{border-color:var(--ok);background:var(--ok-bg)}.tsel.bad{border-color:var(--bad);background:var(--bad-bg)}
.tr2{display:block;padding:8px 10px;margin-top:6px;border:2px solid var(--line);border-radius:10px;line-height:1.4}.tr2.ok{border-color:var(--ok);background:var(--ok-bg)}.tr2.bad{border-color:var(--bad);background:var(--bad-bg)}
.rf{display:flex;gap:16px;margin-top:6px}.rf label{display:flex;gap:6px;align-items:center}
.tad{margin:6px 0;padding:8px 10px;border-left:3px solid var(--gold);background:var(--bg);border-radius:6px;line-height:1.45}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}.trs summary{color:var(--brand-2);font-weight:700;margin-top:8px}
textarea.wta,.wta{width:100%;font:inherit;font-size:1rem;line-height:1.55;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);resize:vertical}
.wsit{margin:8px 0 6px;line-height:1.55}.wpts{margin:6px 0 4px;padding-left:22px;line-height:1.6}.wpts li{margin:2px 0}
.wcount{text-align:right;font-size:.8rem;color:var(--muted);margin-top:4px}
.rmg{margin-top:12px}.rmg>b{font-family:var(--display);color:var(--brand-2)}
.model{white-space:pre-wrap;line-height:1.6;margin-top:10px;font-size:1rem}
.ck{display:flex;gap:8px;align-items:flex-start;line-height:1.4}.ck input{margin-top:3px;accent-color:var(--brand-2)}
.th3{margin:18px 0 0;font-size:.98rem;font-family:var(--display)}
.disc{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.disc b{display:block;line-height:1.4}
.opener{display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--brand-2);font-style:italic}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:1.05rem}
.chip[disabled]{opacity:.3}
.answer-line{min-height:54px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding-bottom:8px;margin-bottom:14px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .chip{width:100%;text-align:left}
.match .chip.sel{border-color:var(--gold)}
.match .chip.done{border-color:var(--ok);background:var(--ok-bg);opacity:.75}
.match .chip.shake{border-color:var(--bad);background:var(--bad-bg)}
.feedback{margin-top:14px;border-radius:12px;padding:12px 14px;font-weight:700}
.feedback.ok{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.feedback small{display:block;font-weight:400;color:var(--ink);margin-top:2px}
.actions{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:1.02rem;background:var(--brand-2);color:#fff}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:none;border:2px solid var(--line);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
.flash{perspective:900px;margin-top:6px}
.fc{position:relative;min-height:220px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:6px}
.fc .de{font-family:var(--display);font-size:1.9rem;line-height:1.15}
.fc .tr{font-size:1.15rem}
.fc .tr[dir="rtl"]{font-family:var(--arabic)}
.fc .exs{color:var(--muted);font-style:italic}
.fc .tap{position:absolute;bottom:10px;font-size:.75rem;color:var(--muted)}
.text-de{font-size:1.15rem;line-height:1.75;margin-top:14px}
.tfq b{font-size:1.12rem}
.tf{display:flex;gap:8px;margin-top:8px}
.tf button{flex:1}
.tfq{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.done-box{text-align:center;padding:24px 16px}
.done-box .big{font-family:var(--display);font-size:3rem;font-weight:800;color:var(--brand-2)}
:root[data-theme="dark"] .done-box .big{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .done-box .big{color:var(--gold)}}
.mats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mat{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.mat b::after{content:" \2197";color:var(--gold)}
.mat b{font-family:var(--display);font-size:1.05rem}
.mat small{color:var(--muted)}
.mat:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.note{font-size:.85rem;color:var(--muted);margin-top:10px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.8rem;margin-top:6px;padding:4px}
.lock{max-width:380px;margin:30px auto;text-align:center}.lock-logo{width:96px;height:96px;border-radius:50%;object-fit:cover;box-shadow:0 4px 14px rgba(0,0,0,.15)}.lock h1{margin:14px 0 6px}.lock form{margin-top:16px}
footer{margin-top:28px;text-align:center;font-size:.8rem;color:var(--muted)}
@media (max-width:380px){.levels{grid-template-columns:repeat(2,1fr)}.modules{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

 text:{title:"Neue Heimat",de:"Ich heiße Cristina und bin in Timișoara geboren und aufgewachsen. Vor drei Jahren bin ich mit meinem Mann nach Stuttgart gezogen, weil er dort eine gute Stelle gefunden hat. Am Anfang war alles schwer, weil ich kaum Deutsch konnte. Dann habe ich einen Kurs gemacht und dort meine Freundin Leyla kennengelernt. Heute fühle ich mich hier zu Hause.",

 grammar:{title:"Verben mit Präpositionen — wofür? worauf?",

"a11-1":{title:"Neu im Deutschkurs",de:"Hallo! Ich heiße Ana Popescu. Ich bin 28 Jahre alt. Ich komme aus Rumänien, aus Cluj. Jetzt wohne ich in Wien. Ich spreche Rumänisch, Englisch und ein bisschen Deutsch. Ich lerne Deutsch in einem Sprachkurs. Der Kurs ist am Montag und am Mittwoch. Im Kurs sind zehn Personen. Das ist Lukas. Er ist mein Lehrer. Er kommt aus Österreich und wohnt auch in Wien. Er spricht Deutsch, Englisch und Spanisch. Das ist Maria. Sie kommt aus Spanien, aus Madrid. Maria wohnt in Wien und spricht Spanisch und Englisch. Ana und Maria sprechen im Kurs Deutsch. Nach dem Kurs trinken sie zusammen Kaffee.",
 q:[["Ana kommt aus Österreich.",false],["Ana wohnt jetzt in Wien.",true],["Lukas spricht Rumänisch.",false],["Der Kurs ist am Montag und am Mittwoch.",true],["Maria kommt aus Italien.",false],["Im Kurs sind zehn Personen.",true]]},
"a11-2":{title:"Das ist meine Familie",de:"Das ist meine Familie. Ich heiße Andrei und bin 35 Jahre alt. Mein Vater heißt Mihai, er ist 63. Meine Mutter heißt Elena, sie ist 60. Meine Eltern wohnen in Iași. Ich habe einen Bruder und eine Schwester. Mein Bruder heißt Radu. Er ist 25 Jahre alt, ledig und wohnt in Berlin. Er ist Student. Meine Schwester heißt Ioana. Sie ist 17 und geht noch zur Schule. Ich bin verheiratet. Meine Frau heißt Laura. Wir haben eine Tochter, sie heißt Sofia und ist vier Jahre alt. Meine Großeltern wohnen auch in Iași. Am Wochenende besuchen wir oft die Familie.",
 q:[["Der Bruder wohnt in Berlin.",true],["Die Schwester ist 25 Jahre alt.",false],["Andrei hat einen Sohn.",false],["Andreis Eltern wohnen in Iași.",true],["Radu ist verheiratet.",false],["Sofia ist vier Jahre alt.",true]]},
"a11-3":{title:"Einkaufen am Samstag",de:"Heute ist Samstag. Paul geht in den Supermarkt. Er hat eine Liste: Brot, Milch, Eier und Käse. Er kauft auch Äpfel und Bananen, denn er isst gern Obst. Gemüse braucht er auch: ein Kilo Tomaten und Kartoffeln. Fleisch kauft er nicht, er isst lieber Fisch. Am Abend kommt seine Freundin Lisa. Paul möchte Fisch mit Kartoffeln kochen. Lisa trinkt keinen Wein, deshalb kauft Paul eine Flasche Orangensaft. Für das Frühstück am Sonntag kauft er Kaffee. Alles zusammen kostet 32 Euro. Paul bezahlt mit Karte.",
 q:[["Paul kauft Brot.",true],["Paul isst gern Fleisch.",false],["Alles zusammen kostet 32 Euro.",true],["Lisa trinkt gern Wein.",false],["Paul kocht Fisch mit Kartoffeln.",true],["Paul bezahlt bar.",false]]},
"a11-4":{title:"Die neue Wohnung",de:"Familie Ionescu hat eine neue Wohnung in Cluj. Die Wohnung ist im Zentrum und hat drei Zimmer, eine Küche und ein Bad. Das Wohnzimmer ist groß und hell. Dort stehen ein Sofa, ein Tisch und vier Stühle. Das Schlafzimmer ist klein, aber schön. Das Kinderzimmer ist für Tim, er ist sechs Jahre alt. Die Küche ist leider klein und ein bisschen dunkel. Sie hat aber einen neuen Kühlschrank. Das Bad ist modern. Die Wohnung hat auch einen Balkon. Von dort sieht man den Park. Die Miete ist 450 Euro. Das ist nicht billig, aber Familie Ionescu findet die Wohnung super.",
 q:[["Die Wohnung hat drei Zimmer.",true],["Die Küche ist groß.",false],["Die Wohnung hat keinen Balkon.",false],["Tim ist sechs Jahre alt.",true],["Das Wohnzimmer ist dunkel.",false],["Die Miete ist 450 Euro.",true]]},
"a11-5":{title:"Ioanas Tag",de:"Ioana arbeitet in einem Büro in Bukarest. Sie steht jeden Tag um halb sieben auf. Zuerst duscht sie, dann frühstückt sie: Sie trinkt Kaffee und isst ein Brot mit Käse. Um halb acht fährt sie mit dem Bus zur Arbeit. Ihre Arbeit beginnt um acht Uhr. Mittags isst sie mit ihren Kollegen in der Kantine. Um 16 Uhr ist die Arbeit zu Ende. Dann holt sie ihren Sohn vom Kindergarten ab. Um 17 Uhr kauft sie im Supermarkt ein. Abends kocht sie, und die Familie isst zusammen. Danach räumt sie auf und sieht ein bisschen fern. Sie geht um elf Uhr schlafen. Am Wochenende schläft sie lange.",
 q:[["Ioana steht um 6:30 Uhr auf.",true],["Mittags isst sie zu Hause.",false],["Sie geht um 23 Uhr schlafen.",true],["Ioana fährt mit dem Auto zur Arbeit.",false],["Die Arbeit beginnt um acht Uhr.",true],["Am Wochenende steht sie früh auf.",false]]},
"a11-6":{title:"Ein Wochenende",de:"Am Wochenende hat Radu Zeit. Am Samstag scheint die Sonne und es ist warm. Am Vormittag fährt er mit Freunden Rad. Mittags essen sie im Park. Am Nachmittag schwimmen sie im See. Abends gehen Radu und seine Freundin ins Kino. Der Film ist sehr gut. Am Sonntag regnet es den ganzen Tag. Radu bleibt zu Hause. Er liest ein Buch und hört Musik. Am Nachmittag spielt er mit seiner Schwester Karten. Seine Schwester spielt sehr gut und gewinnt immer! Abends kocht Radu Spaghetti für die Familie. Radu findet: Das Wochenende ist immer zu kurz.",
 q:[["Am Samstag regnet es.",false],["Radu und seine Freunde schwimmen im See.",true],["Am Sonntag liest Radu ein Buch.",true],["Am Samstagabend geht Radu ins Theater.",false],["Radu kocht am Sonntag Spaghetti.",true],["Radu spielt am Sonntag Fußball.",false]]},
"a11-7":{title:"Maria lernt Deutsch",de:"Maria ist 45 Jahre alt und kommt aus Craiova. Sie hat als Kind in der Schule Englisch gelernt. Jetzt lernt sie Deutsch, denn sie will in Österreich als Krankenpflegerin arbeiten. Sie macht einen Online-Kurs, zweimal pro Woche, am Dienstag und am Donnerstag. Der Unterricht dauert zwei Stunden. Ihr Lehrer erklärt die Grammatik sehr gut. Maria kann schon viel verstehen und lesen, aber Sprechen ist noch schwer. Sie muss jeden Tag neue Wörter lernen und üben. Abends macht sie ihre Hausaufgaben. Manchmal hilft ihr ihre Tochter. Im Juni möchte sie die Prüfung A1 machen. Sie hat ein bisschen Angst, aber sie will die Prüfung bestehen.",
 q:[["Maria hat als Kind Deutsch gelernt.",false],["Der Kurs ist zweimal pro Woche.",true],["Sprechen ist für Maria leicht.",false],["Maria will in Österreich arbeiten.",true],["Der Unterricht dauert drei Stunden.",false],["Marias Tochter hilft ihr manchmal.",true]]},
"a12-8":{title:"Ein neuer Job",de:"Elena ist 34 Jahre alt und kommt aus Brașov. Früher war sie Verkäuferin in einem Supermarkt. Die Arbeit war anstrengend: Sie hatte oft Schichten am Wochenende und wenig Zeit für ihre Familie. Das Geld war auch nicht gut. Vor einem Jahr ist sie mit ihrem Mann nach Deutschland gekommen. Am Anfang hatte sie keine Arbeit und hat einen Deutschkurs gemacht. Seit sechs Monaten arbeitet sie als Pflegehelferin in einem Krankenhaus in Nürnberg. Sie arbeitet Teilzeit, von Montag bis Freitag, immer vormittags. Ihre Kollegen sind sehr nett und helfen ihr viel. Ihre Chefin ist zufrieden mit ihr. Elena möchte später eine Ausbildung als Krankenpflegerin machen.",
 q:[["Elena war früher Verkäuferin.",true],["Elena arbeitet seit einem Jahr im Krankenhaus.",false],["Die Kollegen sind unfreundlich.",false],["Elena arbeitet Teilzeit.",true],["Sie arbeitet jetzt am Wochenende.",false],["Elena möchte eine Ausbildung machen.",true]]},
"a12-9":{title:"Auf dem Bürgeramt",de:"Andrei ist neu in München. Er kommt aus Rumänien und arbeitet seit zwei Wochen in einer IT-Firma. In Deutschland muss man sich innerhalb von zwei Wochen beim Bürgeramt anmelden. Zuerst macht Andrei online einen Termin. Er bekommt einen Termin für Dienstag um 9:30 Uhr. Am Dienstag geht er zum Amt. Er zieht eine Wartenummer und wartet zehn Minuten. Dann geht er zu Schalter 4. Die Beamtin ist freundlich. Sie sagt: „Guten Tag. Füllen Sie bitte dieses Formular aus und unterschreiben Sie hier.“ Andrei zeigt seinen Ausweis und seinen Mietvertrag. Nach 15 Minuten ist alles fertig. Er bekommt eine Meldebescheinigung. Das ist wichtig, denn jetzt kann er auch ein Bankkonto eröffnen.",
 q:[["Andrei macht online einen Termin.",true],["Er wartet eine Stunde.",false],["Andrei zeigt seinen Ausweis.",true],["Der Termin ist am Mittwoch.",false],["Andrei geht zu Schalter 4.",true],["Die Beamtin ist unfreundlich.",false]]},
"a12-10":{title:"Beim Arzt",de:"Herr Marin hat seit gestern Fieber, Kopfschmerzen und Husten. Er fühlt sich sehr schlecht. Heute Morgen ruft er in der Praxis an und bekommt einen Termin um zehn Uhr. Im Wartezimmer sitzen schon viele Patienten. Nach 30 Minuten ruft die Ärztin ihn. Sie untersucht ihn und sagt: „Sie haben eine Grippe. Sie sollen drei Tage im Bett bleiben und viel Tee trinken. Nehmen Sie diese Tabletten zweimal am Tag, morgens und abends, nach dem Essen.“ Herr Marin fragt: „Darf ich arbeiten?“ Die Ärztin sagt: „Nein, Sie dürfen diese Woche nicht arbeiten.“ Dann holt Herr Marin die Tabletten in der Apotheke. Die Apothekerin sagt: „Gute Besserung!“",
 q:[["Herr Marin hat seit einer Woche Fieber.",false],["Er soll drei Tage im Bett bleiben.",true],["Er soll die Tabletten dreimal am Tag nehmen.",false],["Er wartet 30 Minuten im Wartezimmer.",true],["Herr Marin darf diese Woche arbeiten.",false],["Er holt die Tabletten in der Apotheke.",true]]},
"a12-11":{title:"Der Weg zur Sprachschule",de:"Sara kommt aus Moldawien und wohnt seit drei Monaten in Hamburg. Jeden Morgen fährt sie zur Sprachschule. Zuerst geht sie fünf Minuten zu Fuß zur U-Bahn-Station. Dann fährt sie mit der U-Bahn drei Stationen bis zum Hauptbahnhof. Dort steigt sie um und fährt mit dem Bus Nummer 6 weiter. An der Haltestelle „Rathaus“ steigt sie aus. Dann geht sie zwei Minuten geradeaus, an der Ampel rechts, und schon ist sie da. Die Fahrt dauert 25 Minuten. Sara hat eine Monatskarte, sie kostet 58 Euro. Im Sommer möchte Sara mit dem Fahrrad zur Schule fahren, denn das ist billiger und gesund. Heute ist der Bus zu spät gekommen, deshalb war Sara nicht pünktlich.",
 q:[["Sara fährt mit dem Auto.",false],["Sie steigt am Hauptbahnhof um.",true],["Die Fahrt dauert eine Stunde.",false],["Sara hat eine Monatskarte.",true],["An der Ampel geht Sara links.",false],["Im Sommer möchte Sara mit dem Fahrrad fahren.",true]]},
"a12-12":{title:"Ein kaputter Wasserkocher",de:"Frau Stan hat letzte Woche in einem Elektrogeschäft einen Wasserkocher gekauft. Er hat 35 Euro gekostet. Am Anfang hat er gut funktioniert. Aber heute Morgen funktioniert er nicht mehr. Frau Stan ist sauer, denn sie trinkt jeden Morgen Tee. Sie geht mit dem Wasserkocher und dem Kassenbon zurück ins Geschäft. An der Information fragt sie: „Könnten Sie mir bitte helfen? Mein Wasserkocher ist kaputt.“ Der Verkäufer schaut sich den Wasserkocher an und sagt: „Das tut mir leid. Sie haben zwei Jahre Garantie. Möchten Sie einen neuen Wasserkocher oder Ihr Geld zurück?“ Frau Stan überlegt kurz. Dann nimmt sie einen neuen. Der Verkäufer gibt ihr noch einen Gutschein über fünf Euro. Frau Stan ist zufrieden.",
 q:[["Frau Stan hat den Wasserkocher gestern gekauft.",false],["Sie hat den Kassenbon dabei.",true],["Frau Stan möchte ihr Geld zurück.",false],["Der Wasserkocher hat 35 Euro gekostet.",true],["Es gibt nur ein Jahr Garantie.",false],["Frau Stan bekommt einen Gutschein.",true]]},
"a12-13":{title:"Im Kaufhaus",de:"Bianca braucht eine Jacke für den Winter, denn ihre alte Jacke ist zu klein. Am Samstag geht sie mit ihrer Freundin Alina ins Kaufhaus. In der Damenabteilung gibt es viele Jacken. Bianca probiert zwei Jacken an. Die schwarze Jacke kostet 89 Euro, die blaue kostet nur 59 Euro. Die schwarze ist länger und wärmer, aber die blaue gefällt ihr besser, denn sie ist moderner. Alina sagt: „Die blaue steht dir gut!“ Leider ist die blaue Jacke in Größe 38 zu klein, und Größe 40 gibt es nicht mehr. Die Verkäuferin sagt: „Wir bekommen nächste Woche neue Jacken.“ Aber Bianca möchte nicht warten, denn es ist schon kalt. Am Ende kauft Bianca die schwarze Jacke und dazu einen warmen Schal.",
 q:[["Die blaue Jacke ist billiger.",true],["Die blaue Jacke ist wärmer.",false],["Bianca kauft die blaue Jacke.",false],["Bianca geht mit Alina einkaufen.",true],["Größe 40 gibt es noch.",false],["Bianca kauft auch einen Schal.",true]]},
"a12-14":{title:"Eine Einladung",de:"Liebe Ioana, wie geht es dir? Ich habe eine gute Nachricht: Am Samstag, den 14. Juni, habe ich Geburtstag und möchte mit meinen Freunden feiern! Die Party beginnt um 19 Uhr in meiner neuen Wohnung in der Lindenstraße 8, im zweiten Stock. Es kommen ungefähr 20 Gäste, auch Mihai und Sorina aus unserem Deutschkurs. Ich mache Pizza und meine Schwester backt einen Kuchen. Bitte bring keine Geschenke mit, aber vielleicht einen Salat oder etwas zu trinken. Wir wollen auch tanzen, also bring gute Laune mit! Kannst du kommen? Bitte sag mir bis Mittwoch Bescheid. Ich freue mich auf dich! Liebe Grüße, Daniel",
 q:[["Die Party ist am Samstag.",true],["Die Party beginnt um 20 Uhr.",false],["Ioana soll ein Geschenk mitbringen.",false],["Daniels Schwester backt einen Kuchen.",true],["Es kommen ungefähr 50 Gäste.",false],["Ioana soll bis Mittwoch antworten.",true]]},
"a21-1":{title:"Neue Heimat",de:"Ich heiße Cristina, bin 38 Jahre alt und in Timișoara geboren und aufgewachsen. Nach dem Gymnasium habe ich in Timișoara Wirtschaft studiert und danach in einer Bank gearbeitet. Vor drei Jahren bin ich mit meinem Mann nach Stuttgart gezogen, weil er dort eine gute Stelle als Ingenieur gefunden hat. Am Anfang war alles schwer, weil ich kaum Deutsch konnte. Ich habe meine Familie und meine Freunde sehr vermisst. Auch das Wetter war für mich fremd, weil es in Stuttgart oft regnet. Dann habe ich einen Deutschkurs gemacht und dort meine Freundin Leyla aus der Türkei kennengelernt. Wir haben zusammen gelernt und uns oft getroffen. Seit einem Jahr arbeite ich wieder, jetzt bei einer Versicherung. Ich habe mich an das Leben hier gewöhnt und fühle mich hier zu Hause. Trotzdem fahre ich jeden Sommer nach Rumänien.",
 q:[["Cristina ist in Stuttgart geboren.",false],["Sie ist wegen der Arbeit ihres Mannes umgezogen.",true],["Cristina hat Leyla im Deutschkurs kennengelernt.",true],["Cristina hat Medizin studiert.",false],["In Stuttgart regnet es oft.",true],["Cristina arbeitet jetzt in einer Bank.",false]]},
"a21-2":{title:"Endlich eingerichtet",de:"Mihai ist 24 Jahre alt und vor zwei Wochen in seine erste eigene Wohnung in Graz gezogen. Vorher hat er bei seinen Eltern gewohnt. Die Wohnung liegt im dritten Stock, leider gibt es keinen Aufzug. Der Umzug war deshalb sehr anstrengend, aber zwei Freunde haben ihm geholfen. Am Anfang standen überall Kisten. Jetzt ist alles fertig: Das Bett steht am Fenster, der Schrank steht neben der Tür und über dem Sofa hängt ein großes Bild. Seine Bücher stehen im Regal und auf dem Boden liegt ein bunter Teppich. Den Teppich hat er von seiner Oma bekommen. Die Wohnung ist klein, aber sehr gemütlich und ruhig. Die Miete beträgt 520 Euro warm, die Kaution waren drei Monatsmieten. Die Nachbarn sind freundlich. Nur der Nachbar im vierten Stock hört manchmal nachts laut Musik.",
 q:[["Das Bett steht neben der Tür.",false],["Über dem Sofa hängt ein Bild.",true],["Die Miete beträgt 520 Euro.",true],["Das Haus hat einen Aufzug.",false],["Den Teppich hat Mihai von seiner Oma bekommen.",true],["Alle Nachbarn sind immer ruhig.",false]]},
"a21-3":{title:"Gesünder leben",de:"Paul ist 42 Jahre alt und arbeitet als Buchhalter. Er sitzt den ganzen Tag im Büro vor dem Computer. Früher hat er sich kaum bewegt, viel Fast Food gegessen und oft Rückenschmerzen gehabt. Außerdem war er immer müde. Seine Ärztin hat gesagt: „Sie müssen sich mehr bewegen und sich gesünder ernähren.“ Jetzt fährt Paul jeden Tag mit dem Fahrrad zur Arbeit, das sind 20 Minuten. Zweimal pro Woche geht er nach der Arbeit ins Fitnessstudio. Am Wochenende geht er mit seiner Frau joggen oder wandern. Er isst weniger Fast Food und mehr Obst und Gemüse. Mittags nimmt er sein Essen von zu Hause mit. Nach drei Monaten fühlt er sich viel besser. Er hat fünf Kilo abgenommen und die Rückenschmerzen sind fast weg. Paul sagt: „Am Anfang war es schwer, aber jetzt macht mir Sport richtig Spaß.“",
 q:[["Paul hatte oft Kopfschmerzen.",false],["Er fährt jeden Tag mit dem Fahrrad zur Arbeit.",true],["Paul hat zehn Kilo abgenommen.",false],["Paul arbeitet als Buchhalter.",true],["Er geht dreimal pro Woche ins Fitnessstudio.",false],["Mittags nimmt er Essen von zu Hause mit.",true]]},
"a21-4":{title:"Die neue Stelle",de:"Liebe Ana, stell dir vor: Ich habe die Stelle bei der Softwarefirma in Cluj bekommen! Du weißt ja, dass ich mich vor einem Monat beworben habe. Das Vorstellungsgespräch war am Montag. Ich war sehr nervös, aber die Chefin und ein Kollege aus dem Team waren sehr freundlich. Sie haben gefragt, warum ich die Firma wechseln möchte und welche Erfahrungen ich habe. Schon am Mittwoch hat die Chefin angerufen und gesagt, dass sie mich einstellen möchten! Ich arbeite Vollzeit, 40 Stunden pro Woche, und das Gehalt ist besser als in meiner alten Firma. Ich finde auch toll, dass ich zweimal pro Woche im Homeoffice arbeiten kann. Die Probezeit dauert drei Monate. In meiner alten Firma habe ich schon gekündigt. Am 1. März fange ich an. Wollen wir am Wochenende feiern? Viele Grüße, Radu",
 q:[["Radu hatte das Vorstellungsgespräch am Mittwoch.",false],["Das Gehalt ist besser als früher.",true],["Radu kann jeden Tag im Homeoffice arbeiten.",false],["Radu war beim Gespräch nervös.",true],["Die Probezeit dauert sechs Monate.",false],["Radu hat in der alten Firma gekündigt.",true]]},
"a21-5":{title:"Mein Hobby",de:"Ich heiße Florin und interessiere mich seit fünf Jahren für Fotografie. Angefangen hat alles mit einem alten Fotoapparat von meinem Großvater. Am Wochenende gehe ich oft mit meiner Kamera in den Bergen wandern und fotografiere Tiere und Landschaften. Am liebsten fotografiere ich am frühen Morgen, weil das Licht dann am schönsten ist. Seit zwei Jahren bin ich Mitglied in einem Fotoverein. Einmal im Monat treffen wir uns und sprechen über unsere Bilder. Manchmal machen wir zusammen einen Ausflug, zum Beispiel an einen See oder in eine alte Stadt. Die anderen Mitglieder sind sehr nett und ich habe viel von ihnen gelernt. Im Dezember haben wir eine kleine Ausstellung im Rathaus. Von mir hängen dort fünf Fotos. Darauf freue ich mich sehr! Ich träume von einer Reise nach Island, denn dort möchte ich unbedingt fotografieren.",
 q:[["Florin interessiert sich seit zehn Jahren für Fotografie.",false],["Der Verein trifft sich einmal im Monat.",true],["Die Ausstellung ist im Dezember.",true],["Florin fotografiert am liebsten abends.",false],["Der erste Fotoapparat war von seinem Großvater.",true],["In der Ausstellung hängen zehn Fotos von Florin.",false]]},
"a21-6":{title:"Ohne Handy",de:"Letzte Woche ist Laura das Handy ins Wasser gefallen, als sie am See war. Danach hat es nicht mehr funktioniert. Zuerst wusste sie nicht, wie sie ohne Handy leben soll. Sie konnte keine Nachrichten schreiben, keine Videos sehen und nicht im Internet surfen. Sie wusste nicht einmal, wie spät es war, denn sie hat keine Uhr. Auch für die Arbeit war es schwierig, weil sie ihre E-Mails nur am Computer lesen konnte. Aber dann hat sie gemerkt, dass sie viel mehr Zeit hatte. Abends hat sie nicht mehr stundenlang auf den Bildschirm geschaut. Sie hat zwei Bücher gelesen, ihre Freundin besucht und ist früher schlafen gegangen. Sie hat auch besser geschlafen. Nach zehn Tagen hat sie ein neues Handy gekauft. Jetzt möchte sie es weniger benutzen: Nach 21 Uhr bleibt das Handy in der Küche.",
 q:[["Lauras Handy ist ins Wasser gefallen.",true],["Ohne Handy hatte sie weniger Zeit.",false],["Laura möchte das neue Handy weniger benutzen.",true],["Laura hat eine Uhr.",false],["Sie hat ohne Handy besser geschlafen.",true],["Laura hat das neue Handy nach zwei Tagen gekauft.",false]]},
"a21-7":{title:"Ein Urlaub mit Hindernissen",de:"Im Sommer wollten Ana und Victor zwei Wochen Urlaub in Portugal machen. Sie hatten schon im Januar den Flug und ein Hotel in Lissabon gebucht. Leider hatte ihr Flug drei Stunden Verspätung, deshalb konnten sie erst spät abends ins Hotel fahren. Am Flughafen in Lissabon war dann Victors Koffer nicht da. Er musste ein Formular ausfüllen und am nächsten Tag neue Kleidung kaufen. Erst nach drei Tagen kam der Koffer ins Hotel. Aber dann war der Urlaub wunderschön: Das Wetter war jeden Tag sonnig und warm. Sie konnten jeden Tag im Meer schwimmen und viele Sehenswürdigkeiten in Lissabon besichtigen. Sie sind auch mit dem Zug nach Porto gefahren und haben dort zwei Nächte übernachtet. Das Essen hat ihnen sehr gut geschmeckt, besonders der Fisch. Am Ende wollten sie gar nicht mehr nach Hause fahren.",
 q:[["Der Flug hatte drei Stunden Verspätung.",true],["Anas Koffer war nicht da.",false],["Sie konnten im Meer schwimmen.",true],["Sie haben im März gebucht.",false],["Der Koffer kam nach drei Tagen.",true],["Sie sind mit dem Bus nach Porto gefahren.",false]]}

 grammar:{title:"trotzdem · Konjunktiv II: wäre, hätte, würde, könnte",
  expl:{ro:"„trotzdem” (totuși) leagă două propoziții principale și exprimă un contrast: ceva se întâmplă, deși ne-am aștepta la altceva. Trotzdem poate sta pe poziția 1 sau după verb, iar verbul rămâne mereu pe poziția 2: Es regnet. Trotzdem gehen wir spazieren. / Wir gehen trotzdem spazieren. Comparați: deshalb = consecința logică, trotzdem = contrariul așteptării. Konjunktiv II îl folosim pentru propuneri politicoase, rugăminți, dorințe și situații ireale: Wie wäre es mit einem Picknick? Hättest du Lust auf Kino? Ich würde gern ausschlafen. Wir könnten zusammen kochen. La majoritatea verbelor folosim würde + infinitiv (la final). Doar sein, haben și verbele modale au forme proprii: wäre, hätte, könnte, müsste, dürfte, sollte.",
   ar:"«trotzdem» معناها «ومع ذلك / برضه»، وبتربط جملتين رئيسيتين بينهم تناقض: حاجة بتحصل رغم إن المتوقع عكسها. trotzdem ممكن تيجي في الأول أو بعد الفعل، والفعل دايمًا في المكان التاني: Es regnet. Trotzdem gehen wir spazieren. أو Wir gehen trotzdem spazieren. قارن: deshalb = نتيجة منطقية، و trotzdem = عكس المتوقع. أما Konjunktiv II فبنستخدمه في الاقتراحات المؤدبة والطلبات والأمنيات والحاجات اللي مش حقيقية: Wie wäre es mit einem Picknick? و Hättest du Lust auf Kino? و Ich würde gern ausschlafen. و Wir könnten zusammen kochen. مع أغلب الأفعال بنستخدم würde + المصدر في آخر الجملة. بس sein و haben والأفعال المساعدة ليهم صيغ خاصة: wäre، hätte، könnte، müsste، dürfte، sollte.",
   en:"„trotzdem” (nevertheless/still) links two main clauses and expresses a contrast: something happens although you would expect the opposite. Trotzdem can stand in position 1 or after the verb; the verb always stays in position 2: Es regnet. Trotzdem gehen wir spazieren. / Wir gehen trotzdem spazieren. Compare: deshalb = logical result, trotzdem = against expectation. Konjunktiv II is used for polite suggestions, requests, wishes and unreal situations: Wie wäre es mit einem Picknick? Hättest du Lust auf Kino? Ich würde gern ausschlafen. Wir könnten zusammen kochen. Most verbs use würde + infinitive (at the end). Only sein, haben and the modal verbs have their own forms: wäre, hätte, könnte, müsste, dürfte, sollte."},

 text:{title:"Ein ganz normales Wochenende?",de:"Eigentlich wollte Lena am Wochenende nur ausschlafen und faulenzen. Die ganze Woche hatte sie im Büro viel Stress gehabt und sie war total müde. Trotzdem rief sie am Freitagabend ihre Freundin Mara an. „Hättest du morgen Lust auf einen Ausflug?“, fragte Mara. „Wir könnten mit dem Fahrrad an den See fahren und dort ein Picknick machen.“ Lena zögerte zuerst, aber dann sagte sie zu. Am Samstagmorgen war der Himmel grau und es war ziemlich kühl. Die beiden fuhren trotzdem los. Unterwegs fing es an zu regnen, deshalb machten sie eine Pause in einem kleinen Café. Dort lernten sie zwei Studenten kennen. Sie wollten auch zum See und so fuhren die vier zusammen weiter. Am Nachmittag schien plötzlich wieder die Sonne und sie verbrachten einen sehr gemütlichen Nachmittag am Wasser. Am Abend war Lena zwar müde, aber sehr zufrieden. Am Sonntag hat sie dann endlich ausgeschlafen – bis elf Uhr! Danach hat sie ihre Wohnung aufgeräumt und die Wäsche gewaschen. Am Abend schrieb sie Mara eine Nachricht: „Nächstes Mal würde ich gern den ganzen Tag am See bleiben. Hättest du nächsten Samstag wieder Zeit? Es war trotzdem eines der schönsten Wochenenden seit Langem.“",
  q:[["Lena hatte eine stressige Woche im Büro.",true],["Mara hat Lena am Freitagabend angerufen.",true],["Lena hat den Ausflug sofort abgesagt.",false],["Am Samstagmorgen schien die Sonne.",false],["Weil es regnete, machten sie eine Pause in einem Café.",true],["Im Café haben sie zwei Studenten kennengelernt.",true],["Am Sonntag ist Lena sehr früh aufgestanden.",false],["Lena möchte bald wieder einen Ausflug mit Mara machen.",true]]},
 dictation:["Es regnet, trotzdem machen wir einen Ausflug.","Hättest du am Samstag Lust auf ein Picknick?","Wie wäre es mit einem Konzert am Sonntagabend?","Ich würde am Wochenende gern ausschlafen.","Wir könnten zusammen mit dem Fahrrad an den See fahren.","Leider ist das Konzert schon ausverkauft."],
 speak:["Was hast du am Wochenende vor?","Hättest du Lust, mit mir ins Kino zu gehen?","Wie wäre es mit einem Picknick im Park?","Wir könnten am Sonntag zusammen grillen.","Ich würde lieber zu Hause bleiben.","Es regnet, trotzdem gehen wir spazieren.","Ich bin müde, aber ich komme trotzdem mit.","Am Samstag schlafe ich immer aus.","Leider muss ich unsere Verabredung absagen.","Können wir das Treffen auf nächste Woche verschieben?","Am Wochenende erhole ich mich vom Stress.","Komm doch am Sonntag bei uns vorbei!"]
},

 grammar:{title:"Adjektivdeklination mit unbestimmtem Artikel · Komparativ und Superlativ · als / wie",
  expl:{ro:"După articolul nehotărât (ein, eine), după kein și după posesive (mein, dein …) adjectivul primește o terminație care arată genul atunci când articolul nu o arată: ein großer Tisch (m), ein neues Handy (n), eine alte Lampe (f). La acuzativ masculin: einen großen Tisch. La dativ și la plural terminația este mereu -en: mit einem großen Tisch, keine alten Stühle. Comparativul se formează cu -er, superlativul cu am …-sten: billig – billiger – am billigsten. Multe adjective scurte primesc Umlaut: groß – größer – am größten, alt – älter – am ältesten. Forme neregulate: gut – besser – am besten, viel – mehr – am meisten, gern – lieber – am liebsten. Când comparăm lucruri diferite folosim „als”: Der Laptop ist teurer als das Tablet. Când sunt egale folosim „(genau)so … wie”: Das Handy ist so teuer wie der Laptop.",
   ar:"بعد أداة النكرة (ein, eine) وبعد kein وضمائر الملكية (mein, dein …) الصفة بتاخد نهاية بتوضح الجنس لما الأداة ما توضحوش: ein großer Tisch (مذكر)، ein neues Handy (محايد)، eine alte Lampe (مؤنث). في الأكوزاتيف المذكر: einen großen Tisch. في الداتيف والجمع النهاية دايمًا ‎-en: mit einem großen Tisch و keine alten Stühle. صيغة المقارنة بنزود ‎-er، والتفضيل بـ am …-sten: billig – billiger – am billigsten. صفات قصيرة كتير بتاخد Umlaut: groß – größer – am größten و alt – älter – am ältesten. وفيه صيغ شاذة: gut – besser – am besten و viel – mehr – am meisten و gern – lieber – am liebsten. لما نقارن حاجتين مختلفين نستخدم «als»: Der Laptop ist teurer als das Tablet. ولما يكونوا زي بعض نستخدم «(genau)so … wie»: Das Handy ist so teuer wie der Laptop.",
   en:"After the indefinite article (ein, eine), kein and possessives (mein, dein …) the adjective takes an ending that shows the gender when the article does not: ein großer Tisch (m), ein neues Handy (n), eine alte Lampe (f). Masculine accusative: einen großen Tisch. In the dative and the plural the ending is always -en: mit einem großen Tisch, keine alten Stühle. The comparative adds -er, the superlative uses am …-sten: billig – billiger – am billigsten. Many short adjectives take an umlaut: groß – größer – am größten, alt – älter – am ältesten. Irregular: gut – besser – am besten, viel – mehr – am meisten, gern – lieber – am liebsten. Comparing different things: „als” (Der Laptop ist teurer als das Tablet). Equal things: „(genau)so … wie” (Das Handy ist so teuer wie der Laptop)."},

 text:{title:"Neu oder gebraucht?",de:"Viele Menschen kaufen heute nicht mehr alles neu. Marius, 29, ist Student und hat wenig Geld. Er geht fast jeden Samstag auf den Flohmarkt in seinem Viertel. „Dort findet man oft echte Schnäppchen“, erzählt er. „Letzten Monat habe ich einen alten Plattenspieler für nur 25 Euro gekauft. Der Händler wollte zuerst 40 Euro, aber ich habe gehandelt.“ Für Marius ist ein gebrauchtes Produkt nicht schlechter als ein neues. Im Gegenteil: Alte Möbel aus Holz sind oft stabiler als moderne Möbel aus dem Kaufhaus. Seine Nachbarin Frau Schuster, 54, sieht das anders. Sie kauft lieber neue Geräte. „Bei einem neuen Gerät habe ich zwei Jahre Garantie. Wenn etwas kaputtgeht, kann ich es umtauschen oder zurückschicken. Auf dem Flohmarkt geht das nicht.“ Frau Schuster bestellt viel im Internet. Vor jedem Kauf vergleicht sie die Preise und liest die Bewertungen anderer Kunden. „Online ist die Auswahl am größten und oft ist es auch am billigsten“, sagt sie. Am Ende sind sich beide in einem Punkt einig: Die Qualität ist wichtiger als die Marke. Und wer klug einkauft, spart nicht nur Geld, sondern schützt auch die Umwelt.",
  q:[["Marius geht fast jeden Samstag auf den Flohmarkt.",true],["Der Plattenspieler hat am Ende 40 Euro gekostet.",false],["Marius findet gebrauchte Produkte schlechter als neue.",false],["Nach Marius' Meinung sind alte Holzmöbel oft stabiler.",true],["Frau Schuster kauft lieber neue Geräte.",true],["Auf dem Flohmarkt bekommt man zwei Jahre Garantie.",false],["Frau Schuster liest vor dem Kauf die Bewertungen.",true],["Für beide ist die Marke wichtiger als die Qualität.",false]]},

{
 id:"a22-10", n:10, title:"Kommunikation",
 topic:{ro:"Comunicarea: telefon, internet, poștă și formulare", ar:"التواصل: الموبايل والإنترنت والبريد والاستمارات", en:"Communication: phone, internet, post and forms"},
 grammar:{title:"Passiv Präsens · Adjektiv nach bestimmtem Artikel · Was für ein …? · Wortbildung un-, -los, -ung",
  expl:{ro:"Pasivul arată ce se întâmplă, nu cine face acțiunea: Die Adresse wird hier eingetragen. Se formează cu werden (conjugat, pe poziția 2) + participiul II (la final). Dacă vrem să spunem cine face acțiunea, folosim von + dativ: Das Paket wird vom Postboten gebracht. După articolul hotărât (der, das, die, dieser, welcher) adjectivul are terminații scurte: la nominativ singular -e (der neue Drucker, das kleine Handy, die kurze Nachricht), la acuzativ masculin, dativ și plural -en (den neuen Drucker, mit dem kleinen Handy, die alten Kabel). Cu „Was für ein …?” întrebăm despre fel/tip: Was für ein Handy hast du? – Ein altes. Formarea cuvintelor: un- înseamnă contrariul (höflich → unhöflich), -los înseamnă „fără” (kostenlos, arbeitslos), iar -ung transformă un verb în substantiv feminin (anmelden → die Anmeldung).",
   ar:"المبني للمجهول (Passiv) بيركّز على اللي بيحصل، مش مين اللي عمله: Die Adresse wird hier eingetragen. بيتكوّن من werden (متصرّف في المكان التاني) + Partizip II في الآخر. ولو عايزين نقول مين عمل الحاجة نستخدم von + Dativ: Das Paket wird vom Postboten gebracht. بعد أداة التعريف (der, das, die, dieser, welcher) نهايات الصفة قصيرة: في النوميناتيف المفرد ‎-e (der neue Drucker و das kleine Handy و die kurze Nachricht)، وفي الأكوزاتيف المذكر والداتيف والجمع ‎-en (den neuen Drucker و mit dem kleinen Handy و die alten Kabel). بـ «Was für ein …?» بنسأل عن النوع: Was für ein Handy hast du? – Ein altes. تكوين الكلمات: un- معناها العكس (höflich → unhöflich)، و ‎-los معناها «من غير» (kostenlos و arbeitslos)، و ‎-ung بتحوّل الفعل لاسم مؤنث (anmelden → die Anmeldung).",
   en:"The passive focuses on what happens, not on who does it: Die Adresse wird hier eingetragen. It is formed with werden (conjugated, position 2) + past participle (at the end). To say who does it, use von + dative: Das Paket wird vom Postboten gebracht. After the definite article (der, das, die, dieser, welcher) adjective endings are short: nominative singular -e (der neue Drucker, das kleine Handy, die kurze Nachricht); masculine accusative, dative and plural -en (den neuen Drucker, mit dem kleinen Handy, die alten Kabel). „Was für ein …?” asks about the kind: Was für ein Handy hast du? – Ein altes. Word formation: un- = the opposite (höflich → unhöflich), -los = without (kostenlos, arbeitslos), -ung turns a verb into a feminine noun (anmelden → die Anmeldung)."},

 text:{title:"So funktioniert die neue Paketstation",de:"In unserer Stadt gibt es seit einem Monat eine neue Paketstation am Bahnhof. Viele Kunden haben gefragt, wie das System funktioniert. Hier die wichtigsten Informationen: Zuerst wird die kostenlose App heruntergeladen. Danach meldet man sich mit seiner E-Mail-Adresse an. Bei der Anmeldung wird die Handynummer eingetragen, denn sie wird später für den Abholcode gebraucht. Beim Online-Einkauf wird dann als Lieferadresse nicht die Wohnung, sondern die Paketstation gewählt. Sobald das Paket angekommen ist, bekommt man eine Nachricht mit einem Code. Am Automaten wird der Code eingegeben und die richtige Tür öffnet sich automatisch. Das Paket bleibt sieben Tage in der Station. Wer es in dieser Zeit nicht abholt, muss nichts bezahlen: Das Paket wird einfach an den Absender zurückgeschickt. Auch Pakete können hier verschickt werden. Dafür wird das Etikett in der App erstellt und am Automaten gedruckt. Herr Lindner, 67, war am Anfang skeptisch: „Ich dachte, das ist alles zu kompliziert und unpraktisch für ältere Menschen.“ Heute ist er begeistert. „Früher war ich nie zu Hause, wenn der Postbote kam. Jetzt hole ich meine Pakete ab, wann ich will – auch sonntags um zehn Uhr abends.“",
  q:[["Die Paketstation steht am Bahnhof.",true],["Für die App muss man bezahlen.",false],["Die Handynummer wird für den Abholcode gebraucht.",true],["Man bekommt den Code per Brief.",false],["Ein Paket bleibt sieben Tage in der Station.",true],["Wenn man das Paket nicht abholt, kostet es Geld.",false],["An der Station kann man auch Pakete verschicken.",true],["Herr Lindner findet die Station heute immer noch zu kompliziert.",false]]},

{
 id:"a22-11", n:11, title:"Unterwegs",
 topic:{ro:"Pe drum: trafic, mașină, indicații", ar:"في الطريق: المرور والعربية والاتجاهات", en:"On the road: traffic, car and directions"},
 grammar:{title:"Lokale Präpositionen · Konjunktion deshalb · Wortbildung -bar, -ig, -isch",
  expl:{ro:"Pentru drum și direcții folosim multe prepoziții locale. Cu dativul: aus (din interior): aus dem Parkhaus; von (de la): von der Arbeit; an … vorbei (pe lângă): an der Kirche vorbei; bis zu (până la): bis zur Ampel; gegenüber (vizavi de): gegenüber dem Bahnhof. Cu acuzativul: durch (prin): durch den Tunnel; über (peste): über die Brücke; um … herum (în jurul): um den Platz herum; … entlang (de-a lungul, stă după substantiv): die Straße entlang. „deshalb” (de aceea) exprimă o consecință: Es gab einen Stau. Deshalb bin ich zu spät gekommen. După deshalb verbul stă imediat pe poziția 2. Formarea adjectivelor: -bar = „se poate” (erreichbar, machbar), -ig = „are …/este plin de” (sonnig, eilig, vorsichtig), -isch = „tipic pentru …” (praktisch, telefonisch, elektrisch).",
   ar:"للطريق والاتجاهات بنستخدم حروف جر مكانية كتير. مع الداتيف: aus (من جوه): aus dem Parkhaus، و von (من عند): von der Arbeit، و an … vorbei (من جنب): an der Kirche vorbei، و bis zu (لحد): bis zur Ampel، و gegenüber (قصاد): gegenüber dem Bahnhof. مع الأكوزاتيف: durch (من خلال): durch den Tunnel، و über (فوق / عبر): über die Brücke، و um … herum (حوالين): um den Platz herum، و … entlang (على طول، وبتيجي بعد الاسم): die Straße entlang. «deshalb» معناها «علشان كده» وبتعبّر عن نتيجة: Es gab einen Stau. Deshalb bin ich zu spät gekommen. بعد deshalb الفعل بييجي على طول في المكان التاني. تكوين الصفات: ‎-bar = «ممكن يتعمل» (erreichbar و machbar)، و ‎-ig = «فيه …» (sonnig و eilig و vorsichtig)، و ‎-isch = «خاص بـ …» (praktisch و telefonisch و elektrisch).",
   en:"For routes and directions we use many local prepositions. With the dative: aus (out of): aus dem Parkhaus; von (from): von der Arbeit; an … vorbei (past): an der Kirche vorbei; bis zu (as far as): bis zur Ampel; gegenüber (opposite): gegenüber dem Bahnhof. With the accusative: durch (through): durch den Tunnel; über (over/across): über die Brücke; um … herum (around): um den Platz herum; … entlang (along, placed after the noun): die Straße entlang. „deshalb” (that's why) expresses a result: Es gab einen Stau. Deshalb bin ich zu spät gekommen. After deshalb the verb comes immediately in position 2. Adjective formation: -bar = can be done (erreichbar, machbar), -ig = having/full of (sonnig, eilig, vorsichtig), -isch = typical of (praktisch, telefonisch, elektrisch)."},

 text:{title:"Eine Fahrt mit Hindernissen",de:"Letzten Freitag wollte Andrei mit dem Auto zu seiner Schwester nach Leipzig fahren. Die Strecke ist nur 190 Kilometer lang, deshalb dachte er, dass er in zwei Stunden da ist. Aber schon in der Stadt gab es eine Baustelle und eine Umleitung. Das Navi schickte ihn durch ein Wohngebiet und um einen großen Park herum. Endlich kam er auf die Autobahn. Nach zwanzig Minuten stand er im Stau, denn vor ihm hatte es einen Unfall gegeben. Zum Glück war niemand schwer verletzt. Als es weiterging, merkte Andrei, dass er fast keinen Sprit mehr hatte. Er nahm die nächste Ausfahrt und fuhr zur Tankstelle. Dann kam das nächste Problem: Plötzlich machte der Motor komische Geräusche und das Auto blieb stehen – eine Panne! Andrei rief den Pannendienst an. Ein freundlicher Mechaniker kam nach einer halben Stunde und reparierte das Auto direkt an der Straße. Abschleppen war zum Glück nicht nötig. Andrei fuhr dann sehr vorsichtig weiter, immer den Fluss entlang, bis zum Haus seiner Schwester. Er kam mit vier Stunden Verspätung an. „Nächstes Mal fahre ich mit dem Zug“, sagte er und lachte. „Das ist vielleicht nicht schneller, aber viel entspannter.“",
  q:[["Andrei wollte zu seinem Bruder fahren.",false],["Wegen einer Baustelle gab es eine Umleitung.",true],["Das Navi schickte ihn um einen Park herum.",true],["Auf der Autobahn gab es einen Unfall mit Schwerverletzten.",false],["Andrei musste tanken.",true],["Das Auto musste in die Werkstatt geschleppt werden.",false],["Andrei kam vier Stunden zu spät an.",true],["Nächstes Mal möchte Andrei wieder mit dem Auto fahren.",false]]},

{
 id:"a22-12", n:12, title:"Reisen",
 topic:{ro:"Călătorii: cazare, destinații, rezervări", ar:"السفر: السكن والوجهات والحجز", en:"Travel: accommodation, destinations, bookings"},
 grammar:{title:"an, auf, in (Wo? / Wohin?) · Adjektiv ohne Artikel · ohne · von … an, über",
  expl:{ro:"Pentru destinații de călătorie folosim an, auf și in. La întrebarea Wohin? (direcție) → acuzativ: ans Meer, an den See, in die Berge, aufs Land, auf eine Insel. La întrebarea Wo? (loc) → dativ: am Meer, am See, in den Bergen, auf dem Land, auf einer Insel. Regula: an = lângă apă/margine, auf = suprafață, insulă, țară (Land), in = în interiorul unui spațiu (Berge, Wald, țări cu articol: in die Schweiz – in der Schweiz). Adjectivul fără articol (des întâlnit în anunțuri) primește terminația articolului hotărât: ruhiges Zimmer (das), schöner Strand (der), mit großem Balkon (dem), mit herrlicher Aussicht (der). „ohne” cere acuzativul: ohne Frühstück, ohne den Koffer. Prepoziții temporale: von … an = începând cu (vom 1. Juli an, ab Montag), über = mai mult de (über vier Stunden Aufenthalt).",
   ar:"لوجهات السفر بنستخدم an و auf و in. مع سؤال Wohin? (رايح فين؟) → أكوزاتيف: ans Meer و an den See و in die Berge و aufs Land و auf eine Insel. مع سؤال Wo? (فين؟) → داتيف: am Meer و am See و in den Bergen و auf dem Land و auf einer Insel. القاعدة: an = جنب المية أو الحافة، و auf = سطح أو جزيرة أو الريف، و in = جوه مكان (الجبال، الغابة، والدول اللي ليها أداة: in die Schweiz – in der Schweiz). الصفة من غير أداة (بتيجي كتير في الإعلانات) بتاخد نهاية أداة التعريف: ruhiges Zimmer (das) و schöner Strand (der) و mit großem Balkon (dem) و mit herrlicher Aussicht (der). «ohne» (من غير) بتاخد أكوزاتيف: ohne Frühstück و ohne den Koffer. حروف جر زمنية: von … an = ابتداءً من (vom 1. Juli an أو ab Montag)، و über = أكتر من (über vier Stunden Aufenthalt).",
   en:"For travel destinations we use an, auf and in. Wohin? (direction) → accusative: ans Meer, an den See, in die Berge, aufs Land, auf eine Insel. Wo? (location) → dative: am Meer, am See, in den Bergen, auf dem Land, auf einer Insel. Rule of thumb: an = next to water/an edge, auf = surface, island, countryside, in = inside an area (mountains, forest, countries with an article: in die Schweiz – in der Schweiz). An adjective without an article (common in adverts) takes the ending of the definite article: ruhiges Zimmer (das), schöner Strand (der), mit großem Balkon (dem), mit herrlicher Aussicht (der). „ohne” takes the accusative: ohne Frühstück, ohne den Koffer. Time prepositions: von … an = from … on (vom 1. Juli an, ab Montag), über = more than (über vier Stunden Aufenthalt)."},
  table:[["Wohin? (Akkusativ)","Wo? (Dativ)"],["ans Meer","am Meer"],["an den See","am See"],["in die Berge","in den Bergen"],["in den Wald","im Wald"],["aufs Land","auf dem Land"],["auf eine Insel","auf einer Insel"],["in die Schweiz","in der Schweiz"],["nach Österreich","in Österreich"]],
  table2:[["","maskulin","neutral","feminin","Plural"],["Nominativ","schöner Strand","ruhiges Zimmer","herrliche Aussicht","freundliche Leute"],["Akkusativ","schönen Strand","ruhiges Zimmer","herrliche Aussicht","freundliche Leute"],["Dativ","mit schönem Strand","mit großem Balkon","mit eigener Terrasse","mit netten Leuten"]],

 text:{title:"Urlaubsbewertung: Ferienwohnung „Seeblick“",de:"Wir, eine vierköpfige Familie aus Köln, haben im August zehn Tage in der Ferienwohnung „Seeblick“ verbracht. Schon die Anreise war ein kleines Abenteuer: Unser Zug hatte Verspätung, deshalb haben wir in Nürnberg den Anschluss verpasst und mussten über zwei Stunden auf den nächsten Zug warten. Aber die Mühe hat sich gelohnt! Die Wohnung liegt in ruhiger Lage direkt am See, nur zehn Minuten vom Dorf entfernt. Sie ist hell, sauber und modern eingerichtet. Besonders gut hat uns der große Balkon mit herrlicher Aussicht auf die Berge gefallen. Die Küche ist gut ausgestattet, deshalb haben wir oft selbst gekocht. Die Vermieterin, Frau Huber, war sehr freundlich und hat uns viele Tipps für Ausflüge gegeben. Wir sind in die Berge gewandert, haben eine Bootsfahrt gemacht und einen Tag in Salzburg verbracht. Es gab nur zwei kleine Nachteile: Das WLAN funktionierte nicht immer und die Wohnung hat keinen Parkplatz. Wer mit dem Auto anreist, muss im Dorf parken. In der Hochsaison sind die Preise natürlich höher, aber für diese Qualität sind sie fair. Wichtig: Man kann bis vier Wochen vor der Anreise kostenlos stornieren. Unser Fazit: Ideal für Familien, die Natur und Ruhe lieben. Wir kommen bestimmt wieder!",
  q:[["Die Familie hat zehn Tage in der Ferienwohnung verbracht.",true],["Auf der Anreise hat die Familie einen Anschluss verpasst.",true],["Die Wohnung liegt mitten im Dorf.",false],["Vom Balkon sieht man die Berge.",true],["Die Familie hat immer im Restaurant gegessen.",false],["Die Familie hat einen Ausflug nach Salzburg gemacht.",true],["Die Wohnung hat einen eigenen Parkplatz.",false],["Man kann bis vier Wochen vor der Anreise kostenlos stornieren.",true]]},

 grammar:{title:"Indirekte Fragen mit Fragewort und ob · Verb lassen",
  expl:{ro:"Întrebările indirecte sunt mai politicoase. Ele încep cu o expresie ca Können Sie mir sagen, …? / Wissen Sie, …? / Ich möchte wissen, … / Ich weiß nicht, … . Urmează o propoziție secundară: verbul conjugat merge la final! Dacă întrebarea directă are cuvânt interogativ (wie, wann, wo, was, wer, wie viel), îl păstrăm: Wann öffnet die Bank? → Wissen Sie, wann die Bank öffnet? Dacă întrebarea directă este o întrebare da/nu, folosim „ob”: Kann ich mit Karte zahlen? → Können Sie mir sagen, ob ich mit Karte zahlen kann? Verbul „lassen” înseamnă că nu facem noi ceva, ci punem pe altcineva să facă: Ich lasse mein Fahrrad reparieren (îmi repară altcineva bicicleta). Structura: lassen (poziția 2) + infinitiv (la final). Atenție la conjugare: du lässt, er lässt (cu Umlaut).",
   ar:"الأسئلة غير المباشرة أكتر أدب. بتبدأ بجملة زي Können Sie mir sagen, …? أو Wissen Sie, …? أو Ich möchte wissen, … أو Ich weiß nicht, … . وبعدها جملة فرعية: الفعل المتصرّف بيروح آخر الجملة! لو السؤال المباشر فيه أداة استفهام (wie, wann, wo, was, wer, wie viel) بنحتفظ بيها: Wann öffnet die Bank? → Wissen Sie, wann die Bank öffnet? ولو السؤال إجابته نعم/لأ بنستخدم «ob»: Kann ich mit Karte zahlen? → Können Sie mir sagen, ob ich mit Karte zahlen kann? الفعل «lassen» معناه إنك مش بتعمل الحاجة بنفسك، لكن بتخلّي حد تاني يعملها: Ich lasse mein Fahrrad reparieren (حد تاني بيصلّحلي العجلة). التركيب: lassen في المكان التاني + المصدر في الآخر. خد بالك من التصريف: du lässt و er lässt (بـ Umlaut).",
   en:"Indirect questions are more polite. They start with a phrase like Können Sie mir sagen, …? / Wissen Sie, …? / Ich möchte wissen, … / Ich weiß nicht, … . A subordinate clause follows: the conjugated verb goes to the end! If the direct question has a question word (wie, wann, wo, was, wer, wie viel), keep it: Wann öffnet die Bank? → Wissen Sie, wann die Bank öffnet? If it is a yes/no question, use „ob”: Kann ich mit Karte zahlen? → Können Sie mir sagen, ob ich mit Karte zahlen kann? The verb „lassen” means you don't do something yourself but have someone else do it: Ich lasse mein Fahrrad reparieren. Structure: lassen (position 2) + infinitive (at the end). Note the forms: du lässt, er lässt (with umlaut)."},

 text:{title:"Das erste eigene Konto",de:"Ioana ist vor drei Wochen nach Stuttgart gezogen. Sie hat eine Stelle als Pflegefachkraft gefunden, und ihr Arbeitgeber braucht für das Gehalt ein deutsches Konto. Deshalb geht sie am Montag zu einer Bank in der Innenstadt. Ein junger Berater, Herr Krause, begrüßt sie freundlich. Ioana ist etwas nervös, aber sie hat sich die wichtigsten Fragen vorher aufgeschrieben. „Können Sie mir sagen, wie viel ein Girokonto kostet?“, fragt sie zuerst. Herr Krause erklärt, dass das Konto für Berufseinsteiger kostenlos ist, wenn jeden Monat ein Gehalt eingeht. „Und wissen Sie, ob ich auch online überweisen kann?“ – „Natürlich. Mit unserer App können Sie alles mit dem Handy machen: Überweisungen, Daueraufträge, Kontoauszüge.“ Ioana möchte auch wissen, ob sie im Ausland kostenlos Geld abheben kann, denn sie fährt oft nach Rumänien. Herr Krause sagt, dass das in der EU meistens kein Problem ist, aber dass es bei manchen Automaten Gebühren gibt. Am Ende bekommt Ioana ein Formular, das sie ausfüllen und unterschreiben muss. Die Bankkarte wird ihr per Post geschickt, die Geheimzahl kommt einige Tage später in einem extra Brief. „Und wenn ich die Karte verliere?“, fragt Ioana. „Dann rufen Sie sofort die Sperrnummer an und lassen die Karte sperren. Das ist rund um die Uhr möglich.“ Zufrieden verlässt Ioana die Bank.",
  q:[["Ioana braucht ein Konto für ihr Gehalt.",true],["Herr Krause ist der Chef der Bank.",false],["Ioana hat ihre Fragen vorher aufgeschrieben.",true],["Das Girokonto kostet für Ioana jeden Monat Geld.",false],["Mit der App kann man auch Daueraufträge einrichten.",true],["Im Ausland kann man an allen Automaten ohne Gebühren Geld abheben.",false],["Die Geheimzahl kommt zusammen mit der Karte.",false],["Eine verlorene Karte kann man rund um die Uhr sperren lassen.",true]]},
 dictation:["Können Sie mir sagen, wie hoch die Gebühren sind?","Wissen Sie, ob es hier einen Geldautomaten gibt?","Ich möchte wissen, wann die Bank öffnet.","Ich habe meine Karte verloren und lasse sie sofort sperren.","Mein Bruder lässt sein Auto in der Werkstatt reparieren.","Die Miete zahle ich jeden Monat per Dauerauftrag."],

{
 id:"a22-14", n:14, title:"Lebensstationen",
 topic:{ro:"Etapele vieții (recapitulare A2)", ar:"مراحل الحياة (مراجعة A2)", en:"Stages of life (A2 review)"},
 grammar:{title:"Wiederholung: Perfekt/Präteritum · Konjunktiv II · Wortbildung · Satzverbindungen",
  expl:{ro:"Lecția recapitulează gramatica A2. 1) Trecutul: în vorbire folosim Perfekt (Ich bin nach Berlin gezogen), în texte scrise și povestiri Präteritum (Ich zog nach Berlin). Cu sein, haben și verbele modale folosim aproape mereu Präteritum: war, hatte, konnte, musste. 2) Konjunktiv II pentru dorințe și sfaturi: Ich wäre gern noch einmal jung. An deiner Stelle würde ich studieren. 3) Formarea cuvintelor: -er/-in pentru persoane (Lehrer, Lehrerin), -ung pentru substantive din verbe (erinnern → die Erinnerung), cuvinte compuse – ultimul cuvânt dă articolul (das Hochzeitsfoto), -chen pentru diminutiv, mereu neutru (das Häuschen); adjective cu un-, -los, -ig, -bar. 4) Legarea propozițiilor: aber, denn (poziția 0, ordine normală), deshalb, trotzdem (poziția 1, verbul urmează imediat), weil, dass, wenn (propoziție secundară, verbul la final).",
   ar:"الدرس ده مراجعة لجرامر A2. ١) الماضي: في الكلام بنستخدم Perfekt (Ich bin nach Berlin gezogen)، وفي الكتابة والحكايات Präteritum (Ich zog nach Berlin). ومع sein و haben والأفعال المساعدة بنستخدم Präteritum تقريبًا دايمًا: war و hatte و konnte و musste. ٢) Konjunktiv II للأمنيات والنصايح: Ich wäre gern noch einmal jung. و An deiner Stelle würde ich studieren. ٣) تكوين الكلمات: ‎-er/-in للأشخاص (Lehrer و Lehrerin)، و ‎-ung لاسم من فعل (erinnern → die Erinnerung)، والكلمات المركبة: آخر كلمة هي اللي بتحدد الأداة (das Hochzeitsfoto)، و ‎-chen للتصغير ودايمًا محايد (das Häuschen)، وصفات بـ un- و ‎-los و ‎-ig و ‎-bar. ٤) ربط الجمل: aber و denn (مكان صفر، ترتيب عادي)، و deshalb و trotzdem (مكان أول والفعل بعدها على طول)، و weil و dass و wenn (جملة فرعية والفعل في الآخر).",
   en:"This lesson reviews A2 grammar. 1) The past: in speech we use the Perfekt (Ich bin nach Berlin gezogen), in written texts and stories the Präteritum (Ich zog nach Berlin). With sein, haben and modal verbs we almost always use the Präteritum: war, hatte, konnte, musste. 2) Konjunktiv II for wishes and advice: Ich wäre gern noch einmal jung. An deiner Stelle würde ich studieren. 3) Word formation: -er/-in for people (Lehrer, Lehrerin), -ung for nouns from verbs (erinnern → die Erinnerung), compounds – the last word gives the article (das Hochzeitsfoto), -chen for diminutives, always neuter (das Häuschen); adjectives with un-, -los, -ig, -bar. 4) Linking clauses: aber, denn (position 0, normal order), deshalb, trotzdem (position 1, verb follows immediately), weil, dass, wenn (subordinate clause, verb at the end)."},

 text:{title:"Achtzig Jahre – ein Leben in Stationen",de:"Letzten Sonntag hat meine Großmutter Elena ihren achtzigsten Geburtstag gefeiert. Die ganze Familie war da – vier Generationen an einem Tisch. Nach dem Essen holte sie ein altes Fotoalbum und erzählte uns aus ihrem Leben. Sie wurde 1946 in einem kleinen Dorf in Siebenbürgen geboren und wuchs mit fünf Geschwistern auf. Die Familie hatte wenig Geld, trotzdem erinnert sie sich gern an ihre Kindheit. „Wir hatten kein Spielzeug, aber wir waren immer draußen und hatten viel Spaß“, sagte sie. Nach der Schule wollte sie Lehrerin werden, doch ihre Eltern konnten das Studium nicht bezahlen. Deshalb machte sie eine Ausbildung als Schneiderin. Mit 22 lernte sie auf einem Dorffest meinen Großvater kennen. Sie verliebten sich sofort und heirateten nur ein Jahr später. Weil es auf dem Land kaum Arbeit gab, zogen sie in die Stadt. Dort bekamen sie drei Kinder. In den Achtzigerjahren war das Leben sehr schwer, aber meine Großeltern gaben nie auf. Mit 60 ging meine Großmutter in Rente und mit 65 machte sie endlich ihre erste große Reise – nach Italien. Mein Großvater ist vor sechs Jahren gestorben. Heute wohnt sie allein in einem kleinen Häuschen mit Garten, aber sie ist nie einsam, denn die Enkelkinder besuchen sie oft. Am Ende des Abends fragte ich sie: „Was würdest du anders machen, wenn du noch einmal jung wärst?“ Sie lachte: „Ich würde früher reisen. Aber sonst? Gar nichts.“",
  q:[["Die Großmutter hat ihren achtzigsten Geburtstag gefeiert.",true],["Sie ist in einer großen Stadt aufgewachsen.",false],["Sie hat schlechte Erinnerungen an ihre Kindheit.",false],["Ihre Eltern konnten das Studium nicht bezahlen.",true],["Sie hat ihren Mann auf einem Dorffest kennengelernt.",true],["Das Paar zog in die Stadt, weil es dort Arbeit gab.",true],["Ihre erste große Reise machte sie mit 30.",false],["Wenn sie noch einmal jung wäre, würde sie früher reisen.",true]]},

{
 id:"b11-1", n:1, title:"Glück im Alltag",
 topic:{ro:"Noroc și ghinion în viața de zi cu zi", ar:"الحظ في الحياة اليومية", en:"Luck in everyday life"},
 grammar:{title:"Konjunktion als · Präteritum (bringen – brachte) · Plusquamperfekt",
  expl:{ro:"„als” introduce o propoziție secundară temporală pentru o acțiune unică în trecut (verbul la final): Als ich nach Hause kam, war die Tür offen. Pentru acțiuni repetate în trecut sau pentru prezent/viitor folosim „wenn”: Immer wenn ich Oma besuchte, backte sie Kuchen. Präteritum este timpul povestirii. Verbele mixte schimbă vocala ca verbele tari, dar primesc terminația -te ca verbele slabe: bringen – brachte, denken – dachte, wissen – wusste, kennen – kannte, rennen – rannte. Plusquamperfekt (mai mult ca perfectul) exprimă o acțiune care s-a petrecut înaintea altei acțiuni din trecut. Se formează cu hatte/war + participiul II: Er hatte den Schlüssel verloren, deshalb wartete er vor der Tür. Als der Arzt kam, war der Mann schon umgefallen. Alegem hatte sau war la fel ca la Perfekt (mișcare/schimbare de stare → sein).",
   ar:"«als» بتبدأ جملة فرعية زمنية لحدث حصل مرة واحدة في الماضي (الفعل في الآخر): Als ich nach Hause kam, war die Tür offen. وللحاجات اللي اتكررت في الماضي أو للحاضر والمستقبل بنستخدم «wenn»: Immer wenn ich Oma besuchte, backte sie Kuchen. الـ Präteritum هو زمن الحكي. الأفعال المختلطة بتغيّر الحرف المتحرك زي الأفعال القوية، بس بتاخد ‎-te زي الأفعال الضعيفة: bringen – brachte و denken – dachte و wissen – wusste و kennen – kannte و rennen – rannte. الـ Plusquamperfekt (الماضي التام) بيعبّر عن حاجة حصلت قبل حاجة تانية في الماضي. بيتكوّن من hatte/war + Partizip II: Er hatte den Schlüssel verloren, deshalb wartete er vor der Tür. و Als der Arzt kam, war der Mann schon umgefallen. بنختار hatte أو war زي الـ Perfekt بالظبط (حركة أو تغيّر حالة → sein).",
   en:"„als” introduces a time clause for a single event in the past (verb at the end): Als ich nach Hause kam, war die Tür offen. For repeated events in the past or for present/future we use „wenn”: Immer wenn ich Oma besuchte, backte sie Kuchen. The Präteritum is the tense of storytelling. Mixed verbs change their vowel like strong verbs but take -te like weak verbs: bringen – brachte, denken – dachte, wissen – wusste, kennen – kannte, rennen – rannte. The Plusquamperfekt (past perfect) expresses an action that happened before another past action. It is formed with hatte/war + past participle: Er hatte den Schlüssel verloren, deshalb wartete er vor der Tür. Als der Arzt kam, war der Mann schon umgefallen. Choose hatte or war as in the Perfekt (movement/change of state → sein)."},
  table:conj(["finden → Plusquamperfekt","fallen → Plusquamperfekt"],[["hatte gefunden","hattest gefunden","hatte gefunden","hatten gefunden","hattet gefunden","hatten gefunden"],["war gefallen","warst gefallen","war gefallen","waren gefallen","wart gefallen","waren gefallen"]]),
  table2:conj(["bringen","denken","wissen","kennen"],[["brachte","brachtest","brachte","brachten","brachtet","brachten"],["dachte","dachtest","dachte","dachten","dachtet","dachten"],["wusste","wusstest","wusste","wussten","wusstet","wussten"],["kannte","kanntest","kannte","kannten","kanntet","kannten"]]),
  examples:["Als ich zur Bushaltestelle kam, war der Bus schon weg.","Als Kind wusste ich nicht, wie man Fahrrad fährt.","Ein Nachbar brachte mir die Tasche, die ich verloren hatte.","Nachdem ich den ganzen Tag gesucht hatte, fand ich endlich meinen Schlüssel.","Der Mann war auf der Straße umgefallen, deshalb rief ich den Notarzt.","Ich dachte, ich hätte kein Glück – aber dann gewann ich den ersten Preis.","Immer wenn ich in Eile war, verpasste ich die Straßenbahn."]},

 text:{title:"Ein Tag voller Zufälle",de:"Der zwölfte März fing für Daniel sehr schlecht an. Er hatte vergessen, den Wecker zu stellen, und wachte erst um halb acht auf. In der Eile rannte er ohne Frühstück aus dem Haus. Als er zur Haltestelle kam, war die Straßenbahn natürlich schon weg. Deshalb nahm er ein Taxi. Erst im Büro merkte er, dass er seine Geldbörse nicht mehr hatte. Er hatte sie wohl im Taxi verloren! Darin waren nicht nur 200 Euro, sondern auch sein Ausweis und seine Bankkarte. Daniel war verzweifelt. Er rief bei der Taxizentrale an, aber dort wusste niemand etwas. Am Nachmittag ging er zum Fundbüro – ohne Erfolg. Als er am Abend müde nach Hause kam, wartete eine ältere Dame vor seiner Tür. „Sind Sie Herr Daniel Popescu?“, fragte sie. „Ich glaube, das gehört Ihnen.“ Sie gab ihm seine Geldbörse. Nach ihm war sie mit demselben Taxi gefahren und hatte die Geldbörse auf dem Rücksitz gefunden. Die Adresse stand auf dem Ausweis, und weil sie in der Nähe wohnte, brachte sie sie selbst vorbei. Daniel war unglaublich erleichtert. Er wollte ihr einen Finderlohn geben, aber sie lehnte ab. „Ich freue mich, wenn ich helfen kann“, sagte sie. Und dann kam die größte Überraschung: Die Dame war die Großmutter seiner Kollegin Sabine. Am nächsten Tag brachte Daniel ihr einen großen Blumenstrauß. „Was für ein Zufall“, dachte er. „Am Ende war das doch ein Glückstag.“",
  q:[["Daniel hatte vergessen, den Wecker zu stellen.",true],["Er fuhr mit der Straßenbahn ins Büro.",false],["In der Geldbörse waren auch sein Ausweis und seine Bankkarte.",true],["Im Fundbüro hatte man seine Geldbörse.",false],["Eine ältere Dame hatte die Geldbörse im Taxi gefunden.",true],["Die Dame wollte einen Finderlohn haben.",false],["Die Dame ist mit einer Kollegin von Daniel verwandt.",true],["Daniel brachte ihr am nächsten Tag Blumen.",true]]},
 dictation:["Als ich zur Haltestelle kam, war der Bus schon weg.","Er hatte den Schlüssel verloren, deshalb wartete er vor der Tür.","Ein Nachbar brachte mir die Tasche, die ich verloren hatte.","Immer wenn ich in Eile bin, vergesse ich etwas.","Ich dachte, das wäre mein Koffer, aber er gehörte einer anderen Frau.","Zum Glück hatte ein ehrlicher Finder die Geldbörse abgegeben."],
 speak:["Da habe ich wirklich Glück gehabt!","So ein Pech, der Zug ist schon weg.","Als ich nach Hause kam, war die Tür offen.","Als Kind wusste ich nicht, wie man schwimmt.","Ich hatte meinen Schlüssel verloren.","Nachdem ich lange gesucht hatte, fand ich mein Handy.","Ein Nachbar brachte mir das Paket.","Ich dachte, heute ist mein Pechtag.","Was für ein Zufall, dich hier zu treffen!","Ich war total erleichtert.","Ich möchte mich herzlich bei Ihnen bedanken.","Ich frage mal im Fundbüro nach."]
},

 topic:{ro:"Divertisment: TV, filme, seriale, spectacole", ar:"الترفيه: التلفزيون والأفلام والمسلسلات والعروض", en:"Entertainment: TV, films, series, shows"},
 grammar:{title:"Konjunktion obwohl · Relativpronomen und Relativsatz · Gradpartikeln",
  expl:{ro:"„obwohl” (deși) introduce o propoziție secundară concesivă: verbul conjugat merge la final. Obwohl der Film sehr lang war, war er nie langweilig. Sensul este același ca la trotzdem, dar structura diferă: trotzdem leagă două propoziții principale (Der Film war lang. Trotzdem war er nie langweilig.). Propoziția relativă descrie mai exact un substantiv. Pronumele relativ are genul și numărul substantivului, dar cazul îl primește din propoziția relativă; verbul stă la final: Das ist der Schauspieler, der den Preis gewonnen hat (nominativ). Das ist die Serie, die ich jeden Abend schaue (acuzativ). Das ist der Freund, dem ich die DVD geliehen habe (dativ). Pronumele relative seamănă cu articolul hotărât, excepție dativ plural: denen. Particulele de grad nuanțează adjectivele: total/absolut (foarte tare), sehr/besonders, ziemlich (destul de), etwas/ein bisschen (puțin), nicht besonders (nu prea), zu (prea).",
   ar:"«obwohl» (رغم إن) بتبدأ جملة فرعية والفعل المتصرّف بيروح الآخر: Obwohl der Film sehr lang war, war er nie langweilig. المعنى زي trotzdem بالظبط، بس التركيب مختلف: trotzdem بتربط جملتين رئيسيتين (Der Film war lang. Trotzdem war er nie langweilig.). جملة الصلة (Relativsatz) بتوصف الاسم بدقة أكتر. ضمير الصلة بياخد جنس وعدد الاسم، لكن الحالة الإعرابية بياخدها من جملة الصلة نفسها، والفعل في الآخر: Das ist der Schauspieler, der den Preis gewonnen hat (نوميناتيف). و Das ist die Serie, die ich jeden Abend schaue (أكوزاتيف). و Das ist der Freund, dem ich die DVD geliehen habe (داتيف). ضمائر الصلة شبه أداة التعريف، ماعدا الداتيف الجمع: denen. أدوات الدرجة بتوضّح قوة الصفة: total/absolut (جدًا جدًا)، و sehr/besonders، و ziemlich (لحد كبير)، و etwas/ein bisschen (شوية)، و nicht besonders (مش أوي)، و zu (زيادة عن اللزوم).",
   en:"„obwohl” (although) introduces a subordinate clause: the conjugated verb goes to the end. Obwohl der Film sehr lang war, war er nie langweilig. The meaning is like trotzdem, but the structure differs: trotzdem links two main clauses (Der Film war lang. Trotzdem war er nie langweilig.). A relative clause describes a noun more precisely. The relative pronoun takes the gender and number of the noun, but its case comes from the relative clause; the verb goes to the end: Das ist der Schauspieler, der den Preis gewonnen hat (nominative). Das ist die Serie, die ich jeden Abend schaue (accusative). Das ist der Freund, dem ich die DVD geliehen habe (dative). Relative pronouns look like the definite article, except dative plural: denen. Degree particles modify adjectives: total/absolut (extremely), sehr/besonders, ziemlich (quite), etwas/ein bisschen (a little), nicht besonders (not very), zu (too)."},

 text:{title:"Fernsehen von gestern, Streaming von heute",de:"Noch vor zwanzig Jahren saß die ganze Familie am Samstagabend vor dem Fernseher. Man schaute zusammen eine Quizshow oder einen Spielfilm, und am Montag sprachen alle in der Schule oder im Büro über die Sendung, die sie gesehen hatten. Heute ist das anders. Die meisten jungen Leute haben keinen klassischen Fernseher mehr, obwohl sie täglich mehrere Stunden Filme und Serien sehen. Sie streamen alles auf dem Laptop, dem Tablet oder dem Handy – wann und wo sie wollen. Die Studentin Mara, 23, erzählt: „Ich schaue fast jeden Abend eine Serie. Manchmal schaue ich eine ganze Staffel an einem Wochenende. Das ist ziemlich ungesund, ich weiß, aber die Serien sind einfach total spannend.“ Ihr Vater, Herr Lang, 58, sieht das kritisch. „Früher hatten wir weniger Auswahl, aber wir haben gemeinsam etwas erlebt. Heute sitzt jeder allein vor seinem Bildschirm.“ Trotzdem hat auch er ein Abo bei einem Streamingdienst – vor allem wegen der Dokumentarfilme, die er sehr gern sieht. Eine Sache verbindet aber die Generationen: Live-Erlebnisse werden wieder beliebter. Konzerte, Musicals und Comedy-Abende sind oft schnell ausverkauft. „Ein Auftritt auf der Bühne, bei dem das ganze Publikum lacht und klatscht – das kann kein Bildschirm ersetzen“, meint Mara. Da ist ihr Vater ausnahmsweise einer Meinung mit ihr.",
  q:[["Früher hat die Familie am Samstagabend oft zusammen ferngesehen.",true],["Die meisten jungen Leute haben heute einen klassischen Fernseher.",false],["Mara schaut manchmal eine ganze Staffel an einem Wochenende.",true],["Mara findet das sehr gesund.",false],["Herr Lang findet, dass heute jeder allein vor dem Bildschirm sitzt.",true],["Herr Lang hat kein Abo bei einem Streamingdienst.",false],["Live-Veranstaltungen werden wieder beliebter.",true],["Mara und ihr Vater sind beim Thema Live-Erlebnisse einer Meinung.",true]]},

 id:"b11-3", n:3, title:"Fit bleiben",
 topic:{ro:"Sănătate și mișcare: a rămâne în formă", ar:"الصحة والرياضة: إزاي تفضل فِت", en:"Health and exercise: staying fit"},
 grammar:{title:"Genitiv · Passiv Präsens · Passiv mit Modalverb",
  expl:{ro:"Genitivul exprimă apartenența (al, a, ai, ale): die Entspannung des Rückens, die Praxis meiner Ärztin. Articole la genitiv: des (m/n), der (f/plural), eines/einer, meines/meiner. Substantivele masculine și neutre primesc -s sau -es: des Arztes, des Knies, eines Kindes. În limba vorbită genitivul se înlocuiește des cu von + dativ (die Praxis von meiner Ärztin), dar în scris și după unele prepoziții (wegen, trotz, während) folosim genitivul. Pasivul prezent: werden + participiul II: Das Knie wird untersucht. Pasivul cu verb modal: verbul modal conjugat (poziția 2) + participiul II + werden (la final): Ihr Knie muss geröntgt werden. Die Übung kann zu Hause gemacht werden. Der Verband darf nicht nass werden (aici werden = a deveni). Pasivul cu modal apare foarte des la medic și în instrucțiuni.",
   ar:"الـ Genitiv بيعبّر عن الملكية (بتاع / الخاص بـ): die Entspannung des Rückens و die Praxis meiner Ärztin. أدوات الجينيتيف: des (مذكر/محايد)، و der (مؤنث/جمع)، و eines/einer، و meines/meiner. الأسماء المذكرة والمحايدة بتاخد ‎-s أو ‎-es: des Arztes و des Knies و eines Kindes. في الكلام العادي بيستبدلوا الجينيتيف كتير بـ von + Dativ (die Praxis von meiner Ärztin)، لكن في الكتابة وبعد حروف جر زي wegen و trotz و während بنستخدم الجينيتيف. المبني للمجهول في المضارع: werden + Partizip II: Das Knie wird untersucht. المبني للمجهول مع فعل مساعد: الفعل المساعد متصرّف (المكان التاني) + Partizip II + werden (في الآخر): Ihr Knie muss geröntgt werden. و Die Übung kann zu Hause gemacht werden. التركيب ده بييجي كتير عند الدكتور وفي التعليمات.",
   en:"The genitive expresses possession (of): die Entspannung des Rückens, die Praxis meiner Ärztin. Genitive articles: des (m/n), der (f/plural), eines/einer, meines/meiner. Masculine and neuter nouns add -s or -es: des Arztes, des Knies, eines Kindes. In spoken German the genitive is often replaced by von + dative (die Praxis von meiner Ärztin), but in writing and after some prepositions (wegen, trotz, während) we use the genitive. Present passive: werden + past participle: Das Knie wird untersucht. Passive with a modal verb: conjugated modal (position 2) + past participle + werden (at the end): Ihr Knie muss geröntgt werden. Die Übung kann zu Hause gemacht werden. This structure is very common at the doctor's and in instructions."},

 grammar:{title:"Verweiswörter · Nachsilben bei Adjektiven · Uneingeleitete wenn-Sätze · dass-Sätze und ihre Entsprechungen",
  expl:{ro:"1) Cuvintele de referință leagă propozițiile dintr-un text: pronume prepoziționale (damit, darauf, dafür, daran …) și pronume demonstrative (das, dies, diese). Ele trimit la o idee anterioară (Dieser Trend ist interessant. Deshalb beschäftigen sich Experten damit.) sau ulterioară (Die Zahlen deuten darauf hin, dass …). 2) Sufixele adjectivelor: -lich, -ig, -isch, -sam, -bar, -voll, -los, -reich; adjectivele de origine latină se termină des în -iv, -ant, -ent, -ell (informativ, interessant, aktuell). 3) Propozițiile condiționale cu wenn pot fi scurtate: wenn dispare și verbul conjugat trece pe primul loc: Wenn Sie reservieren möchten, drücken Sie die 1. → Möchten Sie reservieren, drücken Sie die 1. Sunt tipice pentru anunțuri, instrucțiuni și limba scrisă. 4) Când subiectul (sau obiectul) din propoziția principală este același cu subiectul din propoziția cu dass, putem folosi infinitivul cu zu: Er kann sich nicht vorstellen, dass er allein schaut → … allein zu schauen. După verbe de spus (sagen, berichten), de percepție (sehen, hören) și de cunoaștere (wissen, vermuten) NU folosim infinitiv cu zu. 5) Propozițiile cu dass pot înlocui un complement: Der Wirt sorgt für die Getränke → Der Wirt sorgt dafür, dass die Gäste Getränke haben (cu prepoziție apare da(r)- + prepoziție).",
   ar:"١) كلمات الإحالة بتربط جمل النص ببعض: ضماير بحرف جر (damit و darauf و dafür و daran …) وضماير إشارة (das و dies و diese). بترجع لفكرة اتقالت قبل كده (Dieser Trend ist interessant. Deshalb beschäftigen sich Experten damit.) أو جاية بعد كده (Die Zahlen deuten darauf hin, dass …). ٢) نهايات الصفات: ‎-lich و ‎-ig و ‎-isch و ‎-sam و ‎-bar و ‎-voll و ‎-los و ‎-reich، والصفات اللي أصلها لاتيني غالبًا بتنتهي بـ ‎-iv و ‎-ant و ‎-ent و ‎-ell (informativ و interessant و aktuell). ٣) جمل الشرط بـ wenn ممكن تتختصر: نشيل wenn ونحط الفعل المتصرّف في الأول: Wenn Sie reservieren möchten, drücken Sie die 1. → Möchten Sie reservieren, drücken Sie die 1. دي بتيجي كتير في الإعلانات والتعليمات واللغة المكتوبة. ٤) لما الفاعل (أو المفعول) في الجملة الرئيسية يكون هو نفس فاعل جملة dass، نقدر نستخدم المصدر مع zu: Er kann sich nicht vorstellen, dass er allein schaut → … allein zu schauen. بعد أفعال القول (sagen و berichten) والإدراك (sehen و hören) والمعرفة (wissen و vermuten) مفيش zu-Infinitiv. ٥) جملة dass ممكن تحل محل مفعول: Der Wirt sorgt für die Getränke → Der Wirt sorgt dafür, dass die Gäste Getränke haben (ومع حرف الجر بنقول da(r) + حرف الجر).",
   en:"1) Reference words link the sentences of a text: prepositional pronouns (damit, darauf, dafür, daran …) and demonstrative pronouns (das, dies, diese). They point back to an earlier idea (Dieser Trend ist interessant. Deshalb beschäftigen sich Experten damit.) or forward to a following one (Die Zahlen deuten darauf hin, dass …). 2) Adjective suffixes: -lich, -ig, -isch, -sam, -bar, -voll, -los, -reich; adjectives of Latin origin often end in -iv, -ant, -ent, -ell (informativ, interessant, aktuell). 3) Conditional wenn-clauses can be shortened: wenn disappears and the conjugated verb moves to the front: Wenn Sie reservieren möchten, drücken Sie die 1. → Möchten Sie reservieren, drücken Sie die 1. Typical of announcements, instructions and written German. 4) If the subject (or object) of the main clause is the same as the subject of the dass-clause, you can use an infinitive with zu: Er kann sich nicht vorstellen, dass er allein schaut → … allein zu schauen. After verbs of saying (sagen, berichten), perception (sehen, hören) and knowing (wissen, vermuten) there is NO zu-infinitive. 5) dass-clauses can replace an object: Der Wirt sorgt für die Getränke → Der Wirt sorgt dafür, dass die Gäste Getränke haben (with a preposition we add da(r)- + preposition)."},

  tables:[{h:"dass-Sätze als Ergänzung",t:[["Satz mit Ergänzung","Satz mit dass"],["Bemerkenswert ist der Erfolg der Serie. (Nominativ)","Bemerkenswert ist, dass die Serie erfolgreich ist."],["Viele geben ihre Schwäche für Krimis zu. (Akkusativ)","Viele geben zu, dass sie eine Schwäche für Krimis haben."],["Der Wirt sorgt für die Getränke. (Präposition)","Der Wirt sorgt dafür, dass die Gäste Getränke haben."]]},{h:"Uneingeleitete wenn-Sätze",t:[["mit wenn","ohne wenn (Verb zuerst)"],["Wenn Sie Karten bestellen möchten, drücken Sie die 1.","Möchten Sie Karten bestellen, drücken Sie die 1."],["Wenn der Film ausverkauft ist, rufen wir Sie an.","Ist der Film ausverkauft, rufen wir Sie an."],["Wenn man die Zeitung abonniert, spart man Geld.","Abonniert man die Zeitung, spart man Geld."]]},{h:"Nachsilben bei Adjektiven",t:[["Nachsilbe","Beispiele"],["-lich / -ig / -isch","täglich, wichtig, kritisch"],["-sam / -bar","unterhaltsam, lesbar"],["-voll / -los / -reich","wertvoll, kostenlos, erfolgreich"],["-iv / -ant / -ent / -ell","informativ, interessant, intelligent, aktuell"]]}],

 text:{title:"Lesen Jugendliche noch?",de:"„Die Jugend liest nicht mehr!“ – Diesen Satz hört man von Eltern, Lehrern und Journalisten seit Jahrzehnten. Doch stimmt das wirklich? Eine neue Studie zum Medienkonsum von Zwölf- bis Neunzehnjährigen zeichnet ein differenziertes Bild. Zwar greifen nur noch rund 15 Prozent der Jugendlichen regelmäßig zu einer gedruckten Zeitung, aber das bedeutet nicht, dass sie sich nicht informieren. Im Gegenteil: Über 80 Prozent lesen täglich Nachrichten – allerdings fast ausschließlich auf dem Smartphone. Dabei spielen klassische Nachrichtenseiten eine immer kleinere Rolle. Viele junge Menschen informieren sich stattdessen über soziale Netzwerke, Videoplattformen oder Podcasts. Experten sehen darin sowohl Chancen als auch Risiken. Einerseits sind Informationen heute schneller und leichter zugänglich als je zuvor. Andererseits ist es für junge Leser oft schwierig, seriöse Quellen von Falschmeldungen zu unterscheiden. Die Studie weist darauf hin, dass nur ein Drittel der Befragten die Herkunft einer Nachricht regelmäßig überprüft. Medienpädagogen fordern deshalb, dass Medienkompetenz ein festes Schulfach wird. Und Bücher? Hier gibt es überraschende Ergebnisse. Fast die Hälfte der Jugendlichen liest in ihrer Freizeit mindestens einmal pro Woche ein Buch. Besonders beliebt sind Fantasy-Romane und Jugendbücher, die auf Plattformen wie „BookTok“ empfohlen werden. Dort präsentieren junge Leute in kurzen Videos ihre Lieblingsbücher – mit enormem Erfolg. Manche Titel, die schon jahrelang in den Buchhandlungen lagen, wurden dadurch plötzlich zu Bestsellern. Verlage haben auf diesen Trend reagiert und arbeiten inzwischen gezielt mit jungen Influencern zusammen. Auffällig ist auch der Unterschied zwischen den Geschlechtern: Mädchen lesen deutlich häufiger Bücher als Jungen, die dagegen mehr Zeit mit Videospielen verbringen. Die Forscher betonen jedoch, dass sich die Freude am Lesen fördern lässt – vor allem dann, wenn Eltern selbst lesen und Kinder ihre Bücher frei auswählen dürfen. Das Fazit der Studie lautet also: Jugendliche lesen nicht weniger, sondern anders. Die Frage ist nicht, ob sie lesen, sondern was – und wie kritisch.",
  q:[["Nur etwa 15 Prozent der Jugendlichen lesen regelmäßig eine gedruckte Zeitung.",true],["Die meisten Jugendlichen informieren sich überhaupt nicht über Nachrichten.",false],["Jugendliche lesen Nachrichten fast nur auf dem Smartphone.",true],["Laut Studie überprüft die Mehrheit die Herkunft einer Nachricht regelmäßig.",false],["Medienpädagogen möchten Medienkompetenz als Schulfach.",true],["Fast die Hälfte der Jugendlichen liest mindestens einmal pro Woche ein Buch.",true],["Auf BookTok werden vor allem Sachbücher empfohlen.",false],["Durch BookTok wurden manche ältere Bücher zu Bestsellern.",true],["Jungen lesen häufiger Bücher als Mädchen.",false],["Das Fazit lautet: Jugendliche lesen nicht weniger, sondern anders.",true]]},

 write:{type:"Persönliche E-Mail",title:"Filmempfehlung für einen Freund",
  situation:"Sie haben am Wochenende einen Film gesehen, der Sie begeistert hat. Ihr Freund Jonas schreibt Ihnen, dass er nicht weiß, was er am Freitag machen soll. Schreiben Sie ihm eine E-Mail.",
  points:["den Film kurz beschreiben (Thema, Handlung, Schauspieler)","begründen, warum der Film sehenswert ist","einen gemeinsamen Kinobesuch vorschlagen (Tag, Uhrzeit, Kino)","um eine schnelle Antwort bitten, weil die Karten knapp sind"],
  words:"Schreiben Sie ca. 150 Wörter.",
  tip:{ro:"Pentru recomandare folosește adjective puternice (spannend, berührend, unterhaltsam) și explică de ce. Încearcă și o propoziție fără wenn: Hast du Zeit, kaufe ich die Karten.",ar:"عشان توصي بفيلم استخدم صفات قوية (spannend و berührend و unterhaltsam) واشرح ليه. وجرّب جملة شرط من غير wenn: Hast du Zeit, kaufe ich die Karten.",en:"For a recommendation use strong adjectives (spannend, berührend, unterhaltsam) and explain why. Also try a clause without wenn: Hast du Zeit, kaufe ich die Karten."},
  redemittel:[["Einleitung",["Du hast doch geschrieben, dass …","Ich habe einen Tipp für dich!"]],["Film beschreiben",["Der Film handelt von …","Die Hauptrolle spielt …","Es geht um …"]],["Bewertung",["Besonders beeindruckt hat mich …","Den Film muss man einfach gesehen haben, denn …","Er ist nicht nur spannend, sondern auch …"]],["Vorschlag und Bitte",["Wie wäre es, wenn wir am Freitag zusammen …?","Hast du Lust, kaufe ich die Karten online.","Sag mir bitte bis morgen Bescheid, denn …"]]],
  model:"Hallo Jonas,\n\ndu hast doch geschrieben, dass du für Freitag noch keine Pläne hast. Ich habe einen tollen Tipp für dich!\n\nAm Wochenende habe ich „Das letzte Signal“ gesehen, einen deutschen Thriller, der gerade im Kino läuft. Der Film handelt von einer jungen Radiomoderatorin, die während einer Live-Sendung einen mysteriösen Anruf bekommt. Danach gerät sie in ein gefährliches Spiel. Die Hauptrolle spielt Lea Brandt, und sie ist einfach fantastisch.\n\nBesonders beeindruckt hat mich, dass der Film nicht nur spannend ist, sondern auch zeigt, wie stark Medien unsere Meinung beeinflussen. Bis zur letzten Minute weiß man nicht, wem man glauben soll.\n\nWie wäre es, wenn wir am Freitag zusammen hingehen? Im Kino am Markt läuft er um 20:15 Uhr. Danach könnten wir noch etwas trinken gehen. Hast du Lust, kaufe ich die Karten online.\n\nSag mir bitte bis morgen Abend Bescheid, denn die Vorstellungen am Wochenende sind fast immer ausverkauft.\n\nBis bald!\nRadu"}

 grammar:{title:"Temporales ausdrücken · Temporale Zusammenhänge verbal und nominal · Wortbildung: -weise",
  expl:{ro:"1) Acțiuni simultane: während (în timp ce), solange (atâta timp cât – aceeași durată), als (o singură dată în trecut): Während sie noch zur Schule gehen, machen manche schon Praktika. Solange er in der Schule ist, wohnt er bei seinen Eltern. 2) Acțiuni succesive: bevor/ehe (înainte să), nachdem (după ce), sobald (imediat ce). Ordinea timpurilor la nachdem: nachdem + Perfekt → principala la prezent; nachdem + Plusquamperfekt → principala la Präteritum. Nachdem er ein Jahr Pause gemacht hatte, begann er mit dem Studium. 3) În limba scrisă se preferă forma nominală cu prepoziții: bevor → vor + dativ (Vor der Bewerbung informiere ich mich), während/solange → während + genitiv (Während der Schulzeit …), sobald → (gleich) nach + dativ (Gleich nach dem Erhalt des Zeugnisses …), nachdem → nach + dativ (Nach dem Ende des Schuljahres …). 4) Adverbele cu sufixul -weise exprimă o apreciere sau un mod: din adjective (cu -er-): normalerweise, glücklicherweise, möglicherweise; din substantive: beziehungsweise, stellenweise, teilweise, probeweise, ausnahmsweise.",
   ar:"١) أحداث في نفس الوقت: während (في الوقت اللي)، و solange (طول ما – نفس المدة)، و als (مرة واحدة في الماضي): Während sie noch zur Schule gehen, machen manche schon Praktika. و Solange er in der Schule ist, wohnt er bei seinen Eltern. ٢) أحداث ورا بعض: bevor/ehe (قبل ما)، و nachdem (بعد ما)، و sobald (أول ما). ترتيب الأزمنة مع nachdem: nachdem + Perfekt → الجملة الرئيسية مضارع، و nachdem + Plusquamperfekt → الرئيسية Präteritum: Nachdem er ein Jahr Pause gemacht hatte, begann er mit dem Studium. ٣) في الكتابة الرسمية بنفضّل الشكل الاسمي بحروف الجر: bevor → vor + Dativ (Vor der Bewerbung informiere ich mich)، و während/solange → während + Genitiv (Während der Schulzeit …)، و sobald → (gleich) nach + Dativ (Gleich nach dem Erhalt des Zeugnisses …)، و nachdem → nach + Dativ (Nach dem Ende des Schuljahres …). ٤) الظروف اللي بتنتهي بـ ‎-weise بتعبّر عن تقييم أو طريقة: من صفات (بـ ‎-er-): normalerweise و glücklicherweise و möglicherweise، ومن أسماء: beziehungsweise و stellenweise و teilweise و probeweise و ausnahmsweise.",
   en:"1) Simultaneous actions: während (while), solange (as long as – same duration), als (once in the past): Während sie noch zur Schule gehen, machen manche schon Praktika. Solange er in der Schule ist, wohnt er bei seinen Eltern. 2) Successive actions: bevor/ehe (before), nachdem (after), sobald (as soon as). Tense sequence with nachdem: nachdem + Perfekt → main clause in the present; nachdem + Plusquamperfekt → main clause in the Präteritum: Nachdem er ein Jahr Pause gemacht hatte, begann er mit dem Studium. 3) Written German prefers the nominal form with prepositions: bevor → vor + dative (Vor der Bewerbung informiere ich mich), während/solange → während + genitive (Während der Schulzeit …), sobald → (gleich) nach + dative (Gleich nach dem Erhalt des Zeugnisses …), nachdem → nach + dative (Nach dem Ende des Schuljahres …). 4) Adverbs with -weise express an evaluation or manner: from adjectives (with -er-): normalerweise, glücklicherweise, möglicherweise; from nouns: beziehungsweise, stellenweise, teilweise, probeweise, ausnahmsweise."},

 text:{title:"Ein Jahr Pause – Zeitverschwendung oder Gewinn?",de:"Nach zwölf oder dreizehn Jahren Schule wissen viele junge Menschen noch nicht genau, wie es weitergehen soll. Statt sich sofort für ein Studium oder eine Ausbildung zu entscheiden, legen immer mehr Schulabgänger eine Pause ein – ein sogenanntes „Gap Year“. Die Möglichkeiten sind vielfältig: Work & Travel in Australien oder Neuseeland, ein Freiwilligendienst in einem sozialen Projekt, ein Jahr als Au-pair oder ein Praktikum im Ausland. Besonders beliebt ist Work & Travel. Dabei reisen die jungen Leute durch ein Land und finanzieren ihren Aufenthalt durch Gelegenheitsjobs – zum Beispiel bei der Obsternte, in Hotels oder auf Farmen. Sobald sie genug Geld verdient haben, ziehen sie weiter. Bevor es losgehen kann, sind allerdings einige Vorbereitungen nötig: Man braucht ein spezielles Visum, eine Auslandskrankenversicherung und genügend Geld für die ersten Wochen. Agenturen bieten Pakete an, die Flug, Unterkunft für die ersten Nächte und einen Ansprechpartner vor Ort enthalten. Billig ist das nicht: Für ein Jahr sollte man mit 6.000 bis 10.000 Euro rechnen. Kritiker meinen, ein Gap Year sei verlorene Zeit. Wer ein Jahr lang reise, verliere den Anschluss und beginne später mit dem Berufsleben. Doch Studien zeigen das Gegenteil. Junge Menschen, die nach der Schule eine Auszeit genommen haben, brechen ihr Studium seltener ab. Sie haben ihre Interessen in dieser Zeit besser kennengelernt und treffen daher bewusstere Entscheidungen. Auch Personalchefs bewerten Auslandserfahrungen in der Regel positiv. „Wer sich allein in einem fremden Land zurechtgefunden hat, beweist Selbstständigkeit und Flexibilität“, erklärt eine Personalberaterin. Lukas, 20, hat nach dem Abitur zehn Monate in Australien verbracht. „Am Anfang hatte ich stellenweise großes Heimweh und das Geld war knapp“, erzählt er. „Aber ich habe gelernt, Probleme allein zu bewältigen.“ Nachdem er zurückgekommen war, schrieb er sich für Tourismusmanagement ein – eine Entscheidung, die er ohne seine Reise wahrscheinlich nie getroffen hätte. Sein Rat: „Plant gut, aber nicht zu viel. Die besten Erfahrungen macht man ohnehin spontan.“",
  q:[["Immer mehr Schulabgänger machen nach der Schule eine Pause.",true],["Bei Work & Travel finanziert man die Reise durch Gelegenheitsjobs.",true],["Für Work & Travel braucht man kein spezielles Visum.",false],["Agenturen bieten Pakete mit einem Ansprechpartner vor Ort an.",true],["Ein Gap Year kostet laut Text höchstens 3.000 Euro.",false],["Laut Studien brechen junge Menschen nach einem Gap Year ihr Studium häufiger ab.",false],["Personalchefs bewerten Auslandserfahrungen meist positiv.",true],["Lukas hatte in Australien manchmal Heimweh.",true],["Lukas wusste schon vor der Reise, dass er Tourismusmanagement studieren will.",false],["Lukas rät, nicht alles zu genau zu planen.",true]]},

 write:{type:"Formelle Anfrage",title:"Anfrage an eine Work-&-Travel-Agentur",
  situation:"Sie möchten nach Ihrem Schulabschluss ein Jahr Work & Travel in Australien machen. Im Internet haben Sie die Anzeige der Agentur „TravelPlus GmbH“ gelesen. Schreiben Sie eine formelle E-Mail an die Agentur.",
  points:["sich kurz vorstellen und den Grund Ihres Schreibens nennen","nach den Kosten und den Leistungen des Pakets fragen","nach Visum und Versicherung fragen","um Informationsmaterial oder einen Beratungstermin bitten"],
  words:"Schreiben Sie ca. 150–180 Wörter. Denken Sie an Absender, Ort und Datum, Betreff, Anrede und Gruß.",
  tip:{ro:"Scrisoare formală: adresa expeditorului sus, apoi destinatarul, apoi „Bukarest, den …“ (cu den!), Betreff fără punct, „Sehr geehrte Damen und Herren,“ și prima frază cu literă mică. Folosește întrebări indirecte: Könnten Sie mir mitteilen, ob …",ar:"الجواب الرسمي: عنوان الراسل فوق، وبعده المرسل إليه، وبعدين «Bukarest, den …» (لازم den!)، والـ Betreff من غير نقطة، و «Sehr geehrte Damen und Herren,» وأول جملة تبدأ بحرف صغير. استخدم أسئلة غير مباشرة: Könnten Sie mir mitteilen, ob …",en:"Formal letter: sender's address at the top, then the recipient, then „Bukarest, den …“ (with den!), subject line without a full stop, „Sehr geehrte Damen und Herren,“ and the first sentence starts in lower case. Use indirect questions: Könnten Sie mir mitteilen, ob …"},

  model:"Elena Ionescu\nStrada Mihai Eminescu 25\n020072 Bukarest\nRumänien\n\nTravelPlus GmbH\nKundenberatung\nLeopoldstraße 18\n80802 München\n\nBukarest, den 18. Oktober 2026\n\nAnfrage zu Ihrem Work-&-Travel-Programm in Australien\n\nSehr geehrte Damen und Herren,\n\nmit großem Interesse habe ich Ihre Anzeige auf Ihrer Internetseite gelesen. Ich bin 18 Jahre alt und mache im Juni mein Abitur. Bevor ich mit dem Studium beginne, möchte ich ein Jahr in Australien arbeiten und reisen.\n\nZunächst würde ich gern wissen, wie viel Ihr Paket kostet und welche Leistungen im Preis enthalten sind. Ist zum Beispiel die Unterkunft in den ersten Nächten inklusive? Außerdem interessiert mich, ob Sie mir bei der Jobsuche vor Ort helfen.\n\nKönnten Sie mir bitte auch mitteilen, wie ich das Visum beantragen muss und ob Sie eine Auslandskrankenversicherung anbieten? Da ich zum ersten Mal allein ins Ausland reise, sind mir diese Punkte besonders wichtig.\n\nIch wäre Ihnen dankbar, wenn Sie mir Informationsmaterial zuschicken könnten. Gern würde ich auch einen telefonischen Beratungstermin vereinbaren.\n\nFür Ihre Bemühungen bedanke ich mich im Voraus und freue mich auf Ihre Antwort.\n\nMit freundlichen Grüßen\nElena Ionescu"}

 grammar:{title:"Das Verb lassen · Futur II – Vermutungen · Verbverbindungen · Nominalisierung von Verben",
  expl:{ro:"1) „lassen” + infinitiv are patru sensuri: a permite (Laura lässt sich nicht gern fotografieren), a pune pe altcineva să facă (Ich lasse meine Haare schneiden), posibilitate – „sich lassen” (Das Problem lässt sich lösen = poate fi rezolvat) și a nu schimba nimic (Lass das! Sie lässt ihre Frisur so, wie sie ist). La Perfekt: ca verb principal → gelassen (Sie hat ihre Frisur so gelassen); cu un alt infinitiv → dublu infinitiv (Sie hat sich die Haare schneiden lassen). 2) Futur II exprimă o presupunere despre trecut: werden + participiu II + haben/sein: Er wird wohl zu viel trainiert haben. Sie wird gestern beim Arzt gewesen sein. Alternativ: adverbe (wohl, vermutlich, wahrscheinlich) + Perfekt. 3) Verbele gehen, lernen, bleiben, sehen, hören se leagă de infinitiv fără zu: Ich gehe joggen. Sie lernt tanzen. La Perfekt, sehen și hören formează dublu infinitiv: Ich habe ihn laufen sehen. 4) Nominalizarea: infinitivul devine substantiv neutru, iar substantivul sau adverbul din față se lipește: den Kopf schütteln → das Kopfschütteln, mit den Armen kreisen → das Armkreisen, rückwärts gehen → das Rückwärtsgehen.",
   ar:"١) «lassen» + المصدر ليها ٤ معاني: يسمح (Laura lässt sich nicht gern fotografieren)، ويخلّي حد تاني يعمل (Ich lasse meine Haare schneiden)، والإمكانية بـ «sich lassen» (Das Problem lässt sich lösen = ممكن يتحل)، وإنه مايغيّرش حاجة (Lass das! و Sie lässt ihre Frisur so, wie sie ist). في الـ Perfekt: لو فعل أساسي → gelassen (Sie hat ihre Frisur so gelassen)، ولو معاه مصدر تاني → مصدرين ورا بعض (Sie hat sich die Haare schneiden lassen). ٢) الـ Futur II بيعبّر عن تخمين عن الماضي: werden + Partizip II + haben/sein: Er wird wohl zu viel trainiert haben. و Sie wird gestern beim Arzt gewesen sein. والبديل: ظرف (wohl و vermutlich و wahrscheinlich) + Perfekt. ٣) الأفعال gehen و lernen و bleiben و sehen و hören بتاخد مصدر من غير zu: Ich gehe joggen. و Sie lernt tanzen. وفي الـ Perfekt مع sehen و hören بنستخدم مصدرين: Ich habe ihn laufen sehen. ٤) تحويل الفعل لاسم: المصدر بيبقى اسم محايد، والاسم أو الظرف اللي قبله بيلزق فيه: den Kopf schütteln → das Kopfschütteln، و mit den Armen kreisen → das Armkreisen، و rückwärts gehen → das Rückwärtsgehen.",
   en:"1) „lassen” + infinitive has four meanings: to allow (Laura lässt sich nicht gern fotografieren), to have something done (Ich lasse meine Haare schneiden), possibility with „sich lassen” (Das Problem lässt sich lösen = can be solved) and to leave something unchanged (Lass das! Sie lässt ihre Frisur so, wie sie ist). Perfekt: as a main verb → gelassen (Sie hat ihre Frisur so gelassen); with another infinitive → double infinitive (Sie hat sich die Haare schneiden lassen). 2) Futur II expresses an assumption about the past: werden + past participle + haben/sein: Er wird wohl zu viel trainiert haben. Sie wird gestern beim Arzt gewesen sein. Alternative: adverbs (wohl, vermutlich, wahrscheinlich) + Perfekt. 3) The verbs gehen, lernen, bleiben, sehen, hören take an infinitive without zu: Ich gehe joggen. Sie lernt tanzen. In the Perfekt, sehen and hören form a double infinitive: Ich habe ihn laufen sehen. 4) Nominalisation: the infinitive becomes a neuter noun and a preceding noun or adverb is attached: den Kopf schütteln → das Kopfschütteln, mit den Armen kreisen → das Armkreisen, rückwärts gehen → das Rückwärtsgehen."},

  tables:[{h:"Vermutung: Futur II oder Adverb",t:[["Futur II","Adverb + Perfekt"],["Da wird sich Ihr Leben ziemlich verändert haben.","Da hat sich Ihr Leben wohl ziemlich verändert."],["Ihre Freunde werden neidisch gewesen sein.","Ihre Freunde waren vermutlich neidisch."]]},{h:"Verbverbindungen ohne zu",t:[["Verb","Präsens","Perfekt"],["gehen","Sie gehen oft joggen.","Sie sind oft joggen gegangen."],["lernen","Viele lernen Salsa tanzen.","Viele haben Salsa tanzen gelernt."],["bleiben","Ich bleibe kurz stehen.","Ich bin kurz stehen geblieben."],["sehen","Er sieht sie trainieren.","Er hat sie trainieren sehen."],["hören","Ich höre ihn lachen.","Ich habe ihn lachen hören."]]},{h:"Nominalisierung von Verben",t:[["Verbindung","Nomen (immer das)"],["den Kopf schütteln","das Kopfschütteln"],["mit den Schultern zucken","das Schulterzucken"],["mit den Armen kreisen","das Armkreisen"],["vorwärts / rückwärts laufen","das Vorwärtslaufen / das Rückwärtslaufen"]]}],

 text:{title:"Echte Körper statt Photoshop",de:"Glatte Haut, perfekte Figur, keine einzige Falte: Jahrzehntelang zeigten Werbung und Modemagazine Körper, die es in Wirklichkeit kaum gibt. Fast jedes Foto wurde nachträglich bearbeitet. Psychologen warnen schon lange davor, dass diese Bilder vor allem bei jungen Frauen zu Unzufriedenheit und mangelndem Selbstbewusstsein führen. Doch inzwischen ist eine Gegenbewegung entstanden. Unter dem Motto „Body Positivity“ zeigen immer mehr Frauen – und auch Männer – in sozialen Netzwerken ihren Körper so, wie er ist: mit Dehnungsstreifen, Narben oder ein paar Kilos zu viel. Auch die Modebranche hat reagiert. Mehrere große Firmen lassen ihre Kollektionen inzwischen von ganz normalen Menschen präsentieren statt von professionellen Models. Eine bekannte Drogeriekette verzichtet seit einigen Jahren komplett auf die Bearbeitung ihrer Werbefotos. Eine der neuen Gesichter ist Miriam K., 41, Grundschullehrerin aus Köln. Sie hatte sich aus Spaß bei einem Casting beworben und wurde zu ihrer eigenen Überraschung ausgewählt. „Beim ersten Fotoshooting hätte ich fast kalte Füße bekommen“, erzählt sie lachend. „Ich habe gedacht: Was mache ich hier eigentlich?“ Doch das Team ließ ihr Zeit, sich an die Kamera zu gewöhnen. Eine Stylistin schminkte sie dezent, ihre Frisur blieb, wie sie war. Heute hängt ihr Foto auf Plakaten in ganz Deutschland. Ihre Schülerinnen und Schüler werden ziemlich gestaunt haben, als sie ihre Lehrerin plötzlich an der Bushaltestelle sahen. „Einige Mädchen haben mir gesagt, dass sie sich jetzt in ihrer Haut wohler fühlen. Das ist für mich das schönste Kompliment.“ Kritiker sehen den Trend allerdings skeptisch. Sie meinen, dass die Firmen nicht aus Überzeugung handeln, sondern nur, weil sich damit gut Geld verdienen lässt. Außerdem bleibe der Druck, gut auszusehen, bestehen – er werde nur anders verpackt. Expertinnen raten deshalb, nicht das Aussehen in den Mittelpunkt zu stellen, sondern das Körpergefühl: Wer sich regelmäßig bewegt, ausreichend schläft und seinem Körper mit Respekt begegnet, fühlt sich langfristig wohler – unabhängig davon, was die Werbung zeigt.",
  q:[["Früher wurden Werbefotos fast immer bearbeitet.",true],["Psychologen halten perfekte Werbebilder für ungefährlich.",false],["„Body Positivity“ zeigt Körper so, wie sie wirklich sind.",true],["Eine Drogeriekette bearbeitet ihre Werbefotos nicht mehr.",true],["Miriam ist von Beruf professionelles Model.",false],["Beim ersten Shooting hatte Miriam fast Angst.",true],["Für das Shooting wurde Miriams Frisur komplett verändert.",false],["Einige Mädchen fühlen sich durch Miriams Bild wohler in ihrer Haut.",true],["Kritiker glauben, dass die Firmen nur aus Überzeugung handeln.",false],["Expertinnen raten, das Körpergefühl wichtiger zu nehmen als das Aussehen.",true]]},

 write:{type:"Beschwerde",title:"Beschwerde an ein Fitnessstudio",
  situation:"Sie haben vor zwei Monaten im Fitnessstudio „BodyStar“ einen Jahresvertrag abgeschlossen. In der Werbung wurden moderne Geräte, täglich zehn Kurse und eine persönliche Betreuung versprochen. Die Realität sieht anders aus. Schreiben Sie eine Beschwerde an die Studioleitung.",
  points:["Grund Ihres Schreibens: wann und welchen Vertrag Sie abgeschlossen haben","was in der Werbung versprochen wurde und was nicht stimmt","wie Sie sich deshalb fühlen und welche Folgen das für Sie hat","was Sie erwarten (z. B. Erstattung, Sonderkündigung) – mit Frist"],
  words:"Schreiben Sie ca. 180 Wörter. Formeller Brief mit allen Bestandteilen.",
  tip:{ro:"La Beschwerde telc: rămâi politicos, dar ferm. Structură: motiv – problemă (concret, cu date) – consecințe – cerere clară cu termen (bis zum …). Fără exagerări și fără insulte.",ar:"في Beschwerde بتاعة telc: خليك مؤدب بس حازم. الترتيب: السبب – المشكلة (بتفاصيل وتواريخ) – النتايج – طلب واضح بميعاد (bis zum …). من غير مبالغة ولا شتيمة.",en:"For a telc complaint: stay polite but firm. Structure: reason – problem (concrete, with dates) – consequences – clear demand with a deadline (bis zum …). No exaggeration, no insults."},
  redemittel:[["Einleitung",["am 1. September habe ich in Ihrem Studio einen Jahresvertrag abgeschlossen.","Leider muss ich mich heute über … beschweren."]],["Problem schildern",["In Ihrer Werbung versprechen Sie …, tatsächlich aber …","Zu meinem großen Ärger musste ich feststellen, dass …","Hinzu kommt, dass …"]],["Folgen",["Das ist für mich besonders ärgerlich, weil …","Unter diesen Umständen kann ich nicht …"]],["Forderung",["Ich erwarte daher, dass Sie …","Ich bitte Sie, mir bis zum … mitzuteilen, …","Andernfalls sehe ich mich gezwungen, …","Mit freundlichen Grüßen"]]],
  model:"Andrei Popa\nCalea Victoriei 112\n010093 Bukarest\nRumänien\n\nBodyStar Fitness GmbH\nStudioleitung\nRosenheimer Straße 40\n81669 München\n\nBukarest, den 18. Oktober 2026\n\nBeschwerde über die Leistungen Ihres Studios – Mitgliedsnummer 20417\n\nSehr geehrte Damen und Herren,\n\nam 15. August habe ich in Ihrem Studio einen Jahresvertrag zu einem monatlichen Beitrag von 49 Euro abgeschlossen. Leider muss ich mich heute über Ihre Leistungen beschweren.\n\nIn Ihrer Werbung versprechen Sie moderne Geräte, täglich zehn Kurse und eine persönliche Betreuung. Tatsächlich aber sind seit Wochen drei Laufbänder defekt, und von den angekündigten Kursen finden höchstens vier pro Tag statt. Hinzu kommt, dass ich trotz mehrfacher Nachfrage noch keinen Trainingsplan bekommen habe, obwohl ein Beratungsgespräch im Preis enthalten ist.\n\nDas ist für mich besonders ärgerlich, weil ich wegen meiner Rückenprobleme gezielt trainieren muss. Unter diesen Umständen ist ein sinnvolles Training nicht möglich.\n\nIch erwarte daher, dass Sie mir für die vergangenen zwei Monate die Hälfte des Beitrags erstatten und die Mängel umgehend beheben. Bitte teilen Sie mir bis zum 31. Oktober mit, wie Sie das Problem lösen werden. Andernfalls sehe ich mich gezwungen, den Vertrag fristlos zu kündigen.\n\nMit freundlichen Grüßen\nAndrei Popa"}

 grammar:{title:"Bedeutungen des Konjunktiv II · Adjektive mit Präpositionen",
  expl:{ro:"1) Konjunktiv II exprimă condiții ireale, dorințe ireale și comparații ireale – la prezent și la trecut. Prezent: würde + infinitiv sau formele proprii (wäre, hätte, könnte, müsste, käme, wüsste, fände, gäbe). Trecut: wäre/hätte + participiu II. Condiție: Wenn Jana die App nicht verwenden würde, würde sie nicht alle Attraktionen sehen. / Wenn Jana die App nicht verwendet hätte, hätte sie nicht alles gesehen. Cu verb modal la trecut: dublu infinitiv – Wenn sie ihren Freund hätte anrufen können, hätte sie sich nicht verlaufen. Dorință (obligatoriu cu doch, doch nur, bloß sau nur): Könnte ich doch in Berlin wohnen! / Wäre ich bloß in Köln geblieben! Comparație ireală cu als ob / als: Es sieht so aus, als ob die Welle so hoch wie ein Haus wäre. / … als wäre die Welle so hoch … 2) Multe adjective au o prepoziție fixă: cu acuzativ – stolz auf, bekannt für, verliebt in, überrascht über, gewöhnt an, angewiesen auf; cu dativ – interessiert an, bekannt bei, zufrieden mit, verrückt nach, begeistert von, abhängig von, nett zu, typisch für (+Akk).",
   ar:"١) الـ Konjunktiv II بيعبّر عن شرط مش حقيقي، وأمنية مش حقيقية، ومقارنة مش حقيقية – في الحاضر والماضي. الحاضر: würde + المصدر أو الصيغ الخاصة (wäre، hätte، könnte، müsste، käme، wüsste، fände، gäbe). الماضي: wäre/hätte + Partizip II. شرط: Wenn Jana die App nicht verwenden würde, würde sie nicht alle Attraktionen sehen. / Wenn Jana die App nicht verwendet hätte, hätte sie nicht alles gesehen. ومع فعل مساعد في الماضي بنستخدم مصدرين: Wenn sie ihren Freund hätte anrufen können, hätte sie sich nicht verlaufen. أمنية (لازم معاها doch أو doch nur أو bloß أو nur): Könnte ich doch in Berlin wohnen! و Wäre ich bloß in Köln geblieben! مقارنة غير حقيقية بـ als ob أو als: Es sieht so aus, als ob die Welle so hoch wie ein Haus wäre. أو … als wäre die Welle so hoch … ٢) صفات كتير ليها حرف جر ثابت: مع أكوزاتيف – stolz auf، و bekannt für، و verliebt in، و überrascht über، و gewöhnt an، و angewiesen auf. ومع داتيف – interessiert an، و bekannt bei، و zufrieden mit، و verrückt nach، و begeistert von، و abhängig von، و nett zu، و typisch für (+Akk).",
   en:"1) Konjunktiv II expresses unreal conditions, unreal wishes and unreal comparisons – in the present and the past. Present: würde + infinitive or the special forms (wäre, hätte, könnte, müsste, käme, wüsste, fände, gäbe). Past: wäre/hätte + past participle. Condition: Wenn Jana die App nicht verwenden würde, würde sie nicht alle Attraktionen sehen. / Wenn Jana die App nicht verwendet hätte, hätte sie nicht alles gesehen. With a modal verb in the past: double infinitive – Wenn sie ihren Freund hätte anrufen können, hätte sie sich nicht verlaufen. Wish (doch, doch nur, bloß or nur is required): Könnte ich doch in Berlin wohnen! / Wäre ich bloß in Köln geblieben! Unreal comparison with als ob / als: Es sieht so aus, als ob die Welle so hoch wie ein Haus wäre. / … als wäre die Welle so hoch … 2) Many adjectives take a fixed preposition: with accusative – stolz auf, bekannt für, verliebt in, überrascht über, gewöhnt an, angewiesen auf; with dative – interessiert an, bekannt bei, zufrieden mit, verrückt nach, begeistert von, abhängig von, nett zu; typisch für (+acc)."},

 text:{title:"Leipzig – die Stadt, die sich neu erfunden hat",de:"Wer heute durch Leipzig spaziert, kann kaum glauben, dass viele Häuser hier vor dreißig Jahren noch leer standen. Nach der Wiedervereinigung verloren zehntausende Menschen ihre Arbeit und zogen in den Westen. Ganze Straßenzüge verfielen, die Stadt schrumpfte auf knapp 440.000 Einwohner. Heute dagegen gehört Leipzig zu den am schnellsten wachsenden Städten Deutschlands und hat wieder über 600.000 Einwohner. Was ist passiert? Ein wichtiger Grund waren die niedrigen Mieten. Künstler, Studenten und junge Familien entdeckten die leeren Altbauwohnungen und alten Fabrikhallen. Aus einer ehemaligen Baumwollspinnerei wurde ein Zentrum mit Ateliers, Galerien und Werkstätten, das inzwischen international bekannt für seine Kunstszene ist. Gleichzeitig investierte die Stadt kräftig in die Infrastruktur: Der Nahverkehr wurde ausgebaut, und die Altstadt erstrahlt in neuem Glanz. Besonders stolz sind die Leipziger auf ihre Seen. Wo früher Braunkohle abgebaut wurde, sind künstliche Seen entstanden, an denen man heute baden, segeln und surfen kann. „Wenn mir vor zwanzig Jahren jemand gesagt hätte, dass ich in Leipzig am Strand liegen würde, hätte ich ihn für verrückt gehalten“, sagt Petra Lindner, die seit ihrer Geburt hier lebt. Doch der Erfolg hat auch Schattenseiten. Weil immer mehr Menschen nach Leipzig ziehen, steigen die Mieten deutlich. In beliebten Stadtteilen wie Plagwitz oder Connewitz können sich viele alteingesessene Bewohner ihre Wohnungen kaum noch leisten. Kritiker sprechen bereits von Gentrifizierung und warnen davor, dass Leipzig seinen besonderen Charakter verlieren könnte. „Ich wünschte, die Stadt würde mehr bezahlbare Wohnungen bauen“, meint der Student Jonas. „Sonst wird Leipzig bald so teuer wie München.“ Trotz dieser Probleme sind die meisten Bewohner mit ihrer Stadt sehr zufrieden. In Umfragen zur Lebensqualität landet Leipzig regelmäßig auf den vorderen Plätzen. Besucher sind oft überrascht über die entspannte Atmosphäre, das große Kulturangebot – von der Oper bis zum Thomanerchor – und die vielen Grünflächen. Manche nennen Leipzig schon „das neue Berlin“. Die Leipziger selbst hören das nicht so gern: Sie finden, ihre Stadt sei einzigartig.",
  q:[["Nach der Wiedervereinigung verlor Leipzig viele Einwohner.",true],["Heute hat Leipzig weniger als 500.000 Einwohner.",false],["Niedrige Mieten zogen Künstler und Studenten an.",true],["Aus einer alten Fabrik wurde ein Kunstzentrum.",true],["Die Seen um Leipzig sind natürliche Seen.",false],["Petra Lindner hätte früher nicht geglaubt, in Leipzig am Strand zu liegen.",true],["In Plagwitz und Connewitz sinken die Mieten.",false],["Jonas wünscht sich mehr bezahlbare Wohnungen.",true],["Die meisten Bewohner sind mit ihrer Stadt unzufrieden.",false],["Die Leipziger hören gern, dass ihre Stadt „das neue Berlin“ sei.",false]]},

 write:{type:"Formeller Brief",title:"Vorschläge an die Stadtverwaltung",
  situation:"In Ihrer Stadt wurde vor Kurzem der einzige Jugendtreff geschlossen. Viele Jugendliche wissen nicht mehr, wo sie ihre Freizeit verbringen sollen. Die Stadtverwaltung bittet die Bürger um Vorschläge. Schreiben Sie einen Brief an das Amt für Jugend und Freizeit.",
  points:["sich vorstellen und den Grund Ihres Schreibens nennen","die aktuelle Situation beschreiben und kritisieren","konkrete Vorschläge machen (Konjunktiv II: Es wäre schön, wenn …)","um eine Antwort oder ein Gespräch bitten"],
  words:"Schreiben Sie ca. 180 Wörter.",
  tip:{ro:"Konjunktiv II face propunerile politicoase: Es wäre sinnvoll, wenn … / Man könnte … / Ich würde vorschlagen, … Combină-l cu adjective + prepoziție: Viele Eltern sind unzufrieden mit …",ar:"الـ Konjunktiv II بيخلّي الاقتراحات مؤدبة: Es wäre sinnvoll, wenn … و Man könnte … و Ich würde vorschlagen, … واستخدم معاه صفات + حرف جر: Viele Eltern sind unzufrieden mit …",en:"Konjunktiv II makes suggestions polite: Es wäre sinnvoll, wenn … / Man könnte … / Ich würde vorschlagen, … Combine it with adjective + preposition: Viele Eltern sind unzufrieden mit …"},

  model:"Ioana Marinescu\nGartenstraße 7\n04109 Leipzig\n\nStadt Leipzig\nAmt für Jugend und Freizeit\nNaumburger Straße 26\n04229 Leipzig\n\nLeipzig, den 18. Oktober 2026\n\nVorschläge für neue Freizeitangebote für Jugendliche\n\nSehr geehrte Damen und Herren,\n\nich wende mich an Sie, weil Sie die Bürger um Vorschläge für neue Freizeitangebote gebeten haben. Als Mutter von zwei Teenagern verfolge ich dieses Thema mit großem Interesse.\n\nSeit der Schließung des Jugendtreffs im Sommer haben die Jugendlichen in unserem Stadtteil keinen Ort mehr, an dem sie sich treffen können. Viele hängen abends an der Bushaltestelle herum oder sitzen nur noch zu Hause vor dem Bildschirm. Viele Eltern sind darüber sehr besorgt.\n\nEs wäre schön, wenn die Stadt einen neuen Treffpunkt einrichten würde, zum Beispiel in den leeren Räumen der alten Bibliothek. Man könnte dort Musik-, Sport- und Computerkurse anbieten. Außerdem würde ich vorschlagen, den Sportplatz im Park am Wochenende länger zu öffnen. Wäre es nicht auch möglich, die Jugendlichen selbst an der Planung zu beteiligen? Sie wissen am besten, was ihnen fehlt.\n\nIch würde mich freuen, wenn Sie meine Vorschläge berücksichtigen würden. Für ein persönliches Gespräch stehe ich gern zur Verfügung.\n\nMit freundlichen Grüßen\nIoana Marinescu"}

  expl:{ro:"1) Ca verbele și adjectivele, și unele substantive au o prepoziție fixă: das Bedürfnis nach (+D), die Vorstellung von (+D), die Erinnerung an (+A), das Verständnis für (+A), die Angst vor (+D), die Beziehung zu (+D). 2) Vorbirea indirectă redă ce a spus cineva, mai ales în presă și știri. Se folosește Konjunktiv I: radicalul verbului + -e, -est, -e, -en, -et, -en (er habe, sie komme, er wolle); sein are forme speciale (ich sei, du sei(e)st, er sei, wir seien). Când Konjunktiv I arată la fel ca indicativul (mai ales la plural: sie haben), folosim Konjunktiv II (sie hätten). Există un singur timp trecut: haben/sein la Konjunktiv I sau II + participiu II: Sie sagt, sie habe ihn verlassen. Er sagt, sie seien zurückgekommen. Atenție la pronume: Lucy sagt: „Jo ist meine Schwester.“ → Lucy sagt, Jo sei ihre Schwester. 3) Propozițiile relative generalizatoare cu wer, wen, wem formulează o afirmație general valabilă; propoziția principală începe cu un pronume demonstrativ (der, den, dem), care poate lipsi dacă are același caz: Wer sich nicht trennen will, (der) kann die Ehe verlängern. Wem das Eheleben nicht gefällt, der … 4) Propoziții comparative: je + comparativ (propoziție secundară, verbul la final), desto/umso + comparativ + verb: Je entspannter Sie miteinander umgehen, umso wohler fühlen Sie sich. Fără adjectiv folosim mehr: Je mehr Sie telefonieren, desto besser kennen Sie sich.",
   ar:"١) زي الأفعال والصفات، فيه أسماء ليها حرف جر ثابت: das Bedürfnis nach (+D)، و die Vorstellung von (+D)، و die Erinnerung an (+A)، و das Verständnis für (+A)، و die Angst vor (+D)، و die Beziehung zu (+D). ٢) الكلام غير المباشر بينقل اللي حد قاله، خصوصًا في الجرايد والأخبار. بنستخدم Konjunktiv I: جذر الفعل + ‎-e و ‎-est و ‎-e و ‎-en و ‎-et و ‎-en (er habe، sie komme، er wolle)، و sein ليه صيغ خاصة (ich sei، du sei(e)st، er sei، wir seien). ولما Konjunktiv I يبقى زي المضارع العادي (خصوصًا في الجمع: sie haben) بنستخدم Konjunktiv II (sie hätten). وفيه زمن ماضي واحد بس: haben/sein في Konjunktiv I أو II + Partizip II: Sie sagt, sie habe ihn verlassen. و Er sagt, sie seien zurückgekommen. خد بالك من الضماير: Lucy sagt: „Jo ist meine Schwester.“ → Lucy sagt, Jo sei ihre Schwester. ٣) جمل الصلة العامة بـ wer و wen و wem بتقول حاجة تنطبق على الكل، والجملة الرئيسية بتبدأ بضمير إشارة (der و den و dem)، وممكن يتشال لو نفس الحالة: Wer sich nicht trennen will, (der) kann die Ehe verlängern. و Wem das Eheleben nicht gefällt, der … ٤) جمل المقارنة: je + صيغة مقارنة (جملة فرعية والفعل في الآخر)، و desto/umso + صيغة مقارنة + الفعل: Je entspannter Sie miteinander umgehen, umso wohler fühlen Sie sich. ومن غير صفة بنستخدم mehr: Je mehr Sie telefonieren, desto besser kennen Sie sich.",
   en:"1) Like verbs and adjectives, some nouns have a fixed preposition: das Bedürfnis nach (+D), die Vorstellung von (+D), die Erinnerung an (+A), das Verständnis für (+A), die Angst vor (+D), die Beziehung zu (+D). 2) Reported speech renders what someone said, especially in the press and news. It uses Konjunktiv I: verb stem + -e, -est, -e, -en, -et, -en (er habe, sie komme, er wolle); sein has special forms (ich sei, du sei(e)st, er sei, wir seien). When Konjunktiv I looks like the indicative (especially in the plural: sie haben), use Konjunktiv II (sie hätten). There is only one past tense: haben/sein in Konjunktiv I or II + past participle: Sie sagt, sie habe ihn verlassen. Er sagt, sie seien zurückgekommen. Watch the pronouns: Lucy sagt: „Jo ist meine Schwester.“ → Lucy sagt, Jo sei ihre Schwester. 3) Generalising relative clauses with wer, wen, wem make a generally valid statement; the main clause starts with a demonstrative pronoun (der, den, dem), which can be dropped if it has the same case: Wer sich nicht trennen will, (der) kann die Ehe verlängern. Wem das Eheleben nicht gefällt, der … 4) Comparative clauses: je + comparative (subordinate clause, verb at the end), desto/umso + comparative + verb: Je entspannter Sie miteinander umgehen, umso wohler fühlen Sie sich. Without an adjective use mehr: Je mehr Sie telefonieren, desto besser kennen Sie sich."},

 text:{title:"Liebe auf Distanz",de:"Montagmorgen, 5:30 Uhr, Hauptbahnhof Köln: Auf Gleis 4 verabschieden sich zahlreiche Paare. Für sie beginnt eine neue Woche ohne den Partner. Experten schätzen, dass in Deutschland etwa jedes achte Paar eine Fernbeziehung führt – Tendenz steigend. Der Grund ist meist der Beruf: Immer mehr Menschen ziehen für eine Stelle in eine andere Stadt oder sogar ins Ausland, während der Partner aus familiären oder beruflichen Gründen nicht mitkommen kann. Lange galten Fernbeziehungen als wenig stabil. „Aus den Augen, aus dem Sinn“, sagt ein altes Sprichwort. Doch neuere Studien zeigen ein anderes Bild. Eine Untersuchung der Universität Mainz kommt zu dem Ergebnis, dass Paare in Fernbeziehungen nicht häufiger getrennt seien als Paare, die zusammenleben. Im Gegenteil: Viele Befragte gaben an, sie würden intensiver miteinander kommunizieren und die gemeinsame Zeit bewusster genießen. Die Psychologin Dr. Anne Weiß erklärt das so: „Wer seinen Partner nur am Wochenende sieht, streitet seltener über alltägliche Dinge wie den Abwasch oder den Müll.“ Je seltener man sich sehe, desto größer sei allerdings die Gefahr, dass man sich ein idealisiertes Bild vom Partner mache. Problematisch werde es oft erst dann, wenn das Paar wieder zusammenziehe und der Alltag plötzlich zurückkomme. Auch die Kosten sind nicht zu unterschätzen. Viele Paare geben monatlich mehrere Hundert Euro für Zugtickets oder Flüge aus. Hinzu kommen Erschöpfung durch lange Reisen und die Sehnsucht nach dem Partner, die besonders an Feiertagen oder bei Krankheit groß ist. Sarah und Mihai, beide 32, leben seit drei Jahren zwischen Hamburg und Bukarest. „Am Anfang haben wir jeden Abend stundenlang telefoniert“, erzählt Sarah. „Heute haben wir feste Rituale: Sonntags kochen wir per Videoanruf zusammen das gleiche Gericht.“ Für die beiden ist klar, dass die Distanz kein Dauerzustand sein soll. Nächstes Jahr will Mihai nach Hamburg ziehen. Sein Tipp für andere Paare: „Redet offen über eure Bedürfnisse und plant ein gemeinsames Ziel. Wer weiß, wann die Entfernung endet, der hält sie viel leichter aus.“",
  q:[["Etwa jedes achte Paar in Deutschland führt eine Fernbeziehung.",true],["Der häufigste Grund für Fernbeziehungen ist das Studium.",false],["Laut der Studie trennen sich Paare in Fernbeziehungen häufiger.",false],["Viele Befragte sagen, sie würden intensiver kommunizieren.",true],["Laut Dr. Weiß streiten Fernbeziehungs-Paare seltener über Alltagsdinge.",true],["Je seltener man sich sieht, desto realistischer wird das Bild vom Partner.",false],["Fernbeziehungen können teuer sein.",true],["Sarah und Mihai leben zwischen Hamburg und Bukarest.",true],["Sonntags gehen Sarah und Mihai zusammen essen.",false],["Mihai rät, ein gemeinsames Ziel zu planen.",true]]},

 discuss:[["Kann eine Fernbeziehung auf Dauer funktionieren?","Aus meiner Sicht hängt das in erster Linie davon ab, …"],["Ist die Ehe heute noch zeitgemäß?","Ich bin fest davon überzeugt, dass …"],["Welche Herausforderungen haben bikulturelle Paare?","Eine der größten Herausforderungen besteht meiner Meinung nach darin, …"],["Was halten Sie von einer „Ehe auf Zeit“?","Auf den ersten Blick klingt das …, aber bei näherer Betrachtung …"]],
 write:{type:"Leserbrief",title:"Leserbrief zum Thema Fernbeziehungen",
  situation:"In der Zeitschrift „Leben heute“ ist ein Artikel mit dem Titel „Fernbeziehungen haben keine Zukunft“ erschienen. Darin behauptet der Autor, Liebe auf Distanz scheitere fast immer. Schreiben Sie einen Leserbrief an die Redaktion.",
  points:["sich auf den Artikel beziehen (Titel, Datum, Hauptaussage)","die Hauptaussage des Autors in indirekter Rede wiedergeben","eigene Erfahrungen oder Beispiele nennen und Gegenargumente bringen","ein Fazit ziehen und Ihre Meinung zusammenfassen"],
  words:"Schreiben Sie ca. 180 Wörter.",
  tip:{ro:"Leserbrief: începe cu referința la articol (In Ihrem Artikel vom … schreiben Sie, …). Redă opinia autorului în vorbire indirectă (Der Autor behauptet, Fernbeziehungen seien …) – asta impresionează la B2!",ar:"رسالة القارئ: ابدأ بالإشارة للمقال (In Ihrem Artikel vom … schreiben Sie, …). وانقل رأي الكاتب بالكلام غير المباشر (Der Autor behauptet, Fernbeziehungen seien …) – دي بتعمل انطباع قوي في B2!",en:"Letter to the editor: start by referring to the article (In Ihrem Artikel vom … schreiben Sie, …). Report the author's view in indirect speech (Der Autor behauptet, Fernbeziehungen seien …) – that impresses at B2!"},
  redemittel:[["Bezug auf den Artikel",["mit großem Interesse habe ich Ihren Artikel „…“ vom … gelesen.","In Ihrem Artikel vertreten Sie die Meinung, …","Der Autor behauptet, Fernbeziehungen seien …"]],["Widerspruch",["Dieser Meinung kann ich nur teilweise zustimmen.","Aus eigener Erfahrung weiß ich, dass …","Dagegen spricht, dass …"]],["Beispiele",["Ein gutes Beispiel dafür ist …","Wer selbst eine Fernbeziehung geführt hat, der weiß …"]],["Fazit",["Zusammenfassend lässt sich sagen, dass …","Je …, desto …","Mit freundlichen Grüßen"]]],
  model:"Sehr geehrte Damen und Herren,\n\nmit großem Interesse habe ich Ihren Artikel „Fernbeziehungen haben keine Zukunft“ vom 10. Oktober gelesen. Der Autor behauptet darin, Liebe auf Distanz scheitere fast immer, weil die Partner sich mit der Zeit auseinanderleben würden. Dieser Meinung kann ich nur teilweise zustimmen.\n\nNatürlich ist eine Fernbeziehung nicht einfach. Die Sehnsucht nach dem Partner, die hohen Reisekosten und die fehlende Zweisamkeit im Alltag sind echte Probleme. Aus eigener Erfahrung weiß ich jedoch, dass eine Beziehung trotzdem funktionieren kann. Mein Mann und ich haben vier Jahre zwischen Cluj und Stuttgart gelebt. Gerade weil wir uns selten gesehen haben, haben wir sehr offen über unsere Bedürfnisse gesprochen.\n\nDagegen spricht außerdem, dass neuere Studien zu einem ganz anderen Ergebnis kommen. Demnach trennen sich Paare in Fernbeziehungen nicht häufiger als andere. Wer ein gemeinsames Ziel hat, der hält die Entfernung viel leichter aus.\n\nZusammenfassend lässt sich sagen: Je klarer die Partner ihre Zukunft planen, desto größer sind ihre Chancen. Ein so pauschales Urteil wie in Ihrem Artikel finde ich deshalb unfair.\n\nMit freundlichen Grüßen\nCristina Weber, Stuttgart"}
},

 grammar:{title:"Subjektive Bedeutung von sollen · Nominalisierung von Verben · Konditionale Zusammenhänge · Konzessive Zusammenhänge",
  expl:{ro:"1) „sollen” cu sens subiectiv arată că redăm ceva auzit sau citit, fără să garantăm că e adevărat (se spune că …): Jeder Deutsche soll 52 kg Fleisch im Jahr essen (= Laut einer Studie isst …). La trecut: sollen + infinitiv perfect: 42 Millionen Menschen sollen diesen Ernährungsstil übernommen haben. 2) Din verbe se formează substantive în mai multe feluri: cu -er (der Erzeuger, masculin), din radical (der Anbau), cu prefixul Ge- (der Geschmack, das Getränk), din infinitiv (das Essen, neutru), cu -e (die Ernte) și cu -ung (die Zubereitung, feminin). 3) Condiția: verbal cu wenn, falls, sofern (în măsura în care) sau nominal cu bei + dativ (tipic scris): Wenn man reklamiert, … → Bei einer Reklamation …; Sofern Sie interessiert sind, … → Bei Interesse … 4) Concesia (contrastul neașteptat): verbal cu obwohl, selbst/auch wenn (chiar dacă), trotzdem/dennoch (totuși, în propoziție principală); nominal cu trotz + genitiv sau selbst/auch bei + dativ: Obwohl die Qualität gleich ist, … → Trotz gleicher Qualität …; Selbst wenn das Obst nur kleine Makel hat, … → Selbst bei kleinen Makeln …",
   ar:"١) «sollen» بمعنى ذاتي بتوضّح إننا بننقل حاجة سمعناها أو قريناها من غير ما نضمن إنها صح (بيقولوا إن …): Jeder Deutsche soll 52 kg Fleisch im Jahr essen (= Laut einer Studie isst …). وفي الماضي: sollen + مصدر الماضي: 42 Millionen Menschen sollen diesen Ernährungsstil übernommen haben. ٢) من الأفعال بنعمل أسماء بكذا طريقة: بـ ‎-er (der Erzeuger، مذكر)، ومن الجذر (der Anbau)، وبالبادئة Ge- (der Geschmack و das Getränk)، ومن المصدر (das Essen، محايد)، وبـ ‎-e (die Ernte)، وبـ ‎-ung (die Zubereitung، مؤنث). ٣) الشرط: بالفعل مع wenn و falls و sofern (بشرط إن)، أو بالاسم مع bei + Dativ (أسلوب الكتابة): Wenn man reklamiert, … → Bei einer Reklamation …، و Sofern Sie interessiert sind, … → Bei Interesse … ٤) الاستدراك (تناقض غير متوقع): بالفعل مع obwohl، و selbst/auch wenn (حتى لو)، و trotzdem/dennoch (ومع ذلك، في جملة رئيسية)، وبالاسم مع trotz + Genitiv أو selbst/auch bei + Dativ: Obwohl die Qualität gleich ist, … → Trotz gleicher Qualität …، و Selbst wenn das Obst nur kleine Makel hat, … → Selbst bei kleinen Makeln …",
   en:"1) „sollen” in its subjective meaning shows that we report something heard or read without guaranteeing it (it is said that …): Jeder Deutsche soll 52 kg Fleisch im Jahr essen (= Laut einer Studie isst …). Past: sollen + perfect infinitive: 42 Millionen Menschen sollen diesen Ernährungsstil übernommen haben. 2) Nouns are formed from verbs in several ways: with -er (der Erzeuger, masculine), from the stem (der Anbau), with the prefix Ge- (der Geschmack, das Getränk), from the infinitive (das Essen, neuter), with -e (die Ernte) and with -ung (die Zubereitung, feminine). 3) Condition: verbal with wenn, falls, sofern (provided that) or nominal with bei + dative (typical of writing): Wenn man reklamiert, … → Bei einer Reklamation …; Sofern Sie interessiert sind, … → Bei Interesse … 4) Concession (unexpected contrast): verbal with obwohl, selbst/auch wenn (even if), trotzdem/dennoch (nevertheless, in a main clause); nominal with trotz + genitive or selbst/auch bei + dative: Obwohl die Qualität gleich ist, … → Trotz gleicher Qualität …; Selbst wenn das Obst nur kleine Makel hat, … → Selbst bei kleinen Makeln …"},

 text:{title:"Zu gut für die Tonne",de:"Ein Joghurt, dessen Datum gestern abgelaufen ist. Ein Brot vom Vortag. Äpfel mit kleinen braunen Flecken. In vielen deutschen Haushalten landen solche Lebensmittel ohne zu zögern im Müll. Nach Angaben des Bundesernährungsministeriums soll jeder Verbraucher pro Jahr rund 78 Kilogramm Lebensmittel wegwerfen. Insgesamt kommen in Deutschland so jedes Jahr über elf Millionen Tonnen Lebensmittelabfälle zusammen – vom Feld über den Handel bis zum Kühlschrank. Experten zufolge wäre etwa die Hälfte davon vermeidbar. Ein Hauptgrund für die Verschwendung ist ein weit verbreitetes Missverständnis: Viele Verbraucher verwechseln das Mindesthaltbarkeitsdatum mit einem Verfallsdatum. Dabei garantiert der Hersteller nur, dass das Produkt bis zu diesem Tag seine typischen Eigenschaften wie Geschmack und Farbe behält. Selbst wenn das Datum überschritten ist, sind die meisten Lebensmittel noch problemlos essbar. Die Verbraucherzentrale rät deshalb: „Schauen, riechen, probieren!“ Nur bei leicht verderblichen Produkten wie Hackfleisch oder rohem Fisch gilt ein festes Verbrauchsdatum, das man ernst nehmen sollte. Aber auch der Handel trägt Verantwortung. Obst und Gemüse, das nicht der Norm entspricht – etwa zu kleine Kartoffeln oder krumme Gurken –, schafft es oft gar nicht erst in den Supermarkt. Trotz einwandfreier Qualität wird es aussortiert. Inzwischen gibt es Gegenbewegungen: Einige Supermarktketten verkaufen sogenanntes „Wunder-Gemüse“ mit Makeln zu günstigeren Preisen. Apps vermitteln Restaurants und Bäckereien, die übrig gebliebene Speisen am Abend zu reduzierten Preisen abgeben. Und die Tafeln sammeln Lebensmittel, die nicht mehr verkauft werden können, und verteilen sie an Menschen mit wenig Geld. Rund zwei Millionen Menschen sollen dieses Angebot regelmäßig nutzen. Was kann jeder Einzelne tun? Fachleute empfehlen, Einkäufe zu planen, Reste kreativ zu verwerten und Lebensmittel richtig zu lagern. Wer sich zum Beispiel vor dem Einkauf einen Wochenplan macht, kauft weniger spontan und spart dabei nebenbei viel Geld. Denn eines ist sicher: Jedes weggeworfene Lebensmittel hat Wasser, Energie und Arbeit gekostet – und das umsonst.",
  q:[["Jeder Verbraucher soll pro Jahr rund 78 Kilo Lebensmittel wegwerfen.",true],["Laut Experten wären fast alle Lebensmittelabfälle unvermeidbar.",false],["Viele verwechseln das Mindesthaltbarkeitsdatum mit einem Verfallsdatum.",true],["Nach dem Mindesthaltbarkeitsdatum sind Lebensmittel immer gefährlich.",false],["Bei Hackfleisch sollte man das Verbrauchsdatum ernst nehmen.",true],["Krumme Gurken werden trotz guter Qualität oft aussortiert.",true],["Kein Supermarkt verkauft Gemüse mit Makeln.",false],["Über Apps kann man abends übrig gebliebene Speisen günstiger kaufen.",true],["Die Tafeln verkaufen Lebensmittel zu normalen Preisen.",false],["Ein Wochenplan hilft, weniger spontan einzukaufen.",true]]},

 write:{type:"Beschwerde",title:"Beschwerde über einen Kochkurs",
  situation:"Sie haben bei der Kochschule „Genuss & Co.“ einen vierstündigen Kurs „Italienische Küche für Anfänger“ für 89 Euro gebucht. Laut Anzeige: maximal 8 Teilnehmer, frische Bio-Zutaten, ein Profikoch aus Italien und ein Menü mit Getränken. Leider war vieles anders. Schreiben Sie eine Beschwerde.",
  points:["Grund Ihres Schreibens: welchen Kurs, wann, zu welchem Preis","was in der Anzeige stand und was tatsächlich passiert ist","warum Sie besonders enttäuscht sind","was Sie erwarten – mit Frist"],
  words:"Schreiben Sie ca. 180 Wörter.",
  tip:{ro:"Folosește gramatica lecției: Laut Ihrer Anzeige sollte … (ce s-a promis), Trotz der hohen Teilnahmegebühr … (concesie), Bei einer Erstattung wäre ich bereit … (condiție). Exact aceste structuri dau „Strukturen“ maxime la telc.",ar:"استخدم جرامر الدرس: Laut Ihrer Anzeige sollte … (اللي اتوعدنا بيه)، و Trotz der hohen Teilnahmegebühr … (استدراك)، و Bei einer Erstattung wäre ich bereit … (شرط). التراكيب دي بالظبط بتجيب أعلى درجة في «Strukturen» في telc.",en:"Use the lesson's grammar: Laut Ihrer Anzeige sollte … (what was promised), Trotz der hohen Teilnahmegebühr … (concession), Bei einer Erstattung wäre ich bereit … (condition). Exactly these structures earn top marks for structures in telc."},
  redemittel:[["Einleitung",["am … habe ich an Ihrem Kurs „…“ teilgenommen.","Leider war ich mit dem Kurs in mehreren Punkten sehr unzufrieden."]],["Problem schildern",["Laut Ihrer Anzeige sollten höchstens … Personen teilnehmen, tatsächlich waren es …","Statt eines Profikochs …","Trotz der hohen Teilnahmegebühr …"]],["Enttäuschung",["Besonders enttäuscht war ich darüber, dass …","Ich hatte mich sehr auf … gefreut."]],["Forderung",["Ich fordere Sie daher auf, mir … zu erstatten.","Bei einer Erstattung von … wäre ich bereit, …","Ich erwarte Ihre Antwort bis zum …","Mit freundlichen Grüßen"]]],
  model:"Mihaela Stan\nBulevardul Unirii 48\n030167 Bukarest\nRumänien\n\nKochschule Genuss & Co.\nHerrn Markus Lenz\nSchillerstraße 12\n60313 Frankfurt am Main\n\nBukarest, den 18. Oktober 2026\n\nBeschwerde über den Kurs „Italienische Küche für Anfänger“ am 11. Oktober\n\nSehr geehrter Herr Lenz,\n\nam 11. Oktober habe ich an Ihrem Kurs „Italienische Küche für Anfänger“ teilgenommen, für den ich 89 Euro bezahlt habe. Leider war ich mit dem Kurs in mehreren Punkten sehr unzufrieden.\n\nLaut Ihrer Anzeige sollten höchstens acht Personen teilnehmen, tatsächlich waren wir aber vierzehn. Deshalb konnte ich kaum selbst kochen, sondern habe meistens nur zugeschaut. Statt eines Profikochs aus Italien leitete ein Student den Kurs, der viele Fragen nicht beantworten konnte. Außerdem waren die Zutaten keineswegs frisch: Die Tomaten kamen aus der Dose, und von Bio-Qualität war nichts zu sehen. Trotz der hohen Teilnahmegebühr gab es zum Essen nur Leitungswasser.\n\nBesonders enttäuscht war ich darüber, dass ich den Kurs als Geburtstagsgeschenk für meine Schwester gebucht hatte.\n\nIch fordere Sie daher auf, uns mindestens die Hälfte der Kursgebühr zu erstatten. Alternativ wäre ich bereit, an einem anderen Kurs teilzunehmen, sofern die versprochenen Bedingungen dann eingehalten werden. Bitte antworten Sie mir bis zum 31. Oktober.\n\nMit freundlichen Grüßen\nMihaela Stan"}
}
]);

 grammar:{title:"Konsekutive Zusammenhänge · Feste Verbindungen von Nomen mit Verben · Negation durch Vor- und Nachsilben",
  expl:{ro:"1) Consecința (ce urmează dintr-o situație) se exprimă verbal sau nominal. Verbal: sodass (astfel încât): Sophie hat ihren Bachelor fast abgeschlossen, sodass sie jetzt Zeit für ein Auslandssemester hat; so / derartig + adjectiv …, dass (atât de … încât): Ihr Interesse ist so groß, dass sie in einer Großstadt studieren möchte; folglich / infolgedessen (în consecință – în propoziție principală, verbul urmează imediat). Nominal, tipic scris: infolge + genitiv: Infolge ihres Bachelorabschlusses hat Sophie jetzt Zeit. 2) Construcțiile substantiv + verb (Nomen-Verb-Verbindungen) sunt foarte frecvente în limba scrisă și formală; în vorbire se folosește adesea doar verbul: eine Entscheidung treffen = entscheiden, eine Frage stellen = fragen, Verantwortung übernehmen = verantworten, über Kenntnisse verfügen = wissen, einen Vortrag halten = vortragen, infrage kommen. Unele substantive merg cu mai multe verbe: einen Eindruck bekommen/haben/hinterlassen/gewinnen. 3) Negarea adjectivelor prin prefixe: a- (asozial), des- (desillusioniert), ir- (irrelevant), miss- (missverständlich), non- (nonverbal), un- (uninteressant) și prin sufixul -los (anspruchslos). Atenție: -los înseamnă „fără”, opusul este adesea -voll (anspruchslos – anspruchsvoll).",
   ar:"١) النتيجة (اللي بيترتّب على موقف) بنعبّر عنها بالفعل أو بالاسم. بالفعل: sodass (لدرجة إن / بحيث): Sophie hat ihren Bachelor fast abgeschlossen, sodass sie jetzt Zeit für ein Auslandssemester hat، و so / derartig + صفة …, dass (لدرجة إن): Ihr Interesse ist so groß, dass sie in einer Großstadt studieren möchte، و folglich / infolgedessen (وبالتالي – في جملة رئيسية والفعل بعدها على طول). وبالاسم (أسلوب الكتابة): infolge + Genitiv: Infolge ihres Bachelorabschlusses hat Sophie jetzt Zeit. ٢) تراكيب الاسم + الفعل (Nomen-Verb-Verbindungen) كتيرة جدًا في اللغة المكتوبة والرسمية، وفي الكلام بنستخدم الفعل لوحده: eine Entscheidung treffen = entscheiden، و eine Frage stellen = fragen، و Verantwortung übernehmen = verantworten، و über Kenntnisse verfügen = wissen، و einen Vortrag halten = vortragen، و infrage kommen. وفيه أسماء بتمشي مع كذا فعل: einen Eindruck bekommen/haben/hinterlassen/gewinnen. ٣) نفي الصفات بالبادئات: a- (asozial)، و des- (desillusioniert)، و ir- (irrelevant)، و miss- (missverständlich)، و non- (nonverbal)، و un- (uninteressant)، وبالنهاية ‎-los (anspruchslos). خد بالك: ‎-los معناها «من غير»، والعكس غالبًا ‎-voll (anspruchslos – anspruchsvoll).",
   en:"1) Consequence (what follows from a situation) can be expressed verbally or nominally. Verbally: sodass (so that): Sophie hat ihren Bachelor fast abgeschlossen, sodass sie jetzt Zeit für ein Auslandssemester hat; so / derartig + adjective …, dass (so … that): Ihr Interesse ist so groß, dass sie in einer Großstadt studieren möchte; folglich / infolgedessen (consequently – in a main clause, verb right after). Nominally, typical of writing: infolge + genitive: Infolge ihres Bachelorabschlusses hat Sophie jetzt Zeit. 2) Noun-verb combinations are very common in written and formal German; in speech we often use just the verb: eine Entscheidung treffen = entscheiden, eine Frage stellen = fragen, Verantwortung übernehmen = verantworten, über Kenntnisse verfügen = wissen, einen Vortrag halten = vortragen, infrage kommen. Some nouns go with several verbs: einen Eindruck bekommen/haben/hinterlassen/gewinnen. 3) Negating adjectives with prefixes: a- (asozial), des- (desillusioniert), ir- (irrelevant), miss- (missverständlich), non- (nonverbal), un- (uninteressant) and with the suffix -los (anspruchslos). Note: -los means „without”; its opposite is often -voll (anspruchslos – anspruchsvoll)."},

  tables:[{h:"Ein Nomen – mehrere Verben",t:[["Nomen","Verben"],["einen Eindruck","bekommen, haben, hinterlassen, gewinnen"],["eine Entscheidung","treffen, fällen"],["infrage","stellen, kommen"],["Kenntnisse","vertiefen, erweitern"],["(die) Verantwortung","haben, tragen, ablehnen, übernehmen"]]},{h:"Negation durch Vor- und Nachsilben",t:[["Vorsilbe / Nachsilbe","Beispiel"],["a-","asozial, atypisch"],["des-","desillusioniert, desinteressiert"],["ir-","irrelevant, irregulär"],["miss-","missverständlich, missglückt"],["non-","nonverbal"],["un-","uninteressant, unabhängig"],["-los","anspruchslos (↔ anspruchsvoll)"]]}],

 text:{title:"Was kostet ein Studium in Deutschland?",de:"Deutschland gilt als eines der attraktivsten Länder für ein Studium. Über 400.000 internationale Studierende sind derzeit an deutschen Hochschulen eingeschrieben – so viele wie nie zuvor. Einer der wichtigsten Gründe: An den meisten staatlichen Universitäten gibt es keine Studiengebühren. Pro Semester zahlt man lediglich einen Semesterbeitrag zwischen 150 und 400 Euro, der oft sogar ein Ticket für den öffentlichen Nahverkehr enthält. Doch „gebührenfrei“ heißt nicht „kostenlos“. Wer in Deutschland studiert, muss seinen Lebensunterhalt selbst finanzieren – und der ist in vielen Universitätsstädten teuer geworden. Laut einer aktuellen Erhebung geben Studierende durchschnittlich rund 1.100 Euro im Monat aus. Den größten Posten macht die Miete aus: In München oder Frankfurt kostet schon ein WG-Zimmer häufig über 700 Euro. Infolgedessen ziehen viele in günstigere Städte wie Leipzig, Chemnitz oder Magdeburg. Ein Platz im Studentenwohnheim ist deutlich billiger, aber die Wartelisten sind so lang, dass man sich schon Monate vor Studienbeginn bewerben sollte. Wie finanzieren Studierende ihr Leben? Etwa zwei Drittel haben einen Nebenjob, zum Beispiel als Kellner, Nachhilfelehrer oder studentische Hilfskraft an der Uni. Viele erhalten außerdem Unterstützung von ihren Eltern. Wer aus einer Familie mit geringem Einkommen kommt, kann BAföG beantragen, eine staatliche Förderung, von der die Hälfte später zurückgezahlt werden muss. Für besonders gute oder engagierte Studierende gibt es zudem Stipendien – etwa vom Deutschen Akademischen Austauschdienst. Doch viele wissen gar nicht, dass sie infrage kommen, und stellen deshalb nie einen Antrag. Experten raten, sich frühzeitig zu informieren. Besonders internationale Studierende sollten bedenken, dass sie für das Visum einen Finanzierungsnachweis von über 11.000 Euro pro Jahr vorlegen müssen. Elif, 24, aus der Türkei studiert Maschinenbau in Aachen: „Am Anfang war alles so teuer, dass ich fast aufgegeben hätte. Dann habe ich einen Job in der Unibibliothek gefunden und später ein Stipendium bekommen. Heute kann ich mich endlich auf das Studium konzentrieren.“ Ihr Tipp: „Habt keine Angst, Fragen zu stellen. Die Beratungsstellen an der Uni sind wirklich hilfreich.“",

 write:{type:"Motivationsschreiben",title:"Bewerbung um einen Studienplatz mit Stipendium",
  situation:"Sie möchten an der Universität Heidelberg den Masterstudiengang „Internationales Management“ studieren und bewerben sich gleichzeitig um ein Stipendium der Hochschule. Schreiben Sie ein Motivationsschreiben an die Auswahlkommission.",
  points:["Ihre bisherige Ausbildung und Ihre Kenntnisse beschreiben","begründen, warum Sie sich für diesen Studiengang und diese Universität entschieden haben","erklären, welche Ziele Sie nach dem Studium haben","begründen, warum Sie das Stipendium benötigen und verdienen"],
  words:"Schreiben Sie ca. 200 Wörter.",
  tip:{ro:"Scrisoarea de motivație este ideală pentru Nomen-Verb-Verbindungen: über Kenntnisse verfügen, Verantwortung übernehmen, einen Eindruck gewinnen, eine Entscheidung treffen. Fii concret (exemple, cifre), nu doar „sunt motivat”.",ar:"خطاب الدوافع أحسن مكان لتراكيب الاسم + الفعل: über Kenntnisse verfügen و Verantwortung übernehmen و einen Eindruck gewinnen و eine Entscheidung treffen. خليك محدد (أمثلة وأرقام)، مش بس «أنا متحمّس».",en:"A motivation letter is perfect for noun-verb combinations: über Kenntnisse verfügen, Verantwortung übernehmen, einen Eindruck gewinnen, eine Entscheidung treffen. Be concrete (examples, numbers), not just „I am motivated”."},
  redemittel:[["Einleitung",["hiermit bewerbe ich mich um einen Studienplatz im Masterstudiengang …","Mit großem Interesse habe ich mich über Ihr Programm informiert."]],["Qualifikation",["Im Juli habe ich mein Bachelorstudium der … erfolgreich abgeschlossen.","Ich verfüge über sehr gute Kenntnisse in …","Während meines Praktikums habe ich Verantwortung für … übernommen."]],["Motivation und Ziele",["Ich habe mich für Ihre Universität entschieden, weil …","Besonders reizt mich …","Nach dem Studium möchte ich …"]],["Stipendium und Schluss",["Da meine Familie mich finanziell nur begrenzt unterstützen kann, …","Über eine Einladung zu einem persönlichen Gespräch würde ich mich sehr freuen.","Mit freundlichen Grüßen"]]],
  model:"Radu Petrescu\nStrada Lalelelor 9\n400165 Cluj-Napoca\nRumänien\n\nUniversität Heidelberg\nAuswahlkommission Master Internationales Management\nGrabengasse 1\n69117 Heidelberg\n\nCluj-Napoca, den 18. Oktober 2026\n\nBewerbung um einen Studienplatz und ein Stipendium\n\nSehr geehrte Damen und Herren,\n\nhiermit bewerbe ich mich um einen Studienplatz im Masterstudiengang „Internationales Management“ sowie um ein Stipendium Ihrer Hochschule.\n\nIm Juli habe ich mein Bachelorstudium der Wirtschaftswissenschaften an der Babeș-Bolyai-Universität mit der Note 9,4 abgeschlossen. Neben Rumänisch verfüge ich über sehr gute Englisch- und Deutschkenntnisse (Niveau C1 bzw. B2). Während eines sechsmonatigen Praktikums bei einem deutschen Automobilzulieferer habe ich Verantwortung für ein kleines Projektteam übernommen und viel über internationale Zusammenarbeit gelernt.\n\nIch habe mich für Ihre Universität entschieden, weil Ihr Programm Theorie und Praxis ideal verbindet. Besonders reizt mich die Möglichkeit, ein Semester an einer Partneruniversität in Asien zu verbringen. Nach dem Studium möchte ich in einem international tätigen Unternehmen arbeiten und langfristig die wirtschaftlichen Beziehungen zwischen Deutschland und Rumänien stärken.\n\nDa meine Eltern mich finanziell nur begrenzt unterstützen können, wäre ein Stipendium für mich eine große Hilfe. So könnte ich mich voll auf das Studium konzentrieren, statt nebenbei viele Stunden arbeiten zu müssen.\n\nÜber eine Einladung zu einem persönlichen Gespräch würde ich mich sehr freuen.\n\nMit freundlichen Grüßen\nRadu Petrescu"}

 grammar:{title:"Alternativen zum Passiv · Subjektlose Passivsätze",
  expl:{ro:"1) Pasivul cu verbe modale (können, müssen, sollen, dürfen) poate fi înlocuit cu structuri active, mai elegante: a) Adjective în -bar și uneori -lich = „poate fi …”: ein realisierbares Projekt (= care poate fi realizat), lieferbare Ware, ein verständlicher Text. Negația se face cu un-: ein unerreichbares Ziel, ein unersetzlicher Mensch, unverkäufliche Muster. b) sich lassen + infinitiv = poate fi: Ein Menü lässt sich für 10 Euro machen (= kann gemacht werden). c) sein + zu + infinitiv = trebuie / poate fi: Die Rechnung ist noch zu bezahlen (= muss bezahlt werden). Das Restaurant ist nicht zu verkaufen (= kann/darf nicht verkauft werden). 2) Pasivul fără subiect: complementul în acuzativ din propoziția activă devine subiect (nominativ) în pasiv. Dacă propoziția activă nu are acuzativ (verbe ca arbeiten, beginnen mit, helfen, tanzen), pasivul nu are subiect: Mit den Vorbereitungen wird schon im Februar begonnen. Im Sommer muss bis in den Abend gearbeitet werden. Dacă poziția 1 rămâne liberă, punem „es”: Es wird täglich ausgeliefert. Es wird viel gelacht.",
   ar:"١) المبني للمجهول مع الأفعال المساعدة (können و müssen و sollen و dürfen) ممكن نستبدله بتراكيب مبنية للمعلوم أشيك: أ) صفات بـ ‎-bar وأحيانًا ‎-lich = «ممكن يتعمل»: ein realisierbares Projekt (= ممكن يتنفّذ)، و lieferbare Ware، و ein verständlicher Text. والنفي بـ un-: ein unerreichbares Ziel، و ein unersetzlicher Mensch، و unverkäufliche Muster. ب) sich lassen + المصدر = ممكن يتعمل: Ein Menü lässt sich für 10 Euro machen (= kann gemacht werden). ج) sein + zu + المصدر = لازم / ممكن يتعمل: Die Rechnung ist noch zu bezahlen (= muss bezahlt werden). و Das Restaurant ist nicht zu verkaufen (= kann/darf nicht verkauft werden). ٢) المبني للمجهول من غير فاعل: المفعول الأكوزاتيف في الجملة المبنية للمعلوم بيبقى فاعل (نوميناتيف) في المبني للمجهول. ولو الجملة مافيهاش أكوزاتيف (أفعال زي arbeiten و beginnen mit و helfen و tanzen) يبقى المبني للمجهول من غير فاعل: Mit den Vorbereitungen wird schon im Februar begonnen. و Im Sommer muss bis in den Abend gearbeitet werden. ولو المكان الأول فاضي بنحط «es»: Es wird täglich ausgeliefert. و Es wird viel gelacht.",
   en:"1) The passive with modal verbs (können, müssen, sollen, dürfen) can be replaced by more elegant active structures: a) Adjectives in -bar and sometimes -lich = can be …: ein realisierbares Projekt (= that can be realised), lieferbare Ware, ein verständlicher Text. Negation with un-: ein unerreichbares Ziel, ein unersetzlicher Mensch, unverkäufliche Muster. b) sich lassen + infinitive = can be: Ein Menü lässt sich für 10 Euro machen (= kann gemacht werden). c) sein + zu + infinitive = must / can be: Die Rechnung ist noch zu bezahlen (= muss bezahlt werden). Das Restaurant ist nicht zu verkaufen (= kann/darf nicht verkauft werden). 2) Subjectless passive: the accusative object of the active sentence becomes the subject (nominative) in the passive. If the active sentence has no accusative (verbs like arbeiten, beginnen mit, helfen, tanzen), the passive has no subject: Mit den Vorbereitungen wird schon im Februar begonnen. Im Sommer muss bis in den Abend gearbeitet werden. If position 1 is empty, we put „es”: Es wird täglich ausgeliefert. Es wird viel gelacht."},
  table:[["Adjektiv","Beispiel","Bedeutung"],["-bar","ein realisierbares Projekt","ein Projekt, das realisiert werden kann"],["-bar","lieferbare Ware","Ware, die geliefert werden kann"],["un- … -bar","ein unerreichbares Ziel","ein Ziel, das nicht erreicht werden kann"],["-lich","ein verständlicher Text","ein Text, der verstanden werden kann"],["un- … -lich","ein unersetzlicher Mensch","ein Mensch, der nicht ersetzt werden kann"]],
  table2:[["Alternative","Beispiel","Passivsatz"],["sich lassen + Infinitiv","Ein 3-Gänge-Menü lässt sich für 10 Euro machen.","Ein 3-Gänge-Menü kann für 10 Euro gemacht werden."],["sein + zu + Infinitiv","Die Rechnung ist noch zu bezahlen.","Die Rechnung muss / sollte noch bezahlt werden."],["sein + zu + Infinitiv","Das Restaurant ist nicht zu verkaufen.","Das Restaurant kann / darf nicht verkauft werden."]],
  tables:[{h:"Subjektlose Passivsätze",t:[["Aktivsatz ohne Akkusativ","Subjektloser Passivsatz","Passivsatz mit es auf Position 1"],["Mit den Vorbereitungen beginnt man schon im Februar.","Mit den Vorbereitungen wird schon im Februar begonnen.","Es wird mit den Vorbereitungen schon im Februar begonnen."],["Im Sommer müssen die Gärtner bis in den Abend arbeiten.","Im Sommer muss bis in den Abend gearbeitet werden.","Es muss im Sommer bis in den Abend gearbeitet werden."],["Der Gärtner liefert täglich aus.","—","Es wird täglich ausgeliefert."]]}],

 text:{title:"Blumen pflücken auf Vertrauen",de:"Am Rand einer Landstraße bei Stuttgart leuchtet es von Juni bis Oktober in allen Farben: Sonnenblumen, Gladiolen, Dahlien und Zinnien wachsen hier auf einem riesigen Feld. Ein Schild verkündet: „Blumen selbst schneiden – 1 Euro pro Stück“. Ein Verkäufer ist nirgends zu sehen. Bezahlt wird nach dem Vertrauensprinzip: Die Kunden werfen das Geld in eine kleine Metallkasse, die an einem Holzpfahl befestigt ist. Das Konzept stammt aus den Niederlanden und hat sich in den letzten Jahren in ganz Deutschland verbreitet. Für die Landwirte ist es eine attraktive Einnahmequelle, denn Personalkosten fallen kaum an. Mit der Aussaat wird bereits im April begonnen, und im Sommer muss täglich kontrolliert und gegossen werden. „Die Arbeit lässt sich gut neben dem normalen Hof organisieren“, erzählt Landwirt Thomas Maier, der drei solcher Felder betreibt. Doch funktioniert das Vertrauen wirklich? Maier lacht. „Die meisten Kunden sind ehrlich. Natürlich gibt es auch schwarze Schafe, die mehr Blumen schneiden, als sie bezahlen. Ein gewisser Verlust ist unvermeidlich.“ Nach seinen Schätzungen zahlen etwa achtzig bis neunzig Prozent der Kunden korrekt. Ärgerlicher seien Diebstähle der gesamten Kasse, die leider immer wieder vorkämen. Deshalb wird die Kasse inzwischen mehrmals täglich geleert, und an einigen Feldern sind Kameras installiert. Manche Landwirte bieten außerdem die Möglichkeit an, per Handy zu bezahlen. Für die Kunden hat das Blumenfeld einen besonderen Reiz. Statt einen fertigen Strauß im Supermarkt zu kaufen, können sie sich ihre Lieblingsblumen selbst aussuchen. Viele Familien machen daraus einen kleinen Ausflug. „Meine Kinder lieben es, die schönsten Sonnenblumen zu finden“, sagt eine Mutter, die gerade mit einem großen Strauß zum Auto geht. „Und ehrlich gesagt ist es auch ein schönes Gefühl, dass einem jemand einfach vertraut.“ Experten sehen in solchen Angeboten einen Trend: Immer mehr Menschen wünschen sich regionale Produkte und direkten Kontakt zum Erzeuger. Ähnliche Modelle gibt es inzwischen auch für Kartoffeln, Eier oder Kürbisse – meist verkauft in kleinen Hofläden oder an Straßenständen ohne Personal.",
  q:[["Auf dem Feld steht den ganzen Tag ein Verkäufer.",false],["Bezahlt wird nach dem Vertrauensprinzip.",true],["Das Konzept kommt ursprünglich aus den Niederlanden.",true],["Mit der Aussaat wird im Juni begonnen.",false],["Laut Maier sind die meisten Kunden ehrlich.",true],["Etwa die Hälfte der Kunden zahlt nicht.",false],["Manchmal wird die ganze Kasse gestohlen.",true],["An manchen Feldern kann man auch per Handy bezahlen.",true],["Viele Familien machen aus dem Blumenpflücken einen Ausflug.",true],["Ähnliche Modelle gibt es nur für Blumen.",false]]},

 write:{type:"Beschwerde",title:"Kündigung wird ignoriert",
  situation:"Sie hatten bei der Firma „TechHelp24“ ein Abo für technische Hilfe am Telefon (14,99 € im Monat). Sie haben das Abo am 15. August fristgerecht per E-Mail gekündigt. Trotzdem wurden im September und Oktober weiter Beiträge abgebucht, und Sie haben keine Kündigungsbestätigung erhalten. Schreiben Sie eine Beschwerde.",
  points:["Ihre Kündigung erwähnen (wann, wie, Kundennummer)","beschreiben, was danach passiert ist","Ihren Ärger ausdrücken und auf die Vertragsbedingungen hinweisen","Forderungen stellen: Bestätigung, Rückzahlung – mit Frist"],
  words:"Schreiben Sie ca. 180 Wörter.",
  tip:{ro:"Folosește structurile lecției pentru un ton formal: Die Beträge sind unverzüglich zu erstatten (sein + zu). Mein Anliegen lässt sich leicht klären (sich lassen). Es wurde mir kein Rückruf … (pasiv). Menționează mereu numărul de client.",ar:"استخدم تراكيب الدرس عشان الأسلوب الرسمي: Die Beträge sind unverzüglich zu erstatten (sein + zu)، و Mein Anliegen lässt sich leicht klären (sich lassen)، و Es wurde mir kein Rückruf … (مبني للمجهول). ودايمًا اكتب رقم العميل.",en:"Use the lesson's structures for a formal tone: Die Beträge sind unverzüglich zu erstatten (sein + zu). Mein Anliegen lässt sich leicht klären (sich lassen). Es wurde mir kein Rückruf … (passive). Always mention your customer number."},
  redemittel:[["Einleitung",["am … habe ich mein Abonnement (Kundennummer …) fristgerecht gekündigt.","Mit diesem Schreiben möchte ich mich über … beschweren."]],["Sachverhalt",["Trotz meiner Kündigung wurden im … weitere Beträge abgebucht.","Eine Kündigungsbestätigung habe ich bis heute nicht erhalten.","Bei Ihrer Hotline wurde mir ein Rückruf versprochen, der jedoch nie erfolgte."]],["Ärger und Hinweis",["Ich bin über dieses Vorgehen sehr verärgert.","Laut Ihren Vertragsbedingungen beträgt die Kündigungsfrist …"]],["Forderung",["Die zu Unrecht abgebuchten Beträge sind mir unverzüglich zu erstatten.","Ich erwarte bis zum … eine schriftliche Bestätigung.","Sollte ich bis dahin nichts von Ihnen hören, werde ich die Verbraucherzentrale einschalten.","Mit freundlichen Grüßen"]]],
  model:"Daniel Moldovan\nStrada Doamnei 15\n030051 Bukarest\nRumänien\n\nTechHelp24 GmbH\nKundenservice\nFriedrichstraße 101\n10117 Berlin\n\nBukarest, den 18. Oktober 2026\n\nKündigung meines Abonnements – Kundennummer TH-58219\n\nSehr geehrte Damen und Herren,\n\nam 15. August habe ich mein Abonnement für Ihre telefonische Technikhilfe per E-Mail fristgerecht zum 31. August gekündigt. Mit diesem Schreiben möchte ich mich über Ihr weiteres Vorgehen beschweren.\n\nTrotz meiner Kündigung wurden im September und im Oktober jeweils 14,99 Euro von meinem Konto abgebucht. Eine Kündigungsbestätigung habe ich bis heute nicht erhalten. Als ich am 2. Oktober bei Ihrer Hotline anrief, wurde mir ein Rückruf innerhalb von 24 Stunden versprochen, der jedoch nie erfolgte.\n\nIch bin über dieses Vorgehen sehr verärgert. Laut Ihren Vertragsbedingungen beträgt die Kündigungsfrist nur zwei Wochen zum Monatsende. Meine Kündigung war also eindeutig rechtzeitig.\n\nIch fordere Sie daher auf, mir die Kündigung schriftlich zu bestätigen. Die zu Unrecht abgebuchten 29,98 Euro sind mir unverzüglich zu erstatten. Ich erwarte Ihre Antwort bis zum 31. Oktober. Sollte ich bis dahin nichts von Ihnen hören, werde ich die Verbraucherzentrale einschalten und den Abbuchungen bei meiner Bank widersprechen.\n\nMit freundlichen Grüßen\nDaniel Moldovan"}
}

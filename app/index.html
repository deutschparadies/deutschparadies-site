 text:{title:"Fit im Büro – geht das?",de:"Viele Menschen sitzen acht Stunden oder mehr am Schreibtisch. Die Folgen kennt fast jeder: Rückenschmerzen, Verspannungen in den Schultern und Müdigkeit. Laut einer Studie der Krankenkassen ist der Rücken der häufigste Grund für Krankmeldungen in Deutschland. Deshalb bieten immer mehr Firmen Programme für die Gesundheit ihrer Mitarbeiter an. In der Firma von Carmen Ionescu, die als Buchhalterin in Frankfurt arbeitet, gibt es seit einem Jahr eine „bewegte Mittagspause“. Zweimal pro Woche kommt eine Physiotherapeutin ins Büro und zeigt einfache Übungen. „Die meisten Übungen können direkt am Arbeitsplatz gemacht werden“, erklärt sie. „Man braucht keine Sportkleidung und kein Fitnessstudio.“ Wichtig ist vor allem die Haltung: Der Bildschirm sollte auf Augenhöhe stehen, und die Füße sollten flach auf dem Boden stehen. Außerdem soll jede Stunde eine kurze Pause gemacht werden, in der man aufsteht, sich dehnt oder ein paar Schritte geht. Carmen war am Anfang skeptisch, aber heute ist sie überzeugt. „Früher hatte ich jeden Abend Nackenschmerzen. Seit ich regelmäßig die Übungen mache, geht es mir viel besser.“ Auch die Ernährung spielt eine Rolle: In der Kantine gibt es jetzt jeden Tag ein ausgewogenes Gericht mit viel Gemüse. Die Firma ist zufrieden, denn die Zahl der Krankheitstage ist deutlich gesunken. Ein Kollege meint lachend: „Wenn mein Rücken nicht mehr wehtut, arbeite ich auch lieber.“",
  q:[["Rückenschmerzen sind der häufigste Grund für Krankmeldungen.",true],["Carmen arbeitet als Physiotherapeutin.",false],["Die Physiotherapeutin kommt zweimal pro Woche ins Büro.",true],["Für die Übungen braucht man Sportkleidung.",false],["Der Bildschirm sollte auf Augenhöhe stehen.",true],["Man soll jede Stunde eine kurze Pause machen.",true],["Carmen hat heute immer noch jeden Abend Nackenschmerzen.",false],["Die Zahl der Krankheitstage ist gestiegen.",false]]},

{
 id:"b11-4", n:4, title:"Sprachen",
 topic:{ro:"Limbi străine: învățare, neînțelegeri, multilingvism", ar:"اللغات: التعلّم وسوء الفهم وتعدّد اللغات", en:"Languages: learning, misunderstandings, multilingualism"},
 grammar:{title:"Irrealer Bedingungssatz mit wenn · wegen + Genitiv · darum / deswegen",
  expl:{ro:"Propoziția condițională ireală descrie o situație care nu este reală acum: Wenn Sie deutlicher sprechen würden, könnte ich Sie besser verstehen (dar nu vorbiți clar). Ambele propoziții sunt la Konjunktiv II: în propoziția cu wenn verbul stă la final, iar propoziția principală începe cu verbul: Wenn ich mehr Zeit hätte, würde ich Spanisch lernen. Putem omite „wenn”, iar atunci verbul trece pe primul loc: Hätte ich mehr Zeit, würde ich Spanisch lernen. „wegen” (din cauza) cere genitivul: wegen meines Freundes, wegen der Arbeit, wegen des schlechten Wetters. În limba vorbită se aude și wegen + dativ (wegen dem Wetter), dar în scris folosim genitivul. „darum” și „deswegen” au același sens ca „deshalb” (de aceea): stau pe poziția 1 și verbul urmează imediat: Meine Frau kommt aus Spanien, darum lerne ich Spanisch.",
   ar:"جملة الشرط غير الحقيقية بتوصف موقف مش حقيقي دلوقتي: Wenn Sie deutlicher sprechen würden, könnte ich Sie besser verstehen (بس حضرتك مش بتتكلم بوضوح). الجملتين في Konjunktiv II: في جملة wenn الفعل في الآخر، والجملة الرئيسية بتبدأ بالفعل: Wenn ich mehr Zeit hätte, würde ich Spanisch lernen. ممكن نشيل «wenn» ونحط الفعل في الأول: Hätte ich mehr Zeit, würde ich Spanisch lernen. «wegen» (بسبب) بتاخد جينيتيف: wegen meines Freundes و wegen der Arbeit و wegen des schlechten Wetters. في الكلام بتسمع wegen + Dativ (wegen dem Wetter)، بس في الكتابة نستخدم الجينيتيف. «darum» و «deswegen» نفس معنى «deshalb» (علشان كده): بييجوا في المكان الأول والفعل بعدهم على طول: Meine Frau kommt aus Spanien, darum lerne ich Spanisch.",
   en:"The unreal conditional describes a situation that is not real now: Wenn Sie deutlicher sprechen würden, könnte ich Sie besser verstehen (but you don't speak clearly). Both clauses use Konjunktiv II: in the wenn-clause the verb goes to the end, and the main clause starts with the verb: Wenn ich mehr Zeit hätte, würde ich Spanisch lernen. You can drop „wenn” and put the verb first: Hätte ich mehr Zeit, würde ich Spanisch lernen. „wegen” (because of) takes the genitive: wegen meines Freundes, wegen der Arbeit, wegen des schlechten Wetters. In speech you also hear wegen + dative (wegen dem Wetter), but in writing use the genitive. „darum” and „deswegen” mean the same as „deshalb” (that's why): position 1, verb immediately after: Meine Frau kommt aus Spanien, darum lerne ich Spanisch."},

 text:{title:"Mehrsprachig im Alltag",de:"Die Familie Petrescu-Weber lebt seit sechs Jahren in Graz. Die Mutter, Ana, ist Rumänin, der Vater, Thomas, ist Österreicher. Ihre zwei Kinder wachsen zweisprachig auf: Mit der Mutter sprechen sie Rumänisch, mit dem Vater Deutsch. „Am Anfang hatten wir Angst, dass die Kinder beide Sprachen durcheinanderbringen“, erzählt Ana. „Aber Experten sagen, dass das ganz normal ist. Heute wechseln sie problemlos von einer Sprache in die andere.“ Für Ana selbst war es nicht so leicht. Sie hatte in der Schule nur Englisch und Französisch gelernt, darum musste sie Deutsch als Erwachsene lernen. Wegen ihrer Arbeit in einem Hotel besuchte sie zwei Jahre lang einen Abendkurs. „Die Grammatik war schwierig, aber das größte Problem war der Dialekt“, lacht sie. „Im Kurs lernte ich Hochdeutsch, aber auf der Straße sprachen alle Steirisch. Ich habe am Anfang fast nichts verstanden.“ Einmal gab es sogar ein peinliches Missverständnis beim Bäcker: Sie wollte zwei Brötchen kaufen und bekam zwei Stück Kuchen, weil die Verkäuferin ein anderes Wort benutzt hatte. Heute spricht Ana fließend Deutsch, und auch den Dialekt versteht sie gut. Ihr Tipp für alle Deutschlernenden: „Traut euch zu sprechen, auch wenn ihr Fehler macht! Wenn ich am Anfang mutiger gewesen wäre, hätte ich viel schneller gelernt.“ Thomas lernt übrigens seit einem Jahr Rumänisch. „Wenn ich besser Rumänisch sprechen würde, könnte ich endlich mit meiner Schwiegermutter diskutieren“, sagt er und zwinkert.",
  q:[["Die Familie lebt seit sechs Jahren in Graz.",true],["Die Kinder sprechen mit dem Vater Rumänisch.",false],["Ana hatte in der Schule Deutsch gelernt.",false],["Wegen ihrer Arbeit besuchte Ana einen Abendkurs.",true],["Für Ana war der Dialekt das größte Problem.",true],["Beim Bäcker bekam Ana genau, was sie wollte.",false],["Ana rät, auch mit Fehlern zu sprechen.",true],["Thomas lernt seit einem Jahr Rumänisch.",true]]},

{
 id:"b11-5", n:5, title:"Beruf, Job und Praktikum",
 topic:{ro:"Profesie, job și stagiu de practică", ar:"المهنة والشغل والتدريب العملي", en:"Career, jobs and internships"},
 grammar:{title:"Infinitiv mit zu · nicht / nur brauchen + zu",
  expl:{ro:"Infinitivul cu zu completează multe expresii și verbe: Ich habe keine Lust, Ärger zu bekommen. Es ist wichtig, pünktlich zu sein. Er versucht, eine Stelle zu finden. „zu” stă imediat înaintea infinitivului, la finalul propoziției. La verbele separabile, zu intră la mijloc: anrufen → anzurufen, aufstehen → aufzustehen. Expresii frecvente: Lust/Zeit/Angst haben, es ist wichtig/schwer/schön, Spaß machen, vergessen, versuchen, anfangen, aufhören, vorhaben, sich freuen, hoffen, bitten, empfehlen. Atenție: după verbele modale (können, müssen, wollen …) NU folosim zu: Ich muss arbeiten. „brauchen + zu” înlocuiește „müssen” în propoziții negative sau restrictive: nicht brauchen zu = nu e nevoie (Du brauchst nicht zu kommen = Du musst nicht kommen), nur brauchen zu = e suficient doar (Sie brauchen nur das Formular auszufüllen).",
   ar:"المصدر مع zu بيكمّل تعبيرات وأفعال كتير: Ich habe keine Lust, Ärger zu bekommen. و Es ist wichtig, pünktlich zu sein. و Er versucht, eine Stelle zu finden. «zu» بتيجي قبل المصدر على طول في آخر الجملة. ومع الأفعال المنفصلة zu بتدخل في النص: anrufen → anzurufen و aufstehen → aufzustehen. تعبيرات مشهورة: Lust/Zeit/Angst haben، و es ist wichtig/schwer/schön، و Spaß machen، و vergessen، و versuchen، و anfangen، و aufhören، و vorhaben، و sich freuen، و hoffen، و bitten، و empfehlen. خد بالك: بعد الأفعال المساعدة (können, müssen, wollen …) مفيش zu: Ich muss arbeiten. «brauchen + zu» بتحل محل «müssen» في النفي أو التحديد: nicht brauchen zu = مش لازم (Du brauchst nicht zu kommen = Du musst nicht kommen)، و nur brauchen zu = كفاية بس (Sie brauchen nur das Formular auszufüllen).",
   en:"The infinitive with zu completes many expressions and verbs: Ich habe keine Lust, Ärger zu bekommen. Es ist wichtig, pünktlich zu sein. Er versucht, eine Stelle zu finden. „zu” comes directly before the infinitive at the end of the clause. With separable verbs, zu goes in the middle: anrufen → anzurufen, aufstehen → aufzustehen. Common triggers: Lust/Zeit/Angst haben, es ist wichtig/schwer/schön, Spaß machen, vergessen, versuchen, anfangen, aufhören, vorhaben, sich freuen, hoffen, bitten, empfehlen. Note: after modal verbs (können, müssen, wollen …) there is NO zu: Ich muss arbeiten. „brauchen + zu” replaces „müssen” in negative or restrictive sentences: nicht brauchen zu = don't have to (Du brauchst nicht zu kommen = Du musst nicht kommen), nur brauchen zu = only have to (Sie brauchen nur das Formular auszufüllen)."},
  table:[["Ausdruck","Infinitiv mit zu (am Ende)"],["Ich habe keine Lust,","am Wochenende zu arbeiten."],["Es ist wichtig,","pünktlich zu sein."],["Ich habe vergessen,","die Kollegin anzurufen."],["Er versucht,","eine Praktikumsstelle zu finden."],["Wir haben vor,","uns selbstständig zu machen."],["Es macht mir Spaß,","mit Kunden zu sprechen."],["Ich freue mich darauf,","im Team mitzuarbeiten."]],

  examples:["Ich habe keine Lust, schon wieder Überstunden zu machen.","Es ist nicht leicht, eine gute Praktikumsstelle zu finden.","Hast du daran gedacht, den Lebenslauf mitzuschicken?","Ich habe vor, nach dem Praktikum eine Ausbildung anzufangen.","Sie brauchen keine Berufserfahrung zu haben.","Du brauchst nur die Unterlagen per E-Mail zu schicken.","Es macht mir Spaß, im Team zu arbeiten."]},

 text:{title:"Mein Praktikum in einer Werbeagentur",de:"Nach dem Abitur wusste Sophie, 20, noch nicht genau, was sie studieren wollte. „Ich hatte keine Lust, sofort an die Uni zu gehen und dann nach zwei Semestern festzustellen, dass das Fach nicht zu mir passt“, erzählt sie. Deshalb hat sie beschlossen, zuerst ein Praktikum zu machen. Sie interessierte sich schon immer für Grafik und Marketing, also bewarb sie sich bei mehreren Werbeagenturen. Das war gar nicht so einfach: Viele Firmen wollten nur Studenten, und manche Praktika waren unbezahlt. Nach vier Absagen bekam sie endlich eine Einladung zum Vorstellungsgespräch. „Ich war furchtbar nervös. Aber die Chefin war sehr nett und sagte: Sie brauchen keine Berufserfahrung zu haben – wichtig ist, dass Sie neugierig sind und gern im Team arbeiten.“ Sophie bekam die Stelle für sechs Monate. Am Anfang bestand ihre Arbeit vor allem darin, Kaffee zu kochen, Texte zu korrigieren und Daten in Tabellen einzutragen. Aber schon nach ein paar Wochen durfte sie bei Kundengesprächen dabei sein und eigene Ideen für Werbeplakate entwickeln. Ein Plakat, das sie gestaltet hatte, hängt jetzt sogar an Bushaltestellen in der ganzen Stadt. Natürlich gab es auch stressige Tage mit Überstunden, aber Sophie hat viel gelernt. „Heute weiß ich, was ich will“, sagt sie. „Ich habe vor, Kommunikationsdesign zu studieren.“ Ihr Tipp für andere: „Habt keine Angst, nach einem Praktikum zu fragen. Man braucht nur Mut und ein gutes Anschreiben.“",
  q:[["Sophie wollte nach dem Abitur sofort studieren.",false],["Sie interessierte sich für Grafik und Marketing.",true],["Sie bekam schon auf ihre erste Bewerbung eine Zusage.",false],["Die Chefin sagte, dass Berufserfahrung nicht nötig ist.",true],["Das Praktikum dauerte sechs Monate.",true],["Sophie durfte nie bei Kundengesprächen dabei sein.",false],["Ein Plakat von Sophie hängt an Bushaltestellen.",true],["Sophie möchte jetzt Kommunikationsdesign studieren.",true]]},

 grammar:{title:"um … zu · damit · statt … zu · ohne … zu · Ausdrücke mit es",
  expl:{ro:"Pentru scop folosim „um … zu” (același subiect) sau „damit” (subiecte diferite). Ich rufe an, um einen Termin zu vereinbaren (eu sun, eu stabilesc). Ich rufe an, damit der Techniker kommt (eu sun, tehnicianul vine). Cu damit verbul conjugat stă la final. Cu același subiect se poate folosi și damit, dar um … zu este mai elegant. „statt … zu” (în loc să) arată o alternativă: Statt das Gerät zu reparieren, kaufte er ein neues. „ohne … zu” (fără să) arată că o acțiune așteptată nu are loc: Er ging, ohne zu bezahlen. Toate trei folosesc infinitivul cu zu la final. Expresii cu „es”: es este un subiect formal fără sens propriu: vremea (Es regnet. Es ist kalt.), ora (Es ist halb neun.), es gibt (Es gibt ein Problem.), es geht um (Es geht um Ihre Bestellung.), Wie geht es Ihnen?, es ist + adjectiv + zu-infinitiv (Es ist einfach, online zu bestellen).",
   ar:"للهدف بنستخدم «um … zu» (نفس الفاعل) أو «damit» (فاعل مختلف). Ich rufe an, um einen Termin zu vereinbaren (أنا اللي بتصل وأنا اللي بحدد الميعاد). و Ich rufe an, damit der Techniker kommt (أنا بتصل والفني هو اللي ييجي). مع damit الفعل المتصرّف بيروح الآخر. مع نفس الفاعل ممكن damit برضه، بس um … zu أشيك. «statt … zu» (بدل ما) بتوضح بديل: Statt das Gerät zu reparieren, kaufte er ein neues. و «ohne … zu» (من غير ما) بتوضح إن حاجة متوقعة ما حصلتش: Er ging, ohne zu bezahlen. التلاتة بيستخدموا المصدر مع zu في الآخر. تعبيرات بـ «es»: es هنا فاعل شكلي ملوش معنى: الجو (Es regnet. Es ist kalt.)، والساعة (Es ist halb neun.)، و es gibt (Es gibt ein Problem.)، و es geht um (Es geht um Ihre Bestellung.)، و Wie geht es Ihnen?، و es ist + صفة + zu (Es ist einfach, online zu bestellen).",
   en:"For purpose we use „um … zu” (same subject) or „damit” (different subjects). Ich rufe an, um einen Termin zu vereinbaren (I call, I arrange). Ich rufe an, damit der Techniker kommt (I call, the technician comes). With damit the conjugated verb goes to the end. With the same subject damit is possible too, but um … zu is more elegant. „statt … zu” (instead of) shows an alternative: Statt das Gerät zu reparieren, kaufte er ein neues. „ohne … zu” (without) shows that an expected action does not happen: Er ging, ohne zu bezahlen. All three use the zu-infinitive at the end. Expressions with „es”: es is a formal subject without its own meaning: weather (Es regnet. Es ist kalt.), time (Es ist halb neun.), es gibt (Es gibt ein Problem.), es geht um (Es geht um Ihre Bestellung.), Wie geht es Ihnen?, es ist + adjective + zu-infinitive (Es ist einfach, online zu bestellen)."},

 text:{title:"Eine Waschmaschine und viel Geduld",de:"Herr Bauer hatte sich im Internet eine neue Waschmaschine bestellt. Laut Onlineshop sollte die Lieferzeit drei bis fünf Tage betragen. Nach zwei Wochen war die Maschine immer noch nicht da. Herr Bauer rief bei der Hotline an, um zu fragen, wo seine Bestellung bleibt. Zuerst hing er eine halbe Stunde in der Warteschleife. Dann wurde er dreimal weitergeleitet, ohne eine klare Antwort zu bekommen. Schließlich schrieb er eine E-Mail: „Sehr geehrte Damen und Herren, es geht um meine Bestellung Nr. 48215. Ich bitte Sie, mir mitzuteilen, wann die Waschmaschine geliefert wird, damit ich mir einen Tag frei nehmen kann.“ Zwei Tage später kam endlich die Lieferung. Aber als Herr Bauer die Maschine zum ersten Mal einschaltete, lief Wasser auf den Boden. Statt sich wieder stundenlang zu ärgern, machte er Fotos von dem Schaden und schickte sie mit einer Reklamation an den Kundenservice. Diesmal reagierte die Firma schnell und war sehr kulant. Eine Mitarbeiterin entschuldigte sich telefonisch für die Probleme. Ein Techniker kam schon am nächsten Morgen, um das Gerät zu prüfen. Weil der Mangel nicht zu reparieren war, wurde die Maschine kostenlos ersetzt. Außerdem bekam Herr Bauer einen Gutschein über 50 Euro als Entschädigung. „Am Ende war ich zufrieden“, erzählt er. „Aber es ist wirklich nicht einfach, bei manchen Firmen jemanden zu erreichen. Mein Tipp: Immer alles schriftlich machen und Fotos aufheben!“",
  q:[["Die Lieferzeit sollte drei bis fünf Tage betragen.",true],["Herr Bauer bekam bei der Hotline sofort eine klare Antwort.",false],["In seiner E-Mail nannte er die Bestellnummer.",true],["Die Waschmaschine funktionierte von Anfang an perfekt.",false],["Herr Bauer machte Fotos von dem Schaden.",true],["Diesmal reagierte die Firma schnell.",true],["Die Maschine wurde repariert.",false],["Herr Bauer bekam einen Gutschein über 50 Euro.",true]]},

 grammar:{title:"Zweiteilige Konjunktionen · Konjunktiv II: irreale Wünsche · Verben mit Präpositionen · trotz",
  expl:{ro:"Conjuncții din două părți: nicht nur … sondern auch (nu numai … ci și) adaugă un al doilea avantaj; zwar … aber (ce-i drept … dar) limitează o afirmație; entweder … oder (ori … ori) prezintă două alternative. Die Wohnung ist nicht nur hell, sondern auch ruhig. Die Lage ist zwar gut, aber die Miete ist hoch. Wir ziehen entweder nach Köln oder nach Bonn. Dorințe ireale cu Konjunktiv II: Wenn die Wohnung doch größer wäre! / Hätte ich doch bloß einen Balkon! / Wäre die Miete nur nicht so hoch! Pentru trecut: hätte/wäre + participiu: Hätte ich doch bloß den Vertrag genauer gelesen! Multe verbe au o prepoziție fixă care trebuie învățată împreună cu verbul: sich ärgern über (+Akk), sich kümmern um (+Akk), träumen von (+Dat), sich gewöhnen an (+Akk), warten auf (+Akk), sich beschweren über (+Akk). Întrebare: Worüber ärgerst du dich? Răspuns cu pronume: Ich ärgere mich darüber. „trotz” (în ciuda) cere genitivul: trotz des großen Angebots, trotz der hohen Miete.",
   ar:"أدوات ربط من جزئين: nicht nur … sondern auch (مش بس … لكن كمان) بتضيف ميزة تانية، و zwar … aber (صحيح إن … بس) بتحد من الكلام، و entweder … oder (يا … يا) بتعرض اختيارين. Die Wohnung ist nicht nur hell, sondern auch ruhig. و Die Lage ist zwar gut, aber die Miete ist hoch. و Wir ziehen entweder nach Köln oder nach Bonn. الأمنيات اللي مش حقيقية بـ Konjunktiv II: Wenn die Wohnung doch größer wäre! و Hätte ich doch bloß einen Balkon! و Wäre die Miete nur nicht so hoch! وللماضي: hätte/wäre + Partizip: Hätte ich doch bloß den Vertrag genauer gelesen! أفعال كتير ليها حرف جر ثابت لازم يتحفظ معاها: sich ärgern über (+Akk)، و sich kümmern um (+Akk)، و träumen von (+Dat)، و sich gewöhnen an (+Akk)، و warten auf (+Akk)، و sich beschweren über (+Akk). السؤال: Worüber ärgerst du dich? والرد بضمير: Ich ärgere mich darüber. «trotz» (رغم) بتاخد جينيتيف: trotz des großen Angebots و trotz der hohen Miete.",
   en:"Two-part conjunctions: nicht nur … sondern auch (not only … but also) adds a second point; zwar … aber (admittedly … but) limits a statement; entweder … oder (either … or) presents two alternatives. Die Wohnung ist nicht nur hell, sondern auch ruhig. Die Lage ist zwar gut, aber die Miete ist hoch. Wir ziehen entweder nach Köln oder nach Bonn. Unreal wishes with Konjunktiv II: Wenn die Wohnung doch größer wäre! / Hätte ich doch bloß einen Balkon! / Wäre die Miete nur nicht so hoch! For the past: hätte/wäre + participle: Hätte ich doch bloß den Vertrag genauer gelesen! Many verbs have a fixed preposition to learn with the verb: sich ärgern über (+acc), sich kümmern um (+acc), träumen von (+dat), sich gewöhnen an (+acc), warten auf (+acc), sich beschweren über (+acc). Question: Worüber ärgerst du dich? Answer with a pronoun: Ich ärgere mich darüber. „trotz” (despite) takes the genitive: trotz des großen Angebots, trotz der hohen Miete."},

 text:{title:"Traumwohnung gesucht",de:"Seit drei Monaten sind Elena und Mihai auf Wohnungssuche in Frankfurt. Bisher wohnen sie in einem kleinen möblierten Zimmer, aber im Herbst bekommen sie ein Baby und brauchen mehr Platz. „Wir träumen von einer Dreizimmerwohnung mit Balkon, nicht zu weit vom Zentrum“, erzählt Elena. Doch der Wohnungsmarkt ist schwierig. Trotz des großen Angebots im Internet finden sie kaum etwas Bezahlbares. Viele Wohnungen sind zwar schön, aber viel zu teuer. Andere sind günstig, aber liegen weit außerhalb der Stadt. Zu einer Besichtigung kamen über vierzig Interessenten – die Wohnung war nach einer Stunde vergeben. „Hätten wir doch bloß früher angefangen zu suchen!“, seufzt Mihai. Letzte Woche hatten sie endlich Glück. Eine ältere Vermieterin bot ihnen eine Wohnung in einem Altbau an. Die Wohnung hat 72 Quadratmeter und ist nicht nur hell, sondern auch ruhig, denn die Schlafzimmer liegen zum Hof. Die Kaltmiete beträgt 980 Euro, dazu kommen etwa 220 Euro Nebenkosten. Die Kaution liegt bei drei Monatsmieten. Natürlich gibt es auch Nachteile: Die Küche ist ziemlich klein, und es gibt keinen Aufzug – die Wohnung liegt im vierten Stock. „Wenn es doch bloß einen Aufzug gäbe!“, lacht Elena. „Mit Kinderwagen wird das anstrengend.“ Aber die Vermieterin hat versprochen, sich um alle Reparaturen zu kümmern, und die Nachbarn scheinen sehr nett zu sein. Am Wochenende unterschreiben sie den Mietvertrag. Entweder streichen sie die Wände selbst oder sie bitten Freunde um Hilfe – auf jeden Fall wollen sie im August einziehen.",

{
 id:"b12-8", n:8, title:"Unter Freunden",
 topic:{ro:"Între prieteni: prietenie, cunoștințe, Du sau Sie", ar:"بين الأصحاب: الصداقة والمعارف و Du ولا Sie", en:"Among friends: friendship, acquaintances, du or Sie"},
 grammar:{title:"falls · Relativsatz mit Präposition · Adjektiv als Nomen · n-Deklination · je … desto",
  expl:{ro:"„falls” (în cazul în care) introduce o condiție posibilă, asemănător cu wenn; verbul stă la final: Falls du keine Zeit hast, ruf mich an. Propoziția relativă cu prepoziție: prepoziția verbului stă înaintea pronumelui relativ, iar cazul îl dă prepoziția: Ist das der Bekannte, über den du gesprochen hast? (sprechen über + Akk). Das ist die Freundin, mit der ich in Urlaub fahre (mit + Dat). Adjectivul folosit ca substantiv se scrie cu majusculă, dar se declină ca un adjectiv: bekannt → der Bekannte, ein Bekannter, die Bekannte, mit meinem Bekannten. La fel: der/die Deutsche, Erwachsene, Verwandte, Jugendliche. Declinarea n: unele substantive masculine primesc -n/-en în toate cazurile în afară de nominativ: der Kollege – den/dem/des Kollegen; der Nachbar, der Student, der Mensch, der Herr (den Herrn). „je … desto” compară două schimbări: je + comparativ + propoziție secundară (verb la final), desto + comparativ + verb: Je leichter Ihnen das fällt, desto besser. Je öfter wir uns treffen, desto besser verstehen wir uns.",
   ar:"«falls» (لو / في حالة) بتعبّر عن شرط ممكن، شبه wenn، والفعل في الآخر: Falls du keine Zeit hast, ruf mich an. جملة الصلة بحرف جر: حرف الجر بتاع الفعل بييجي قبل ضمير الصلة، وهو اللي بيحدد الحالة: Ist das der Bekannte, über den du gesprochen hast? (sprechen über + Akk). و Das ist die Freundin, mit der ich in Urlaub fahre (mit + Dat). الصفة اللي بتتحوّل لاسم بتتكتب بحرف كبير بس بتتصرّف زي الصفة: bekannt → der Bekannte و ein Bekannter و die Bekannte و mit meinem Bekannten. وكمان: der/die Deutsche و Erwachsene و Verwandte و Jugendliche. تصريف n: بعض الأسماء المذكرة بتاخد ‎-n/-en في كل الحالات ماعدا النوميناتيف: der Kollege – den/dem/des Kollegen، وكذلك der Nachbar و der Student و der Mensch و der Herr (den Herrn). «je … desto» بتقارن تغيّرين: je + صيغة مقارنة + جملة فرعية (الفعل في الآخر)، و desto + صيغة مقارنة + الفعل: Je leichter Ihnen das fällt, desto besser. و Je öfter wir uns treffen, desto besser verstehen wir uns.",
   en:"„falls” (in case/if) introduces a possible condition, similar to wenn; the verb goes to the end: Falls du keine Zeit hast, ruf mich an. Relative clause with a preposition: the verb's preposition comes before the relative pronoun and determines the case: Ist das der Bekannte, über den du gesprochen hast? (sprechen über + acc). Das ist die Freundin, mit der ich in Urlaub fahre (mit + dat). An adjective used as a noun is capitalised but declined like an adjective: bekannt → der Bekannte, ein Bekannter, die Bekannte, mit meinem Bekannten. Likewise: der/die Deutsche, Erwachsene, Verwandte, Jugendliche. n-declension: some masculine nouns add -n/-en in all cases except the nominative: der Kollege – den/dem/des Kollegen; der Nachbar, der Student, der Mensch, der Herr (den Herrn). „je … desto” compares two changes: je + comparative + subordinate clause (verb at the end), desto + comparative + verb: Je leichter Ihnen das fällt, desto besser. Je öfter wir uns treffen, desto besser verstehen wir uns."},

 text:{title:"„Du“ oder „Sie“? – Ein Interview",de:"Wann sagt man in Deutschland „du“ und wann „Sie“? Für viele Deutschlernende ist das eine schwierige Frage. Wir haben mit der Kommunikationstrainerin Katrin Vogel gesprochen. Frau Vogel, gibt es feste Regeln? – „Es gibt zumindest Faustregeln. Kinder, Jugendliche, Familienmitglieder und Freunde duzt man. Erwachsene, die man nicht kennt, siezt man – zum Beispiel beim Arzt, auf dem Amt oder im Geschäft.“ Und im Beruf? – „Da wird es kompliziert. In vielen jungen Firmen und Start-ups duzen sich alle, auch mit dem Chef. In Banken oder Behörden siezt man sich dagegen oft jahrelang.“ Wer darf das Du anbieten? – „Normalerweise der Ältere dem Jüngeren, der Chef dem Mitarbeiter oder die Frau dem Mann. Falls Sie unsicher sind, sagen Sie lieber ‚Sie‘ und warten Sie ab. Das ist nie unhöflich.“ Kann man das Du auch ablehnen? – „Theoretisch ja, aber das ist sehr unangenehm. Ein Bekannter von mir hat einmal das Du seines Nachbarn abgelehnt. Danach haben die beiden kaum noch miteinander gesprochen.“ Haben Sie einen Tipp für unsere Leser? – „Hören Sie gut zu, wie die anderen sprechen. Und keine Panik: Je länger man in Deutschland lebt, desto leichter wird es. Wenn man einen Fehler macht, entschuldigt man sich einfach. Die meisten Menschen, mit denen man zu tun hat, verstehen das.“ Übrigens: In Online-Foren und sozialen Netzwerken duzen sich fast alle – auch Menschen, die sich noch nie gesehen haben.",
  q:[["Familienmitglieder und Freunde duzt man.",true],["Beim Arzt duzt man normalerweise.",false],["In vielen Start-ups duzen sich alle, auch mit dem Chef.",true],["Normalerweise bietet der Jüngere das Du an.",false],["Wenn man unsicher ist, sollte man lieber „Sie“ sagen.",true],["Das Du abzulehnen ist ganz normal und angenehm.",false],["Je länger man in Deutschland lebt, desto leichter wird es.",true],["In Online-Foren siezen sich die meisten Menschen.",false]]},
 dictation:["Falls du am Samstag Zeit hast, komm doch zu unserer Party.","Ist das der Bekannte, über den du gesprochen hast?","Das ist die Freundin, mit der ich jeden Sommer verreise.","Gestern habe ich zufällig einen alten Bekannten getroffen.","Ich habe meinen Kollegen um Hilfe gebeten.","Je länger ich ihn kenne, desto sympathischer finde ich ihn."],

 topic:{ro:"Tehnica în viața de zi cu zi: aparate, instrucțiuni, forumuri", ar:"التكنولوجيا في الحياة اليومية: الأجهزة والتعليمات والمنتديات", en:"Technology in everyday life: devices, instructions, forums"},
 grammar:{title:"als ob · während · nachdem · bevor",
  expl:{ro:"„als ob” (ca și cum) introduce o comparație ireală; verbul stă la final, de obicei la Konjunktiv II: Er tut so, als ob er alles wüsste. Wir schreiben mit der Hand, als ob wir im Mittelalter wären. Conjuncțiile temporale introduc propoziții secundare (verbul la final). „während” (în timp ce): două acțiuni simultane: Während ich unterwegs bin, kann ich mich nicht um den Computer kümmern. „nachdem” (după ce): mai întâi acțiunea din propoziția cu nachdem, apoi cea din propoziția principală. Atenție la timpuri: nachdem + Plusquamperfekt → principală la Präteritum (Nachdem ich das Update installiert hatte, funktionierte nichts mehr); nachdem + Perfekt → principală la prezent (Nachdem ich das Essen ausgefahren habe, kümmere ich mich um den Laptop). „bevor” (înainte să): acțiunea din principală are loc mai întâi: Bevor du das Gerät einschaltest, lies die Bedienungsanleitung. „während” poate fi și prepoziție cu genitivul: während der Arbeit.",
   ar:"«als ob» (كأن) بتعمل مقارنة مش حقيقية، والفعل في الآخر وغالبًا في Konjunktiv II: Er tut so, als ob er alles wüsste. و Wir schreiben mit der Hand, als ob wir im Mittelalter wären. أدوات الزمن دي بتبدأ جمل فرعية (الفعل في الآخر). «während» (في الوقت اللي): حاجتين بيحصلوا في نفس الوقت: Während ich unterwegs bin, kann ich mich nicht um den Computer kümmern. «nachdem» (بعد ما): الحاجة اللي في جملة nachdem بتحصل الأول وبعدين اللي في الجملة الرئيسية. خد بالك من الأزمنة: nachdem + Plusquamperfekt → الرئيسية Präteritum (Nachdem ich das Update installiert hatte, funktionierte nichts mehr)، و nachdem + Perfekt → الرئيسية مضارع (Nachdem ich das Essen ausgefahren habe, kümmere ich mich um den Laptop). «bevor» (قبل ما): الحاجة اللي في الجملة الرئيسية بتحصل الأول: Bevor du das Gerät einschaltest, lies die Bedienungsanleitung. و «während» ممكن تبقى حرف جر مع الجينيتيف: während der Arbeit.",
   en:"„als ob” (as if) introduces an unreal comparison; the verb goes to the end, usually in Konjunktiv II: Er tut so, als ob er alles wüsste. Wir schreiben mit der Hand, als ob wir im Mittelalter wären. The time conjunctions introduce subordinate clauses (verb at the end). „während” (while): two simultaneous actions: Während ich unterwegs bin, kann ich mich nicht um den Computer kümmern. „nachdem” (after): the nachdem-clause happens first, then the main clause. Watch the tenses: nachdem + Plusquamperfekt → main clause in Präteritum (Nachdem ich das Update installiert hatte, funktionierte nichts mehr); nachdem + Perfekt → main clause in the present (Nachdem ich das Essen ausgefahren habe, kümmere ich mich um den Laptop). „bevor” (before): the main clause happens first: Bevor du das Gerät einschaltest, lies die Bedienungsanleitung. „während” can also be a preposition with the genitive: während der Arbeit."},
  table:[["Konjunktion","Bedeutung","Beispiel"],["während","gleichzeitig","Während der Computer startet, koche ich Kaffee."],["nachdem","zuerst Nebensatz, dann Hauptsatz","Nachdem ich das Update installiert hatte, lief nichts mehr."],["bevor","zuerst Hauptsatz, dann Nebensatz","Bevor du das Gerät benutzt, lies die Anleitung."],["als ob + Konjunktiv II","irrealer Vergleich","Er tut so, als ob er ein Computerexperte wäre."]],
  table2:[["Nebensatz mit nachdem","Hauptsatz"],["Plusquamperfekt: Nachdem ich gegessen hatte,","Präteritum: ging ich spazieren."],["Plusquamperfekt: Nachdem sie angerufen hatte,","Präteritum: kam der Techniker."],["Perfekt: Nachdem ich die App installiert habe,","Präsens: melde ich mich an."],["Perfekt: Nachdem der Akku geladen ist,","Präsens: kann man das Gerät benutzen."]],

 text:{title:"Hilfe! Mein smartes Zuhause ist dumm",de:"Beitrag von „Technikmuffel_77“ im Forum „Smart Home für Anfänger“: Hallo zusammen, ich brauche dringend euren Rat. Vor zwei Monaten habe ich meine Wohnung modernisiert. Jetzt kann ich angeblich alles mit dem Handy steuern: das Licht, die Heizung, die Rollläden und sogar die Kaffeemaschine. Klingt toll, oder? In Wirklichkeit ist es ein Albtraum. Gestern zum Beispiel: Nachdem ich ein Update installiert hatte, ging plötzlich überall das Licht an – um drei Uhr nachts! Ich bin aufgewacht, als ob ein Einbrecher im Haus wäre. Und während ich im Urlaub war, hat die Heizung eine Woche lang auf 26 Grad geheizt, obwohl ich sie ausgeschaltet hatte. Bevor ich das alles gekauft habe, hat mir der Verkäufer gesagt: „Das bedienen sogar Kinder!“ Na ja. Hat jemand eine Idee, was ich tun kann? Antwort von „Lisa_IT“: Hallo Technikmuffel, das klingt nach einem Problem mit dem Router. Bevor du alles zurückschickst, starte bitte den Router neu und prüfe, ob alle Geräte mit dem gleichen WLAN verbunden sind. Nachdem du das gemacht hast, solltest du in den Einstellungen der App die automatischen Updates ausschalten. Dann kannst du selbst entscheiden, wann ein Update installiert wird. Antwort von „Opa_Heinz“: Mein Tipp: Lichtschalter! Die funktionieren seit hundert Jahren ohne Update. Antwort von „Technikmuffel_77“: Danke, Lisa! Ich habe den Router neu gestartet und die Updates ausgeschaltet. Seitdem funktioniert alles. Und Heinz – ehrlich gesagt, habe ich auch schon an die guten alten Lichtschalter gedacht …",
  q:[["Der Verfasser hat seine Wohnung vor zwei Monaten modernisiert.",true],["Nach einem Update ging um drei Uhr nachts das Licht an.",true],["Im Urlaub war die Heizung ausgeschaltet.",false],["Der Verkäufer hat gesagt, dass das System sehr kompliziert ist.",false],["Lisa vermutet ein Problem mit dem Router.",true],["Lisa empfiehlt, die automatischen Updates einzuschalten.",false],["Opa Heinz empfiehlt ganz normale Lichtschalter.",true],["Nach Lisas Tipps funktioniert jetzt alles.",true]]},

 topic:{ro:"Totul despre produs: pane, descrieri, reclamații, reclamă", ar:"كل حاجة عن المنتج: الأعطال والوصف والشكاوى والإعلانات", en:"All about the product: breakdowns, descriptions, complaints, advertising"},
 grammar:{title:"Relativsätze mit was und wo · Partizip Präsens als Adjektiv · weder … noch / sowohl … als auch",
  expl:{ro:"Pronumele relativ „was” apare după alles, nichts, etwas, vieles, das (pronume) și după superlative substantivate (das Beste): Alles, was schiefgehen kann, geht irgendwann schief. Das ist das Beste, was ich je gekauft habe. „was” se poate referi și la o propoziție întreagă: Das Paket kam zu spät, was mich sehr geärgert hat. Pronumele relativ „wo” se folosește pentru locuri, mai ales după nume de orașe/țări și după dort/da: Wir gehen in den Laden, wo es am billigsten ist. Participiul prezent = infinitiv + -d: hüpfen → hüpfend. Folosit ca adjectiv, primește terminații normale: ein hüpfender Frosch, die sprechende Zahnbürste, bei laufendem Motor. Arată o acțiune care are loc în același timp (activă). Conjuncții duble: weder … noch (nici … nici) neagă ambele părți: Ich habe weder den Schlüssel noch die Anleitung gefunden. sowohl … als auch (atât … cât și) le afirmă pe amândouă: Sowohl die Lieferzeit als auch der Geschmack sind in Ordnung.",
   ar:"ضمير الصلة «was» بييجي بعد alles و nichts و etwas و vieles و das (ضمير) وبعد صيغة التفضيل المحوّلة لاسم (das Beste): Alles, was schiefgehen kann, geht irgendwann schief. و Das ist das Beste, was ich je gekauft habe. و «was» ممكن ترجع على جملة كاملة: Das Paket kam zu spät, was mich sehr geärgert hat. ضمير الصلة «wo» بيستخدم للأماكن، خصوصًا بعد أسماء المدن والدول وبعد dort/da: Wir gehen in den Laden, wo es am billigsten ist. اسم الفاعل (Partizip Präsens) = المصدر + ‎-d: hüpfen → hüpfend. ولما يبقى صفة بياخد نهايات عادية: ein hüpfender Frosch و die sprechende Zahnbürste و bei laufendem Motor. بيوضح حاجة بتحصل في نفس الوقت (مبني للمعلوم). أدوات مزدوجة: weder … noch (لا … ولا) بتنفي الاتنين: Ich habe weder den Schlüssel noch die Anleitung gefunden. و sowohl … als auch (سواء … أو / الاتنين) بتثبت الاتنين: Sowohl die Lieferzeit als auch der Geschmack sind in Ordnung.",
   en:"The relative pronoun „was” follows alles, nichts, etwas, vieles, das (pronoun) and nominalised superlatives (das Beste): Alles, was schiefgehen kann, geht irgendwann schief. Das ist das Beste, was ich je gekauft habe. „was” can also refer to a whole clause: Das Paket kam zu spät, was mich sehr geärgert hat. The relative pronoun „wo” is used for places, especially after names of cities/countries and after dort/da: Wir gehen in den Laden, wo es am billigsten ist. Present participle = infinitive + -d: hüpfen → hüpfend. Used as an adjective, it takes normal endings: ein hüpfender Frosch, die sprechende Zahnbürste, bei laufendem Motor. It shows an action happening at the same time (active). Two-part conjunctions: weder … noch (neither … nor) negates both parts: Ich habe weder den Schlüssel noch die Anleitung gefunden. sowohl … als auch (both … and) affirms both: Sowohl die Lieferzeit als auch der Geschmack sind in Ordnung."},

 text:{title:"Kolumne: Murphy wohnt bei mir",de:"Kennen Sie Murphys Gesetz? Es lautet: Alles, was schiefgehen kann, geht auch schief. Seit letzter Woche weiß ich, dass dieses Gesetz stimmt. Alles begann mit einem Geburtstagsgeschenk für meinen Neffen: ein leuchtender Plastikfrosch, der hüpfen und sprechen kann. Laut Werbung „das Spielzeug, das sowohl Kinder als auch Eltern begeistert“. Ich bestellte den Frosch online, und die Lieferzeit sollte zwei Tage betragen. Natürlich kam das Paket nicht. Nach einer Woche rief ich beim Kundenservice an, was eine halbe Stunde Warteschleife bedeutete. Die freundliche Mitarbeiterin versprach mir, das Paket sofort noch einmal zu schicken. Ausgerechnet am Geburtstag, als ich schon auf der Party war, stand der Bote vor meiner Tür. Am nächsten Tag holte ich das Paket bei der Post ab. Ich öffnete die Verpackung: Weder der Frosch noch die Batterien waren drin – stattdessen eine elektrische Zahnbürste! Eine sprechende Zahnbürste, die jeden Morgen „Guten Morgen, bitte drei Minuten putzen!“ sagt. Ich schrieb eine Reklamation. Diesmal reagierte die Firma schnell und schickte den richtigen Frosch. Mein Neffe war begeistert. Leider hüpfte der Frosch nur zwei Tage, dann ging er kaputt. Den Schlüssel für das Batteriefach fanden wir nirgends. Das Beste, was ich aus dieser Geschichte gelernt habe: Nächstes Mal schenke ich ein Buch. Und die Zahnbürste? Die durfte ich behalten. Sie wünscht mir jeden Morgen gute Laune – das ist wenigstens etwas, was funktioniert.",
  q:[["Murphys Gesetz sagt: Alles, was schiefgehen kann, geht schief.",true],["Das Geschenk war für die Nichte der Autorin.",false],["Laut Werbung begeistert das Spielzeug Kinder und Eltern.",true],["Das Paket kam pünktlich nach zwei Tagen.",false],["Im Paket war eine elektrische Zahnbürste.",true],["Der richtige Frosch hat lange funktioniert.",false],["Nächstes Mal möchte die Autorin ein Buch schenken.",true],["Die Zahnbürste musste sie zurückschicken.",false]]},

 grammar:{title:"Futur I · innerhalb / außerhalb + Genitiv · Konjunktion da",
  expl:{ro:"Futur I = werden (conjugat, poziția 2) + infinitiv (la final): Ich werde mehr Sport machen. Îl folosim pentru planuri și promisiuni ferme (mai ales la începutul anului: gute Vorsätze), pentru prognoze (Morgen wird es regnen) și pentru presupuneri despre prezent, adesea cu wohl (Er wird wohl krank sein). Pentru viitor apropiat, germana folosește foarte des prezentul + o expresie de timp: Morgen fahre ich nach Wien. „innerhalb” (în interiorul / în decurs de) și „außerhalb” (în afara) cer genitivul și se folosesc pentru loc și timp: innerhalb einer Ortschaft, außerhalb der Stadt, innerhalb einer Woche, außerhalb der Öffnungszeiten. „da” (deoarece) introduce o cauză, ca weil; verbul stă la final. Da stă adesea la începutul propoziției și exprimă o cauză cunoscută: Da sie nur in seinem Dorf wachsen, sind die Pflanzen sehr selten. La întrebarea Warum? răspundem însă cu weil, nu cu da.",
   ar:"الـ Futur I = werden (متصرّف في المكان التاني) + المصدر (في الآخر): Ich werde mehr Sport machen. بنستخدمه للخطط والوعود الأكيدة (خصوصًا في أول السنة: gute Vorsätze)، وللتوقعات (Morgen wird es regnen)، وللتخمين عن الحاضر وغالبًا مع wohl (Er wird wohl krank sein). وللمستقبل القريب الألمان بيستخدموا المضارع + كلمة زمن كتير جدًا: Morgen fahre ich nach Wien. «innerhalb» (جوه / خلال) و «außerhalb» (برّه) بياخدوا جينيتيف وبيستخدموا للمكان والزمن: innerhalb einer Ortschaft و außerhalb der Stadt و innerhalb einer Woche و außerhalb der Öffnungszeiten. «da» (بما إن / لأن) بتعبّر عن سبب زي weil، والفعل في الآخر. da غالبًا بتيجي في أول الجملة وبتعبّر عن سبب معروف: Da sie nur in seinem Dorf wachsen, sind die Pflanzen sehr selten. بس لما حد يسأل Warum? بنرد بـ weil مش da.",
   en:"Futur I = werden (conjugated, position 2) + infinitive (at the end): Ich werde mehr Sport machen. We use it for firm plans and promises (especially New Year's resolutions: gute Vorsätze), for predictions (Morgen wird es regnen) and for assumptions about the present, often with wohl (Er wird wohl krank sein). For the near future German very often uses the present + a time expression: Morgen fahre ich nach Wien. „innerhalb” (inside/within) and „außerhalb” (outside) take the genitive and are used for place and time: innerhalb einer Ortschaft, außerhalb der Stadt, innerhalb einer Woche, außerhalb der Öffnungszeiten. „da” (since/as) introduces a reason like weil; the verb goes to the end. Da often starts the sentence and gives a known reason: Da sie nur in seinem Dorf wachsen, sind die Pflanzen sehr selten. But when answering Warum? we use weil, not da."},

 text:{title:"Andere Länder, andere Sitten",de:"Wer ins Ausland reist oder in einem anderen Land lebt, merkt schnell: Was bei uns höflich ist, kann woanders unhöflich wirken. In Deutschland zum Beispiel ist Pünktlichkeit sehr wichtig. Wer zu einem Termin zehn Minuten zu spät kommt, sollte sich entschuldigen. In vielen südeuropäischen Ländern sieht man das lockerer. Auch bei der Begrüßung gibt es große Unterschiede. In Deutschland gibt man sich die Hand, in Frankreich oder Rumänien küsst man Freunde auf die Wange, und in Japan verbeugt man sich. Da es in Japan als unhöflich gilt, sich die Nase in der Öffentlichkeit zu putzen, sollten Reisende das lieber auf der Toilette tun. Beim Essen gibt es ebenfalls viele Regeln. In China ist es zum Beispiel unhöflich, den Teller ganz leer zu essen, weil der Gastgeber dann denkt, dass man nicht satt geworden ist. In Deutschland dagegen freut sich die Gastgeberin, wenn nichts übrig bleibt. Und das Trinkgeld? In den USA erwartet man mindestens 15 Prozent, in Japan kann Trinkgeld sogar beleidigend sein. Die Psychologin Anna Kühn rät: „Bevor Sie in ein fremdes Land reisen, informieren Sie sich über die wichtigsten Sitten. Innerhalb weniger Minuten finden Sie im Internet alles Nötige. Und wenn Sie trotzdem einen Fehler machen: Lächeln Sie und entschuldigen Sie sich. Die meisten Menschen werden Ihnen verzeihen, da sie merken, dass Sie sich Mühe geben.“ Ihr Vorsatz für die nächste Reise? „Ich werde endlich ein paar Wörter Japanisch lernen.“",
  q:[["In Deutschland ist Pünktlichkeit sehr wichtig.",true],["In Japan küsst man sich zur Begrüßung auf die Wange.",false],["In Japan gilt es als unhöflich, sich in der Öffentlichkeit die Nase zu putzen.",true],["In China sollte man den Teller immer ganz leer essen.",false],["In Deutschland freut sich die Gastgeberin, wenn nichts übrig bleibt.",true],["In Japan erwartet man mindestens 15 Prozent Trinkgeld.",false],["Anna Kühn empfiehlt, sich vor der Reise zu informieren.",true],["Anna Kühn will vor der nächsten Reise ein paar Wörter Japanisch lernen.",true]]},

{

 topic:{ro:"Sfaturi și ajutor: consiliere, voluntariat, modele", ar:"النصيحة والمساعدة: الاستشارة والتطوّع والقدوة", en:"Advice and help: counselling, volunteering, role models"},
 grammar:{title:"seit(dem) · bis · indem · ohne dass · Präposition außer",
  expl:{ro:"Toate aceste conjuncții introduc propoziții secundare (verbul la final). „seit / seitdem” (de când): o acțiune a început în trecut și continuă: Seitdem ich hier lebe, engagiere ich mich im Verein. Atenție: cu seit(dem), propoziția stă de obicei la prezent dacă acțiunea continuă. „bis” (până când): Ich warte, bis mein Name richtig geschrieben wird. „indem” (prin faptul că, făcând …) arată modul sau mijlocul, răspunde la întrebarea Wie?: Man löst viele Probleme, indem man sich beraten lässt. „ohne dass” (fără ca) arată că ceva nu se întâmplă; o folosim mai ales când subiectele diferă: Sie redet ständig, ohne dass ich etwas sagen kann. Cu același subiect preferăm ohne … zu: Er ging, ohne sich zu verabschieden. Prepoziția „außer” (în afară de, cu excepția) cere dativul: Alle außer meinem Vater waren einverstanden. Außer dir hat mir niemand geholfen.",
   ar:"كل الأدوات دي بتبدأ جمل فرعية (الفعل في الآخر). «seit / seitdem» (من ساعة ما): حاجة بدأت في الماضي ولسه مستمرة: Seitdem ich hier lebe, engagiere ich mich im Verein. خد بالك: مع seit(dem) الجملة غالبًا بتكون مضارع لو الحاجة لسه مستمرة. «bis» (لحد ما): Ich warte, bis mein Name richtig geschrieben wird. «indem» (عن طريق إن / بإنك) بتوضح الطريقة أو الوسيلة، وبترد على سؤال Wie?: Man löst viele Probleme, indem man sich beraten lässt. «ohne dass» (من غير ما) بتوضح إن حاجة مش بتحصل، وبنستخدمها خصوصًا لما الفاعل يختلف: Sie redet ständig, ohne dass ich etwas sagen kann. ولو نفس الفاعل نفضّل ohne … zu: Er ging, ohne sich zu verabschieden. حرف الجر «außer» (ماعدا / غير) بياخد داتيف: Alle außer meinem Vater waren einverstanden. و Außer dir hat mir niemand geholfen.",
   en:"All these conjunctions introduce subordinate clauses (verb at the end). „seit / seitdem” (since): an action began in the past and continues: Seitdem ich hier lebe, engagiere ich mich im Verein. Note: with seit(dem) the clause is usually in the present if the action continues. „bis” (until): Ich warte, bis mein Name richtig geschrieben wird. „indem” (by doing …) shows the manner or means and answers Wie?: Man löst viele Probleme, indem man sich beraten lässt. „ohne dass” (without) shows that something doesn't happen; it is used mainly when the subjects differ: Sie redet ständig, ohne dass ich etwas sagen kann. With the same subject we prefer ohne … zu: Er ging, ohne sich zu verabschieden. The preposition „außer” (except, apart from) takes the dative: Alle außer meinem Vater waren einverstanden. Außer dir hat mir niemand geholfen."},
  table:[["Konjunktion","Bedeutung","Beispiel"],["seit / seitdem","von damals bis jetzt","Seitdem ich hier lebe, engagiere ich mich im Verein."],["bis","bis zu einem Zeitpunkt","Ich warte, bis mein Name richtig geschrieben wird."],["indem","Art und Weise (Wie?)","Man findet Hilfe, indem man sich beraten lässt."],["ohne dass","etwas passiert nicht","Er hat das Problem gelöst, ohne dass ich ihn fragen musste."],["außer + Dativ","Ausnahme","Alle außer meinem Vater waren einverstanden."]],
  table2:[["ohne … zu (gleiches Subjekt)","ohne dass (anderes Subjekt)"],["Er ging, ohne sich zu verabschieden.","Er ging, ohne dass wir es merkten."],["Sie half mir, ohne Geld zu verlangen.","Sie half mir, ohne dass ich darum bitten musste."],["Ich habe unterschrieben, ohne den Vertrag zu lesen.","Ich habe unterschrieben, ohne dass mir jemand den Vertrag erklärt hat."]],
  examples:["Seitdem ich in Deutschland lebe, helfe ich anderen bei Behördengängen.","Seit sie ehrenamtlich arbeitet, hat sie viele neue Freunde.","Bitte warten Sie, bis Ihre Nummer aufgerufen wird.","Ich habe mein Deutsch verbessert, indem ich jeden Tag Nachrichten gehört habe.","Man kann Geld sparen, indem man Lebensmittel nicht wegwirft.","Er hat einfach meinen Brief geöffnet, ohne dass ich es erlaubt hatte.","Außer meiner Schwester wusste niemand von dem Problem."]},

 text:{title:"Hilfe von Mensch zu Mensch",de:"Seitdem Ahmad vor acht Jahren nach Leipzig gekommen ist, hat sich sein Leben stark verändert. Am Anfang verstand er kaum ein Wort Deutsch, und jeder Brief von einer Behörde machte ihm Angst. „Ich habe oft Formulare unterschrieben, ohne dass ich genau wusste, was darin stand“, erzählt er. Einmal hatte er sogar eine Frist verpasst und musste Strafe zahlen. Geholfen hat ihm damals eine ältere Frau aus seinem Haus, Frau Richter. Sie war früher Lehrerin und erklärte ihm geduldig jeden Bescheid, bis er alles verstanden hatte. „Sie hat mir geholfen, ohne Geld dafür zu verlangen. Für mich ist sie bis heute ein Vorbild.“ Heute spricht Ahmad fließend Deutsch und arbeitet als Krankenpfleger. In seiner Freizeit engagiert er sich ehrenamtlich in einer Beratungsstelle für Neuankömmlinge. Zweimal pro Woche hilft er Menschen, Anträge auszufüllen, Termine zu vereinbaren oder Briefe zu verstehen. „Ich gebe etwas zurück, indem ich anderen helfe“, sagt er. Viele seiner Besucher haben ähnliche Schwierigkeiten wie er damals. Nicht immer ist die Arbeit leicht. Manchmal wird Ahmad mit Gewissensfragen konfrontiert: Soll er einem Mann helfen, obwohl er weiß, dass dessen Angaben nicht ganz stimmen? „In so einem Fall sage ich ehrlich meine Meinung. Ich helfe gern – aber nur, wenn alles korrekt ist.“ Alle in der Beratungsstelle, außer der Leiterin, arbeiten freiwillig. Ahmad findet das selbstverständlich: „Wenn jeder ein bisschen hilft, wird die Gesellschaft besser.“",
  q:[["Ahmad lebt seit acht Jahren in Leipzig.",true],["Am Anfang verstand er die Briefe von den Behörden gut.",false],["Einmal hat er eine Frist verpasst.",true],["Frau Richter war früher Ärztin.",false],["Frau Richter hat kein Geld für ihre Hilfe verlangt.",true],["Ahmad arbeitet heute als Krankenpfleger.",true],["In der Beratungsstelle hilft er einmal im Monat.",false],["Alle in der Beratungsstelle arbeiten freiwillig, auch die Leiterin.",false]]},

{

 topic:{ro:"Politică și istorie: alegeri, partide, Germania după 1945", ar:"السياسة والتاريخ: الانتخابات والأحزاب وألمانيا بعد ١٩٤٥", en:"Politics and history: elections, parties, Germany after 1945"},
 grammar:{title:"Adjektivdeklination mit Komparativ und Superlativ · Partizip Perfekt als Adjektiv · Passiv Präteritum und Perfekt",
  expl:{ro:"Comparativul și superlativul folosite înaintea unui substantiv primesc terminațiile normale ale adjectivului, adăugate după -er / -(e)st: schönere Spielplätze, eine bessere Lösung, die wichtigste Partei, der älteste Politiker. Participiul II poate fi folosit ca adjectiv, cu sens pasiv/încheiat: die versprochenen Einrichtungen (instituțiile care au fost promise), die geteilte Stadt, ein gewählter Präsident. Pasivul la trecut: Präteritum = wurde + participiul II: Die Mauer wurde 1961 gebaut. Perfekt = sein + participiul II + worden (nu „geworden”!): Die Mauer ist 1989 geöffnet worden. Cine face acțiunea: von + dativ: Der Kanzler wurde vom Bundestag gewählt. În textele istorice și în presă se folosește mai ales pasivul la Präteritum.",
   ar:"صيغ المقارنة والتفضيل لما تيجي قبل الاسم بتاخد نهايات الصفة العادية بعد ‎-er أو ‎-(e)st: schönere Spielplätze و eine bessere Lösung و die wichtigste Partei و der älteste Politiker. الـ Partizip II ممكن يبقى صفة، ومعناه مبني للمجهول أو حاجة خلصت: die versprochenen Einrichtungen (المؤسسات اللي اتوعد بيها)، و die geteilte Stadt، و ein gewählter Präsident. المبني للمجهول في الماضي: Präteritum = wurde + Partizip II: Die Mauer wurde 1961 gebaut. و Perfekt = sein + Partizip II + worden (مش «geworden»!): Die Mauer ist 1989 geöffnet worden. ولو عايزين نقول مين عمل الحاجة: von + Dativ: Der Kanzler wurde vom Bundestag gewählt. في النصوص التاريخية والجرايد بيستخدموا Passiv Präteritum أكتر حاجة.",
   en:"Comparatives and superlatives before a noun take the normal adjective endings after -er / -(e)st: schönere Spielplätze, eine bessere Lösung, die wichtigste Partei, der älteste Politiker. The past participle can be used as an adjective with a passive/completed meaning: die versprochenen Einrichtungen (the facilities that were promised), die geteilte Stadt, ein gewählter Präsident. Passive in the past: Präteritum = wurde + past participle: Die Mauer wurde 1961 gebaut. Perfekt = sein + past participle + worden (not „geworden”!): Die Mauer ist 1989 geöffnet worden. The agent: von + dative: Der Kanzler wurde vom Bundestag gewählt. Historical texts and the press mainly use the Präteritum passive."},
  table:conj(["Passiv Präteritum","Passiv Perfekt"],[["wurde gewählt","wurdest gewählt","wurde gewählt","wurden gewählt","wurdet gewählt","wurden gewählt"],["bin gewählt worden","bist gewählt worden","ist gewählt worden","sind gewählt worden","seid gewählt worden","sind gewählt worden"]]),

 text:{title:"Deutschland nach 1945 – eine kurze Chronik",de:"Nach dem Ende des Zweiten Weltkriegs im Mai 1945 lag Deutschland in Trümmern. Das Land wurde von den Siegermächten – den USA, Großbritannien, Frankreich und der Sowjetunion – in vier Besatzungszonen geteilt. Auch die Hauptstadt Berlin wurde in vier Sektoren aufgeteilt. 1949 wurden zwei deutsche Staaten gegründet: im Westen die Bundesrepublik Deutschland (BRD), im Osten die Deutsche Demokratische Republik (DDR). Während in der BRD eine parlamentarische Demokratie entstand, wurde die DDR von einer einzigen Partei regiert. In den Fünfzigerjahren verließen Millionen Menschen die DDR in Richtung Westen. Um das zu stoppen, wurde am 13. August 1961 die Berliner Mauer gebaut. Die geteilte Stadt wurde zum Symbol des Kalten Krieges. Familien und Freunde wurden über Nacht getrennt. Fast dreißig Jahre lang war die Grenze streng bewacht. Im Herbst 1989 gingen in Leipzig und anderen Städten der DDR Hunderttausende auf die Straße. Sie forderten Meinungsfreiheit, Reisefreiheit und freie Wahlen. Am Abend des 9. November 1989 wurde die Mauer überraschend geöffnet. Die Bilder von feiernden Menschen auf der Mauer gingen um die Welt. Weniger als ein Jahr später, am 3. Oktober 1990, ist Deutschland wiedervereinigt worden. Dieser Tag ist heute der Nationalfeiertag. Die Wiedervereinigung war die größte politische Veränderung der deutschen Nachkriegsgeschichte. Doch bis heute gibt es zwischen Ost und West Unterschiede, zum Beispiel bei den Löhnen und Renten.",
  q:[["Nach 1945 wurde Deutschland in vier Zonen geteilt.",true],["Die BRD und die DDR wurden 1955 gegründet.",false],["Die DDR wurde von mehreren Parteien demokratisch regiert.",false],["Die Berliner Mauer wurde 1961 gebaut.",true],["Im Herbst 1989 demonstrierten Hunderttausende in der DDR.",true],["Die Mauer wurde am 3. Oktober 1990 geöffnet.",false],["Der 3. Oktober ist heute der Nationalfeiertag.",true],["Zwischen Ost und West gibt es heute keine Unterschiede mehr.",false]]},

 grammar:{title:"Wiederholung B1: Konnektoren, Präpositionen und Zukunft",
  expl:{ro:"Lecția finală a nivelului B1 recapitulează cele mai importante mijloace de legătură. Pentru fiecare sens există trei variante: un adverb de legătură în propoziția principală (verbul imediat după el: deshalb, trotzdem), o conjuncție subordonatoare (verbul la final: weil, obwohl, damit) și o prepoziție (cu substantiv: wegen, trotz, für). Exemplu pentru cauză: Es regnet. Deshalb bleibe ich zu Hause. / Ich bleibe zu Hause, weil es regnet. / Wegen des Regens bleibe ich zu Hause. Pentru viitor și viziuni: werden + infinitiv pentru prognoze (In 50 Jahren werden die meisten Autos elektrisch fahren), Konjunktiv II pentru dorințe (Ich würde gern in einem Europa ohne Grenzen leben) și prezentul cu o expresie de timp pentru planuri concrete (Nächstes Jahr ziehe ich nach Spanien). Pentru opinii: Meiner Meinung nach …, Ich bin davon überzeugt, dass …, Ich bezweifle, dass …",
   ar:"آخر درس في B1 بيراجع أهم أدوات الربط. لكل معنى فيه تلات أشكال: ظرف ربط في جملة رئيسية (الفعل بعده على طول: deshalb و trotzdem)، وأداة ربط لجملة فرعية (الفعل في الآخر: weil و obwohl و damit)، وحرف جر (مع اسم: wegen و trotz و für). مثال على السبب: Es regnet. Deshalb bleibe ich zu Hause. و Ich bleibe zu Hause, weil es regnet. و Wegen des Regens bleibe ich zu Hause. وللمستقبل والرؤى: werden + المصدر للتوقعات (In 50 Jahren werden die meisten Autos elektrisch fahren)، و Konjunktiv II للأمنيات (Ich würde gern in einem Europa ohne Grenzen leben)، والمضارع + كلمة زمن للخطط الأكيدة (Nächstes Jahr ziehe ich nach Spanien). وللتعبير عن الرأي: Meiner Meinung nach … و Ich bin davon überzeugt, dass … و Ich bezweifle, dass …",
   en:"The final B1 lesson reviews the most important linking devices. For each meaning there are three options: a linking adverb in a main clause (verb right after it: deshalb, trotzdem), a subordinating conjunction (verb at the end: weil, obwohl, damit) and a preposition (with a noun: wegen, trotz, für). Example for reason: Es regnet. Deshalb bleibe ich zu Hause. / Ich bleibe zu Hause, weil es regnet. / Wegen des Regens bleibe ich zu Hause. For the future and visions: werden + infinitive for predictions (In 50 Jahren werden die meisten Autos elektrisch fahren), Konjunktiv II for wishes (Ich würde gern in einem Europa ohne Grenzen leben) and the present with a time expression for concrete plans (Nächstes Jahr ziehe ich nach Spanien). For opinions: Meiner Meinung nach …, Ich bin davon überzeugt, dass …, Ich bezweifle, dass …"},

 text:{title:"Wo ist meine Heimat?",de:"Was ist Heimat? Ist es der Ort, wo man geboren wurde? Das Land, dessen Pass man hat? Oder einfach der Ort, wo man sich wohlfühlt? Für immer mehr Menschen in Europa ist diese Frage nicht leicht zu beantworten. Nach einer aktuellen Umfrage lebt jeder achte EU-Bürger in einem anderen Land als dem, in dem er geboren wurde. Eine von ihnen ist Ioana Marin, 34. Sie ist in Brașov aufgewachsen, hat in Lyon studiert und arbeitet seit sechs Jahren als Architektin in München. „Als ich nach Deutschland kam, hatte ich großes Heimweh“, erinnert sie sich. „Ich vermisste meine Familie, das Essen und sogar das Wetter.“ Damit sie schneller Anschluss fand, trat sie einem Chor bei. Dort lernte sie nicht nur viele Leute kennen, sondern auch ihren heutigen Mann, einen Italiener. Zu Hause sprechen die beiden Deutsch, mit ihrer kleinen Tochter spricht Ioana Rumänisch und ihr Mann Italienisch. „Unsere Tochter wird dreisprachig aufwachsen. Ich bin davon überzeugt, dass das ein großes Geschenk ist.“ Fühlt sie sich heute als Rumänin, als Deutsche oder als Europäerin? „Ehrlich gesagt: alles zusammen. Meiner Meinung nach kann man mehrere Heimaten haben. Brașov ist die Heimat meiner Kindheit, München ist mein Zuhause.“ Und die Zukunft? „Ich hoffe, dass Europa trotz aller Probleme weiter zusammenwächst. Wenn ich könnte, würde ich meiner Tochter eine Welt ohne Grenzen und ohne Vorurteile schenken.“ Irgendwann möchte Ioana vielleicht nach Rumänien zurückkehren – aber nicht jetzt. „Heimat ist für mich kein Ort“, sagt sie, „sondern ein Gefühl.“",
  q:[["Jeder achte EU-Bürger lebt in einem anderen Land als dem Geburtsland.",true],["Ioana hat in München studiert.",false],["Am Anfang hatte Ioana großes Heimweh.",true],["Im Chor hat sie ihren Mann kennengelernt.",true],["Ioanas Mann ist Deutscher.",false],["Ihre Tochter wächst dreisprachig auf.",true],["Ioana fühlt sich nur als Rumänin.",false],["Für Ioana ist Heimat vor allem ein Gefühl.",true]]},

 grammar:{title:"Zweiteilige Konnektoren · Mittelfeld im Hauptsatz · Nachsilben bei Nomen",
  expl:{ro:"1) Conectorii din două părți structurează argumentele: enumerare pozitivă (nicht nur … sondern auch, sowohl … als auch), enumerare negativă (weder … noch), alternativă (entweder … oder), contrast (einerseits … andererseits) și restricție (zwar … aber). Prima parte poate sta pe poziția 1 (cu inversiune: Zwar sehen wir uns selten, aber …) sau în interiorul propoziției (Wir sehen uns zwar selten, aber …). Atenție: cu weder … noch nu mai folosim nicht sau kein! 2) Mittelfeld = tot ce stă între verbul conjugat și finalul propoziției. Complementele circumstanțiale urmează de regulă ordinea te-ka-mo-lo: temporal (wann?) – kauzal (warum?) – modal (wie?) – lokal (wo?): Wir haben letztes Jahr wegen der Arbeit leider kaum in Berlin telefoniert. 3) Complemente: dativul stă înaintea acuzativului (Ich schenke meiner Freundin ein Buch); dacă unul este pronume, pronumele stă primul (Ich schenke es meiner Freundin); dacă ambele sunt pronume, acuzativul stă înaintea dativului (Ich schenke es ihr). 4) Sufixele substantivelor indică genul: -er, -ist, -or → der; -nis, -um, -ment → das (de obicei); -e, -keit, -heit, -ion, -schaft, -ung, -tät → die.",
   ar:"١) أدوات الربط المزدوجة بتنظّم الحجج: تعداد إيجابي (nicht nur … sondern auch و sowohl … als auch)، وتعداد سلبي (weder … noch)، واختيار (entweder … oder)، ومقارنة بين جانبين (einerseits … andererseits)، وتحفّظ (zwar … aber). الجزء الأول ممكن ييجي في أول الجملة (والفعل بعده على طول: Zwar sehen wir uns selten, aber …) أو جوه الجملة (Wir sehen uns zwar selten, aber …). خد بالك: مع weder … noch ممنوع nicht أو kein! ٢) الـ Mittelfeld هو كل اللي بين الفعل المتصرّف وآخر الجملة. الظروف بتمشي عادةً بترتيب te-ka-mo-lo: زمان (wann?) – سبب (warum?) – طريقة (wie?) – مكان (wo?): Wir haben letztes Jahr wegen der Arbeit leider kaum in Berlin telefoniert. ٣) المفعولات: الداتيف قبل الأكوزاتيف (Ich schenke meiner Freundin ein Buch)، ولو واحد منهم ضمير يتقدّم الضمير (Ich schenke es meiner Freundin)، ولو الاتنين ضماير الأكوزاتيف قبل الداتيف (Ich schenke es ihr). ٤) نهايات الأسماء بتدلّ على الجنس: ‎-er و ‎-ist و ‎-or → der، و ‎-nis و ‎-um و ‎-ment → das (غالبًا)، و ‎-e و ‎-keit و ‎-heit و ‎-ion و ‎-schaft و ‎-ung و ‎-tät → die.",
   en:"1) Two-part connectors structure arguments: positive listing (nicht nur … sondern auch, sowohl … als auch), negative listing (weder … noch), alternative (entweder … oder), contrast (einerseits … andererseits) and restriction (zwar … aber). The first part can stand in position 1 (with inversion: Zwar sehen wir uns selten, aber …) or inside the clause (Wir sehen uns zwar selten, aber …). Note: with weder … noch you never add nicht or kein! 2) The Mittelfeld is everything between the conjugated verb and the end of the clause. Adverbials usually follow te-ka-mo-lo: temporal (wann?) – causal (warum?) – modal (wie?) – local (wo?): Wir haben letztes Jahr wegen der Arbeit leider kaum in Berlin telefoniert. 3) Objects: dative before accusative (Ich schenke meiner Freundin ein Buch); if one is a pronoun, the pronoun comes first (Ich schenke es meiner Freundin); if both are pronouns, accusative before dative (Ich schenke es ihr). 4) Noun suffixes show the gender: -er, -ist, -or → der; -nis, -um, -ment → das (mostly); -e, -keit, -heit, -ion, -schaft, -ung, -tät → die."},

 text:{title:"Wie viele Freunde braucht der Mensch?",de:"Wer in sozialen Netzwerken unterwegs ist, hat schnell Hunderte von „Freunden“. Doch wie viele davon würden uns tatsächlich nachts um drei Uhr vom Flughafen abholen? Der britische Anthropologe Robin Dunbar beschäftigt sich seit Jahrzehnten mit dieser Frage. Seine These: Unser Gehirn kann nur etwa 150 stabile Beziehungen gleichzeitig verwalten. Diese Zahl ist inzwischen als „Dunbar-Zahl“ bekannt. Interessant ist dabei vor allem, wie unsere Beziehungen aufgebaut sind. Dunbar beschreibt sie als Kreise: Im innersten Kreis befinden sich höchstens fünf Menschen, denen wir uns bedingungslos anvertrauen – meist der Partner, enge Familienmitglieder und ein bis zwei beste Freunde. Im nächsten Kreis stehen etwa fünfzehn gute Freunde, mit denen wir regelmäßig Zeit verbringen. Danach folgen der erweiterte Freundeskreis und schließlich der Bekanntenkreis. Doch Freundschaft ist nicht nur eine Frage der Zahl, sondern auch der Zeit. Studien zeigen, dass man etwa 200 Stunden gemeinsam verbringen muss, bis aus einem Bekannten ein enger Freund wird. Wer diese Zeit nicht investiert, verliert Freunde mit der Zeit aus den Augen. Besonders in der Lebensmitte, wenn Beruf und Familie viel Energie kosten, schrumpft der Freundeskreis oft deutlich. Und welche Rolle spielen soziale Netzwerke? Einerseits erleichtern sie es, den Kontakt über große Entfernungen zu pflegen. Andererseits ersetzen sie das persönliche Treffen nicht. Digitale Kontakte bleiben oft oberflächlich, wenn man sich nie in die Augen sieht. Forscher warnen außerdem davor, dass gerade junge Menschen trotz ständiger Vernetzung immer häufiger unter Einsamkeit leiden. Was also tun? Dunbars Rat ist einfach: Lieber wenige echte Freundschaften pflegen als viele oberflächliche. Wer seinen engsten Freunden regelmäßig zeigt, dass sie ihm wichtig sind – durch ein Gespräch, eine Nachricht oder einen spontanen Besuch –, investiert nicht nur in seine Beziehungen, sondern auch in seine Gesundheit. Denn gute Freunde, das belegen viele Studien, machen glücklicher und lassen uns sogar länger leben.",
  q:[["Laut Dunbar kann man etwa 150 stabile Beziehungen gleichzeitig haben.",true],["Im innersten Kreis befinden sich ungefähr fünfzehn Menschen.",false],["Zum innersten Kreis gehören oft der Partner und enge Familienmitglieder.",true],["Aus einem Bekannten wird nach etwa 20 gemeinsamen Stunden ein enger Freund.",false],["In der Lebensmitte wird der Freundeskreis oft kleiner.",true],["Soziale Netzwerke helfen, Kontakt über große Entfernungen zu halten.",true],["Laut Text ersetzen digitale Kontakte persönliche Treffen vollständig.",false],["Junge Menschen leiden trotz Vernetzung immer häufiger unter Einsamkeit.",true],["Dunbar empfiehlt, möglichst viele Freundschaften zu haben.",false],["Gute Freunde können sich positiv auf die Gesundheit auswirken.",true]]},

  situation:"Ihre ehemalige Schulfreundin Lara hat Sie nach zehn Jahren über ein soziales Netzwerk gefunden. Sie heiratet im Juni und lädt Sie zur Hochzeit nach Hamburg ein. Leider können Sie an diesem Tag nicht kommen. Schreiben Sie Lara eine E-Mail.",

  tip:{ro:"E-mail informal: Liebe … / Lieber …, apoi tutuiala (du, dich, dein). Folosește conectori din lecție (nicht nur … sondern auch, zwar … aber) – dau puncte la telc.",ar:"إيميل غير رسمي: ابدأ بـ Liebe … أو Lieber … واستخدم du و dich و dein. استخدم أدوات الربط من الدرس (nicht nur … sondern auch و zwar … aber) – دي بتجيب درجات في telc.",en:"Informal email: Liebe … / Lieber …, then use du, dich, dein. Use this lesson's connectors (nicht nur … sondern auch, zwar … aber) – they earn points in telc."},
  redemittel:[["Einleitung",["Wie schön, nach so langer Zeit von dir zu hören!","Ich habe mich riesig über deine Nachricht gefreut."]],["Neuigkeiten",["Bei mir hat sich in den letzten Jahren viel verändert.","Stell dir vor, ich wohne inzwischen in …","Zurzeit arbeite ich als …"]],["Absage und Entschuldigung",["Leider muss ich dir absagen, weil …","Es tut mir wirklich leid, dass ich nicht dabei sein kann.","Ich wäre so gern gekommen, aber …"]],["Vorschlag und Schluss",["Was hältst du davon, wenn wir uns im Sommer treffen?","Ich würde mich sehr freuen, wenn …","Ich wünsche euch schon jetzt einen wunderschönen Tag!","Liebe Grüße / Viele Grüße"]]],
  model:"Liebe Lara,\n\nwie schön, nach so langer Zeit von dir zu hören! Ich habe mich riesig über deine Nachricht gefreut – und noch mehr über die tolle Neuigkeit: Herzlichen Glückwunsch zu eurer Hochzeit!\n\nBei mir hat sich in den letzten zehn Jahren viel verändert. Nach dem Studium bin ich nach Bukarest gezogen und arbeite dort jetzt als Ingenieurin in einer großen Firma. Außerdem lerne ich seit einem Jahr Deutsch, weil ich nicht nur beruflich, sondern auch privat oft nach Deutschland reise.\n\nLeider muss ich dir für den 14. Juni absagen. Genau an diesem Wochenende habe ich meine Deutschprüfung, die ich nicht verschieben kann. Es tut mir wirklich leid, denn ich wäre so gern dabei gewesen!\n\nWas hältst du davon, wenn wir uns im Sommer treffen? Ich bin im August ohnehin für eine Woche in Hamburg. Dann könntest du mir die Hochzeitsfotos zeigen und wir könnten von früher erzählen.\n\nIch wünsche euch schon jetzt einen wunderschönen Tag!\n\nLiebe Grüße\nAndreea"}

 grammar:{title:"Zustandspassiv · von oder durch · Vorsilben bei Nomen · Kausale Zusammenhänge · Partizip I und II als Adjektive",
  expl:{ro:"1) Pasivul de stare (Zustandspassiv) descrie rezultatul unei acțiuni: sein + participiul II. Die Unterlagen werden geordnet (acțiunea, Vorgangspassiv) → Die Unterlagen sind geordnet (starea de după). La trecut: Die Unterlagen waren schon geordnet. 2) În propoziția pasivă: von + dativ pentru persoana sau instituția care acționează (Das Training wird von einer Therapeutin durchgeführt), durch + acuzativ pentru mijloc, instrument sau cauză (Stress kann durch solche Übungen abgebaut werden). 3) Din verbe cu prefixele ab-, auf-, aus-, hin-, zurück-, um- se formează substantive cu același sens: absagen → die Absage, aufgeben → die Aufgabe, ausdrucken → der Ausdruck, hinweisen → der Hinweis, zurückfahren → die Rückfahrt (zurück- devine Rück-), umziehen → der Umzug. 4) Cauza se poate exprima verbal (weil, da, denn, deshalb, deswegen, darum) sau nominal, tipic pentru limba scrisă: aufgrund + genitiv, wegen + genitiv, dank + genitiv (cauză pozitivă), aus + dativ (sentimente: aus Höflichkeit), vor + dativ (reacție involuntară: vor Müdigkeit). 5) Participiul I (infinitiv + d) are sens activ: die bestehenden Pausen; participiul II are de obicei sens pasiv: privat genutzte Kopien.",
   ar:"١) مبني المجهول للحالة (Zustandspassiv) بيوصف النتيجة بعد ما الحاجة اتعملت: sein + Partizip II. Die Unterlagen werden geordnet (العملية نفسها) → Die Unterlagen sind geordnet (الحالة بعدها). وفي الماضي: Die Unterlagen waren schon geordnet. ٢) في جملة المبني للمجهول: von + Dativ للشخص أو المؤسسة اللي بتعمل الفعل (Das Training wird von einer Therapeutin durchgeführt)، و durch + Akkusativ للوسيلة أو الأداة أو السبب (Stress kann durch solche Übungen abgebaut werden). ٣) من الأفعال اللي بادئتها ab- و auf- و aus- و hin- و zurück- و um- بنعمل أسماء بنفس المعنى: absagen → die Absage، و aufgeben → die Aufgabe، و ausdrucken → der Ausdruck، و hinweisen → der Hinweis، و zurückfahren → die Rückfahrt (zurück بتبقى Rück)، و umziehen → der Umzug. ٤) السبب ممكن نعبّر عنه بفعل (weil، da، denn، deshalb، deswegen، darum) أو بأسماء ودي طريقة الكتابة الرسمية: aufgrund + Genitiv، و wegen + Genitiv، و dank + Genitiv (سبب إيجابي)، و aus + Dativ (مشاعر: aus Höflichkeit)، و vor + Dativ (رد فعل غير إرادي: vor Müdigkeit). ٥) الـ Partizip I (المصدر + d) معناه مبني للمعلوم: die bestehenden Pausen، والـ Partizip II معناه غالبًا مبني للمجهول: privat genutzte Kopien.",
   en:"1) The stative passive (Zustandspassiv) describes the result of an action: sein + past participle. Die Unterlagen werden geordnet (process) → Die Unterlagen sind geordnet (resulting state). Past: Die Unterlagen waren schon geordnet. 2) In passive sentences: von + dative for the acting person or institution (Das Training wird von einer Therapeutin durchgeführt), durch + accusative for a means, instrument or cause (Stress kann durch solche Übungen abgebaut werden). 3) Verbs with the prefixes ab-, auf-, aus-, hin-, zurück-, um- form nouns with the same meaning: absagen → die Absage, aufgeben → die Aufgabe, ausdrucken → der Ausdruck, hinweisen → der Hinweis, zurückfahren → die Rückfahrt (zurück- becomes Rück-), umziehen → der Umzug. 4) Cause can be expressed verbally (weil, da, denn, deshalb, deswegen, darum) or nominally, typical of written German: aufgrund + genitive, wegen + genitive, dank + genitive (positive cause), aus + dative (feelings: aus Höflichkeit), vor + dative (involuntary reaction: vor Müdigkeit). 5) Participle I (infinitive + d) is active: die bestehenden Pausen; participle II is usually passive: privat genutzte Kopien."},

  table2:[["verbal (Konnektor)","nominal (Präposition)"],["Weil Sie einen langen Arbeitsweg haben, verbringen Sie viel Zeit in der Bahn.","Aufgrund Ihres langen Arbeitsweges verbringen Sie viel Zeit in der Bahn."],["Da das Wetter schlecht war, fiel das Meeting aus.","Wegen des schlechten Wetters fiel das Meeting aus."],["Sie sind sehr offen. Deswegen entstehen keine Missverständnisse.","Dank Ihrer Offenheit entstehen keine Missverständnisse."],["Grüßen Sie freundlich, denn das ist höflich.","Grüßen Sie aus Höflichkeit freundlich."],["Sie sind so müde, deshalb können Sie nicht arbeiten.","Vor Müdigkeit können Sie nicht arbeiten."]],
  tables:[{h:"von oder durch im Passiv",t:[["","Passivsatz","Aktivsatz"],["Person / Institution: von + Dat.","Das Projekt wird von der Geschäftsführung geleitet.","Die Geschäftsführung leitet das Projekt."],["Mittel / Ursache: durch + Akk.","Stress kann durch kurze Pausen abgebaut werden.","Kurze Pausen können Stress abbauen."]]},{h:"Vorsilben bei Nomen",t:[["ab-","auf-","aus-","hin-","Rück-","um-"],["der Abflug","die Aufschrift","die Ausgabe","der Hinweis","die Rückfahrt","der Umzug"],["die Absage","die Aufgabe","der Ausdruck","die Hinfahrt","der Rückblick","der Umsatz"]]},{h:"Partizip I und II als Adjektive",t:[["Partizip I (aktiv, gleichzeitig)","Partizip II (passiv / abgeschlossen)"],["die bestehenden Regeln (Regeln, die bestehen)","privat genutzte Kopien (Kopien, die privat genutzt werden)"],["ein klingelndes Telefon","ein gut organisiertes Büro"],["die wachsende Belastung","die erledigten Aufgaben"]]}],

 text:{title:"Warum gute Mitarbeiter kündigen",de:"Wenn eine erfahrene Mitarbeiterin plötzlich ihre Kündigung auf den Tisch legt, ist die Überraschung in vielen Firmen groß. Dabei sind die Gründe meist längst bekannt – nur hat niemand richtig hingehört. Laut einer aktuellen Umfrage unter 3.000 Beschäftigten ist nicht das Gehalt der wichtigste Kündigungsgrund, sondern die Beziehung zum direkten Vorgesetzten. Fast jeder Zweite gab an, schon einmal wegen eines schlechten Chefs gekündigt zu haben. Was macht einen schlechten Chef aus? Die Befragten nannten vor allem fehlende Wertschätzung: Gute Arbeit wird als selbstverständlich betrachtet, Fehler dagegen werden sofort kritisiert. Auch unklare Zuständigkeiten sorgen für Frust. Wer nicht weiß, welche Aufgaben er eigentlich erledigen soll, und gleichzeitig für alles verantwortlich gemacht wird, fühlt sich schnell überfordert. An zweiter Stelle steht die zu hohe Belastung. Aufgrund von Personalmangel müssen viele Beschäftigte die Arbeit von zwei Kollegen übernehmen. Überstunden sind in manchen Abteilungen schon zur Regel geworden. Die Folgen sind Erschöpfung, häufige Krankmeldungen und im schlimmsten Fall ein Burn-out. Erst an dritter Stelle folgt das Geld. Interessant ist, dass vor allem jüngere Arbeitnehmer heute andere Prioritäten setzen. Für sie sind flexible Arbeitszeiten, Homeoffice und ein gutes Betriebsklima oft wichtiger als ein höheres Gehalt. „Die jungen Leute bleiben nicht mehr aus Pflichtgefühl in einer Firma, in der sie unglücklich sind“, erklärt die Arbeitspsychologin Dr. Sabine Roth. Was können Unternehmen tun? Roth empfiehlt regelmäßige Mitarbeitergespräche, in denen nicht nur über Ziele, sondern auch über Probleme gesprochen wird. Außerdem sollten Führungskräfte geschult werden, damit sie lernen, Lob und Kritik richtig zu formulieren. Auch kleine Maßnahmen können viel bewirken: ein ruhiger Pausenraum, gemeinsame Mittagessen oder die Möglichkeit, Arbeitszeiten selbst zu planen. Denn eines ist sicher: Eine Kündigung kostet ein Unternehmen deutlich mehr als jede Investition in die Zufriedenheit seiner Mitarbeiter. Für die Suche und Einarbeitung einer neuen Fachkraft rechnen Experten mit Kosten von bis zu einem Jahresgehalt.",
  q:[["Laut Umfrage ist das Gehalt der wichtigste Grund für eine Kündigung.",false],["Fast jeder Zweite hat schon einmal wegen eines schlechten Chefs gekündigt.",true],["Fehlende Wertschätzung ist ein häufiger Kritikpunkt.",true],["Unklare Zuständigkeiten führen laut Text zu mehr Motivation.",false],["Wegen Personalmangel müssen viele die Arbeit von Kollegen übernehmen.",true],["In manchen Abteilungen sind Überstunden normal geworden.",true],["Jüngeren Arbeitnehmern ist ein gutes Betriebsklima oft wichtiger als mehr Geld.",true],["Dr. Roth rät, Mitarbeitergespräche abzuschaffen.",false],["Führungskräfte sollen lernen, Lob und Kritik richtig zu formulieren.",true],["Eine neue Fachkraft zu suchen ist für Firmen sehr günstig.",false]]},

 write:{type:"Forumsbeitrag",title:"Pausen am Arbeitsplatz",
  situation:"In einem Internetforum diskutieren Berufstätige über das Thema: „Brauchen wir mehr Pausen am Arbeitsplatz? Sollte jede Firma einen Ruheraum anbieten?“ Schreiben Sie einen Diskussionsbeitrag.",
  points:["Ihre eigene Erfahrung mit Pausen am Arbeitsplatz beschreiben","Vorteile von mehr Pausen und Ruheräumen nennen","mögliche Nachteile oder Probleme ansprechen","Ihre Meinung äußern und einen Vorschlag machen"],
  words:"Schreiben Sie ca. 150 Wörter. Verbinden Sie Ihre Argumente mit Konnektoren.",
  tip:{ro:"Într-un forum poți scrie mai personal, dar argumentele trebuie să fie clare: introducere – argumente pro – argumente contra – opinie. Folosește aufgrund, dank, deshalb din gramatica lecției.",ar:"في المنتدى ممكن تكتب بشكل شخصي أكتر، بس الحجج لازم تبقى واضحة: مقدمة – مزايا – عيوب – رأيك. استخدم aufgrund و dank و deshalb من جرامر الدرس.",en:"A forum post can be more personal, but your arguments must be clear: introduction – pros – cons – opinion. Use aufgrund, dank, deshalb from this lesson's grammar."},
  redemittel:[["Einstieg",["Das Thema betrifft mich persönlich, denn …","Ich möchte gern meine Erfahrungen zu diesem Thema teilen."]],["Vorteile",["Ein großer Vorteil ist, dass …","Dank regelmäßiger Pausen …","Hinzu kommt, dass …"]],["Nachteile",["Allerdings darf man nicht vergessen, dass …","Problematisch finde ich …","Kritiker könnten einwenden, dass …"]],["Meinung und Vorschlag",["Meiner Meinung nach …","Alles in allem bin ich davon überzeugt, dass …","Ich schlage vor, dass …"]]],
  model:"Hallo zusammen,\n\ndas Thema betrifft mich persönlich, denn ich arbeite seit sechs Jahren als Sachbearbeiterin in einem Großraumbüro. Früher habe ich oft am Schreibtisch gegessen und bin nachmittags vor Müdigkeit kaum noch konzentriert gewesen.\n\nSeit unsere Firma letztes Jahr einen kleinen Ruheraum eingerichtet hat, hat sich vieles verändert. Ein großer Vorteil ist, dass man sich dort zehn Minuten wirklich erholen kann – ohne Telefon und ohne Kollegen, die etwas fragen. Dank dieser kurzen Pausen arbeite ich am Nachmittag viel konzentrierter. Hinzu kommt, dass die Zahl der Krankmeldungen in unserer Abteilung deutlich gesunken ist.\n\nAllerdings darf man nicht vergessen, dass nicht jede Firma genug Platz hat. Außerdem könnten manche Mitarbeiter die Pausen ausnutzen.\n\nAlles in allem bin ich davon überzeugt, dass sich ein Ruheraum lohnt. Ich schlage vor, klare Regeln einzuführen, zum Beispiel maximal zwei Pausen von je fünfzehn Minuten pro Tag. So profitieren sowohl die Mitarbeiter als auch die Firma.\n\nViele Grüße\nMaria aus Graz"}
}
